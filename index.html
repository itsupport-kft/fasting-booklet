down on our wrath, I take it back.","Father, take comparison out of my eyes. Let me see my own well as full.","Every emotional connection I have outside my marriage that belongs inside it, I sever it now.","Lord, let the deepest conversations of my life happen with my spouse.","Every little fox spoiling our vines, be caught and be removed today.","Father, restore intimacy in my marriage, physical, emotional, and spiritual.","Every wall built between us over years of small wounds, come down today.","Lord, let us not defraud one another. Teach us to be present to each other.","Every exhaustion that has consumed our marriage, let God restore our strength.","Father, make us a threefold cord that cannot quickly be broken.","Every communication breakdown in our home, be healed in the name of Jesus.","Lord, teach us to fight the problem and not each other.","Every temptation aimed at either of us, be exposed and be defeated in Jesus' name.","Father, let our marriage bed be undefiled and honourable in Your sight.","Every marriage in this fast that is hanging by a thread, hold it together tonight.","Lord, let separated couples in this house hear from You this weekend.","I decree that my well is full, my fountain is blessed, and I will drink from my own, in Jesus' name."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Marriage Altars Must Break","subtitle":"The Twelve Hour Prayer Marathon Begins","about":["Tonight is the hinge of this entire fast. We open at 6:00pm and we do not stop until 6:00am. For nineteen days we have been clearing ground. Tonight we go after the specific structures that have been fighting marriage in bloodlines for generations.","Understand first that marriage has been under organised attack since Genesis 3, and the reason is stated plainly by Malachi. God asks why He made two into one, and answers His own question: \"That he might seek a godly seed\" (Malachi 2:15). Marriage is the delivery system for generations. Break the marriage and you interrupt the seed. That is why the assault is not random.","Tonight we address:","Marriage destroying altars in the bloodline. Family lines where no marriage has ever survived. Where the women are always alone. Where the men always leave. These are patterns with structures behind them.","Covenants made over your marriage before you existed. Betrothals, dedications, promises made in a shrine, sacrifices offered so a family could prosper.","Spirit spouses. This is real and it is common enough that pastoral honesty requires naming it. Recurring dreams of sexual encounters, of a persistent partner in the dream world, of a wedding you did not attend in waking life. These accompany sudden hostility toward a real spouse, unexplained repulsion, marital sabotage, and children who are difficult to conceive. We do not sensationalise this and we do not fear it. We renounce it and it goes.","Altars of divorce and separation, including words spoken over your marriage by relatives who never wanted it. And the wounds we brought in ourselves, because not every attack came from outside. Some marriages are being damaged by unhealed people, and healing is deliverance too. Come standing. Married, single, separated, widowed, engaged. Stand and war."],"scriptures":["Malachi 2:13 to 16","Genesis 2:24","Matthew 19:4 to 6","Ephesians 5:31 to 32","Genesis 26:8","Judges 16:4 to 21","Nehemiah 4:14","Isaiah 54:5 to 17","Hosea 2:16 to 20","Colossians 2:14 to 15","1 Corinthians 6:15 to 20","Romans 7:2","Luke 10:19","Numbers 23:23","Revelation 12:11","Ecclesiastes 4:12"],"note":"Stand. This is the marathon. Speak with everything you have.","points":["Father, tonight I contend for marriage in my life and in my bloodline, in the name of Jesus.","What God hath joined together, let no man put asunder. I enforce that over my home.","Every altar in my father's house speaking against marriage, be demolished tonight.","Every altar in my mother's house assigned against my covenant, collapse now in Jesus' name.","Every family pattern where no marriage survives, be terminated at my generation.","Every betrothal or dedication made over my marriage before I existed, I cancel it now.","Every covenant cut in a shrine concerning who I would marry, be broken by the blood of Jesus.","Every spirit spouse operating in my life, I divorce you tonight in the name of Jesus.","I renounce every dream marriage, every dream husband and dream wife. I belong to Christ alone.","Every ring, every dowry, every gift received in the dream world, I return it and I reject it.","Every child conceived in the spirit realm against my life, I renounce and I destroy that claim.","Every unexplained hostility and repulsion in my marriage, be exposed and be removed.","Every sabotage of my marriage arranged in a spiritual realm, be dismantled tonight.","Every altar of divorce raised against my home, be pulled down in the name of Jesus.","Every relative who has been praying against my marriage, let your words fall to the ground.","Every Delilah and every Jezebel assigned to my household, be removed permanently.","Every soul tie from every previous relationship, I sever you tonight by the blood of Jesus.","Every wound I brought into my marriage that I have never healed, Lord heal it tonight.","Fight for your brethren, your sons, your daughters, your wives, and your houses. I am fighting.","Thy Maker is thine husband. Every single person in this fast, be covered by God Himself.","I decree that every altar against marriage in my bloodline is broken tonight, my covenant stands, and no weapon formed against my home shall prosper, in the name of Jesus."]}],"questions":["Solomon said drink from your own cistern. What specifically stopped your marriage from drawing from its own well, and what is one thing you will do this week to clear it?","Married couples: write down three things you loved about your spouse when you met. Read them to each other tonight. Singles: write down three things about your character that need to be ready before your covenant arrives."],"questionNote":""},{"n":20,"date":"Saturday, October 24","title":"We Have Found Water","subtitle":"","anchor":{"text":"And it came to pass the same day, that Isaac's servants came, and told him concerning the well which they had digged, and said unto him, We have found water.","ref":"Genesis 26:32"},"teaching":["The marathon has closed. The sun is up. And today the report comes in.","Look at the phrase that opens Genesis 26:32. \"And it came to pass the same day.\"","The same day as what? The same day Abimelech came and made peace. The same day the man who evicted him admitted, we saw certainly that the Lord was with thee. Vindication and water arrived on the same calendar day.","And notice how the news came. Isaac did not discover it. The servants came running to tell him. He was elsewhere, making covenant, doing something else entirely, and the report found him.","That is the shape of a breakthrough. You dig for weeks in silence and then one day somebody comes to you with news you did not go looking for.","Then the naming. \"And he called it Shebah: therefore the name of the city is Beersheba unto this day\" (Genesis 26:33). Shebah means oath or seven, the number of completion. And Beersheba means the well of the oath. The place where a covenant was sworn and a well was found is a city that still carries that name thousands of years later.","Isaac named a city after a day.","That is what today is for. Some of you will look back on these twenty one days for the rest of your lives and name a season after them. Your children will hear about October 2026. That is not exaggeration. Landmarks are made when someone decides to name what God did.","And tonight, we do not go home quietly.","After twelve hours of war, after nineteen days of digging, after breaking altars and cutting covenants and rolling stones, we explode.","\"And when they began to sing and to praise, the LORD set ambushments\" (2 Chronicles 20:22). We started this fast with praise on Day One when we had nothing yet. We end it with praise having seen what God has done. The first praise was a sacrifice. Tonight's praise is a receipt."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Night They Found Water","subtitle":"Inside the Prayer Marathon","about":["You are six hours into the marathon. This is the hour where tiredness meets breakthrough.","Understand where you are in the story. Paul and Silas sang at midnight and the foundations moved (Acts 16:25 to 26). Israel came out of Egypt at midnight (Exodus 12:29). Boaz woke at midnight and covenant was set in motion (Ruth 3:8). Midnight is a hinge in Scripture, and you are standing on it. Do not sit down now. There are reports assigned to this hour."],"scriptures":["Genesis 26:32","Acts 16:25 to 26","Exodus 12:29 to 31","Ruth 3:8 to 13","Psalm 30:5","Isaiah 21:11 to 12","Lamentations 2:19","Psalm 119:62","Matthew 25:6"],"note":"","points":["Father, at this midnight hour, let the report of water reach my life.","Every foundation still standing against me, be shaken at midnight as the prison was shaken.","Every prison door in my family, open now. Every band, be loosed.","As Egypt released Israel at midnight, let every captor release my inheritance now.","Every covenant God wants to establish in my life, let it be set in motion at this hour.","Lord, I arise and cry out in the night. Pour out my heart like water before You.","At midnight I will rise to give thanks unto Thee. Psalm 119:62. Receive my thanks now.","Every tiredness in my body at this hour, be replaced with supernatural strength.","Father, do not let me sit down six hours into a twelve hour assignment.","Every answer scheduled for release between midnight and dawn, be delivered now.","Every enemy who thought I would not last this long, let them see me standing.","Lord, let this night be recorded in heaven concerning my family.","Watchman, what of the night? Let the morning come over my situation. Isaiah 21:11.","Every long night in my life, I decree that joy cometh in the morning.","Every marriage in this room tonight, let something break before dawn.","Every barren womb represented here, let this be the night of visitation.","Every financial siege over a family here, be lifted before the sun rises.","Lord, let the cry go up at midnight, behold the bridegroom cometh. Prepare us.","Father, let somebody in this room receive a phone call this week that changes everything.","Every well we have dug for nineteen days, let the water be found tonight.","I decree that before this night is over, there will be a report of water, in Jesus' name."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Shebah: The Morning of the Oath","subtitle":"The Final Hour of the Marathon","about":["One hour left. The sun is coming.","Shebah means oath, and it is connected to the Hebrew word for seven, which is the number of completion and covenant. When Isaac named that well, he was not just recording a discovery. He was sealing an agreement.","This hour is for sealing.","Jacob wrestled until the breaking of the day and would not let go without a blessing (Genesis 32:24 to 26). And it cost him. He walked away limping, with a new name, and \"as he passed over Penuel the sun rose upon him\" (Genesis 32:31). The sun rose on a changed man.","Do not leave this marathon the same person who walked in at 6:00pm."],"scriptures":["Genesis 26:31 to 33","Genesis 32:24 to 31","Lamentations 3:22 to 23","Psalm 30:5","Malachi 4:2","Psalm 5:3","Isaiah 60:1 to 3","Hosea 6:3","2 Samuel 23:4"],"note":"","points":["Father, I will not let You go except You bless me. Genesis 32:26.","Lord, let the sun rise on a changed person this morning.","Every name I came in with that You are changing, let me leave with the new one.","Every oath God is swearing over my life this morning, let it be sealed forever.","Lord, let this hour be a Shebah in my story. Let it be a place I can name.","His compassions fail not, they are new every morning. Great is Your faithfulness.","Weeping may endure for a night, but joy cometh in the morning. My morning is here.","The Sun of righteousness shall arise with healing in His wings. Rise over me now.","Arise, shine, for thy light is come, and the glory of the Lord is risen upon thee.","Every darkness that covered my life and my family, the glory of God is rising now.","Lord, let me leave this room limping if I must, but changed.","Every covenant made in this marathon, let heaven witness it and enforce it.","Father, let the twelve hours we have given You be counted and be rewarded.","Every person who stayed until morning, let them go home with a testimony.","Lord, He shall come unto us as the rain, as the latter and former rain. Come, Lord.","Let my going forth be prepared as the morning. Hosea 6:3.","Every household represented in this marathon, let the sun rise on a new season.","My voice shalt Thou hear in the morning. Receive our voices this morning, Lord.","Father, let the last hour carry the heaviest anointing of the entire night.","As the light of the morning when the sun riseth, a morning without clouds, let it be so.","I decree that this morning is Shebah. The oath is sworn, the water is found, in Jesus' name."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Drawing With Joy","subtitle":"","about":["\"Therefore with joy shall ye draw water out of the wells of salvation\" (Isaiah 12:3). The well is open. Now you have to draw.","Understand that an open well does not water anybody automatically. Water in the ground helps no one. Somebody has to come with a vessel and draw. That is the difference between a breakthrough and a lifestyle.","The Samaritan woman came to a well with a waterpot and left it behind, because she found a spring that did not require the daily trip (John 4:28). Jesus told her, \"the water that I shall give him shall be in him a well of water springing up into everlasting life\" (John 4:14). The well moved from outside her to inside her.","That is what these twenty one days are supposed to produce. Not a memory of a good fast. An internal spring.","And notice the manner Isaiah prescribes: with joy. Not with anxiety. Not with the fear that it might dry up again. Drawing is meant to be a joyful, ordinary, daily act.","This afternoon we practise drawing. Come to the well with a vessel and take something out."],"scriptures":["Isaiah 12:1 to 6","John 4:6 to 15, 28 to 29","John 7:37 to 39","Psalm 36:8 to 9","Jeremiah 2:13","Revelation 22:17","Psalm 16:11","Nehemiah 8:10","Zechariah 13:1"],"note":"","points":["Father, with joy shall I draw water out of the wells of salvation. I draw today.","Every open well in my life, teach me to come daily with a vessel and draw.","Lord, let the water move from outside me to inside me. Let there be a spring in me.","Every anxiety that my breakthrough will dry up, be replaced with confidence today.","Lord, take away the fear that keeps me from enjoying what You have given me.","Every broken cistern I have hewn out for myself, I abandon it for the fountain of living waters.","Father, You are the fountain of life. In Your light shall I see light.","Make me drink of the river of Your pleasures. Psalm 36:8.","Lord, restore joy to my walk with You. Not duty only. Joy.","The joy of the Lord is my strength. Let it be my actual strength today.","Every heaviness that survived this fast, be exchanged for joy this afternoon.","Lord, let me leave my waterpot behind and go and tell somebody.","Every person waiting for my testimony, let me not withhold it from them.","Father, let rivers of living water flow out of my belly to thirsty people.","Let him that is athirst come. Let whosoever will take of the water of life freely.","Lord, open a fountain for sin and for uncleanness in my household. Zechariah 13:1.","In Your presence is fulness of joy. At Your right hand are pleasures for evermore.","Every family member of mine who is thirsty, let them find this well.","Lord, let my home become a well that others can drink from.","Father, teach me to draw daily and not only in a fasting season.","I decree that I draw with joy from an open well, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Exploding Praise","subtitle":"","about":["Tonight we celebrate. You have fasted for twenty days. You have broken altars, cut covenants, opened eyes, warred through a night, and found water. Tonight is not a service. It is a detonation.","Go back to 2 Chronicles 20. Jehoshaphat faced three armies. The prophecy said \"the battle is not yours, but God's\" (verse 15). And then he did something no general would do: he \"appointed singers unto the LORD... that should praise the beauty of holiness, as they went out before the army\" (verse 21). The choir went first.","\"And when they began to sing and to praise, the LORD set ambushments against the children of Ammon, Moab, and mount Seir... and they were smitten\" (verse 22). And the aftermath is worth noting: it took them three days to gather the spoil because there was so much of it (verse 25). And the valley where they had been surrounded was renamed Berachah, the valley of blessing (verse 26).","A place named after a crisis got renamed after a praise. That is what tonight is. We are renaming valleys.","Come with everything. Bring your family. Bring the neighbour who never comes to church. Bring the friend who watched you fast for twenty days and asked what you were doing. Bring the testimony that happened this week.","Bring sound. \"Let every thing that hath breath praise the LORD\" (Psalm 150:6)."],"scriptures":["2 Chronicles 20:14 to 26","Psalm 150:1 to 6","Psalm 149:1 to 9","Acts 16:25 to 26","Joshua 6:16 to 20","Psalm 47:1 to 5","Psalm 100:1 to 5","2 Samuel 6:14 to 22","Ezra 3:11 to 13","Psalm 126:1 to 3","Isaiah 61:3","Psalm 30:11 to 12"],"note":"Stand. Shout. Dance. Do not be dignified tonight.","points":["Father, tonight I praise You for what You have done in these twenty days.","I put the singers before the army one more time. My praise leads and my victory follows.","Every valley of crisis in my life, I rename you Berachah, the valley of blessing.","Lord, set ambushments against every remaining enemy as I begin to sing.","Every spoil assigned to me that will take days to gather, release it now.","I praise You for every altar broken in this fast. Every single one.","I praise You for every eye opened, every stone rolled, every chain that fell.","Thank You, Lord, for the marriages You saved during these twenty days.","Thank You for every womb You visited and every seed You protected.","Thank You for every debt cancelled and every provision released.","Lord, You have turned my mourning into dancing. You have girded me with gladness.","I will praise You as David did, and I will not be too dignified to do it.","Every garment of heaviness, I take it off tonight and I put on praise.","Let the high praises of God be in my mouth and a two edged sword in my hand.","O clap your hands, all ye people. Shout unto God with the voice of triumph.","Every wall still standing after twenty days, I shout you down tonight.","Lord, let this praise be heard by my neighbours, my family, and my city.","Let the unsaved in this room encounter You tonight in the praise.","The Lord hath done great things for us, whereof we are glad. Psalm 126:3.","Let everything that hath breath praise the Lord. I use my breath tonight.","Praise the Lord, O my soul, and all that is within me, bless His holy name."]}],"questions":["Isaac named a city after one day. What are you naming this season, and what will you tell your children about October 2026?","Write down every specific thing God has done in these twenty days. Not general things. Specific ones. Bring that list to the Thanksgiving Service tomorrow."],"questionNote":""},{"n":21,"date":"Sunday, October 25","title":"The Charge","subtitle":"Call It By Its Right Name And Go Possess It","anchor":{"text":"And Isaac digged again the wells of water... and he called their names after the names by which his father had called them.","ref":"Genesis 26:18"},"teaching":["Twenty one days ago you started digging. Today you are commissioned.","Understand what this day is and is not. This is not a graduation. It is a deployment.","Nothing we have done in these twenty one days was an end in itself. We did not break altars so that we could say we broke altars. We broke them so that something could be built. We did not open wells to admire them. We opened them so that people could drink.","And here is where Genesis 26:18 becomes the charge. Isaac dug again, \"and he called their names after the names by which his father had called them.\"","He finished the job with his mouth.","The physical work was done. Water was flowing. And he still took the time to formally restore the names, because the Philistines had renamed them, and a well with a wrong name will be buried again by the next generation. Whoever names a thing governs how it will be treated.","So today you name.","You name what God did. You name what He broke. You name the seasons, the altars, the answers, and the things still coming. You name your marriage, your children, your household, and your future in the language of heaven and not in the language of your history.","And then you possess.","Obadiah 17 contains one of the most confronting phrases in the Bible: \"the house of Jacob shall possess their possessions.\" Read it again. There are possessions that belong to you that you do not currently possess. Legally yours. Practically absent. And the promise is not that God will give you new things. It is that you will take hold of what was already assigned to your name. That is the difference between deliverance and occupation. Deliverance gets you out. Occupation gets you in. Israel came out of Egypt in one night and spent forty years failing to get into Canaan, and the difference was never God's willingness. Today, we go in."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Well of the Oath","subtitle":"","about":["Tonight we seal it. Beersheba means the well of the oath. It is the place where a covenant was sworn and water was found on the same day, and the city carried that name for the rest of biblical history. At this final midnight we are not asking for anything new. We are sealing what God has done and swearing our side of it.","Joshua gathered Israel at Shechem at the end of his life, recounted everything God had done, and then required a decision: \"choose you this day whom ye will serve\" (Joshua 24:15). And then he set up a stone as a witness, \"lest ye deny your God\" (Joshua 24:27).","Tonight you set up a stone."],"scriptures":["Genesis 26:31 to 33","Joshua 24:14 to 27","Joshua 4:1 to 9","1 Samuel 7:12","Genesis 28:18 to 22","Ecclesiastes 5:4 to 5","Psalm 116:12 to 14","Deuteronomy 26:16 to 19"],"note":"","points":["Father, at this final midnight, I seal everything You have done in these twenty one days.","I set up a stone of witness tonight. Hitherto hath the Lord helped me. 1 Samuel 7:12.","Every covenant I have made with God in this fast, let it stand for the rest of my life.","Lord, let this altar not be dismantled when the fasting ends.","Choose you this day whom ye will serve. I choose the Lord for me and my house.","Every vow I make tonight, give me the grace to pay it. I will not vow and not pay.","Father, what shall I render unto You for all Your benefits? I take the cup of salvation.","Every stone I set up tonight, let it speak to my children after me.","Lord, let this be my Bethel, the house of God and the gate of heaven.","Every deliverance received in these twenty one days, be sealed permanently tonight.","Every altar broken, let it never be rebuilt. Affliction shall not rise up the second time.","Every chain that fell in this fast, let it never return to my hands.","Father, let the twelve stones of my testimony be a memorial for generations.","Lord, when my children ask what these stones mean, give me the words to tell them.","Every promise You made me in this fast, I hold You to it and I thank You for it.","Father, I avouch You this day to be my God, and You have avouched me to be Your people.","Every area where I might drift after this fast, guard me by Your Spirit.","Lord, do not let me become the person who dug a well and then walked away from it.","Every marriage represented here, let the covenant we renewed tonight hold.","Father, this is my Beersheba. This is my well of the oath. Let it be named forever.","I decree that what God did in these twenty one days is sealed and permanent, in Jesus' name."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Call It by Its Right Name","subtitle":"","about":["This morning you finish the job with your mouth.","Isaac restored the names. That was the last thing recorded about his digging. And it mattered because a well with a wrong name gets abandoned by whoever inherits it.","So this morning we name things properly.","Your season has a name. Your marriage has a name. Your children have names that were assigned in heaven before they were assigned on a birth certificate. Your business, your ministry, your body, your household. All of it has been called something by the Philistines, and today you take the naming back.","And name what God did in this fast. Do not leave it in the category of \"a nice season.\" Name it. Say what broke. Say what opened. Say what died. A thing that is not named does not get remembered, and a thing that is not remembered does not get passed down."],"scriptures":["Genesis 26:18","Genesis 32:27 to 28","Isaiah 62:2 to 4, 12","Revelation 2:17","Judges 6:12","John 1:42","Genesis 35:18","Ruth 1:20 to 21","Jeremiah 33:16","Exodus 17:15","Genesis 22:14"],"note":"","points":["Father, this morning I call every well in my life by its right name.","Every name the enemy assigned to me over twenty one days of digging, it is gone.","I call my season Rehoboth. The Lord has made room for me and I shall be fruitful.","I call my well Shebah. The oath has been sworn and the water has been found.","I call my marriage blessed, covered, fruitful, and unbreakable, in the name of Jesus.","I call my children taught of the Lord, and great is their peace.","I call my household a house of prayer and a house of praise.","I call my body the temple of the Holy Ghost, healed and whole.","I call my finances a bag without holes and a barrel that does not fail.","I call my mind renewed, sound, and at peace.","I call my ministry fruitful and my hands anointed for yoke destroying work.","Lord, name me the way heaven names me. Let me answer to that and nothing else.","I reject Forsaken. I am Hephzibah. The Lord delighteth in me.","I reject Desolate. I am Beulah. The Lord is married to my land.","I reject Mara. I refuse to be renamed by a season of bitterness.","I call the Lord Jehovah Jireh over my provision. He will provide.","I call the Lord Jehovah Nissi over my battles. He is my banner.","I call the Lord Jehovah Shalom over my home. He is my peace.","Lord, give me the white stone and the new name that only I will know.","Father, let the names I restore this morning stand for generations after me.","I decree that every well in my life carries its original name again, in Jesus' name."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Write It Down","subtitle":"","about":["\"Write the vision, and make it plain upon tables, that he may run that readeth it\" (Habakkuk 2:2).","Notice who runs. Not the one who wrote it. The one who reads it. Written vision outlives the person holding it. And Revelation 12:11 says we overcome \"by the blood of the Lamb, and by the word of their testimony.\" The blood is finished work. The testimony is your part, and it requires a mouth and, ideally, a page.","This hour is for writing.","Write what God did in twenty one days. Write the exact things that broke. Write the dreams, the words, the confirmations. Write what you are still waiting for, so that when it comes you will have a record proving you were told first.","Israel was commanded to take twelve stones out of the Jordan for one reason: \"That when your children ask their fathers in time to come, saying, What mean these stones? Then ye shall let your children know\" (Joshua 4:21 to 22).","Some of you are the first person in your bloodline with a testimony worth writing down. Write it."],"scriptures":["Habakkuk 2:1 to 3","Revelation 12:11","Joshua 4:1 to 24","Psalm 102:18","Deuteronomy 6:6 to 9","Psalm 78:4 to 7","Esther 9:20 to 28","Malachi 3:16","1 Samuel 7:12","Psalm 145:4"],"note":"","points":["Father, help me write down what You have done in these twenty one days.","Every testimony I would have forgotten, bring it back to my memory now.","Lord, let my written vision outlive me and let others run with it.","Every promise You gave me in this fast, let me record it and hold You to it.","I overcome by the blood of the Lamb and by the word of my testimony. I will testify.","Father, give me boldness to tell people what You did, not to boast but to build faith.","Every silent testimony in me, let it be released to encourage somebody this week.","Lord, let this be written for the generation to come, and let a people yet unborn praise You.","One generation shall praise Thy works to another. Let my generation not break the chain.","Father, let my children know what these stones mean. Give me words for them.","Every family history of forgetting God's works, be broken at my generation.","Lord, let there be a book of remembrance written before You for those who feared Your name.","Every answered prayer in this fast, let me testify to it publicly.","Father, let my testimony reach the person who is about to give up.","Lord, let what happened in this house reach nations through the ones who were here.","Every doubt that will come next month, let my written record answer it.","Father, make me a keeper of records and not just a receiver of blessings.","Lord, let this fast become an annual memorial in my household.","Every child in my family, let them grow up on the testimony of what God did in 2026.","Father, let the vision I write be for an appointed time, and let it speak and not lie.","I decree that my testimony is written, remembered, and passed on, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"The Charge: Go and Possess","subtitle":"The Thanksgiving Service","about":["This is the commissioning. Twenty one days ago you sat down in front of a book and started. Tonight you stand up and go.","Hear the charge.","You did not fast to feel something. You fasted to become something. Deliverance that does not result in occupation is a story about a night, not a change in a life. Israel left Egypt in a single night and then spent forty years failing to enter Canaan. The exit was never the problem. The entrance required a different kind of people.","So here is what heaven is saying over this house tonight. Go and possess your possessions. There are things with your name on them that you have never taken hold of. Obadiah 17 is not a prayer request. It is a verdict. Deliverance has come, holiness is established, and possession is the outcome. Go and take it.","Keep the well open. Isaac's problem was that Abraham's wells were left unattended after he died. An unattended well gets filled. The altars you built these twenty one days must be maintained. The prayer life does not end on October 25. The family altar does not fold up. Ten minutes a day kept for a year outranks four hours a day kept for three weeks.","Do not let the Philistines rename what God renamed. People will call your marriage what it used to be. They will call you what you used to be. Answer to the new name.","And dig for somebody else. Isaac drank from wells Abraham dug. Somebody is going to drink from what you opened this month. Your children. Your church. Your city. The ones who join this fast in 2027 because they watched you in 2026. Nothing you carry into this is wasted. Look at Paul. Years in a Pharisee's classroom at the feet of Gamaliel, trained in a law he would later teach believers they were free from. A Roman citizenship he used to appeal to Caesar and preach in Rome itself. A trade in tentmaking that paid his way into cities that had never heard the gospel. Even the memory of Stephen's stoning, which he stood by and approved, became part of the account he gave for the rest of his life of what grace can reach. He wrote it plainly: what he once counted as gain, he now counted as loss for the sake of knowing Christ, and all things worked together, the credentials and the wreckage both, for the purpose he was called to (Philippians 3:7 to 8, Romans 8:28). God did not erase Paul's history to use him. He repurposed it. Your training was not random. Your education was not wasted years. Your pain was not only pain. Carry it out of this room tonight as material for what comes next.","Now go.","\"Be strong and of a good courage: for unto this people shalt thou divide for an inheritance the land, which I sware unto their fathers to give them\" (Joshua 1:6).","Stand for this charge. Receive it with your hands open."],"scriptures":["Obadiah 17","Joshua 1:1 to 9","Genesis 26:18","Deuteronomy 1:6 to 8","Joshua 13:1","Judges 1:1 to 2","Matthew 28:18 to 20","Acts 1:8","Acts 22:3","Galatians 1:15 to 16","Philippians 3:7 to 8, 12 to 14","Romans 8:28","2 Timothy 4:7","Isaiah 54:2 to 3","Deuteronomy 11:24","Ephesians 3:20","Hebrews 12:1 to 2","Numbers 13:30"],"note":"Stand. This is your commissioning. Receive every word.","points":["Father, I thank You for twenty one days of grace, of digging, and of encounter.","I receive the charge tonight. I am not graduating. I am being deployed.","The house of Jacob shall possess their possessions. I go to take what is mine.","Every possession legally mine that I have never held, I take hold of you now.","Be strong and of a good courage. I receive courage for the entering, not just the exiting.","Every place the sole of my foot shall tread upon, God has given it to me.","Ye have dwelt long enough in this mount. Turn and take your journey. I am moving.","There remaineth yet very much land to be possessed. Lord, give me appetite for more.","Let us go up at once and possess it, for we are well able to overcome it.","Every altar I built in these twenty one days, I commit to maintaining it daily.","Lord, do not let my well be left unattended and filled again.","Every Philistine who will try to rename what You renamed, they will not succeed.","Father, let the person I am on October 26 be different from the person I was on October 4.","Lord, make me a digger of wells for the generation coming behind me.","Let my children drink from something I opened. Let my church drink. Let my city drink.","Go ye therefore and teach all nations. I receive the commission tonight.","Ye shall receive power after that the Holy Ghost is come upon you. Let the power rest on me.","I press toward the mark for the prize of the high calling of God in Christ Jesus.","Lord, as You did with Paul, redeem every part of my history, my training, my education, my pain, and my preparation for the purpose of the gospel. Nothing in my life will be wasted.","Lord, let me finish my course and keep the faith, all the way to the end.","Now unto Him that is able to do exceeding abundantly above all that I ask or think.","Thank You, Father. The wells are open, the names are restored, the oath is sworn, and I go to possess my possessions, in the mighty name of Jesus. Amen."]}],"questions":["Name the three biggest things God did in these twenty one days. Then name one specific possession you are going to take hold of before the end of this year.","Isaac's wells were filled because they were left unattended. What exactly is your daily altar going to look like from tomorrow? Write the time, the place, and the length. Be realistic, and then keep it."],"questionNote":""}]</script>
<script id="kjv" type="application/json">{"1 Chronicles 4:9 to 10":[[4,9,"And Jabez was more honourable than his brethren: and his mother called his name Jabez, saying, Because I bare him with sorrow."],[4,10,"And Jabez called on the God of Israel, saying, Oh that thou wouldest bless me indeed, and enlarge my coast, and that thine hand might be with me, and that thou wouldest keep me from evil, that it may not grieve me! And God granted him that which he requested."]],"1 Corinthians 11:28":[[11,28,"But let a man examine himself, and so let him eat of that bread, and drink of that cup."]],"1 Corinthians 11:3":[[11,3,"But I would have you know, that the head of every man is Christ; and the head of the woman is the man; and the head of Christ is God."]],"1 Corinthians 13:4 to 7":[[13,4,"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,"],[13,5,"Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;"],[13,6,"Rejoiceth not in iniquity, but rejoiceth in the truth;"],[13,7,"Beareth all things, believeth all things, hopeth all things, endureth all things."]],"1 Corinthians 13:4 to 8":[[13,4,"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,"],[13,5,"Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;"],[13,6,"Rejoiceth not in iniquity, but rejoiceth in the truth;"],[13,7,"Beareth all things, believeth all things, hopeth all things, endureth all things."],[13,8,"Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away."]],"1 Corinthians 14:14 to 15":[[14,14,"For if I pray in an unknown tongue, my spirit prayeth, but my understanding is unfruitful."],[14,15,"What is it then? I will pray with the spirit, and I will pray with the understanding also: I will sing with the spirit, and I will sing with the understanding also."]],"1 Corinthians 14:2":[[14,2,"For he that speaketh in an unknown tongue speaketh not unto men, but unto God: for no man understandeth him; howbeit in the spirit he speaketh mysteries."]],"1 Corinthians 14:33":[[14,33,"For God is not the author of confusion, but of peace, as in all churches of the saints."]],"1 Corinthians 14:4":[[14,4,"He that speaketh in an unknown tongue edifieth himself; but he that prophesieth edifieth the church."]],"1 Corinthians 16:8 to 9":[[16,8,"But I will tarry at Ephesus until Pentecost."],[16,9,"For a great door and effectual is opened unto me, and there are many adversaries."]],"1 Corinthians 16:9":[[16,9,"For a great door and effectual is opened unto me, and there are many adversaries."]],"1 Corinthians 3:3":[[3,3,"For ye are yet carnal: for whereas there is among you envying, and strife, and divisions, are ye not carnal, and walk as men?"]],"1 Corinthians 4:5":[[4,5,"Therefore judge nothing before the time, until the Lord come, who both will bring to light the hidden things of darkness, and will make manifest the counsels of the hearts: and then shall every man have praise of God."]],"1 Corinthians 4:7":[[4,7,"For who maketh thee to differ from another? and what hast thou that thou didst not receive? now if thou didst receive it, why dost thou glory, as if thou hadst not received it?"]],"1 Corinthians 6:15 to 20":[[6,15,"Know ye not that your bodies are the members of Christ? shall I then take the members of Christ, and make them the members of an harlot? God forbid."],[6,16,"What? know ye not that he which is joined to an harlot is one body? for two, saith he, shall be one flesh."],[6,17,"But he that is joined unto the Lord is one spirit."],[6,18,"Flee fornication. Every sin that a man doeth is without the body; but he that committeth fornication sinneth against his own body."],[6,19,"What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own?"],[6,20,"For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s."]],"1 Corinthians 6:19 to 20":[[6,19,"What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own?"],[6,20,"For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s."]],"1 Corinthians 7:1 to 5":[[7,1,"Now concerning the things whereof ye wrote unto me: It is good for a man not to touch a woman."],[7,2,"Nevertheless, to avoid fornication, let every man have his own wife, and let every woman have her own husband."],[7,3,"Let the husband render unto the wife due benevolence: and likewise also the wife unto the husband."],[7,4,"The wife hath not power of her own body, but the husband: and likewise also the husband hath not power of his own body, but the wife."],[7,5,"Defraud ye not one the other, except it be with consent for a time, that ye may give yourselves to fasting and prayer; and come together again, that Satan tempt you not for your incontinency."]],"1 Corinthians 7:8 to 9":[[7,8,"I say therefore to the unmarried and widows, It is good for them if they abide even as I."],[7,9,"But if they cannot contain, let them marry: for it is better to marry than to burn."]],"1 John 1:7":[[1,7,"But if we walk in the light, as he is in the light, we have fellowship one with another, and the blood of Jesus Christ his Son cleanseth us from all sin."]],"1 John 1:9":[[1,9,"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness."]],"1 John 2:1":[[2,1,"My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:"]],"1 John 2:1 to 2":[[2,1,"My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:"],[2,2,"And he is the propitiation for our sins: and not for ours only, but also for the sins of the whole world."]],"1 John 2:20":[[2,20,"But ye have an unction from the Holy One, and ye know all things."]],"1 John 2:27":[[2,27,"But the anointing which ye have received of him abideth in you, and ye need not that any man teach you: but as the same anointing teacheth you of all things, and is truth, and is no lie, and even as it hath taught you, ye shall abide in him."]],"1 John 3:12 to 13":[[3,12,"Not as Cain, who was of that wicked one, and slew his brother. And wherefore slew he him? Because his own works were evil, and his brother’s righteous."],[3,13,"Marvel not, my brethren, if the world hate you."]],"1 John 4:1 to 3":[[4,1,"Beloved, believe not every spirit, but try the spirits whether they are of God: because many false prophets are gone out into the world."],[4,2,"Hereby know ye the Spirit of God: Every spirit that confesseth that Jesus Christ is come in the flesh is of God:"],[4,3,"And every spirit that confesseth not that Jesus Christ is come in the flesh is not of God: and this is that spirit of antichrist, whereof ye have heard that it should come; and even now already is it in the world."]],"1 John 4:18":[[4,18,"There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love."]],"1 Kings 13:1 to 5":[[13,1,"And, behold, there came a man of God out of Judah by the word of the LORD unto Beth-el: and Jeroboam stood by the altar to burn incense."],[13,2,"And he cried against the altar in the word of the LORD, and said, O altar, altar, thus saith the LORD; Behold, a child shall be born unto the house of David, Josiah by name; and upon thee shall he offer the priests of the high places that burn incense upon thee, and men’s bones shall be burnt upon thee."],[13,3,"And he gave a sign the same day, saying, This is the sign which the LORD hath spoken; Behold, the altar shall be rent, and the ashes that are upon it shall be poured out."],[13,4,"And it came to pass, when king Jeroboam heard the saying of the man of God, which had cried against the altar in Beth-el, that he put forth his hand from the altar, saying, Lay hold on him. And his hand, which he put forth against him, dried up, so that he could not pull it in again to him."],[13,5,"The altar also was rent, and the ashes poured out from the altar, according to the sign which the man of God had given by the word of the LORD."]],"1 Kings 17:8 to 16":[[17,8,"And the word of the LORD came unto him, saying,"],[17,9,"Arise, get thee to Zarephath, which belongeth to Zidon, and dwell there: behold, I have commanded a widow woman there to sustain thee."],[17,10,"So he arose and went to Zarephath. And when he came to the gate of the city, behold, the widow woman was there gathering of sticks: and he called to her, and said, Fetch me, I pray thee, a little water in a vessel, that I may drink."],[17,11,"And as she was going to fetch it, he called to her, and said, Bring me, I pray thee, a morsel of bread in thine hand."],[17,12,"And she said, As the LORD thy God liveth, I have not a cake, but an handful of meal in a barrel, and a little oil in a cruse: and, behold, I am gathering two sticks, that I may go in and dress it for me and my son, that we may eat it, and die."],[17,13,"And Elijah said unto her, Fear not; go and do as thou hast said: but make me thereof a little cake first, and bring it unto me, and after make for thee and for thy son."],[17,14,"For thus saith the LORD God of Israel, The barrel of meal shall not waste, neither shall the cruse of oil fail, until the day that the LORD sendeth rain upon the earth."],[17,15,"And she went and did according to the saying of Elijah: and she, and he, and her house, did eat many days."],[17,16,"And the barrel of meal wasted not, neither did the cruse of oil fail, according to the word of the LORD, which he spake by Elijah."]],"1 Kings 18:30":[[18,30,"And Elijah said unto all the people, Come near unto me. And all the people came near unto him. And he repaired the altar of the LORD that was broken down."]],"1 Kings 18:30 to 39":[[18,30,"And Elijah said unto all the people, Come near unto me. And all the people came near unto him. And he repaired the altar of the LORD that was broken down."],[18,31,"And Elijah took twelve stones, according to the number of the tribes of the sons of Jacob, unto whom the word of the LORD came, saying, Israel shall be thy name:"],[18,32,"And with the stones he built an altar in the name of the LORD: and he made a trench about the altar, as great as would contain two measures of seed."],[18,33,"And he put the wood in order, and cut the bullock in pieces, and laid him on the wood, and said, Fill four barrels with water, and pour it on the burnt sacrifice, and on the wood."],[18,34,"And he said, Do it the second time. And they did it the second time. And he said, Do it the third time. And they did it the third time."],[18,35,"And the water ran round about the altar; and he filled the trench also with water."],[18,36,"And it came to pass at the time of the offering of the evening sacrifice, that Elijah the prophet came near, and said, LORD God of Abraham, Isaac, and of Israel, let it be known this day that thou art God in Israel, and that I am thy servant, and that I have done all these things at thy word."],[18,37,"Hear me, O LORD, hear me, that this people may know that thou art the LORD God, and that thou hast turned their heart back again."],[18,38,"Then the fire of the LORD fell, and consumed the burnt sacrifice, and the wood, and the stones, and the dust, and licked up the water that was in the trench."],[18,39,"And when all the people saw it, they fell on their faces: and they said, The LORD, he is the God; the LORD, he is the God."]],"1 Kings 18:41 to 45":[[18,41,"And Elijah said unto Ahab, Get thee up, eat and drink; for there is a sound of abundance of rain."],[18,42,"So Ahab went up to eat and to drink. And Elijah went up to the top of Carmel; and he cast himself down upon the earth, and put his face between his knees,"],[18,43,"And said to his servant, Go up now, look toward the sea. And he went up, and looked, and said, There is nothing. And he said, Go again seven times."],[18,44,"And it came to pass at the seventh time, that he said, Behold, there ariseth a little cloud out of the sea, like a man’s hand. And he said, Go up, say unto Ahab, Prepare thy chariot, and get thee down, that the rain stop thee not."],[18,45,"And it came to pass in the mean while, that the heaven was black with clouds and wind, and there was a great rain. And Ahab rode, and went to Jezreel."]],"1 Kings 19:1 to 18":[[19,1,"And Ahab told Jezebel all that Elijah had done, and withal how he had slain all the prophets with the sword."],[19,2,"Then Jezebel sent a messenger unto Elijah, saying, So let the gods do to me, and more also, if I make not thy life as the life of one of them by to morrow about this time."],[19,3,"And when he saw that, he arose, and went for his life, and came to Beer-sheba, which belongeth to Judah, and left his servant there."],[19,4,"But he himself went a day’s journey into the wilderness, and came and sat down under a juniper tree: and he requested for himself that he might die; and said, It is enough; now, O LORD, take away my life; for I am not better than my fathers."],[19,5,"And as he lay and slept under a juniper tree, behold, then an angel touched him, and said unto him, Arise and eat."],[19,6,"And he looked, and, behold, there was a cake baken on the coals, and a cruse of water at his head. And he did eat and drink, and laid him down again."],[19,7,"And the angel of the LORD came again the second time, and touched him, and said, Arise and eat; because the journey is too great for thee."],[19,8,"And he arose, and did eat and drink, and went in the strength of that meat forty days and forty nights unto Horeb the mount of God."],[19,9,"And he came thither unto a cave, and lodged there; and, behold, the word of the LORD came to him, and he said unto him, What doest thou here, Elijah?"],[19,10,"And he said, I have been very jealous for the LORD God of hosts: for the children of Israel have forsaken thy covenant, thrown down thine altars, and slain thy prophets with the sword; and I, even I only, am left; and they seek my life, to take it away."],[19,11,"And he said, Go forth, and stand upon the mount before the LORD. And, behold, the LORD passed by, and a great and strong wind rent the mountains, and brake in pieces the rocks before the LORD; but the LORD was not in the wind: and after the wind an earthquake; but the LORD was not in the earthquake:"],[19,12,"And after the earthquake a fire; but the LORD was not in the fire: and after the fire a still small voice."],[19,13,"And it was so, when Elijah heard it, that he wrapped his face in his mantle, and went out, and stood in the entering in of the cave. And, behold, there came a voice unto him, and said, What doest thou here, Elijah?"],[19,14,"And he said, I have been very jealous for the LORD God of hosts: because the children of Israel have forsaken thy covenant, thrown down thine altars, and slain thy prophets with the sword; and I, even I only, am left; and they seek my life, to take it away."],[19,15,"And the LORD said unto him, Go, return on thy way to the wilderness of Damascus: and when thou comest, anoint Hazael to be king over Syria:"],[19,16,"And Jehu the son of Nimshi shalt thou anoint to be king over Israel: and Elisha the son of Shaphat of Abel-meholah shalt thou anoint to be prophet in thy room."],[19,17,"And it shall come to pass, that him that escapeth the sword of Hazael shall Jehu slay: and him that escapeth from the sword of Jehu shall Elisha slay."],[19,18,"Yet I have left me seven thousand in Israel, all the knees which have not bowed unto Baal, and every mouth which hath not kissed him."]],"1 Kings 22:19 to 23":[[22,19,"And he said, Hear thou therefore the word of the LORD: I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left."],[22,20,"And the LORD said, Who shall persuade Ahab, that he may go up and fall at Ramoth-gilead? And one said on this manner, and another said on that manner."],[22,21,"And there came forth a spirit, and stood before the LORD, and said, I will persuade him."],[22,22,"And the LORD said unto him, Wherewith? And he said, I will go forth, and I will be a lying spirit in the mouth of all his prophets. And he said, Thou shalt persuade him, and prevail also: go forth, and do so."],[22,23,"Now therefore, behold, the LORD hath put a lying spirit in the mouth of all these thy prophets, and the LORD hath spoken evil concerning thee."]],"1 Peter 1:18 to 19":[[1,18,"Forasmuch as ye know that ye were not redeemed with corruptible things, as silver and gold, from your vain conversation received by tradition from your fathers;"],[1,19,"But with the precious blood of Christ, as of a lamb without blemish and without spot:"]],"1 Peter 2:12":[[2,12,"Having your conversation honest among the Gentiles: that, whereas they speak against you as evildoers, they may by your good works, which they shall behold, glorify God in the day of visitation."]],"1 Peter 3:1 to 7":[[3,1,"Likewise, ye wives, be in subjection to your own husbands; that, if any obey not the word, they also may without the word be won by the conversation of the wives;"],[3,2,"While they behold your chaste conversation coupled with fear."],[3,3,"Whose adorning let it not be that outward adorning of plaiting the hair, and of wearing of gold, or of putting on of apparel;"],[3,4,"But let it be the hidden man of the heart, in that which is not corruptible, even the ornament of a meek and quiet spirit, which is in the sight of God of great price."],[3,5,"For after this manner in the old time the holy women also, who trusted in God, adorned themselves, being in subjection unto their own husbands:"],[3,6,"Even as Sara obeyed Abraham, calling him lord: whose daughters ye are, as long as ye do well, and are not afraid with any amazement."],[3,7,"Likewise, ye husbands, dwell with them according to knowledge, giving honour unto the wife, as unto the weaker vessel, and as being heirs together of the grace of life; that your prayers be not hindered."]],"1 Peter 3:7":[[3,7,"Likewise, ye husbands, dwell with them according to knowledge, giving honour unto the wife, as unto the weaker vessel, and as being heirs together of the grace of life; that your prayers be not hindered."]],"1 Peter 5:7 to 9":[[5,7,"Casting all your care upon him; for he careth for you."],[5,8,"Be sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour:"],[5,9,"Whom resist stedfast in the faith, knowing that the same afflictions are accomplished in your brethren that are in the world."]],"1 Samuel 15:23":[[15,23,"For rebellion is as the sin of witchcraft, and stubbornness is as iniquity and idolatry. Because thou hast rejected the word of the LORD, he hath also rejected thee from being king."]],"1 Samuel 16:14 to 23":[[16,14,"But the Spirit of the LORD departed from Saul, and an evil spirit from the LORD troubled him."],[16,15,"And Saul’s servants said unto him, Behold now, an evil spirit from God troubleth thee."],[16,16,"Let our lord now command thy servants, which are before thee, to seek out a man, who is a cunning player on an harp: and it shall come to pass, when the evil spirit from God is upon thee, that he shall play with his hand, and thou shalt be well."],[16,17,"And Saul said unto his servants, Provide me now a man that can play well, and bring him to me."],[16,18,"Then answered one of the servants, and said, Behold, I have seen a son of Jesse the Beth-lehemite, that is cunning in playing, and a mighty valiant man, and a man of war, and prudent in matters, and a comely person, and the LORD is with him."],[16,19,"Wherefore Saul sent messengers unto Jesse, and said, Send me David thy son, which is with the sheep."],[16,20,"And Jesse took an ass laden with bread, and a bottle of wine, and a kid, and sent them by David his son unto Saul."],[16,21,"And David came to Saul, and stood before him: and he loved him greatly; and he became his armourbearer."],[16,22,"And Saul sent to Jesse, saying, Let David, I pray thee, stand before me; for he hath found favour in my sight."],[16,23,"And it came to pass, when the evil spirit from God was upon Saul, that David took an harp, and played with his hand: so Saul was refreshed, and was well, and the evil spirit departed from him."]],"1 Samuel 18:6 to 12":[[18,6,"And it came to pass as they came, when David was returned from the slaughter of the Philistine, that the women came out of all cities of Israel, singing and dancing, to meet king Saul, with tabrets, with joy, and with instruments of musick."],[18,7,"And the women answered one another as they played, and said, Saul hath slain his thousands, and David his ten thousands."],[18,8,"And Saul was very wroth, and the saying displeased him; and he said, They have ascribed unto David ten thousands, and to me they have ascribed but thousands: and what can he have more but the kingdom?"],[18,9,"And Saul eyed David from that day and forward."],[18,10,"And it came to pass on the morrow, that the evil spirit from God came upon Saul, and he prophesied in the midst of the house: and David played with his hand, as at other times: and there was a javelin in Saul’s hand."],[18,11,"And Saul cast the javelin; for he said, I will smite David even to the wall with it. And David avoided out of his presence twice."],[18,12,"And Saul was afraid of David, because the LORD was with him, and was departed from Saul."]],"1 Samuel 1:19 to 20":[[1,19,"And they rose up in the morning early, and worshipped before the LORD, and returned, and came to their house to Ramah: and Elkanah knew Hannah his wife; and the LORD remembered her."],[1,20,"Wherefore it came to pass, when the time was come about after Hannah had conceived, that she bare a son, and called his name Samuel, saying, Because I have asked him of the LORD."]],"1 Samuel 1:9 to 20":[[1,9,"So Hannah rose up after they had eaten in Shiloh, and after they had drunk. Now Eli the priest sat upon a seat by a post of the temple of the LORD."],[1,10,"And she was in bitterness of soul, and prayed unto the LORD, and wept sore."],[1,11,"And she vowed a vow, and said, O LORD of hosts, if thou wilt indeed look on the affliction of thine handmaid, and remember me, and not forget thine handmaid, but wilt give unto thine handmaid a man child, then I will give him unto the LORD all the days of his life, and there shall no razor come upon his head."],[1,12,"And it came to pass, as she continued praying before the LORD, that Eli marked her mouth."],[1,13,"Now Hannah, she spake in her heart; only her lips moved, but her voice was not heard: therefore Eli thought she had been drunken."],[1,14,"And Eli said unto her, How long wilt thou be drunken? put away thy wine from thee."],[1,15,"And Hannah answered and said, No, my lord, I am a woman of a sorrowful spirit: I have drunk neither wine nor strong drink, but have poured out my soul before the LORD."],[1,16,"Count not thine handmaid for a daughter of Belial: for out of the abundance of my complaint and grief have I spoken hitherto."],[1,17,"Then Eli answered and said, Go in peace: and the God of Israel grant thee thy petition that thou hast asked of him."],[1,18,"And she said, Let thine handmaid find grace in thy sight. So the woman went her way, and did eat, and her countenance was no more sad."],[1,19,"And they rose up in the morning early, and worshipped before the LORD, and returned, and came to their house to Ramah: and Elkanah knew Hannah his wife; and the LORD remembered her."],[1,20,"Wherefore it came to pass, when the time was come about after Hannah had conceived, that she bare a son, and called his name Samuel, saying, Because I have asked him of the LORD."]],"1 Samuel 28:7 to 20":[[28,7,"Then said Saul unto his servants, Seek me a woman that hath a familiar spirit, that I may go to her, and enquire of her. And his servants said to him, Behold, there is a woman that hath a familiar spirit at Endor."],[28,8,"And Saul disguised himself, and put on other raiment, and he went, and two men with him, and they came to the woman by night: and he said, I pray thee, divine unto me by the familiar spirit, and bring me him up, whom I shall name unto thee."],[28,9,"And the woman said unto him, Behold, thou knowest what Saul hath done, how he hath cut off those that have familiar spirits, and the wizards, out of the land: wherefore then layest thou a snare for my life, to cause me to die?"],[28,10,"And Saul sware to her by the LORD, saying, As the LORD liveth, there shall no punishment happen to thee for this thing."],[28,11,"Then said the woman, Whom shall I bring up unto thee? And he said, Bring me up Samuel."],[28,12,"And when the woman saw Samuel, she cried with a loud voice: and the woman spake to Saul, saying, Why hast thou deceived me? for thou art Saul."],[28,13,"And the king said unto her, Be not afraid: for what sawest thou? And the woman said unto Saul, I saw gods ascending out of the earth."],[28,14,"And he said unto her, What form is he of? And she said, An old man cometh up; and he is covered with a mantle. And Saul perceived that it was Samuel, and he stooped with his face to the ground, and bowed himself."],[28,15,"And Samuel said to Saul, Why hast thou disquieted me, to bring me up? And Saul answered, I am sore distressed; for the Philistines make war against me, and God is departed from me, and answereth me no more, neither by prophets, nor by dreams: therefore I have called thee, that thou mayest make known unto me what I shall do."],[28,16,"Then said Samuel, Wherefore then dost thou ask of me, seeing the LORD is departed from thee, and is become thine enemy?"],[28,17,"And the LORD hath done to him, as he spake by me: for the LORD hath rent the kingdom out of thine hand, and given it to thy neighbour, even to David:"],[28,18,"Because thou obeyedst not the voice of the LORD, nor executedst his fierce wrath upon Amalek, therefore hath the LORD done this thing unto thee this day."],[28,19,"Moreover the LORD will also deliver Israel with thee into the hand of the Philistines: and to morrow shalt thou and thy sons be with me: the LORD also shall deliver the host of Israel into the hand of the Philistines."],[28,20,"Then Saul fell straightway all along on the earth, and was sore afraid, because of the words of Samuel: and there was no strength in him; for he had eaten no bread all the day, nor all the night."]],"1 Samuel 30:1 to 20":[[30,1,"And it came to pass, when David and his men were come to Ziklag on the third day, that the Amalekites had invaded the south, and Ziklag, and smitten Ziklag, and burned it with fire;"],[30,2,"And had taken the women captives, that were therein: they slew not any, either great or small, but carried them away, and went on their way."],[30,3,"So David and his men came to the city, and, behold, it was burned with fire; and their wives, and their sons, and their daughters, were taken captives."],[30,4,"Then David and the people that were with him lifted up their voice and wept, until they had no more power to weep."],[30,5,"And David’s two wives were taken captives, Ahinoam the Jezreelitess, and Abigail the wife of Nabal the Carmelite."],[30,6,"And David was greatly distressed; for the people spake of stoning him, because the soul of all the people was grieved, every man for his sons and for his daughters: but David encouraged himself in the LORD his God."],[30,7,"And David said to Abiathar the priest, Ahimelech’s son, I pray thee, bring me hither the ephod. And Abiathar brought thither the ephod to David."],[30,8,"And David enquired at the LORD, saying, Shall I pursue after this troop? shall I overtake them? And he answered him, Pursue: for thou shalt surely overtake them, and without fail recover all."],[30,9,"So David went, he and the six hundred men that were with him, and came to the brook Besor, where those that were left behind stayed."],[30,10,"But David pursued, he and four hundred men: for two hundred abode behind, which were so faint that they could not go over the brook Besor."],[30,11,"And they found an Egyptian in the field, and brought him to David, and gave him bread, and he did eat; and they made him drink water;"],[30,12,"And they gave him a piece of a cake of figs, and two clusters of raisins: and when he had eaten, his spirit came again to him: for he had eaten no bread, nor drunk any water, three days and three nights."],[30,13,"And David said unto him, To whom belongest thou? and whence art thou? And he said, I am a young man of Egypt, servant to an Amalekite; and my master left me, because three days agone I fell sick."],[30,14,"We made an invasion upon the south of the Cherethites, and upon the coast which belongeth to Judah, and upon the south of Caleb; and we burned Ziklag with fire."],[30,15,"And David said to him, Canst thou bring me down to this company? And he said, Swear unto me by God, that thou wilt neither kill me, nor deliver me into the hands of my master, and I will bring thee down to this company."],[30,16,"And when he had brought him down, behold, they were spread abroad upon all the earth, eating and drinking, and dancing, because of all the great spoil that they had taken out of the land of the Philistines, and out of the land of Judah."],[30,17,"And David smote them from the twilight even unto the evening of the next day: and there escaped not a man of them, save four hundred young men, which rode upon camels, and fled."],[30,18,"And David recovered all that the Amalekites had carried away: and David rescued his two wives."],[30,19,"And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor any thing that they had taken to them: David recovered all."],[30,20,"And David took all the flocks and the herds, which they drave before those other cattle, and said, This is David’s spoil."]],"1 Samuel 7:12":[[7,12,"Then Samuel took a stone, and set it between Mizpeh and Shen, and called the name of it Eben-ezer, saying, Hitherto hath the LORD helped us."]],"1 Thessalonians 5:19":[[5,19,"Quench not the Spirit."]],"1 Timothy 2:15":[[2,15,"Notwithstanding she shall be saved in childbearing, if they continue in faith and charity and holiness with sobriety."]],"1 Timothy 5:8":[[5,8,"But if any provide not for his own, and specially for those of his own house, he hath denied the faith, and is worse than an infidel."]],"1 Timothy 6:6 to 10":[[6,6,"But godliness with contentment is great gain."],[6,7,"For we brought nothing into this world, and it is certain we can carry nothing out."],[6,8,"And having food and raiment let us be therewith content."],[6,9,"But they that will be rich fall into temptation and a snare, and into many foolish and hurtful lusts, which drown men in destruction and perdition."],[6,10,"For the love of money is the root of all evil: which while some coveted after, they have erred from the faith, and pierced themselves through with many sorrows."]],"2 Chronicles 16:9":[[16,9,"For the eyes of the LORD run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him. Herein thou hast done foolishly: therefore from henceforth thou shalt have wars."]],"2 Chronicles 20:14 to 26":[[20,14,"Then upon Jahaziel the son of Zechariah, the son of Benaiah, the son of Jeiel, the son of Mattaniah, a Levite of the sons of Asaph, came the Spirit of the LORD in the midst of the congregation;"],[20,15,"And he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat, Thus saith the LORD unto you, Be not afraid nor dismayed by reason of this great multitude; for the battle is not yours, but God’s."],[20,16,"To morrow go ye down against them: behold, they come up by the cliff of Ziz; and ye shall find them at the end of the brook, before the wilderness of Jeruel."],[20,17,"Ye shall not need to fight in this battle: set yourselves, stand ye still, and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to morrow go out against them: for the LORD will be with you."],[20,18,"And Jehoshaphat bowed his head with his face to the ground: and all Judah and the inhabitants of Jerusalem fell before the LORD, worshipping the LORD."],[20,19,"And the Levites, of the children of the Kohathites, and of the children of the Korhites, stood up to praise the LORD God of Israel with a loud voice on high."],[20,20,"And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem; Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper."],[20,21,"And when he had consulted with the people, he appointed singers unto the LORD, and that should praise the beauty of holiness, as they went out before the army, and to say, Praise the LORD; for his mercy endureth for ever."],[20,22,"And when they began to sing and to praise, the LORD set ambushments against the children of Ammon, Moab, and mount Seir, which were come against Judah; and they were smitten."],[20,23,"For the children of Ammon and Moab stood up against the inhabitants of mount Seir, utterly to slay and destroy them: and when they had made an end of the inhabitants of Seir, every one helped to destroy another."],[20,24,"And when Judah came toward the watch tower in the wilderness, they looked unto the multitude, and, behold, they were dead bodies fallen to the earth, and none escaped."],[20,25,"And when Jehoshaphat and his people came to take away the spoil of them, they found among them in abundance both riches with the dead bodies, and precious jewels, which they stripped off for themselves, more than they could carry away: and they were three days in gathering of the spoil, it was so much."],[20,26,"And on the fourth day they assembled themselves in the valley of Berachah; for there they blessed the LORD: therefore the name of the same place was called, The valley of Berachah, unto this day."]],"2 Chronicles 20:15 to 17":[[20,15,"And he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat, Thus saith the LORD unto you, Be not afraid nor dismayed by reason of this great multitude; for the battle is not yours, but God’s."],[20,16,"To morrow go ye down against them: behold, they come up by the cliff of Ziz; and ye shall find them at the end of the brook, before the wilderness of Jeruel."],[20,17,"Ye shall not need to fight in this battle: set yourselves, stand ye still, and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to morrow go out against them: for the LORD will be with you."]],"2 Chronicles 20:20 to 22":[[20,20,"And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem; Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper."],[20,21,"And when he had consulted with the people, he appointed singers unto the LORD, and that should praise the beauty of holiness, as they went out before the army, and to say, Praise the LORD; for his mercy endureth for ever."],[20,22,"And when they began to sing and to praise, the LORD set ambushments against the children of Ammon, Moab, and mount Seir, which were come against Judah; and they were smitten."]],"2 Chronicles 7:14":[[7,14,"If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land."]],"2 Corinthians 10:3 to 5":[[10,3,"For though we walk in the flesh, we do not war after the flesh:"],[10,4,"(For the weapons of our warfare are not carnal, but mighty through God to the pulling down of strong holds;)"],[10,5,"Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ;"]],"2 Corinthians 11:14":[[11,14,"And no marvel; for Satan himself is transformed into an angel of light."]],"2 Corinthians 1:21":[[1,21,"Now he which stablisheth us with you in Christ, and hath anointed us, is God;"]],"2 Corinthians 2:12 to 13":[[2,12,"Furthermore, when I came to Troas to preach Christ’s gospel, and a door was opened unto me of the Lord,"],[2,13,"I had no rest in my spirit, because I found not Titus my brother: but taking my leave of them, I went from thence into Macedonia."]],"2 Corinthians 3:14 to 16":[[3,14,"But their minds were blinded: for until this day remaineth the same vail untaken away in the reading of the old testament; which vail is done away in Christ."],[3,15,"But even unto this day, when Moses is read, the vail is upon their heart."],[3,16,"Nevertheless when it shall turn to the Lord, the vail shall be taken away."]],"2 Corinthians 3:2 to 3":[[3,2,"Ye are our epistle written in our hearts, known and read of all men:"],[3,3,"Forasmuch as ye are manifestly declared to be the epistle of Christ ministered by us, written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart."]],"2 Corinthians 4:13":[[4,13,"We having the same spirit of faith, according as it is written, I believed, and therefore have I spoken; we also believe, and therefore speak;"]],"2 Corinthians 4:3 to 4":[[4,3,"But if our gospel be hid, it is hid to them that are lost:"],[4,4,"In whom the god of this world hath blinded the minds of them which believe not, lest the light of the glorious gospel of Christ, who is the image of God, should shine unto them."]],"2 Corinthians 4:3 to 6":[[4,3,"But if our gospel be hid, it is hid to them that are lost:"],[4,4,"In whom the god of this world hath blinded the minds of them which believe not, lest the light of the glorious gospel of Christ, who is the image of God, should shine unto them."],[4,5,"For we preach not ourselves, but Christ Jesus the Lord; and ourselves your servants for Jesus’ sake."],[4,6,"For God, who commanded the light to shine out of darkness, hath shined in our hearts, to give the light of the knowledge of the glory of God in the face of Jesus Christ."]],"2 Corinthians 4:8 to 9":[[4,8,"We are troubled on every side, yet not distressed; we are perplexed, but not in despair;"],[4,9,"Persecuted, but not forsaken; cast down, but not destroyed;"]],"2 Corinthians 6:11 to 13":[[6,11,"O ye Corinthians, our mouth is open unto you, our heart is enlarged."],[6,12,"Ye are not straitened in us, but ye are straitened in your own bowels."],[6,13,"Now for a recompence in the same, (I speak as unto my children,) be ye also enlarged."]],"2 Corinthians 8:9":[[8,9,"For ye know the grace of our Lord Jesus Christ, that, though he was rich, yet for your sakes he became poor, that ye through his poverty might be rich."]],"2 Corinthians 9:6 to 11":[[9,6,"But this I say, He which soweth sparingly shall reap also sparingly; and he which soweth bountifully shall reap also bountifully."],[9,7,"Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver."],[9,8,"And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work:"],[9,9,"(As it is written, He hath dispersed abroad; he hath given to the poor: his righteousness remaineth for ever."],[9,10,"Now he that ministereth seed to the sower both minister bread for your food, and multiply your seed sown, and increase the fruits of your righteousness;)"],[9,11,"Being enriched in every thing to all bountifulness, which causeth through us thanksgiving to God."]],"2 Kings 23:12 to 15":[[23,12,"And the altars that were on the top of the upper chamber of Ahaz, which the kings of Judah had made, and the altars which Manasseh had made in the two courts of the house of the LORD, did the king beat down, and brake them down from thence, and cast the dust of them into the brook Kidron."],[23,13,"And the high places that were before Jerusalem, which were on the right hand of the mount of corruption, which Solomon the king of Israel had builded for Ashtoreth the abomination of the Zidonians, and for Chemosh the abomination of the Moabites, and for Milcom the abomination of the children of Ammon, did the king defile."],[23,14,"And he brake in pieces the images, and cut down the groves, and filled their places with the bones of men."],[23,15,"Moreover the altar that was at Beth-el, and the high place which Jeroboam the son of Nebat, who made Israel to sin, had made, both that altar and the high place he brake down, and burned the high place, and stamped it small to powder, and burned the grove."]],"2 Kings 2:1 to 15":[[2,1,"And it came to pass, when the LORD would take up Elijah into heaven by a whirlwind, that Elijah went with Elisha from Gilgal."],[2,2,"And Elijah said unto Elisha, Tarry here, I pray thee; for the LORD hath sent me to Beth-el. And Elisha said unto him, As the LORD liveth, and as thy soul liveth, I will not leave thee. So they went down to Beth-el."],[2,3,"And the sons of the prophets that were at Beth-el came forth to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he said, Yea, I know it; hold ye your peace."],[2,4,"And Elijah said unto him, Elisha, tarry here, I pray thee; for the LORD hath sent me to Jericho. And he said, As the LORD liveth, and as thy soul
