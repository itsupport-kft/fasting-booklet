<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3a40">
<title>Redigging the Be'erot · 21 Day Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f8f8; --surface:#ffffff; --ink:#152427; --muted:#56676a; --line:#e6ebeb;
  --water:#1d6c75; --water-deep:#0f3a40; --water-soft:#d7e8e8; --gold:#b57d1c; --gold-soft:#f4e6c8;
  --stone:#d3dbdb; --focus:#b57d1c;
  --pop-bg:#123f45; --pop-ink:#eef6f5; --pop-muted:#9cc5c6; --pop-num:#f0c36a; --pop-btn:rgba(255,255,255,.12);
  --sans:"Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif:var(--sans);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1c1f; --surface:#122a2e; --ink:#e4ecea; --muted:#9db0b0; --line:#23413f;
    --water:#4fb3bb; --water-deep:#0a2a2e; --water-soft:#163d42; --gold:#e0a944; --gold-soft:#3a2f17; --stone:#2a4446;
    --pop-bg:#e8f1f0; --pop-ink:#132a2d; --pop-muted:#4f6a6c; --pop-num:#1d6c75; --pop-btn:rgba(15,58,64,.08);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1c1f; --surface:#122a2e; --ink:#e4ecea; --muted:#9db0b0; --line:#23413f;
  --water:#4fb3bb; --water-deep:#0a2a2e; --water-soft:#163d42; --gold:#e0a944; --gold-soft:#3a2f17; --stone:#2a4446;
    --pop-bg:#e8f1f0; --pop-ink:#132a2d; --pop-muted:#4f6a6c; --pop-num:#1d6c75; --pop-btn:rgba(15,58,64,.08);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 48px}
.hidden{display:none!important}

/* ---------- Home ---------- */
.home-head{padding:32px 0 4px}
.home-head h1{font-size:1.75rem;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em}
.home-head p{margin:6px 0 0;color:var(--muted);font-family:var(--sans);font-size:.92rem}

.well{display:flex;gap:18px;align-items:center;margin:22px 0 6px;padding:20px;background:var(--surface);border-radius:20px;box-shadow:0 1px 2px rgba(15,58,64,.06)}
.well svg{flex:0 0 auto;width:84px;height:84px}
.well-text strong{display:block;font-size:1.1rem;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.well-text span{display:block;color:var(--muted);font-family:var(--sans);font-size:.9rem;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--water);color:#fff;font-family:var(--sans);font-weight:600;font-size:.95rem;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06201f}}
:root[data-theme="dark"] .btn{color:#06201f}
.well-text .btn{margin-top:12px}

.movement{margin-top:32px}
.movement h2{margin:0;font-size:1rem;font-weight:700;letter-spacing:-.01em}
.movement h2 em{font-style:normal;color:var(--water)}
.movement p{margin:2px 0 10px;color:var(--muted);font-family:var(--sans);font-size:.86rem;line-height:1.45}
.days{list-style:none;margin:0;padding:0}
.day-row{display:flex;width:100%;text-align:left;align-items:center;gap:14px;padding:11px 2px;background:none;border:0;cursor:pointer}
.day-row[aria-disabled="true"]{cursor:default}
.day-row[aria-disabled="true"] .dr-title{color:var(--muted)}
.dr-num{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--sans);font-weight:600;font-size:.9rem;border:1.5px solid var(--stone);color:var(--muted);position:relative;overflow:hidden}
.dr-num .fill{position:absolute;left:0;right:0;bottom:0;background:var(--water-soft);transition:height .4s ease}
.dr-num b{position:relative}
.day-row.is-open .dr-num{border-color:var(--water);color:var(--water)}
.day-row.is-done .dr-num{background:var(--water);border-color:var(--water);color:#fff}
.dr-main{flex:1;min-width:0}
.dr-title{display:block;font-size:.98rem;line-height:1.3;font-weight:500}
.dr-meta{display:block;font-family:var(--sans);font-size:.8rem;color:var(--muted);margin-top:2px}
.dr-icon{flex:0 0 22px;color:var(--muted)}
.day-row.is-done .dr-icon{color:var(--water)}

.foot{margin-top:34px;color:var(--muted);font-family:var(--sans);font-size:.8rem;line-height:1.5}
.foot button{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:.8rem}

/* ---------- Day ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 10px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border:0;background:none;font-family:var(--sans);font-weight:600;color:var(--water);cursor:pointer}
.tb-progress{flex:1;height:4px;background:var(--stone);border-radius:6px;overflow:hidden}
.tb-progress i{display:block;height:100%;background:var(--water);transition:width .3s}
.tb-count{font-family:var(--sans);font-size:.8rem;color:var(--muted);min-width:56px;text-align:right;padding-right:6px}

.day-head{padding:24px 0 6px}
.day-kicker{font-size:.85rem;color:var(--muted);font-weight:500}
.day-head h1{font-size:1.65rem;line-height:1.2;margin:6px 0 0;font-weight:700;letter-spacing:-.02em}
.day-head .sub{margin:4px 0 0;color:var(--muted)}

.anchor{margin:20px 0;padding:18px;background:var(--water-soft);border-radius:16px}
.anchor p{margin:0;font-size:1.02rem;line-height:1.55;font-weight:500}
.anchor cite{display:block;margin-top:10px;font-style:normal;font-size:.85rem;color:var(--water);font-weight:600}

.teach{margin:0 0 8px}
.teach summary{cursor:pointer;list-style:none;font-weight:600;font-size:.95rem;color:var(--water);min-height:44px;display:flex;align-items:center;gap:8px}
.teach summary::-webkit-details-marker{display:none}
.teach summary .chev{transition:transform .2s}
.teach[open] summary .chev{transform:rotate(90deg)}
.teach .prose p{margin:0 0 .9em;color:var(--muted)}

.checklist{margin:18px 0 6px;background:var(--surface);border-radius:16px;padding:6px 16px;box-shadow:0 1px 2px rgba(15,58,64,.06)}
.checklist h2{font-size:.95rem;margin:12px 0 4px;font-weight:700}
.cl-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-family:var(--sans);font-size:.92rem;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.cl-item:first-of-type{border-top:0}
.cl-item .t{flex:1}
.cl-item .c{color:var(--muted);font-size:.82rem}
.tick{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--stone);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.tick.on{background:var(--water);border-color:var(--water);color:#fff}

.session{margin-top:12px;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(15,58,64,.06)}
.s-head{display:flex;align-items:center;gap:12px;width:100%;padding:16px;background:none;border:0;text-align:left;cursor:pointer}
.s-head .tick{flex-basis:28px;height:28px}
.s-main{flex:1;min-width:0}
.s-time{display:block;font-size:.78rem;color:var(--muted);font-weight:500}
.s-title{display:block;font-size:1rem;line-height:1.3;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.s-count{font-family:var(--sans);font-size:.8rem;color:var(--muted);white-space:nowrap}
.s-body{padding:0 16px 14px;border-top:1px solid var(--line)}
.s-sub{margin:12px 0 0;color:var(--muted);font-weight:500}
.s-about p{margin:12px 0 0;color:var(--muted)}
.s-about.clamp p:not(:first-child){display:none}
.more{background:none;border:0;padding:6px 0;margin-top:2px;font-family:var(--sans);font-size:.88rem;font-weight:600;color:var(--water);cursor:pointer;min-height:40px}
.scrip{margin:14px 0 4px}
.scrip h3,.points-h h3{font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:5px 10px;border-radius:8px;background:var(--bg);color:var(--ink);font-weight:500}
.note{margin:16px 0 4px;padding:10px 12px;background:var(--gold-soft);border-radius:10px;font-size:.92rem;font-weight:500}
.points-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:18px}
.points-h button{background:none;border:0;font-family:var(--sans);font-size:.85rem;font-weight:600;color:var(--water);cursor:pointer;min-height:40px;padding:0 4px}
.points{list-style:none;margin:0;padding:0}
.pt{border-top:1px solid var(--line)}
.pt label{display:flex;gap:12px;padding:12px 0;cursor:pointer;align-items:flex-start}
.pt input{position:absolute;opacity:0;width:1px;height:1px}
.pt .box{flex:0 0 24px;height:24px;margin-top:0;border-radius:7px;border:1.5px solid var(--stone);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.pt input:checked + .box{background:var(--water);border-color:var(--water);color:#fff}
.pt input:focus-visible + .box{outline:3px solid var(--focus);outline-offset:2px}
.pt .n{font-size:.78rem;color:var(--muted);font-weight:600;min-width:18px;margin-top:3px;font-variant-numeric:tabular-nums}
.pt .txt{flex:1}
.pt input:checked ~ .txt{color:var(--muted)}

.questions{margin-top:12px;background:var(--surface);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(15,58,64,.06)}
.questions h2{margin:0;font-size:1rem;font-weight:700}
.questions .qnote{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.q{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.q p{margin:0 0 10px}
.q textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);font:inherit;font-size:.98rem;line-height:1.5;resize:vertical}
.q .qcheck{display:flex;gap:10px;align-items:center;margin-top:10px;cursor:pointer;font-family:var(--sans);font-size:.9rem;font-weight:600}
.q .qcheck input{position:absolute;opacity:0;width:1px;height:1px}
.q .qcheck input:checked + .box{background:var(--water);border-color:var(--water);color:#fff}
.q .qcheck input:focus-visible + .box{outline:3px solid var(--focus);outline-offset:2px}
.q .box{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid var(--stone);display:grid;place-items:center;color:transparent}

.done-card{margin-top:22px;padding:20px;border-radius:16px;background:var(--water-deep);color:#e8f2f1;text-align:center}
.done-card h2{margin:0;font-size:1.2rem;font-weight:700}
.done-card p{margin:8px 0 0;font-family:var(--sans);font-size:.92rem;color:#bcd9d9}
.done-card .btn{margin-top:14px;background:#e8f2f1;color:var(--water-deep)}


.chip{border:0;cursor:pointer;min-height:32px}
.chip[aria-expanded="true"]{background:var(--water);color:#fff}
.pop{position:fixed;z-index:30;width:min(92vw,420px);max-height:min(52vh,420px);overflow:auto;-webkit-overflow-scrolling:touch;background:var(--pop-bg);color:var(--pop-ink);border-radius:14px;box-shadow:0 10px 30px rgba(8,30,34,.18),0 1px 3px rgba(8,30,34,.12);padding:14px 16px 16px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.pop.show{opacity:1;transform:none}
.pop-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;position:sticky;top:-14px;background:var(--pop-bg);padding-top:2px}
.pop-h strong{font-size:.92rem;font-weight:700}
.pop-h span{font-size:.72rem;font-weight:600;color:var(--pop-muted);margin-left:6px}
.pop-x{border:0;background:var(--pop-btn);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--pop-ink);flex:0 0 auto}
.pop p{margin:0;font-size:.95rem;line-height:1.6}
.pop sup{font-size:.68rem;font-weight:700;color:var(--pop-num);margin-right:3px;vertical-align:.35em}
.warn{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);font-size:.88rem;font-weight:500;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);font-family:var(--sans);font-size:.9rem;padding:12px 18px;border-radius:12px;max-width:min(90vw,420px);text-align:center;transition:opacity .25s,transform .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="home" class="wrap"></main>
<div id="dayview" class="hidden">
  <div class="topbar"><div class="topbar-in">
    <button class="back" id="backBtn" aria-label="Back to all days"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>All days</button>
    <div class="tb-progress" aria-hidden="true"><i id="tbBar"></i></div>
    <span class="tb-count" id="tbCount"></span>
  </div></div>
  <main class="wrap" id="day"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="book" type="application/json">[{"n":1,"date":"Monday, October 5","title":"The Altar Before the Well","subtitle":"A Day Of Thanksgiving","anchor":{"text":"And he builded an altar there, and called upon the name of the LORD, and pitched his tent there: and there Isaac's servants digged a well.","ref":"Genesis 26:25"},"teaching":["Read the order of Genesis 26:25 again, because most people get it backwards for their entire Christian lives.","Isaac built the altar first. Then he called on the name of the Lord. Then he pitched his tent. And only then, at the very end of the verse, did the digging begin.","He did not dig his way into an encounter. He encountered, and the encounter produced the digging.","We start every fast with thanksgiving for exactly this reason. Before we touch a single altar of the enemy, we build one for God. Before we name one demonic system, we name His goodness. Because a person who begins a fast complaining is a person who will end a fast empty.","There is a woman in our congregation who has been part of this fast since 2017. She came the first year with a list of grievances longer than her arm. Nothing was working. Everything was blocked. She told us later that on Day One she could barely bring herself to say thank you. She said the words felt like sandpaper in her mouth. But she said them anyway. And by the third year, she said something that has stayed with us: \"The list did not change. I changed. And then the list changed.\"","Thanksgiving is not denial. Thanksgiving is not pretending your situation is fine. Thanksgiving is a legal declaration that God has been good to you before, and that His track record is admissible evidence in the case you are about to open.","Today, all four sessions are thanksgiving. Four different dimensions. Do not treat today as a warm up. Today is the foundation the other twenty days will stand on.","Everything we build for the next three weeks rests on what happens in these four sessions.","Bring your mouth. Bring your hands. Bring your feet. And bring a real memory of a real thing God really did."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The First Stone: Building an Altar in the Dark","subtitle":"","about":["Everything in this fast begins now. At midnight we are not asking for anything. We are laying the first stone of an altar. An altar is simply a place where a man and God meet on agreed terms. Before we ask God for one thing, we are giving Him a place to stand in our lives.","Notice that God appeared to Isaac at night (Genesis 26:24). The night is not a disadvantage. For those who know how to use it, the night is an appointment."],"scriptures":["Genesis 26:24 to 25","Genesis 28:11 to 18","Psalm 119:62","Psalm 63:6","Acts 16:25","Exodus 20:24"],"note":"","points":["Father, at this midnight hour, I build You an altar in my life, and I declare that You are welcome here. In Jesus' name.","Lord, I thank You for the mercy that carried me to the first hour of this fast. Ten thousand did not make it here. I did. Thank You.","Every altar in my life that was built by another hand and not by mine, I dismantle you now by the blood of Jesus.","Father, let the fire of God fall upon this altar I am building tonight, and let it never go out. Leviticus 6:13.","I decree that this midnight hour becomes a gate of encounter over my life for the next twenty one days.","Every spirit that has assigned my nights to torment instead of to encounter, I evict you tonight in the name of Jesus.","Lord, as You appeared to Isaac the same night, appear in my night. Do not let this fast pass without an encounter.","I thank You, Father, that You are the God of my father and the God of my house, and my bloodline is not abandoned.","Every foundation of prayerlessness in my family line, I break you tonight by the authority of the name of Jesus.","I decree that from this night forward, my home has an altar, and my altar has fire.","Father, thank You for choosing me for this journey. Thank You that You did not skip my name.","Every voice that spoke against my ability to finish what I start, be silenced now in Jesus' name.","Lord, I dedicate these twenty one days to You before I have received a single answer. Receive my obedience as worship.","I thank You for my marriage and for my covenant, whether it is present, promised, or still being formed in Your hands.","Every altar in my father's house that is speaking against my marriage, I silence you tonight by the blood of Jesus.","Every altar in my mother's house that is competing with the altar of God in my life, collapse now in Jesus' name.","Father, thank You for the tent. Thank You for shelter, for covering, for a place to lay my head tonight.","I decree that what I open at this midnight hour, no demon has the authority to close.","Lord, let this altar I build tonight become a landmark in the spirit that my children will inherit.","I thank You, Father, in advance, for every well that will open in these twenty one days. It is done.","Blessed be the name of the Lord. From the rising of the sun to the going down of the same, His name is to be praised."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Thank You for the Breath I Did Not Earn","subtitle":"","about":["You woke up. You did not arrange that. You did not negotiate it. Somewhere in the night, your heart kept beating without a single instruction from you, and your lungs kept working while your mind was completely offline. This hour is thanksgiving for preservation. For the accident that did not happen. For the diagnosis that came back clean. For the enemy who planned something in the night and could not execute it.","\"It is of the LORD's mercies that we are not consumed, because his compassions fail not. They are new every morning\" (Lamentations 3:22 to 23). The word is consumed. Not inconvenienced. Consumed. There was a consuming assigned to you, and mercy stopped it."],"scriptures":["Lamentations 3:22 to 23","Psalm 3:5","Psalm 118:17","Psalm 124:1 to 8","Psalm 91:5 to 7","Job 33:4"],"note":"","points":["Father, I thank You for breath in my body this morning. I did not earn it and I do not take it lightly.","Thank You, Lord, that I laid down and slept, and I awakened, for You sustained me. Psalm 3:5.","I thank You for every arrow that flew by night and could not find my address.","If it had not been the Lord who was on my side, they would have swallowed me up. Thank You, Lord.","Every plan concluded against my life in the night season that failed, I give You praise for the failure of it.","Father, thank You for my mind. Thank You that I still have my sanity, my memory, and my reasoning.","I thank You for the mercy that answered when justice had every right to speak.","Every spirit of premature death assigned to my household, you have failed, and you will keep failing, in Jesus' name.","Thank You, Lord, for the sickness that was diverted, the accident that was cancelled, and the loss I never even knew about.","Father, I thank You for the ones still sleeping under my roof this morning. Their breath is Your gift.","I decree that the same mercy that brought me to this morning will carry me to the last day of this fast.","Every morning I begin in complaint, I repent. From today, my first words are thanksgiving.","Thank You, Lord, for the doors that were shut, because they were shutting me out of destruction.","I thank You for the prayers of people I have never met who covered me without my knowledge.","Every anointing of grace that has been keeping me quietly, I honour you and I ask for more.","Father, thank You for my spouse, for the covenant You have joined or will join. Thank You for the person, the process, and the promise.","Every morning depression, every waking heaviness, every dawn oppression, break now in Jesus' name.","I decree that my mornings from today become altars and not battlegrounds.","Thank You, Lord, for the years I lost, because You have promised to restore them. Joel 2:25.","I shall not die but live, and declare the works of the Lord. Psalm 118:17.","This is the day which the Lord hath made. I will rejoice and be glad in it, and no devil will steal my joy today."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Thank You for the Wells I Did Not Dig","subtitle":"","about":["Isaac inherited wells he never dug. Abraham did the labour. Isaac drank the water. That is what inheritance means.","You are drinking today from wells you never dug. Somebody prayed for you before you were born. Somebody in your bloodline made a decision that opened a door you walked through without ever noticing. And most of all, Somebody hung on a cross and dug the deepest well in human history, and you drink from it every single day for free.","\"And houses full of all good things, which thou filledst not, and wells digged, which thou diggedst not\" (Deuteronomy 6:11).","This hour is dangerous for pride and wonderful for humility. Because when you sit down and honestly count what you have that you did not build, the list will humble you into worship."],"scriptures":["Deuteronomy 6:10 to 12","Genesis 26:18","Joshua 24:13","John 4:38","1 Corinthians 4:7","Psalm 16:6","Isaiah 12:3"],"note":"","points":["Father, I thank You for wells in my life that I did not dig and did not deserve.","Thank You, Lord, for the blood of Jesus, the deepest well ever opened, and I drink from it freely today.","I thank You for every ancestor in my line who bowed a knee to You, and I honour their labour today.","Every good thing planted in my bloodline that the enemy buried, I command it to resurface now in Jesus' name.","Father, thank You for the salvation I did not purchase and could never have afforded.","I thank You for the education, the skill, and the opportunity that came to me through somebody else's sacrifice.","Every inherited blessing that has been sitting dormant in my family line, I activate you today by the name of Jesus.","Thank You, Lord, for the country I live in, the roof over my head, and the food I will break this fast with.","Every spirit of entitlement and ingratitude in me, I renounce you and cast you out today.","Father, thank You for the mothers and fathers in the faith who carried me when I could not carry myself.","I thank You for Kingdom Full Tabernacle, for this altar, and for the grace on this house.","Thank You, Lord, for Apostle and Prophetess, and for every leader whose prayers have covered my life.","Every good name in my bloodline that was defamed, I restore you today as Isaac restored the names of the wells.","Father, I thank You for the marriages in my family that stood, and I ask for their strength in my own.","I thank You for every wise word spoken over my life that is still working even now.","Every well of blessing filled with earth in my family line, be opened again today in the name of Jesus.","Lord, thank You for the gifts in me that I did not develop and did not create. They are Yours.","The lines are fallen unto me in pleasant places. I have a goodly heritage. Thank You, Lord.","I decree that I will not be the generation that squanders the well. I will dig, and I will pass it on.","Father, make me a digger of wells for my children, so that they inherit water and not dust.","With joy shall I draw water out of the wells of salvation. Isaiah 12:3. Thank You, Lord."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"The Sound That Scatters: Praise As a Weapon","subtitle":"","about":["Tonight thanksgiving stops being polite and becomes violent.","Most believers understand praise as a response to victory. Scripture teaches praise as a cause of victory. Look carefully at 2 Chronicles 20:22. \"And when they began to sing and to praise, the LORD set ambushments.\" The ambush was not set when they began to fight. The ambush was set when they began to sing. Jehoshaphat put the singers in front of the army. Militarily that is insanity. You do not send the choir ahead of the soldiers. But in the realm of the spirit, the sound goes first and the sword follows.","Look at Paul and Silas in Acts 16. Backs shredded. Feet in stocks. Inner prison, which is the deepest cell. And at midnight they sang. Not after the earthquake. Before it. The song came first, and then \"the foundations of the prison were shaken\" (Acts 16:26). Notice what was shaken. Not the door. Not the chain. The foundations. That is what praise does. It goes underneath the structure and destabilises the thing that is holding the structure up.","Jericho fell to a shout. Not a battering ram. A shout. Tonight we are going to praise until something in the foundation of our situations begins to shift. This is not a concert. This is warfare with a melody.","Come with your voice. Come standing. Come ready."],"scriptures":["2 Chronicles 20:20 to 22","Acts 16:25 to 26","Joshua 6:20","Psalm 149:6 to 9","Psalm 8:2","Psalm 22:3","Psalm 47:1","Isaiah 61:3"],"note":"Stand for this session. Where it says shout, shout.","points":["Father, tonight I offer You praise not because everything is fine, but because You are worthy. Receive my sacrifice.","I put the singers in front of my battle tonight. My praise goes first and my breakthrough follows.","Every foundation holding my situation in place, be shaken now by the sound of praise, in Jesus' name.","Let God arise, and let His enemies be scattered around my life, my marriage, and my household.","Every prison door assigned to hold my destiny, open now by the earthquake of praise. Acts 16:26.","Every stock and every chain on my hands and my feet, fall off now in the name of Jesus.","I decree that the high praises of God are in my mouth and a two edged sword is in my hand. Psalm 149:6.","Every wall of Jericho standing between me and my inheritance, I shout you down tonight in Jesus' name.","Lord, You inhabit the praises of Your people. Come and inhabit this house and this hour.","Every spirit of heaviness that has stolen my song, I strip you off and I put on the garment of praise.","Every ambush the enemy set for me, I decree a divine reversal. Let the ambushment be set against my enemies.","Out of the mouth of babes You have ordained strength to still the enemy and the avenger. Psalm 8:2.","Every demonic sound speaking over my life, my name, and my marriage, be drowned out by the sound of praise.","I praise God for the answer I have not yet seen, and I count it as done in the name of Jesus.","Every dry season in my worship life, break now. Restore to me the joy of Your salvation.","Lord, teach my house to praise. Let my children grow up in a home that knows how to make sound.","Every altar erected against my breakthrough, be overthrown by the sound going up from this place tonight.","I decree that my praise confuses my enemies and cancels their strategy, in Jesus' name.","Every stone the Philistines put in my well, begin to shake and dislodge by the vibration of this praise.","Father, let this praise open the heavens over the entire twenty one days of this fast.","Let everything that has breath praise the Lord. I shout it now over my life. Praise the Lord!"]}],"questions":["Name three specific wells in your life that you did not dig. Who dug them, and have you ever thanked God out loud for them?","Isaac built the altar before he dug the well. What does your personal altar actually look like right now, and what is one thing you will change about it for these twenty one days?"],"questionNote":"Write it down. You will read this again on Day Twenty One."},{"n":2,"date":"Tuesday, October 6","title":"The Hands That Hold the Shovel","subtitle":"","anchor":{"text":"Who shall ascend into the hill of the LORD? or who shall stand in his holy place? He that hath clean hands, and a pure heart.","ref":"Psalm 24:3 to 4"},"teaching":["Digging is filthy work. You cannot open a well in a clean shirt. But here is the paradox of this fast: the work is dirty and the digger must be clean. You are about to go into your father's house and your mother's house. You are about to confront altars, expose systems, and call out things by name. That is not a job for a man carrying unconfessed sin, and it is not a job for a woman carrying unreleased offence.","The enemy does not fear your volume. He fears your legal standing.","There is a reason the sons of Sceva got beaten in Acts 19. They used the right name. They said the right words. They had zero authority. \"Jesus I know, and Paul I know; but who are ye?\" (Acts 19:15). The demon did not challenge their theology. It challenged their identity.","Today we settle the identity question before we go to war.","Three movements today. We repent in the morning, because sin gives the enemy a legal claim. We forgive at noon, because unforgiveness is the single most common leak in a believer's spiritual life and it will drain a well faster than any Philistine. And at 6:00pm we receive the Holy Ghost afresh, because you cannot fight what is spiritual with what is merely human. A hard word before we begin: some of you are carrying an offence against a parent, a former spouse, a church leader, or a sibling, and you have carried it so long it feels like a personality trait instead of a prison. Today it comes off. Not because they deserve it. Because you cannot dig with a fist. A closed hand cannot hold a shovel.","Make the phone call today if you can. If you cannot, release it at the altar."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"Search Me: The Midnight Mirror","subtitle":"","about":["David did not ask God to search his enemies. He asked God to search him. \"Search me, O God, and know my heart: try me, and know my thoughts: and see if there be any wicked way in me\" (Psalm 139:23 to 24). That is a dangerous prayer, and most people avoid it because they suspect God will actually answer it.","At this hour we are not accusing ourselves and we are not grovelling. Condemnation is not conviction. Condemnation makes you hide. Conviction makes you come. Tonight we come, and we let the light in, and we let God show us what we have been unable or unwilling to see."],"scriptures":["Psalm 139:23 to 24","Lamentations 3:40","1 Corinthians 11:28","Hebrews 4:12 to 13","Psalm 19:12 to 13","Proverbs 28:13"],"note":"","points":["Father, search me tonight. Know my heart. Try me and know my thoughts. I am not hiding from You.","Lord, show me what I have justified for so long that I no longer see it as sin.","Every secret thing in me that gives the enemy a legal claim, expose it now by the light of Your word.","Cleanse me from secret faults. Keep me back from presumptuous sins. Psalm 19:12 to 13.","Every area where I have been deceived about my own condition, open my eyes tonight in Jesus' name.","Lord, let Your word divide between my soul and my spirit and show me my true motive. Hebrews 4:12.","Every hidden compromise in my private life that is draining my spiritual authority, I bring it to the light now.","Father, I refuse condemnation and I receive conviction. Lead me to repentance, not to shame.","Every stronghold I have been feeding while asking God to remove it, I renounce the feeding tonight.","Lord, show me every place where I have been the Philistine in my own life, filling my own well with dirt.","Every generational pattern operating through me that I have accepted as normal, expose it now in Jesus' name.","Father, search my marriage and my covenant relationship. Show me my part, not only theirs.","Every word I have spoken in my house that grieved the Holy Spirit, I ask for mercy tonight.","Lord, show me what I am pretending not to know.","Every root of bitterness springing up in me and defiling many, be uprooted now. Hebrews 12:15.","Father, I ask for a tender heart. Take away the stony heart and give me a heart of flesh. Ezekiel 36:26.","Every spirit of self righteousness and religious pride, I renounce you tonight in Jesus' name.","Lord, if there is any wicked way in me, deal with it before I go a single day further in this fast.","Every idol I have set up in my heart, I pull you down tonight by the authority of the name of Jesus.","Father, make my hands clean for what You are about to make me do.","Create in me a clean heart, O God, and renew a right spirit within me. Psalm 51:10."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Repentance: Coming Home Before Sunrise","subtitle":"","about":["The word repentance in the New Testament is metanoia. It does not mean feeling terrible. It means changing your mind so completely that you change your direction. It is a military about turn, not an emotional episode. The prodigal son did not repent when he felt sad in the pig pen. He repented when \"he came to himself\" and got up and walked (Luke 15:17 to 20). The proof of repentance is not tears. The proof of repentance is feet.","This morning we are not just saying sorry. We are turning. And we are turning specifically, not vaguely. Vague repentance produces vague deliverance. Name the thing."],"scriptures":["Luke 15:17 to 24","1 John 1:9","Acts 3:19","2 Chronicles 7:14","Psalm 51:1 to 17","Isaiah 55:7","Joel 2:12 to 13"],"note":"","points":["Father, I come home this morning. I am not sending a message. I am coming myself.","I repent of every sin I have named and every sin I have not had the courage to name. Have mercy on me, O God.","Lord, I confess my sin, and I thank You that You are faithful and just to forgive and to cleanse. 1 John 1:9.","I repent on behalf of my father's house for every sin that opened a door the enemy is still using.","I repent on behalf of my mother's house for every covenant, sacrifice, and dedication made in ignorance.","Every legal ground the enemy holds over my life through unconfessed sin, I cancel it now by the blood of Jesus.","Father, I repent of prayerlessness. I repent of the altars I let go cold. Restore the fire.","I repent of every word I spoke against Your promise, against my spouse, and against my own destiny.","Every sin I have committed against my body, the temple of the Holy Ghost, I bring it under the blood now.","Father, I repent of loving the gift more than the Giver, and the platform more than the Presence.","I repent of every compromise I made for money, for acceptance, or for peace that was not real peace.","Every soul tie formed through sin that is still draining my life, I sever you now by the sword of the Spirit.","Father, I repent of trusting in the arm of flesh and calling it wisdom. Jeremiah 17:5.","I repent of the sin of ingratitude, and I ask You to restore thanksgiving to my mouth permanently.","Every altar of secret sin in my life, I demolish you this morning in the name of Jesus.","Father, let repentance not be a feeling in me today. Let it become a direction.","Rend my heart and not my garment. Turn me back to You with all my heart. Joel 2:12 to 13.","Every consequence of past sin still following my household, be arrested and reversed by the blood of Jesus.","Father, if I turn from my wicked way, You said You would hear from heaven and heal my land. Heal my land.","I receive the times of refreshing that come from the presence of the Lord. Acts 3:19.","Thank You, Lord, that my sins are blotted out, and that You remember them no more. It is finished."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Releasing the Hand That Held You","subtitle":"","about":["Forgiveness is the most misunderstood assignment in the body of Christ.","Forgiveness is not saying it was fine. It was not fine. Forgiveness is not reconciliation, and it is not the removal of consequences or boundaries. Forgiveness is the transfer of a case out of your court and into God's. You are not dropping the charges. You are moving the trial to a higher jurisdiction and stepping down as prosecutor.","Look at what Jesus said in Matthew 18. The unforgiving servant was \"delivered to the tormentors\" (Matthew 18:34). Torment. That word is doing heavy lifting. Some of you have been asking God to remove a torment that unforgiveness is legally holding in place.","And the hardest one for many in this fast: some of you have to forgive your mother. Some of you have to forgive your father. They may be gone. They may have never apologised. They may not even know what they did. Release them anyway, because that hand is still around your throat and it does not have to be.","Then at the end of this hour, we open the door to the Holy Spirit, because forgiveness empties a room, and an empty room does not stay empty (Matthew 12:44). We do not just release. We refill."],"scriptures":["Matthew 18:21 to 35","Mark 11:25 to 26","Ephesians 4:31 to 32","Colossians 3:13","Matthew 6:14 to 15","Matthew 12:43 to 45","Luke 11:13"],"note":"","points":["Father, I choose to forgive today, not because it is easy, but because You have commanded it and modelled it.","I release from my court every person who wounded me, and I transfer their case to the Judge of all the earth.","Lord, I forgive my father for every failure, every absence, and every word that marked me. I release him now.","Lord, I forgive my mother for every wound, spoken or silent. I release her now in Jesus' name.","I forgive every leader, every pastor, and every mentor who mishandled my trust. I let them go.","I forgive my spouse, my former spouse, and every person I have been in covenant with. I release them.","Every tormentor that gained access to my life through unforgiveness, your legal ground is gone. Leave now.","Father, I forgive myself for what I did and for what I allowed. I stop punishing what You have pardoned.","Every root of bitterness in my heart, I command you to dry up from the root today. Mark 11:20.","I release every debt owed to me that will never be repaid. I write it off in the name of Jesus.","Every replay of old offence that runs in my mind, I command you to stop now in Jesus' name.","Father, take away all bitterness, wrath, anger, clamour, and evil speaking from me. Ephesians 4:31.","Every spirit of resentment operating in my marriage and in my home, I cast you out now.","Lord, heal the wound underneath the anger. Do not just take the anger. Heal the wound.","Every relationship the enemy destroyed through offence that You want restored, begin restoration today.","I ask forgiveness from those I have hurt, and I commit to going to them where it is right and safe to do so.","Father, my house is swept and empty now. I will not leave it empty. Come and fill it, Holy Spirit.","Holy Spirit, You are welcome in every room forgiveness has just opened in me.","I receive the Holy Spirit today as comforter, as teacher, as helper, and as the power for these twenty one days.","Every dry place in my spirit, be flooded now by the outpouring of the Holy Ghost.","Father, make me quick to forgive for the rest of my life. Let offence find no landing strip in me."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Fire on Wet Wood: The Baptism of the Holy Ghost","subtitle":"","about":["Tonight we deal with power. Go back to Mount Carmel in 1 Kings 18. Elijah is facing four hundred and fifty prophets of Baal. And before he prays, he does something that makes no sense. He pours water on the sacrifice. Not once. Three times. Twelve barrels. Until the trench around the altar was full.","Why would a man drown the very thing he is asking God to burn?","Because Elijah understood something about the fire of God: the fire of God is not helped by your dryness and it is not hindered by your wetness. He was removing every possible natural explanation. He was making sure that when the fire fell, nobody could say it was a spark, a coincidence, or a trick. Some of you have been telling God you are too wet. Too far gone. Too compromised. Too tired. Too many failed attempts. You have watered your own sacrifice with your history and concluded that fire cannot fall on a life like yours.","Fire falls on wet wood.","Tonight we are contending for the baptism of the Holy Ghost and fire. Not the doctrine of it. The reality of it. Jesus told the disciples to wait \"until ye be endued with power from on high\" (Luke 24:49). These were men who had walked with Him for three years, seen every miracle, and heard every sermon. And He still said wait. Exposure is not the same as endowment.","We are also going to deal tonight with everything that quenches, grieves, and counterfeits the Spirit. Because there are believers in the house who are full of information and empty of fire, and there are others who have been operating in a spirit they assumed was the Holy Ghost and was not.","Come thirsty. Come hungry. Come ready to receive."],"scriptures":["1 Kings 18:30 to 39","Luke 24:49","Acts 1:8","Acts 2:1 to 4","Acts 19:1 to 6","John 7:37 to 39","Ephesians 4:30","1 Thessalonians 5:19","Zechariah 4:6","Romans 8:11","Jude 20"],"note":"This is a receiving session. Open your mouth. Lift your hands.","points":["Father, I present myself tonight as a living sacrifice on the altar. Let Your fire fall.","Lord, my wood is wet with failure, with delay, and with disappointment. Let the fire fall anyway.","Holy Spirit, I am not asking for a visit tonight. I am asking for a habitation.","Baptise me with the Holy Ghost and with fire. Matthew 3:11. Not water only. Fire.","Every dryness in my spirit that has made me functional but powerless, be flooded tonight in Jesus' name.","Lord, I have had exposure without endowment. Tonight I receive power from on high. Luke 24:49.","Every religious spirit in my life that has form without power, I renounce you and cast you out.","Holy Spirit, teach me to pray. Take over my prayer life from tonight forward.","I stir up the gift of God that is in me. 2 Timothy 1:6. Every dormant gift, awake now.","Every counterfeit spirit that has been masquerading in my life as the Holy Spirit, I expose you and I expel you.","Every familiar spirit that has been giving me information and calling it revelation, be silenced in Jesus' name.","Lord, forgive me for every time I grieved the Holy Spirit and carried on as if nothing happened.","Every place where I have quenched the Spirit through fear, through logic, or through crowd pressure, I repent.","Father, let rivers of living water flow out of my belly. John 7:38. Break every blockage in the channel.","Holy Spirit, come and pray through me in a language my enemy cannot decode. Jude 20.","Every yoke on my life, be destroyed tonight by the anointing. Isaiah 10:27.","Not by might, nor by power, but by My Spirit, saith the Lord. I abandon my strength tonight.","Holy Spirit, come into my marriage. Be the third strand in this cord that cannot be broken.","Let the Spirit that raised Christ from the dead quicken every dead thing in my life. Romans 8:11.","Every altar of Baal competing for my devotion, be consumed by the fire of God tonight.","The God that answereth by fire, let Him be God in my life. And Lord, answer me by fire tonight."]}],"questions":["Write down one specific name. Not a category, a name. Who have you not forgiven? What will you do today to release them?","Elijah poured water on the sacrifice before he asked for fire. What have you been using as an excuse for why the fire cannot fall on your life?"],"questionNote":""},{"n":3,"date":"Wednesday, October 7","title":"The Spirit and the Spring","subtitle":"","anchor":{"text":"He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water.","ref":"John 7:38"},"teaching":["Every well in Scripture has a spring underneath it. The digging does not create the water. The digging reaches the water that was already flowing under the ground.","That is the whole picture of the Holy Spirit in your life. Jesus did not say a cup of water. He did not say a stream. He said rivers, plural, and He located them in a strange place: \"out of his belly.\" Not out of your head. Not out of your mouth. Out of your innermost being. The deepest part of you, the part nobody sees, the part you cannot manufacture and cannot fake.","Today we go after the source.","Yesterday we received. Today we learn to draw. There is a difference between having the Spirit and yielding to the Spirit. Many believers are like a house with running water and every tap closed. The supply is not the problem. The access is. We are dealing today with three things.","Praying in the Spirit, which Jude calls the building up of yourself on your most holy faith (Jude 20). This is the technology of the Spirit. It is a communication channel the enemy cannot decode, a prayer language that bypasses your limited understanding and prays the perfect will of God when you do not know what to ask.","The anointing, which is not an atmosphere and not a feeling. \"The yoke shall be destroyed because of the anointing\" (Isaiah 10:27). The anointing is the burden removing, yoke destroying power of God resting on a person for a purpose.","And tonight, discernment between true fire and strange fire, because Nadab and Abihu died offering fire the Lord did not command (Leviticus 10:1 to 2), and there is more strange fire in the church today than most people are willing to admit. Come thirsty. \"If any man thirst, let him come unto me, and drink\" (John 7:37). Thirst is the only qualification He listed."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Wind Over the Waters","subtitle":"","about":["Genesis 1:2. \"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters.\"","Before there was light, before there was order, before there was a single word spoken, the Spirit was moving. The Spirit moves over chaos. That is His specialty. He does not require your situation to be organised before He shows up. He shows up precisely where things are formless and void and dark. At this hour we are inviting the Spirit to move over the deep places in us. The parts of our lives that are still without form. The regions where nothing has ever been built."],"scriptures":["Genesis 1:1 to 3","Ezekiel 37:9 to 10","John 3:8","Acts 2:2","Psalm 42:7","Isaiah 44:3"],"note":"","points":["Spirit of God, move over the face of my deep tonight. Move over what is formless in me.","Every region of my life that is still without form and void, receive the ordering power of the Holy Ghost.","Lord, where there is darkness upon my deep, let there be light in the name of Jesus.","Come from the four winds, O breath, and breathe upon my slain places. Ezekiel 37:9.","Every dry bone in my life, in my marriage, and in my calling, hear the word of the Lord and live.","Holy Spirit, blow where You will over my household tonight. I yield the direction to You.","Deep calleth unto deep. Let the deep in God answer the deep in me tonight. Psalm 42:7.","Every shallow place in my walk with God, be broken up. I refuse a surface relationship with You.","Lord, pour water upon him that is thirsty and floods upon the dry ground of my life. Isaiah 44:3.","Every spirit of chaos and confusion assigned to my night season, be scattered by the wind of God.","Father, let the Spirit brood over my family line until something new is born.","Every closed spring in my spirit, break open at this midnight hour in the name of Jesus.","Holy Spirit, I give You permission to move in areas of my life I have kept off limits.","Every place where I have grieved You into silence, I ask You to speak again tonight.","Lord, let my midnight become the hour of creation and not the hour of torment.","I decree that the Spirit of God is moving over my marriage tonight and bringing order out of chaos.","Every void the enemy created in my life through loss, be filled by the presence of God.","Holy Spirit, restore to me sensitivity. I do not want to be a believer who cannot feel You.","Every hardness of heart that developed as protection, dissolve now under the moving of the Spirit.","Father, let this fast be the season when I learn to recognise Your voice without doubting it.","Spirit of the living God, fall fresh on me tonight and do not lift until You are finished."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"The Language of Deep Waters","subtitle":"","about":["\"But ye, beloved, building up yourselves on your most holy faith, praying in the Holy Ghost\" (Jude 20).","The word building is architectural. It is the same idea as raising a structure. When you pray in the Spirit, you are not passing time. You are constructing something in the realm of the spirit. And here is the mercy of it. \"For we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered\" (Romans 8:26). There are situations in your life that are too complicated for your vocabulary. There are family matters where you genuinely do not know what to ask for. This is God's provision for exactly that.","This morning we are not just teaching about it. We are doing it. Give the Spirit twenty minutes of uninterrupted prayer this morning. Not analysing. Not editing. Praying."],"scriptures":["Jude 20 to 21","Romans 8:26 to 27","1 Corinthians 14:2","1 Corinthians 14:4","1 Corinthians 14:14 to 15","Ephesians 6:18","Acts 2:4"],"note":"","points":["Holy Spirit, take over my prayer this morning. I yield my mouth to You.","I build myself up on my most holy faith, praying in the Holy Ghost. Jude 20.","Lord, where I do not know what to pray, let the Spirit make intercession through me with groanings.","Every barrier the enemy erected against my prayer language, I break you now in Jesus' name.","Father, I speak mysteries to You in the Spirit that my enemy cannot intercept. 1 Corinthians 14:2.","Every prayer of mine that has been intercepted in the second heaven, break through now by the Spirit.","Lord, teach me to pray with the spirit and with the understanding also. 1 Corinthians 14:15.","Every laziness and inconsistency in my prayer life, be broken by the fire of God today.","Holy Spirit, give me the burden of intercession for my household and for my nation.","I pray always with all prayer and supplication in the Spirit, watching thereunto. Ephesians 6:18.","Every distraction assigned to interrupt my prayer time, be cut off in the name of Jesus.","Lord, let my prayer life become the strongest area of my Christian walk, not the weakest.","Every silence in my spirit that came from disappointment with God, be healed and be broken.","Father, let there be a prayer altar in my home that my spouse and I keep together.","I decree that my children will grow up hearing prayer in this house.","Every spiritual dullness that makes prayer feel like a duty, be replaced by hunger in Jesus' name.","Holy Spirit, pray through me right now for the thing I cannot see and do not know about.","Lord, let my prayers rise as incense before Your throne today. Psalm 141:2.","Every situation in my life that has resisted my English, I now address in the Spirit.","Father, build something today in the realm of the spirit through my prayer that will stand for generations.","I thank You, Lord, that my prayer is heard and my answer is already released."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"The Yoke Destroying Anointing","subtitle":"","about":["\"And it shall come to pass in that day, that his burden shall be taken away from off thy shoulder, and his yoke from off thy neck, and the yoke shall be destroyed because of the anointing\" (Isaiah 10:27). Read the verse carefully. The yoke is not loosened. It is not adjusted. It is not managed. It is destroyed.","A yoke is a wooden harness placed on an animal to control its direction and extract its labour. That is exactly what the enemy does with a yoke in a human life. He does not usually kill. He redirects and extracts. He takes a man with an apostolic call and yokes him to a cycle of debt so that all his strength goes into survival. He takes a woman with a prophetic gift and yokes her to an emotional pattern so that her energy is spent on the same argument every three months for eleven years.","Some of you have been trying to negotiate with a yoke that only responds to destruction.","The anointing is not perfume and it is not atmosphere. It is God's ability resting on human weakness for a specific assignment. And the anointing you carry is not for you. It is for the yokes you were sent to break."],"scriptures":["Isaiah 10:27","Luke 4:18 to 19","1 John 2:20","1 John 2:27","Psalm 92:10","Acts 10:38","2 Corinthians 1:21","Exodus 30:22 to 33"],"note":"","points":["Father, I receive a fresh anointing today. Anoint me with fresh oil. Psalm 92:10.","Every yoke on my neck that I have been managing instead of breaking, be destroyed today by the anointing.","Every burden the enemy placed on my shoulder, be lifted off now in the name of Jesus.","Lord, the Spirit of the Lord is upon me because You have anointed me. Let that anointing function.","Every yoke of debt controlling the direction of my life, be destroyed in Jesus' name.","Every yoke of repeated failure in my family line, break and never re form.","Every emotional yoke that keeps me returning to the same cycle, be destroyed today.","Father, anoint my hands, my mouth, my mind, and my steps for the assignment You gave me.","Every counterfeit anointing operating in my life, dry up now in the name of Jesus.","I refuse to run my calling on my own strength. Lord, let the oil flow.","Every yoke placed on me by a person, a covenant, or a curse, be destroyed by the anointing.","Lord, let the anointing on my life be evident, so that Abimelech says, we saw certainly that the Lord is with him.","Every dryness in the oil of my life, be reversed. Let there be fresh oil in my vessel today.","Father, let the anointing in my life bring deliverance to somebody else this week.","Every yoke in my marriage that has kept us pulling in opposite directions, be destroyed now.","I break every yoke of oppression from over my children in the name of Jesus.","Lord, teach me to protect the anointing. Show me what drains it and what preserves it.","Every Delilah spirit assigned to talk me out of my anointing, be exposed and be cut off.","The anointing which I have received of Him abideth in me. 1 John 2:27. It is not leaving.","Father, let there be measurable difference between me before this fast and me after it.","Anointing for wells, anointing for digging, anointing for breaking stones, fall on me now in Jesus' name."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Fire Or Foam: Separating the Holy Ghost From Strange Fire","subtitle":"","about":["This is going to be an uncomfortable session, and it needs to be.","Leviticus 10. Nadab and Abihu, sons of Aaron, priests, ordained, trained, positioned. \"And they offered strange fire before the LORD, which he commanded them not. And there went out fire from the LORD, and devoured them\" (Leviticus 10:1 to 2). They did not offer no fire. They offered the wrong fire. And they were in ministry when they did it.","Here is the reality that nobody wants to say from a pulpit: there are spirits operating in churches that are not the Holy Spirit. There are people manifesting who are not being delivered. There are prophecies going forth that are coming from a divining spirit. In Acts 16, a girl followed Paul for days shouting \"These men are the servants of the most high God, which shew unto us the way of salvation\" (Acts 16:17). Every word was accurate. The source was a spirit of divination. Accuracy is not proof of origin. Tonight we deal with:","The familiar spirit, which gives information and imitates the prophetic. Saul went to Endor and got a real answer from a wrong source, and it cost him his life (1 Samuel 28).","The spirit of divination, which produces impressive results and demonic bondage at the same time.","Soulish fire, the emotional and psychological energy that looks like anointing, feels like anointing, and delivers nobody. And the fire of God, which we are contending for tonight. Some of you have carried a spirit for years that you named the Holy Ghost. Some of you received a \"prophetic word\" that has been directing your marriage decisions and it did not come from God. Tonight it gets exposed and it gets removed.","\"Beloved, believe not every spirit, but try the spirits whether they are of God\" (1 John 4:1).","Come with humility tonight. Do not defend anything."],"scriptures":["Leviticus 10:1 to 3","1 John 4:1 to 3","Acts 16:16 to 18","1 Samuel 28:7 to 20","Deuteronomy 18:10 to 12","2 Corinthians 11:14","Matthew 7:22 to 23","1 Kings 22:19 to 23","Jeremiah 23:16","Hebrews 5:14"],"note":"Pray these deliberately. Do not rush.","points":["Father, I try the spirits tonight. Show me what is truly of You in my life and what is not.","Every strange fire I have offered in ignorance, forgive me and remove it in Jesus' name.","Every familiar spirit that has been operating in my life disguised as the Holy Spirit, I expose you now.","Every spirit of divination that entered my life through a person, a place, or a practice, come out now.","Every false prophecy spoken over my life that I received and acted upon, I cancel it by the blood of Jesus.","Every decision I made in my marriage based on a word that did not come from God, I break its effect now.","Lord, deliver me from every counterfeit gift that came from a wrong source.","Every angel of light masquerading in my life, be unmasked now in the name of Jesus. 2 Corinthians 11:14.","Every altar of divination in my father's house and my mother's house, I pull you down tonight.","Every consultation with a diviner, a reader, a seer, or a herbalist in my family line, I renounce it.","Every object in my home that carries a demonic attachment, be exposed to me tonight in Jesus' name.","Every lying spirit that has been placed in the mouth of counsellors around me, be silenced. 1 Kings 22:22.","Lord, restore true discernment to me. Let my senses be exercised to discern good and evil. Hebrews 5:14.","Every soulish fire in my ministry and my worship, dry up. I want the real fire.","Every performance I have mistaken for anointing, expose it and let it die tonight.","I renounce every covenant knowingly or unknowingly made with any spirit that is not the Holy Spirit.","Every dream, vision, or impression from a demonic source, be cancelled and be erased from my memory.","Lord, if I have been deceived, I would rather know it tonight than build another year on it.","Every mixture in my spiritual life, separate now. Let the holy be holy and let the profane go.","Holy Spirit, come and fill every space that strange fire is vacating tonight.","Father, let the God that answereth by fire be God over my life. Send the real fire tonight, in Jesus' name."]}],"questions":["Jesus located the rivers in the belly, not the head. Where in your life have you been operating on information about God instead of flow from God?","Is there a word, a prophecy, or a piece of spiritual counsel currently directing a major decision in your life? Where did it come from, and are you willing to bring it back to God tonight for verification?"],"questionNote":""},{"n":4,"date":"Thursday, October 8","title":"What Lies Beneath the First Layer","subtitle":"","anchor":{"text":"If the foundations be destroyed, what can the righteous do?","ref":"Psalm 11:3"},"teaching":["Today we go underground.","There is a question in Psalm 11:3 that has troubled theologians for centuries, but for anybody in deliverance ministry it is not a mystery at all. If the foundations be destroyed, what can the righteous do? The answer is not \"nothing.\" The answer is repair the foundation. Because righteousness cannot compensate for a broken foundation. You can be genuinely saved, genuinely filled, genuinely serving, and still be standing on ground that was compromised before you were born.","This is where many Christians get frustrated. They cannot understand why a person who prays, pays tithe, serves faithfully, and lives clean keeps hitting the same wall at the same point every time. And the answer is almost always structural, not moral. Foundations are laid before you have a vote.","You did not choose the house you were born into. You did not choose the name you were given, or the sacrifices made at your birth, or the words spoken over your cradle, or the covenant your great grandmother entered so the family could survive a famine. But you inherited the consequences of every one of them. Isaac had to go back to wells his father dug, that his father's enemies filled. The problem was not created in Isaac's generation. It was inherited by Isaac's generation. And it required Isaac's hands to fix it.","Today we are going to do three things.","We are going to audit the father's house and the mother's house honestly. Not to dishonour our parents, but to accurately locate the point of entry. Honour and honesty are not enemies. We are going to restore the names, because Genesis 26:18 says Isaac called the wells by the names his father called them. The Philistines had renamed them. Renaming is a strategy of the enemy. He renames a family of priests into a family of drunks. He renames a lineage of intercessors into a lineage of divorce. Today we take the names back.","And tonight, we break altars. Gideon could not deliver a nation until he first tore down the altar in his own father's compound (Judges 6:25 to 27). Notice that God's first assignment for the deliverer was not the Midianites. It was his own family's altar. Judgement begins at the house of God, and deliverance begins at the house of your father.","A word of pastoral care: this is the day when things surface. Old memories. Old names. Things you had forgotten. That is not the enemy attacking you. That is the excavation working. Let it come up. You cannot break what you will not name."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Root Beneath the Root","subtitle":"","about":["\"Every plant, which my heavenly Father hath not planted, shall be rooted up\" (Matthew 15:13).","Notice the word plant, singular, and rooted, which means dealing with what is under the soil. You can cut a weed at ground level every week for twenty years and it will come back every week for twenty years, because the issue was never the leaf. Tonight we are asking God for something specific: show us the root beneath the root. Not the behaviour. Not even the pattern. The origin.","Some of you have been fighting a symptom for two decades. Tonight we go for the source."],"scriptures":["Matthew 15:13","Psalm 11:3","Luke 3:9","Jeremiah 1:10","Hebrews 12:15","Malachi 4:6","Isaiah 51:1"],"note":"","points":["Father, tonight I ask You to show me the root beneath the root in my life.","Every plant which my heavenly Father has not planted in my life and my lineage, be rooted up now.","Lord, take me back to the source. Show me where it actually began.","Every symptom I have been fighting while the root remained untouched, I go for the root tonight.","I lay the axe to the root of every evil tree in my family line. Luke 3:9.","Every foundational problem that has resisted twenty years of prayer, be uprooted tonight in Jesus' name.","Father, You have set me over nations to root out, to pull down, and to destroy, and then to build and to plant. Jeremiah 1:10.","Look unto the rock whence I was hewn. Lord, show me the pit whence I was digged. Isaiah 51:1.","Every foundation in my life not laid by Jesus Christ, be demolished tonight in the name of Jesus.","Every evil root planted in my life at conception, at birth, or at naming, come out now.","Every root of bitterness in my family line that has defiled many, dry up from the root tonight.","Every hidden agreement my foundation has with darkness, I break it by the blood of Jesus.","Lord, expose every wall in my life that looks solid but is standing on sand.","Every generational cycle that repeats itself in my family every generation, break tonight and do not repeat.","Father, turn the heart of the fathers to the children and the children to the fathers in my line. Malachi 4:6.","Every root feeding the failure pattern in my marriage, be severed in Jesus' name.","Every foundational curse operating in my body, my mind, and my finances, be broken now.","Lord, I refuse to hand a broken foundation to my children. It stops with me.","Every deposit made into my life in the womb by any spirit, I flush you out by the blood of Jesus.","Father, rebuild my foundation on the Rock. Let the storm come and find nothing to take.","I decree tonight that my foundation is being repaired, and what is built on it will stand."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"My Father's House, My Mother's House: The Audit","subtitle":"","about":["This morning we do the honest work of locating entry points.","Let us be clear about something first, because this teaching gets abused. Auditing your foundation is not dishonouring your parents. You can honour a father and still renounce a covenant he made. You can love a mother and still break an altar in her family line. Honour is about your posture. Renunciation is about your inheritance. Those are two different transactions. Here is what to look for as you pray this morning. Ask the Holy Spirit and let Him bring things up.","Patterns that repeat. Divorce in three generations. Deaths at the same age. Financial collapse right before breakthrough. Marriages that always fail in year seven. First born children who always struggle. Sickness that always attacks the same organ in the family.","Practices. Consultations, sacrifices, dedications, rituals at birth or at marriage, secret societies, oaths, family gods, family shrines, family rings and beads and clothes handed down.","Names. Some of you were given names that mean sorrow, or that dedicate you to a deity, or that memorialise a tragedy. Words. What did they say over you when you were young? What did they say about the family? \"We are not a lucky family.\" \"Nobody in this family stays married.\" Those are not observations. They are decrees.","Write down what surfaces. You will use the list at 6:00pm."],"scriptures":["Genesis 12:1","Exodus 20:5","Ezekiel 16:44","Ezekiel 18:2 to 3","Numbers 14:18","Jeremiah 32:18","Psalm 45:10","Nehemiah 9:2","Daniel 9:5 to 8"],"note":"","points":["Holy Spirit, this morning I ask You to open the file on my father's house. Show me what is written there.","Holy Spirit, open the file on my mother's house. Show me what was done and what was said.","Every pattern repeating in my family line that I have accepted as normal, be exposed to me now.","Every practice, ritual, or sacrifice performed over me as a child, I renounce you today in Jesus' name.","Every idol worshipped in my bloodline, I renounce your claim over my life and my seed.","Lord, if my name carries an evil meaning or a wrong dedication, cancel its power over me today.","Every dedication made over my life to any deity, shrine, or spirit, I nullify it by the blood of Jesus.","I confess the iniquity of my fathers and my mothers as Daniel did. Have mercy on my house, O God.","Every oath, pledge, or secret society membership in my family line, I renounce and I break it now.","Every family god that has been fed for generations, I cut off your supply through me in Jesus' name.","Every evil family altar erected before I was born, lose your voice over my life this morning.","Get thee out of thy country, and from thy kindred, and from thy father's house. Lord, separate me. Genesis 12:1.","Forget also thine own people, and thy father's house. Psalm 45:10. I forget every ungodly inheritance.","Every marriage pattern of failure in my family line, I terminate you today in the name of Jesus.","Every death pattern, every age of death, every recurring sickness in my line, break now in Jesus' name.","Every financial ceiling that no one in my family has ever broken, I break through you today.","Every negative word spoken over me as a child that is still ruling my adult life, I cancel you now.","Lord, I honour my father and my mother, and I renounce every ungodly inheritance from both.","I decree that the sour grapes eaten by my fathers will no longer set my teeth on edge. Ezekiel 18:2 to 3.","Every good thing in my lineage that was buried, resurface. Every evil thing, be buried permanently.","Father, I will not carry into my children what was carried into me. The chain ends at my generation."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Calling It by Its Right Name Again","subtitle":"","about":["Genesis 26:18 has a detail most people skim: \"and he called their names after the names by which his father had called them.\"","Why does that matter enough to be recorded in Scripture? Because the Philistines had renamed the wells. When they filled them with earth, they did not just block the water. They erased the identity. Over time, a well called Abundance becomes known as That Old Dry Patch. And after two generations, nobody even remembers there was ever water there. The renaming is what makes the burial permanent.","That is the enemy's strategy over families, and it is the enemy's strategy over you personally.","He renames a woman who is called to intercede as \"the emotional one.\" He renames a man with an apostolic gift as \"the one who never settles down.\" He renames a family of priests as \"the family with the drinking problem.\" He renames a marriage that carries a mandate as \"the couple who fight all the time.\"","And here is the trap: once you accept the new name, you stop digging. Nobody digs where they have been told there was never any water.","Today we take the names back. Jacob became Israel. Simon became Peter. Gideon, hiding in a winepress, was addressed as \"thou mighty man of valour\" (Judges 6:12), which was not a description of what he was doing. It was a restoration of what he was called.","God is not renaming you today. He is un renaming you."],"scriptures":["Genesis 26:18","Genesis 32:27 to 28","Judges 6:12","Isaiah 62:2 to 4","Isaiah 62:12","Revelation 2:17","John 1:42","Ruth 1:20 to 21","Genesis 35:18"],"note":"","points":["Father, today I take back every name the enemy assigned to my life without my permission.","Every well in my life the enemy renamed, I restore your original name in Jesus' name.","I reject the name Failure. I receive the name Fruitful, in the name of Jesus.","I reject the name Forsaken. I am called Hephzibah, for the Lord delighteth in me. Isaiah 62:4.","I reject the name Desolate. My land shall be called Beulah, for the Lord is married to me.","Every label placed on me by family, by teachers, by exes, or by the church, that God did not give me, I remove it.","Every name spoken over my marriage by observers, I cancel it and I call my marriage blessed.","Lord, call me what my Father calls me. Let me answer to heaven's name and no other.","I reject the name Mara. I refuse to be renamed by my season of bitterness. Ruth 1:20.","Every child in my house who has been mislabelled, I restore their true name today in Jesus' name.","Like Rachel named him Benoni, son of my sorrow, but his father called him Benjamin. Genesis 35:18. Father, name me.","Every generational nickname of shame attached to my family surname, be broken now.","Thou shalt be called by a new name, which the mouth of the Lord shall name. Isaiah 62:2.","Every prophetic identity buried under years of failure in my life, resurface now.","Lord, address me the way You addressed Gideon in the winepress. Speak to my calling, not my condition.","Every voice that keeps reciting my old name over me, be permanently silenced in Jesus' name.","I decree that my children will be known by God's name for them and not the world's label.","Father, restore the name of my father's house where it was defamed for a righteous reason.","They shall call them The holy people, The redeemed of the Lord, Sought out. Isaiah 62:12. That is my family.","Every legal document, record, or reputation carrying a wrong name over me, be corrected in the spirit.","Lord, give me the white stone and the new name which no man knoweth saving he that receiveth it. Revelation 2:17."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"The Altars of My Father's House Must Fall","subtitle":"","about":["Tonight is heavy. Come prepared.","Judges 6. Israel is under Midianite oppression so severe that the people are living in caves and hiding their harvest. God raises up a deliverer. And Gideon's first assignment is not what anybody expects.","\"Throw down the altar of Baal that thy father hath, and cut down the grove that is by it\" (Judges 6:25).","Before Midian, the altar in his own father's compound. Understand what an altar is. An altar is a legal platform. It is a place where an exchange takes place between the physical and the spiritual, where a sacrifice is offered and an agreement is established. An altar that has been fed remains active until it is broken, and an active altar has a voice.","This is why Scripture speaks of blood that speaks (Genesis 4:10, Hebrews 12:24). An altar talks. It makes legal statements about a bloodline. It says things like: the men in this family do not live past sixty. The women in this family do not stay married. The first born in this family does not prosper.","And here is why some of you have been stuck: you have been praying against a voice while the platform producing the voice stood untouched. You can silence a speaker for a night. Break the altar and the voice stops permanently.","Notice also that Gideon did it by night because he feared his father's household (Judges 6:27). God did not disqualify him for that. God accepted the obedience even though the courage was partial. If you come tonight afraid, come anyway. Trembling obedience is still obedience.","Tonight we are dealing with:","Altars of the father's house. Altars of the mother's house. Altars raised at your birth, at your naming, at your marriage. Altars of the land and the village. Family shrines, groves, and idols. Every covenant cut with your name in it.","Bring the list you made this morning. Call the things by name."],"scriptures":["Judges 6:25 to 32","Exodus 34:13","Deuteronomy 12:2 to 3","1 Kings 13:1 to 5","2 Kings 23:12 to 15","Genesis 4:10","Hebrews 12:24","Numbers 23:23","Isaiah 54:15 to 17","Colossians 2:14 to 15","Nahum 1:14"],"note":"Stand. Speak these with authority. Where the point says \"I name it,\" actually name it.","points":["Father, I come tonight as Gideon came, and I lay hold of every altar in my father's house.","Every altar of Baal standing in my father's compound, I throw you down tonight in the name of Jesus.","Every grove beside the altar in my mother's house, I cut you down by the axe of the Spirit.","Every altar erected on the day of my birth, I demolish you now by the blood of Jesus.","Every altar erected at my naming ceremony, be broken and be scattered in the name of Jesus.","Every altar erected against my marriage before I ever met my spouse, collapse now.","Every altar speaking against my womb, my seed, and my generation, be silenced permanently.","Every altar of the land, the village, and the compound of my ancestors, lose your grip on my life.","Every priest still ministering at an evil altar on behalf of my family, be dismissed in Jesus' name.","Every sacrifice offered on my behalf that I did not authorise, I cancel your effect by the blood of Jesus.","The blood of Jesus speaketh better things than the blood of Abel. Let the blood outvote every altar tonight.","Every voice from any altar making decrees over my bloodline, be silenced by the blood of Jesus.","Every covenant cut with my name, my hair, my nails, my clothing, or my picture, I break it now.","Every altar of poverty in my lineage, I demolish you tonight in the name of Jesus.","Every altar of premature death in my family, I break you and I refuse your appointment.","Every altar of shame and disgrace assigned to my family name, be pulled down now.","Every altar of infirmity feeding on the bodies in my bloodline, fall now in Jesus' name.","As Josiah broke the altars and burned the bones upon them, let there be no restoration of these altars.","Out of thine house will I cut off the graven image. I will make thy grave, for thou art vile. Nahum 1:14.","Every handwriting of ordinances written against me, be blotted out and nailed to the cross. Colossians 2:14.","I decree that there is no enchantment against Jacob and no divination against Israel. Numbers 23:23. Every altar in my foundation is broken tonight, and I build a new altar to the living God."]}],"questions":["Name one pattern that has repeated at least twice in your family line. Not a feeling, a documented pattern. When did you first notice it, and have you ever specifically renounced it out loud?","What is one name the enemy gave you that you have quietly accepted about yourself? Write down the name God gives you in exchange, and say it out loud before you sleep tonight."],"questionNote":""},{"n":5,"date":"Friday, October 9","title":"What the Philistines Filled It With","subtitle":"","anchor":{"text":"For all the wells which his father's servants had digged in the days of Abraham his father, the Philistines had stopped them, and filled them with earth.","ref":"Genesis 26:15"},"teaching":["Yesterday we found the foundation. Today we find out what was poured into it.","Read the verse again and notice the method. The Philistines did not poison the wells. They did not drain them. They did not build a wall around them or post a guard. They filled them with earth.","That is a strategy of quiet burial. Nobody hears a well being filled. There is no explosion. There is no announcement. One shovel of dirt at a time, until the mouth of the well is level with the ground and a stranger walking past would never know that water once came out of that spot.","That is how most destinies are buried. Not in one dramatic night of attack, but in a
