e, if it displease thee, I will get me back again."],[22,35,"And the angel of the LORD said unto Balaam, Go with the men: but only the word that I shall speak unto thee, that thou shalt speak. So Balaam went with the princes of Balak."],[22,36,"And when Balak heard that Balaam was come, he went out to meet him unto a city of Moab, which is in the border of Arnon, which is in the utmost coast."],[22,37,"And Balak said unto Balaam, Did I not earnestly send unto thee to call thee? wherefore camest thou not unto me? am I not able indeed to promote thee to honour?"],[22,38,"And Balaam said unto Balak, Lo, I am come unto thee: have I now any power at all to say any thing? the word that God putteth in my mouth, that shall I speak."],[22,39,"And Balaam went with Balak, and they came unto Kirjath-huzoth."],[22,40,"And Balak offered oxen and sheep, and sent to Balaam, and to the princes that were with him."],[22,41,"And it came to pass on the morrow, that Balak took Balaam, and brought him up into the high places of Baal, that thence he might see the utmost part of the people."],[23,1,"And Balaam said unto Balak, Build me here seven altars, and prepare me here seven oxen and seven rams."],[23,2,"And Balak did as Balaam had spoken; and Balak and Balaam offered on every altar a bullock and a ram."],[23,3,"And Balaam said unto Balak, Stand by thy burnt offering, and I will go: peradventure the LORD will come to meet me: and whatsoever he sheweth me I will tell thee. And he went to an high place."],[23,4,"And God met Balaam: and he said unto him, I have prepared seven altars, and I have offered upon every altar a bullock and a ram."],[23,5,"And the LORD put a word in Balaam’s mouth, and said, Return unto Balak, and thus thou shalt speak."],[23,6,"And he returned unto him, and, lo, he stood by his burnt sacrifice, he, and all the princes of Moab."],[23,7,"And he took up his parable, and said, Balak the king of Moab hath brought me from Aram, out of the mountains of the east, saying, Come, curse me Jacob, and come, defy Israel."],[23,8,"How shall I curse, whom God hath not cursed? or how shall I defy, whom the LORD hath not defied?"],[23,9,"For from the top of the rocks I see him, and from the hills I behold him: lo, the people shall dwell alone, and shall not be reckoned among the nations."],[23,10,"Who can count the dust of Jacob, and the number of the fourth part of Israel? Let me die the death of the righteous, and let my last end be like his!"],[23,11,"And Balak said unto Balaam, What hast thou done unto me? I took thee to curse mine enemies, and, behold, thou hast blessed them altogether."],[23,12,"And he answered and said, Must I not take heed to speak that which the LORD hath put in my mouth?"],[23,13,"And Balak said unto him, Come, I pray thee, with me unto another place, from whence thou mayest see them: thou shalt see but the utmost part of them, and shalt not see them all: and curse me them from thence."],[23,14,"And he brought him into the field of Zophim, to the top of Pisgah, and built seven altars, and offered a bullock and a ram on every altar."],[23,15,"And he said unto Balak, Stand here by thy burnt offering, while I meet the Lord yonder."],[23,16,"And the LORD met Balaam, and put a word in his mouth, and said, Go again unto Balak, and say thus."],[23,17,"And when he came to him, behold, he stood by his burnt offering, and the princes of Moab with him. And Balak said unto him, What hath the LORD spoken?"],[23,18,"And he took up his parable, and said, Rise up, Balak, and hear; hearken unto me, thou son of Zippor:"],[23,19,"God is not a man, that he should lie; neither the son of man, that he should repent: hath he said, and shall he not do it? or hath he spoken, and shall he not make it good?"],[23,20,"Behold, I have received commandment to bless: and he hath blessed; and I cannot reverse it."],[23,21,"He hath not beheld iniquity in Jacob, neither hath he seen perverseness in Israel: the LORD his God is with him, and the shout of a king is among them."],[23,22,"God brought them out of Egypt; he hath as it were the strength of an unicorn."],[23,23,"Surely there is no enchantment against Jacob, neither is there any divination against Israel: according to this time it shall be said of Jacob and of Israel, What hath God wrought!"]],"Numbers 22:31":[[22,31,"Then the LORD opened the eyes of Balaam, and he saw the angel of the LORD standing in the way, and his sword drawn in his hand: and he bowed down his head, and fell flat on his face."]],"Numbers 22:6":[[22,6,"Come now therefore, I pray thee, curse me this people; for they are too mighty for me: peradventure I shall prevail, that we may smite them, and that I may drive them out of the land: for I wot that he whom thou blessest is blessed, and he whom thou cursest is cursed."]],"Numbers 23:23":[[23,23,"Surely there is no enchantment against Jacob, neither is there any divination against Israel: according to this time it shall be said of Jacob and of Israel, What hath God wrought!"]],"Numbers 23:8":[[23,8,"How shall I curse, whom God hath not cursed? or how shall I defy, whom the LORD hath not defied?"]],"Numbers 30:1 to 5":[[30,1,"And Moses spake unto the heads of the tribes concerning the children of Israel, saying, This is the thing which the LORD hath commanded."],[30,2,"If a man vow a vow unto the LORD, or swear an oath to bind his soul with a bond; he shall not break his word, he shall do according to all that proceedeth out of his mouth."],[30,3,"If a woman also vow a vow unto the LORD, and bind herself by a bond, being in her father’s house in her youth;"],[30,4,"And her father hear her vow, and her bond wherewith she hath bound her soul, and her father shall hold his peace at her: then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand."],[30,5,"But if her father disallow her in the day that he heareth; not any of her vows, or of her bonds wherewith she hath bound her soul, shall stand: and the LORD shall forgive her, because her father disallowed her."]],"Numbers 30:1 to 8":[[30,1,"And Moses spake unto the heads of the tribes concerning the children of Israel, saying, This is the thing which the LORD hath commanded."],[30,2,"If a man vow a vow unto the LORD, or swear an oath to bind his soul with a bond; he shall not break his word, he shall do according to all that proceedeth out of his mouth."],[30,3,"If a woman also vow a vow unto the LORD, and bind herself by a bond, being in her father’s house in her youth;"],[30,4,"And her father hear her vow, and her bond wherewith she hath bound her soul, and her father shall hold his peace at her: then all her vows shall stand, and every bond wherewith she hath bound her soul shall stand."],[30,5,"But if her father disallow her in the day that he heareth; not any of her vows, or of her bonds wherewith she hath bound her soul, shall stand: and the LORD shall forgive her, because her father disallowed her."],[30,6,"And if she had at all an husband, when she vowed, or uttered ought out of her lips, wherewith she bound her soul;"],[30,7,"And her husband heard it, and held his peace at her in the day that he heard it: then her vows shall stand, and her bonds wherewith she bound her soul shall stand."],[30,8,"But if her husband disallowed her on the day that he heard it; then he shall make her vow which she vowed, and that which she uttered with her lips, wherewith she bound her soul, of none effect: and the LORD shall forgive her."]],"Obadiah 17":[[1,17,"But upon mount Zion shall be deliverance, and there shall be holiness; and the house of Jacob shall possess their possessions."]],"Philippians 3:13 to 14":[[3,13,"Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before,"],[3,14,"I press toward the mark for the prize of the high calling of God in Christ Jesus."]],"Philippians 3:7 to 8, 12 to 14":[[3,7,"But what things were gain to me, those I counted loss for Christ."],[3,8,"Yea doubtless, and I count all things but loss for the excellency of the knowledge of Christ Jesus my Lord: for whom I have suffered the loss of all things, and do count them but dung, that I may win Christ,"],[3,12,"Not as though I had already attained, either were already perfect: but I follow after, if that I may apprehend that for which also I am apprehended of Christ Jesus."],[3,13,"Brethren, I count not myself to have apprehended: but this one thing I do, forgetting those things which are behind, and reaching forth unto those things which are before,"],[3,14,"I press toward the mark for the prize of the high calling of God in Christ Jesus."]],"Philippians 3:8 to 10":[[3,8,"Yea doubtless, and I count all things but loss for the excellency of the knowledge of Christ Jesus my Lord: for whom I have suffered the loss of all things, and do count them but dung, that I may win Christ,"],[3,9,"And be found in him, not having mine own righteousness, which is of the law, but that which is through the faith of Christ, the righteousness which is of God by faith:"],[3,10,"That I may know him, and the power of his resurrection, and the fellowship of his sufferings, being made conformable unto his death;"]],"Philippians 4:19":[[4,19,"But my God shall supply all your need according to his riches in glory by Christ Jesus."]],"Philippians 4:6 to 7":[[4,6,"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God."],[4,7,"And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."]],"Philippians 4:8":[[4,8,"Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things."]],"Proverbs 10:22":[[10,22,"The blessing of the LORD, it maketh rich, and he addeth no sorrow with it."]],"Proverbs 11:14":[[11,14,"Where no counsel is, the people fall: but in the multitude of counsellors there is safety."]],"Proverbs 11:24 to 25":[[11,24,"There is that scattereth, and yet increaseth; and there is that withholdeth more than is meet, but it tendeth to poverty."],[11,25,"The liberal soul shall be made fat: and he that watereth shall be watered also himself."]],"Proverbs 12:18":[[12,18,"There is that speaketh like the piercings of a sword: but the tongue of the wise is health."]],"Proverbs 13:11":[[13,11,"Wealth gotten by vanity shall be diminished: but he that gathereth by labour shall increase."]],"Proverbs 13:22":[[13,22,"A good man leaveth an inheritance to his children’s children: and the wealth of the sinner is laid up for the just."]],"Proverbs 16:7":[[16,7,"When a man’s ways please the LORD, he maketh even his enemies to be at peace with him."]],"Proverbs 17:14":[[17,14,"The beginning of strife is as when one letteth out water: therefore leave off contention, before it be meddled with."]],"Proverbs 18:20 to 21":[[18,20,"A man’s belly shall be satisfied with the fruit of his mouth; and with the increase of his lips shall he be filled."],[18,21,"Death and life are in the power of the tongue: and they that love it shall eat the fruit thereof."]],"Proverbs 18:22":[[18,22,"Whoso findeth a wife findeth a good thing, and obtaineth favour of the LORD."]],"Proverbs 19:14":[[19,14,"House and riches are the inheritance of fathers: and a prudent wife is from the LORD."]],"Proverbs 21:20":[[21,20,"There is treasure to be desired and oil in the dwelling of the wise; but a foolish man spendeth it up."]],"Proverbs 21:9 to 19":[[21,9,"It is better to dwell in a corner of the housetop, than with a brawling woman in a wide house."],[21,10,"The soul of the wicked desireth evil: his neighbour findeth no favour in his eyes."],[21,11,"When the scorner is punished, the simple is made wise: and when the wise is instructed, he receiveth knowledge."],[21,12,"The righteous man wisely considereth the house of the wicked: but God overthroweth the wicked for their wickedness."],[21,13,"Whoso stoppeth his ears at the cry of the poor, he also shall cry himself, but shall not be heard."],[21,14,"A gift in secret pacifieth anger: and a reward in the bosom strong wrath."],[21,15,"It is joy to the just to do judgment: but destruction shall be to the workers of iniquity."],[21,16,"The man that wandereth out of the way of understanding shall remain in the congregation of the dead."],[21,17,"He that loveth pleasure shall be a poor man: he that loveth wine and oil shall not be rich."],[21,18,"The wicked shall be a ransom for the righteous, and the transgressor for the upright."],[21,19,"It is better to dwell in the wilderness, than with a contentious and an angry woman."]],"Proverbs 22:6":[[22,6,"Train up a child in the way he should go: and when he is old, he will not depart from it."]],"Proverbs 22:7":[[22,7,"The rich ruleth over the poor, and the borrower is servant to the lender."]],"Proverbs 23:7":[[23,7,"For as he thinketh in his heart, so is he: Eat and drink, saith he to thee; but his heart is not with thee."]],"Proverbs 24:16":[[24,16,"For a just man falleth seven times, and riseth up again: but the wicked shall fall into mischief."]],"Proverbs 26:2":[[26,2,"As the bird by wandering, as the swallow by flying, so the curse causeless shall not come."]],"Proverbs 27:15":[[27,15,"A continual dropping in a very rainy day and a contentious woman are alike."]],"Proverbs 27:23 to 27":[[27,23,"Be thou diligent to know the state of thy flocks, and look well to thy herds."],[27,24,"For riches are not for ever: and doth the crown endure to every generation?"],[27,25,"The hay appeareth, and the tender grass sheweth itself, and herbs of the mountains are gathered."],[27,26,"The lambs are for thy clothing, and the goats are the price of the field."],[27,27,"And thou shalt have goats’ milk enough for thy food, for the food of thy household, and for the maintenance for thy maidens."]],"Proverbs 27:4":[[27,4,"Wrath is cruel, and anger is outrageous; but who is able to stand before envy?"]],"Proverbs 28:13":[[28,13,"He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy."]],"Proverbs 29:11":[[29,11,"A fool uttereth all his mind: but a wise man keepeth it in till afterwards."]],"Proverbs 31:10 to 31":[[31,10,"Who can find a virtuous woman? for her price is far above rubies."],[31,11,"The heart of her husband doth safely trust in her, so that he shall have no need of spoil."],[31,12,"She will do him good and not evil all the days of her life."],[31,13,"She seeketh wool, and flax, and worketh willingly with her hands."],[31,14,"She is like the merchants’ ships; she bringeth her food from afar."],[31,15,"She riseth also while it is yet night, and giveth meat to her household, and a portion to her maidens."],[31,16,"She considereth a field, and buyeth it: with the fruit of her hands she planteth a vineyard."],[31,17,"She girdeth her loins with strength, and strengtheneth her arms."],[31,18,"She perceiveth that her merchandise is good: her candle goeth not out by night."],[31,19,"She layeth her hands to the spindle, and her hands hold the distaff."],[31,20,"She stretcheth out her hand to the poor; yea, she reacheth forth her hands to the needy."],[31,21,"She is not afraid of the snow for her household: for all her household are clothed with scarlet."],[31,22,"She maketh herself coverings of tapestry; her clothing is silk and purple."],[31,23,"Her husband is known in the gates, when he sitteth among the elders of the land."],[31,24,"She maketh fine linen, and selleth it; and delivereth girdles unto the merchant."],[31,25,"Strength and honour are her clothing; and she shall rejoice in time to come."],[31,26,"She openeth her mouth with wisdom; and in her tongue is the law of kindness."],[31,27,"She looketh well to the ways of her household, and eateth not the bread of idleness."],[31,28,"Her children arise up, and call her blessed; her husband also, and he praiseth her."],[31,29,"Many daughters have done virtuously, but thou excellest them all."],[31,30,"Favour is deceitful, and beauty is vain: but a woman that feareth the LORD, she shall be praised."],[31,31,"Give her of the fruit of her hands; and let her own works praise her in the gates."]],"Proverbs 5:15 to 19":[[5,15,"Drink waters out of thine own cistern, and running waters out of thine own well."],[5,16,"Let thy fountains be dispersed abroad, and rivers of waters in the streets."],[5,17,"Let them be only thine own, and not strangers’ with thee."],[5,18,"Let thy fountain be blessed: and rejoice with the wife of thy youth."],[5,19,"Let her be as the loving hind and pleasant roe; let her breasts satisfy thee at all times; and be thou ravished always with her love."]],"Proverbs 5:15 to 21":[[5,15,"Drink waters out of thine own cistern, and running waters out of thine own well."],[5,16,"Let thy fountains be dispersed abroad, and rivers of waters in the streets."],[5,17,"Let them be only thine own, and not strangers’ with thee."],[5,18,"Let thy fountain be blessed: and rejoice with the wife of thy youth."],[5,19,"Let her be as the loving hind and pleasant roe; let her breasts satisfy thee at all times; and be thou ravished always with her love."],[5,20,"And why wilt thou, my son, be ravished with a strange woman, and embrace the bosom of a stranger?"],[5,21,"For the ways of man are before the eyes of the LORD, and he pondereth all his goings."]],"Proverbs 6:1 to 5":[[6,1,"My son, if thou be surety for thy friend, if thou hast stricken thy hand with a stranger,"],[6,2,"Thou art snared with the words of thy mouth, thou art taken with the words of thy mouth."],[6,3,"Do this now, my son, and deliver thyself, when thou art come into the hand of thy friend; go, humble thyself, and make sure thy friend."],[6,4,"Give not sleep to thine eyes, nor slumber to thine eyelids."],[6,5,"Deliver thyself as a roe from the hand of the hunter, and as a bird from the hand of the fowler."]],"Proverbs 6:16 to 19":[[6,16,"These six things doth the LORD hate: yea, seven are an abomination unto him:"],[6,17,"A proud look, a lying tongue, and hands that shed innocent blood,"],[6,18,"An heart that deviseth wicked imaginations, feet that be swift in running to mischief,"],[6,19,"A false witness that speaketh lies, and he that soweth discord among brethren."]],"Proverbs 6:30 to 31":[[6,30,"Men do not despise a thief, if he steal to satisfy his soul when he is hungry;"],[6,31,"But if he be found, he shall restore sevenfold; he shall give all the substance of his house."]],"Psalm 100:1 to 5":[[100,1,"Make a joyful noise unto the LORD, all ye lands."],[100,2,"Serve the LORD with gladness: come before his presence with singing."],[100,3,"Know ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture."],[100,4,"Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name."],[100,5,"For the LORD is good; his mercy is everlasting; and his truth endureth to all generations."]],"Psalm 102:18":[[102,18,"This shall be written for the generation to come: and the people which shall be created shall praise the LORD."]],"Psalm 105:14 to 15":[[105,14,"He suffered no man to do them wrong: yea, he reproved kings for their sakes;"],[105,15,"Saying, Touch not mine anointed, and do my prophets no harm."]],"Psalm 107:10 to 16":[[107,10,"Such as sit in darkness and in the shadow of death, being bound in affliction and iron;"],[107,11,"Because they rebelled against the words of God, and contemned the counsel of the most High:"],[107,12,"Therefore he brought down their heart with labour; they fell down, and there was none to help."],[107,13,"Then they cried unto the LORD in their trouble, and he saved them out of their distresses."],[107,14,"He brought them out of darkness and the shadow of death, and brake their bands in sunder."],[107,15,"Oh that men would praise the LORD for his goodness, and for his wonderful works to the children of men!"],[107,16,"For he hath broken the gates of brass, and cut the bars of iron in sunder."]],"Psalm 107:2":[[107,2,"Let the redeemed of the LORD say so, whom he hath redeemed from the hand of the enemy;"]],"Psalm 109:17 to 20":[[109,17,"As he loved cursing, so let it come unto him: as he delighted not in blessing, so let it be far from him."],[109,18,"As he clothed himself with cursing like as with his garment, so let it come into his bowels like water, and like oil into his bones."],[109,19,"Let it be unto him as the garment which covereth him, and for a girdle wherewith he is girded continually."],[109,20,"Let this be the reward of mine adversaries from the LORD, and of them that speak evil against my soul."]],"Psalm 109:6, 31":[[109,6,"Set thou a wicked man over him: and let Satan stand at his right hand."],[109,31,"For he shall stand at the right hand of the poor, to save him from those that condemn his soul."]],"Psalm 112:1 to 3":[[112,1,"Praise ye the LORD. Blessed is the man that feareth the LORD, that delighteth greatly in his commandments."],[112,2,"His seed shall be mighty upon earth: the generation of the upright shall be blessed."],[112,3,"Wealth and riches shall be in his house: and his righteousness endureth for ever."]],"Psalm 112:2":[[112,2,"His seed shall be mighty upon earth: the generation of the upright shall be blessed."]],"Psalm 113:9":[[113,9,"He maketh the barren woman to keep house, and to be a joyful mother of children. Praise ye the LORD."]],"Psalm 116:12 to 14":[[116,12,"What shall I render unto the LORD for all his benefits toward me?"],[116,13,"I will take the cup of salvation, and call upon the name of the LORD."],[116,14,"I will pay my vows unto the LORD now in the presence of all his people."]],"Psalm 118:17":[[118,17,"I shall not die, but live, and declare the works of the LORD."]],"Psalm 118:22":[[118,22,"The stone which the builders refused is become the head stone of the corner."]],"Psalm 118:5":[[118,5,"I called upon the LORD in distress: the LORD answered me, and set me in a large place."]],"Psalm 119:18":[[119,18,"Open thou mine eyes, that I may behold wondrous things out of thy law."]],"Psalm 119:32":[[119,32,"I will run the way of thy commandments, when thou shalt enlarge my heart."]],"Psalm 119:62":[[119,62,"At midnight I will rise to give thanks unto thee because of thy righteous judgments."]],"Psalm 119:9 to 11":[[119,9,"Wherewithal shall a young man cleanse his way? by taking heed thereto according to thy word."],[119,10,"With my whole heart have I sought thee: O let me not wander from thy commandments."],[119,11,"Thy word have I hid in mine heart, that I might not sin against thee."]],"Psalm 11:3":[[11,3,"If the foundations be destroyed, what can the righteous do?"]],"Psalm 121:3 to 8":[[121,3,"He will not suffer thy foot to be moved: he that keepeth thee will not slumber."],[121,4,"Behold, he that keepeth Israel shall neither slumber nor sleep."],[121,5,"The LORD is thy keeper: the LORD is thy shade upon thy right hand."],[121,6,"The sun shall not smite thee by day, nor the moon by night."],[121,7,"The LORD shall preserve thee from all evil: he shall preserve thy soul."],[121,8,"The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore."]],"Psalm 121:7 to 8":[[121,7,"The LORD shall preserve thee from all evil: he shall preserve thy soul."],[121,8,"The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore."]],"Psalm 124:1 to 8":[[124,1,"If it had not been the LORD who was on our side, now may Israel say;"],[124,2,"If it had not been the LORD who was on our side, when men rose up against us:"],[124,3,"Then they had swallowed us up quick, when their wrath was kindled against us:"],[124,4,"Then the waters had overwhelmed us, the stream had gone over our soul:"],[124,5,"Then the proud waters had gone over our soul."],[124,6,"Blessed be the LORD, who hath not given us as a prey to their teeth."],[124,7,"Our soul is escaped as a bird out of the snare of the fowlers: the snare is broken, and we are escaped."],[124,8,"Our help is in the name of the LORD, who made heaven and earth."]],"Psalm 125:2":[[125,2,"As the mountains are round about Jerusalem, so the LORD is round about his people from henceforth even for ever."]],"Psalm 126:1 to 3":[[126,1,"When the LORD turned again the captivity of Zion, we were like them that dream."],[126,2,"Then was our mouth filled with laughter, and our tongue with singing: then said they among the heathen, The LORD hath done great things for them."],[126,3,"The LORD hath done great things for us; whereof we are glad."]],"Psalm 126:1 to 6":[[126,1,"When the LORD turned again the captivity of Zion, we were like them that dream."],[126,2,"Then was our mouth filled with laughter, and our tongue with singing: then said they among the heathen, The LORD hath done great things for them."],[126,3,"The LORD hath done great things for us; whereof we are glad."],[126,4,"Turn again our captivity, O LORD, as the streams in the south."],[126,5,"They that sow in tears shall reap in joy."],[126,6,"He that goeth forth and weepeth, bearing precious seed, shall doubtless come again with rejoicing, bringing his sheaves with him."]],"Psalm 126:5 to 6":[[126,5,"They that sow in tears shall reap in joy."],[126,6,"He that goeth forth and weepeth, bearing precious seed, shall doubtless come again with rejoicing, bringing his sheaves with him."]],"Psalm 127:3 to 5":[[127,3,"Lo, children are an heritage of the LORD: and the fruit of the womb is his reward."],[127,4,"As arrows are in the hand of a mighty man; so are children of the youth."],[127,5,"Happy is the man that hath his quiver full of them: they shall not be ashamed, but they shall speak with the enemies in the gate."]],"Psalm 133:1 to 3":[[133,1,"Behold, how good and how pleasant it is for brethren to dwell together in unity!"],[133,2,"It is like the precious ointment upon the head, that ran down upon the beard, even Aaron’s beard: that went down to the skirts of his garments;"],[133,3,"As the dew of Hermon, and as the dew that descended upon the mountains of Zion: for there the LORD commanded the blessing, even life for evermore."]],"Psalm 139:1 to 12":[[139,1,"O LORD, thou hast searched me, and known me."],[139,2,"Thou knowest my downsitting and mine uprising, thou understandest my thought afar off."],[139,3,"Thou compassest my path and my lying down, and art acquainted with all my ways."],[139,4,"For there is not a word in my tongue, but, lo, O LORD, thou knowest it altogether."],[139,5,"Thou hast beset me behind and before, and laid thine hand upon me."],[139,6,"Such knowledge is too wonderful for me; it is high, I cannot attain unto it."],[139,7,"Whither shall I go from thy spirit? or whither shall I flee from thy presence?"],[139,8,"If I ascend up into heaven, thou art there: if I make my bed in hell, behold, thou art there."],[139,9,"If I take the wings of the morning, and dwell in the uttermost parts of the sea;"],[139,10,"Even there shall thy hand lead me, and thy right hand shall hold me."],[139,11,"If I say, Surely the darkness shall cover me; even the night shall be light about me."],[139,12,"Yea, the darkness hideth not from thee; but the night shineth as the day: the darkness and the light are both alike to thee."]],"Psalm 139:13 to 16":[[139,13,"For thou hast possessed my reins: thou hast covered me in my mother’s womb."],[139,14,"I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well."],[139,15,"My substance was not hid from thee, when I was made in secret, and curiously wrought in the lowest parts of the earth."],[139,16,"Thine eyes did see my substance, yet being unperfect; and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them."]],"Psalm 139:23 to 24":[[139,23,"Search me, O God, and know my heart: try me, and know my thoughts:"],[139,24,"And see if there be any wicked way in me, and lead me in the way everlasting."]],"Psalm 141:3":[[141,3,"Set a watch, O LORD, before my mouth; keep the door of my lips."]],"Psalm 145:4":[[145,4,"One generation shall praise thy works to another, and shall declare thy mighty acts."]],"Psalm 149:1 to 9":[[149,1,"Praise ye the LORD. Sing unto the LORD a new song, and his praise in the congregation of saints."],[149,2,"Let Israel rejoice in him that made him: let the children of Zion be joyful in their King."],[149,3,"Let them praise his name in the dance: let them sing praises unto him with the timbrel and harp."],[149,4,"For the LORD taketh pleasure in his people: he will beautify the meek with salvation."],[149,5,"Let the saints be joyful in glory: let them sing aloud upon their beds."],[149,6,"Let the high praises of God be in their mouth, and a twoedged sword in their hand;"],[149,7,"To execute vengeance upon the heathen, and punishments upon the people;"],[149,8,"To bind their kings with chains, and their nobles with fetters of iron;"],[149,9,"To execute upon them the judgment written: this honour have all his saints. Praise ye the LORD."]],"Psalm 149:6 to 9":[[149,6,"Let the high praises of God be in their mouth, and a twoedged sword in their hand;"],[149,7,"To execute vengeance upon the heathen, and punishments upon the people;"],[149,8,"To bind their kings with chains, and their nobles with fetters of iron;"],[149,9,"To execute upon them the judgment written: this honour have all his saints. Praise ye the LORD."]],"Psalm 150:1 to 6":[[150,1,"Praise ye the LORD. Praise God in his sanctuary: praise him in the firmament of his power."],[150,2,"Praise him for his mighty acts: praise him according to his excellent greatness."],[150,3,"Praise him with the sound of the trumpet: praise him with the psaltery and harp."],[150,4,"Praise him with the timbrel and dance: praise him with stringed instruments and organs."],[150,5,"Praise him upon the loud cymbals: praise him upon the high sounding cymbals."],[150,6,"Let every thing that hath breath praise the LORD. Praise ye the LORD."]],"Psalm 16:11":[[16,11,"Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore."]],"Psalm 16:5 to 6":[[16,5,"The LORD is the portion of mine inheritance and of my cup: thou maintainest my lot."],[16,6,"The lines are fallen unto me in pleasant places; yea, I have a goodly heritage."]],"Psalm 16:6":[[16,6,"The lines are fallen unto me in pleasant places; yea, I have a goodly heritage."]],"Psalm 18:19":[[18,19,"He brought me forth also into a large place; he delivered me, because he delighted in me."]],"Psalm 19:12 to 13":[[19,12,"Who can understand his errors? cleanse thou me from secret faults."],[19,13,"Keep back thy servant also from presumptuous sins; let them not have dominion over me: then shall I be upright, and I shall be innocent from the great transgression."]],"Psalm 22:3":[[22,3,"But thou art holy, O thou that inhabitest the praises of Israel."]],"Psalm 22:9 to 10":[[22,9,"But thou art he that took me out of the womb: thou didst make me hope when I was upon my mother’s breasts."],[22,10,"I was cast upon thee from the womb: thou art my God from my mother’s belly."]],"Psalm 23:1":[[23,1,"The LORD is my shepherd; I shall not want."]],"Psalm 23:5":[[23,5,"Thou preparest a table before me in the presence of mine enemies: thou anointest my head with oil; my cup runneth over."]],"Psalm 24:7 to 10":[[24,7,"Lift up your heads, O ye gates; and be ye lift up, ye everlasting doors; and the King of glory shall come in."],[24,8,"Who is this King of glory? The LORD strong and mighty, the LORD mighty in battle."],[24,9,"Lift up your heads, O ye gates; even lift them up, ye everlasting doors; and the King of glory shall come in."],[24,10,"Who is this King of glory? The LORD of hosts, he is the King of glory. Selah."]],"Psalm 27:1 to 3":[[27,1,"The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?"],[27,2,"When the wicked, even mine enemies and my foes, came upon me to eat up my flesh, they stumbled and fell."],[27,3,"Though an host should encamp against me, my heart shall not fear: though war should rise against me, in this will I be confident."]],"Psalm 27:8":[[27,8,"When thou saidst, Seek ye my face; my heart said unto thee, Thy face, LORD, will I seek."]],"Psalm 30:11 to 12":[[30,11,"Thou hast turned for me my mourning into dancing: thou hast put off my sackcloth, and girded me with gladness;"],[30,12,"To the end that my glory may sing praise to thee, and not be silent. O LORD my God, I will give thanks unto thee for ever."]],"Psalm 30:5":[[30,5,"For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning."]],"Psalm 31:8":[[31,8,"And hast not shut me up into the hand of the enemy: thou hast set my feet in a large room."]],"Psalm 33:6":[[33,6,"By the word of the LORD were the heavens made; and all the host of them by the breath of his mouth."]],"Psalm 34:5":[[34,5,"They looked unto him, and were lightened: and their faces were not ashamed."]],"Psalm 34:7":[[34,7,"The angel of the LORD encampeth round about them that fear him, and delivereth them."]],"Psalm 35:19":[[35,19,"Let not them that are mine enemies wrongfully rejoice over me: neither let them wink with the eye that hate me without a cause."]],"Psalm 35:27":[[35,27,"Let them shout for joy, and be glad, that favour my righteous cause: yea, let them say continually, Let the LORD be magnified, which hath pleasure in the prosperity of his servant."]],"Psalm 36:8 to 9":[[36,8,"They shall be abundantly satisfied with the fatness of thy house; and thou shalt make them drink of the river of thy pleasures."],[36,9,"For with thee is the fountain of life: in thy light shall we see light."]],"Psalm 37:1 to 8":[[37,1,"Fret not thyself because of evildoers, neither be thou envious against the workers of iniquity."],[37,2,"For they shall soon be cut down like the grass, and wither as the green herb."],[37,3,"Trust in the LORD, and do good; so shalt thou dwell in the land, and verily thou shalt be fed."],[37,4,"Delight thyself also in the LORD; and he shall give thee the desires of thine heart."],[37,5,"Commit thy way unto the LORD; trust also in him; and he shall bring it to pass."],[37,6,"And he shall bring forth thy righteousness as the light, and thy judgment as the noonday."],[37,7,"Rest in the LORD, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass."],[37,8,"Cease from anger, and forsake wrath: fret not thyself in any wise to do evil."]],"Psalm 37:12 to 15":[[37,12,"The wicked plotteth against the just, and gnasheth upon him with his teeth."],[37,13,"The Lord shall laugh at him: for he seeth that his day is coming."],[37,14,"The wicked have drawn out the sword, and have bent their bow, to cast down the poor and needy, and to slay such as be of upright conversation."],[37,15,"Their sword shall enter into their own heart, and their bows shall be broken."]],"Psalm 37:4 to 5":[[37,4,"Delight thyself also in the LORD; and he shall give thee the desires of thine heart."],[37,5,"Commit thy way unto the LORD; trust also in him; and he shall bring it to pass."]],"Psalm 3:5":[[3,5,"I laid me down and slept; I awaked; for the LORD sustained me."]],"Psalm 41:9":[[41,9,"Yea, mine own familiar friend, in whom I trusted, which did eat of my bread, hath lifted up his heel against me."]],"Psalm 42:1 to 2":[[42,1,"As the hart panteth after the water brooks, so panteth my soul after thee, O God."],[42,2,"My soul thirsteth for God, for the living God: when shall I come and appear before God?"]],"Psalm 42:5 to 11":[[42,5,"Why art thou cast down, O my soul? and why art thou disquieted in me? hope thou in God: for I shall yet praise him for the help of his countenance."],[42,6,"O my God, my soul is cast down within me: therefore will I remember thee from the land of Jordan, and of the Hermonites, from the hill Mizar."],[42,7,"Deep calleth unto deep at the noise of thy waterspouts: all thy waves and thy billows are gone over me."],[42,8,"Yet the LORD will command his lovingkindness in the daytime, and in the night his song shall be with me, and my prayer unto the God of my life."],[42,9,"I will say unto God my rock, Why hast thou forgotten me? why go I mourning because of the oppression of the enemy?"],[42,10,"As with a sword in my bones, mine enemies reproach me; while they say daily unto me, Where is thy God?"],[42,11,"Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God."]],"Psalm 42:7":[[42,7,"Deep calleth unto deep at the noise of thy waterspouts: all thy waves and thy billows are gone over me."]],"Psalm 42:8":[[42,8,"Yet the LORD will command his lovingkindness in the daytime, and in the night his song shall be with me, and my prayer unto the God of my life."]],"Psalm 44:21":[[44,21,"Shall not God search this out? for he knoweth the secrets of the heart."]],"Psalm 45:10":[[45,10,"Hearken, O daughter, and consider, and incline thine ear; forget also thine own people, and thy father’s house;"]],"Psalm 47:1":[[47,1,"O clap your hands, all ye people; shout unto God with the voice of triumph."]],"Psalm 47:1 to 5":[[47,1,"O clap your hands, all ye people; shout unto God with the voice of triumph."],[47,2,"For the LORD most high is terrible; he is a great King over all the earth."],[47,3,"He shall subdue the people under us, and the nations under our feet."],[47,4,"He shall choose our inheritance for us, the excellency of Jacob whom he loved. Selah."],[47,5,"God is gone up with a shout, the LORD with the sound of a trumpet."]],"Psalm 4:1":[[4,1,"Hear me when I call, O God of my righteousness: thou hast enlarged me when I was in distress; have mercy upon me, and hear my prayer."]],"Psalm 51:1 to 17":[[51,1,"Have mercy upon me, O God, according to thy lovingkindness: according unto the multitude of thy tender mercies blot out my transgressions."],[51,2,"Wash me throughly from mine iniquity, and cleanse me from my sin."],[51,3,"For I acknowledge my transgressions: and my sin is ever before me."],[51,4,"Against thee, thee only, have I sinned, and done this evil in thy sight: that thou mightest be justified when thou speakest, and be clear when thou judgest."],[51,5,"Behold, I was shapen in iniquity; and in sin did my mother conceive me."],[51,6,"Behold, thou desirest truth in the inward parts: and in the hidden part thou shalt make me to know wisdom."],[51,7,"Purge me with hyssop, and I shall be clean: wash me, and I shall be whiter than snow."],[51,8,"Make me to hear joy and gladness; that the bones which thou hast broken may rejoice."],[51,9,"Hide thy face from my sins, and blot out all mine iniquities."],[51,10,"Create in me a clean heart, O God; and renew a right spirit within me."],[51,11,"Cast me not away from thy presence; and take not thy holy spirit from me."],[51,12,"Restore unto me the joy of thy salvation; and uphold me with thy free spirit."],[51,13,"Then will I teach transgressors thy ways; and sinners shall be converted unto thee."],[51,14,"Deliver me from bloodguiltiness, O God, thou God of my salvation: and my tongue shall sing aloud of thy righteousness."],[51,15,"O Lord, open thou my lips; and my mouth shall shew forth thy praise."],[51,16,"For thou desirest not sacrifice; else would I give it: thou delightest not in burnt offering."],[51,17,"The sacrifices of God are a broken spirit: a broken and a contrite heart, O God, thou wilt not despise."]],"Psalm 56:3 to 4":[[56,3,"What time I am afraid, I will trust in thee."],[56,4,"In God I will praise his word, in God I have put my trust; I will not fear what flesh can do unto me."]],"Psalm 56:8":[[56,8,"Thou tellest my wanderings: put thou my tears into thy bottle: are they not in thy book?"]],"Psalm 5:3":[[5,3,"My voice shalt thou hear in the morning, O LORD; in the morning will I direct my prayer unto thee, and will look up."]],"Psalm 62:8":[[62,8,"Trust in him at all times; ye people, pour out your heart before him: God is a refuge for us. Selah."]],"Psalm 63:1 to 2":[[63,1,"O God, thou art my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water is;"],[63,2,"To see thy power and thy glory, so as I have seen thee in the sanctuary."]],"Psalm 63:6":[[63,6,"When I remember thee upon my bed, and meditate on thee in the night watches."]],"Psalm 69:4":[[69,4,"They that hate me without a cause are more than the hairs of mine head: they that would destroy me, being mine enemies wrongfully, are mighty: then I restored that which I took not away."]],"Psalm 74:16":[[74,16,"The day is thine, the night also is thine: thou hast prepared the light and the sun."]],"Psalm 78:4 to 7":[[78,4,"We will not hide them from their children, shewing to the generation to come the praises of the LORD, and his strength, and his wonderful works that he hath done."],[78,5,"For he established a testimony in Jacob, and appointed a law in Israel, which he commanded our fathers, that they should make them known to their children:"],[78,6,"That the generation to come might know them, even the children which should be born; who should arise and declare them to their children:"],[78,7,"That they might set their hope in God, and not forget the works of God, but keep his commandments:"]],"Psalm 8:2":[[8,2,"Out of the mouth of babes and sucklings hast thou ordained strength because of thine enemies, that thou mightest still the enemy and the avenger."]],"Psalm 91:1 to 12":[[91,1,"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty."],[91,2,"I will say of the LORD, He is my refuge and my fortress: my God; in him will I trust."],[91,3,"Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence."],[91,4,"He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler."],[91,5,"Thou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;"],[91,6,"Nor for the pestilence that walketh in darkness; nor for the destruction that wasteth at noonday."],[91,7,"A thousand shall fall at thy side, and ten thousand at thy right hand; but it shall not come nigh thee."],[91,8,"Only with thine eyes shalt thou behold and see the reward of the wicked."],[91,9,"Because thou hast made the LORD, which is my refuge, even the most High, thy habitation;"],[91,10,"There shall no evil befall thee, neither shall any plague come nigh thy dwelling."],[91,11,"For he shall give his angels charge over thee, to keep thee in all thy ways."],[91,12,"They shall bear thee up in their hands, lest thou dash thy foot against a stone."]],"Psalm 91:1 to 6":[[91,1,"He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty."],[91,2,"I will say of the LORD, He is my refuge and my fortress: my God; in him will I trust."],[91,3,"Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence."],[91,4,"He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler."],[91,5,"Thou shalt not be afraid for the terror by night; nor for the arrow that flieth by day;"],[91,6,"Nor for the pestilence that walketh in darkness; nor for the destruction that wasteth at noonday."]],"Psalm 91:5 to 7":[[91,5,"Thou shalt not be afraid for ith a rod of iron: and her child was caught up unto God, and to his throne."],[12,6,"And the woman fled into the wilderness, where she hath a place prepared of God, that they should feed her there a thousand two hundred and threescore days."]],"Revelation 12:10 to 11":[[12,10,"And I heard a loud voice saying in heaven, Now is come salvation, and strength, and the kingdom of our God, and the power of his Christ: for the accuser of our brethren is cast down, which accused them before our God day and night."],[12,11,"And they overcame him by the blood of the Lamb, and by the word of their testimony; and they loved not their lives unto the death."]],"Revelation 12:11":[[12,11,"And they overcame him by the blood of the Lamb, and by the word of their testimony; and they loved not their lives unto the death."]],"Revelation 12:7 to 11":[[12,7,"And there was war in heaven: Michael and his angels fought against the dragon; and the dragon fought and his angels,"],[12,8,"And prevailed not; neither was their place found any more in heaven."],[12,9,"And the great dragon was cast out, that old serpent, called the Devil, and Satan, which deceiveth the whole world: he was cast out into the earth, and his angels were cast out with him."],[12,10,"And I heard a loud voice saying in heaven, Now is come salvation, and strength, and the kingdom of our God, and the power of his Christ: for the accuser of our brethren is cast down, which accused them before our God day and night."],[12,11,"And they overcame him by the blood of the Lamb, and by the word of their testimony; and they loved not their lives unto the death."]],"Revelation 22:17":[[22,17,"And the Spirit and the bride say, Come. And let him that heareth say, Come. And let him that is athirst come. And whosoever will, let him take the water of life freely."]],"Revelation 2:17":[[2,17,"He that hath an ear, let him hear what the Spirit saith unto the churches; To him that overcometh will I give to eat of the hidden manna, and will giv alities, nor powers, nor things present, nor things to come,"],[8,39,"Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord."]],"Ruth 1:20 to 21":[[1,20,"And she said unto them, Call me not Naomi, call me Mara: for the Almighty hath dealt very bitterly with me."],[1,21,"I went out full, and the LORD hath brought me home again empty: why then call ye me Naomi, seeing the LORD hath testified against me, and the Almighty hath afflicted me?"]],"Ruth 2:1 to 12":[[2,1,"And Naomi had a kinsman of her husband’s, a mighty man of wealth, of the family of Elimelech; and his name was Boaz."],[2,2,"And Ruth the Moabitess said unto Naomi, Let me now go to the field, and glean ears of corn after him in whose sight I shall find grace. And she said unto her, Go, my daughter."],[2,3,"And she went, and came, and gleaned in the field after the reapers: and her hap was to light on a part of the field belonging unto Boaz, who was of the kindred of Elimelech."],[2,4,"And, behold, Boaz came from Beth-lehem, and said unto the reapers, The LORD be with you. And they answered him, The LORD bless thee."],[2,5,"Then said Boaz unto his servant that was set over the reapers, Whose damsel is this?"],[2,6,"And the servant that was set over the reapers answered and said, It is the Moabitish damsel that came back with Naomi out of the country of Moab:"],[2,7,"And she said, I pray you, let me glean and gather after the reapers among the sheaves: so she came, and hath continued even from the morning until now, that she tarried a little in the house."],[2,8,"Then said Boaz unto Ruth, Hearest thou not, my daughter? Go not to glean in another field, neither go from hence, but abide here fast by my maidens:"],[2,9,"Let thine eyes be on the field that they do reap, and go thou after them: have I not charged the young men that they shall not touch thee? and when thou art athirst, go unto the vessels, and drink of that which the young men have drawn."],[2,10,"Then she fell on her face, and bowed herself to the ground, and said unto him, Why have I found grace in thine eyes, that thou shouldest take knowledge of me, seeing I am a stranger?"],[2,11,"And Boaz answered and said unto her, It hath fully been shewed me, all that thou hast done unto thy mother in law since the death of thine husband: and how thou hast left thy father and thy mother, and the land of thy nativity, and art come unto a people which thou knewest not heretofore."],[2,12,"The LORD recompense thy work, and a full reward be given thee of the LORD God of Israel, under whose wings thou art come to trust."]],"Ruth 3:8":[[3,8,"And it came to pass at midnight, that the man was afraid, and turned himself: and, behold, a woman lay at his feet."]],"Ruth 3:8 to 13":[[3,8,"And it came to pass at midnight, that the man was afraid, and turned himself: and, behold, a woman lay at his feet."],[3,9,"And he said, Who art thou? And she answered, I am Ruth thine handmaid: spread therefore thy skirt over thine handmaid; for thou art a near kinsman."],[3,10,"And he said, Blessed be thou of the LORD, my daughter: for thou hast shewed more kindness in the latter end than at the beginning, inasmuch as thou followedst not young men, whether poor or rich."],[3,11,"And now, my daughter, fear not; I will do to thee all that thou requirest: for all the city of my people doth know that thou art a virtuous woman."],[3,12,"And now it is true that I am thy near kinsman: howbeit there is a kinsman nearer than I."],[3,13,"Tarry this night, and it shall be in the morning, that if he will perform unto thee the part of a kinsman, well; let him do the kinsman’s part: but if he will not do the part of a kinsman to thee, then will I do the part of a kinsman to thee, as the LORD liveth: lie down until the morning."]],"Song of Solomon 2:15":[[2,15,"Take us the foxes, the little foxes, that spoil the vines: for our vines have tender grapes."]],"Song of Solomon 4:12 to sist him."],[3,2,"And the LORD said unto Satan, The LORD rebuke thee, O Satan; even the LORD that hath chosen Jerusalem rebuke thee: is not this a brand plucked out of the fire?"],[3,3,"Now Joshua was clothed with filthy garments, and stood before the angel."],[3,4,"And he answered and spake unto those that stood before him, saying, Take away the filthy garments from him. And unto him he said, Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment."]],"Zechariah 3:1 to 5":[[3,1,"And he shewed me Joshua the high priest standing before the angel of the LORD, and Satan standing at his right hand to resist him."],[3,2,"And the LORD said unto Satan, The LORD rebuke thee, O Satan; even the LORD that hath chosen Jerusalem rebuke thee: is not this a brand plucked out of the fire?"],[3,3,"Now Joshua was clothed with filthy garments, and stood before the angel."],[3,4,"And he answered and spake unto those that stood before him, saying, Take away the filthy garments from him. And unto him he said, Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment."],[3,5,"And I said, Let them set a fair mitre upon his head. So they set a fair mitre upon his head, and clothed him with garments. And the angel of the LORD stood by."]],"Zechariah 3:1 to 7":[[3,1,"And he shewed me Joshua the high priest standing before the angel of the LORD, and Satan standing at his right hand to resist him."],[3,2,"And the LORD said unto Satan, The LORD rebuke thee, O Satan; even the LORD that hath chosen Jerusalem rebuke thee: is not this a brand plucked out of the fire?"],[3,3,"Now Joshua was clothed with filthy garments, and stood before the angel."],[3,4,"And he answered and spake unto those that stood before him, saying, Take away the filthy garments from him. And unto him he said, Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment."],[3,5,"And I said, Let them <script>
(function(){

/* ---------- state ---------- */

}
/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function today(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function shortDate(n){ return dayDate(n).toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"}); }

function sessCount(n,s){ var pts=D(n).sessions[s].points, k=0; for(var i=0;i<pts.length;i++){ if(S.c[pk(n,s,i)]) k++; } return k; }
function qDone(n){ var qs=D(n).questions; for(var i=0;i<qs.length;i++){ if(!S.q[n+"-"+i]) return false; } return true; }
function qCount(n){ var qs=D(n).questions,k=0; for(var i=0;i<qs.length;i++){ if(S.q[n+"-"+i]) k++; } return k; }
function totals(n){ var d=D(n), tot=d.questions.length, got=qCount(n); d.sessions.forEach(function(s,si){ tot+=s.points.length; got+=sessCount(n,si); }); return {got:got, tot:tot}; }
function dayComplete(n){ for(var s=0;s<4;s++){ if(!sessDone(n,s)) return false; } return qDone(n); }

}

function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2600); }

/* ---------- home ---------- */
function wellSVG(doneCount){

}

  MOVEMENTS.forEach(function(m,mi){
    h+='<section class="movement"><h2>Movement '+(mi+1)+': <em>'+m.name+'</em>, '+m.sub.toLowerCase()+'</h2><p>'+m.desc+'</p><ul class="days">';
    for(var n=m.from;n<=m.to;n++){

      h+='<li><button class="'+cls+'" data-open="'+n+'"'+(s.open?'':' aria-disabled="true"')+' aria-label="Day '+n+', '+esc(d.title)+', '+esc(meta)+'">'+
         '<span class="dr-num"><span class="fill" style="height:'+fill+'%"></span><b>'+n+'</b></span>'+
         '<span class="dr-main"><span class="dr-title">'+esc(d.title)+'</span><span class="dr-meta">'+esc(meta)+'</span></span>'+

var openDay=null, openSessions={};

  if(typeof closePop==='function') closePop();
  var n=openDay, d=D(n), h='';
  h+='<header class="day-head"><div class="day-kicker">Day '+n+' of 21 \u2022 '+esc(longDate(n))+'</div><h1>'+esc(d.title)+'</h1>'+(d.subtitle?'<p class="sub">'+esc(d.subtitle)+'</p>':'')+'</header>';
  h+='<blockquote class="anchor"><p>\u201c'+esc(d.anchor.text)+'\u201d</p><cite>'+esc(d.anchor.ref)+'</cite></blockquote>';
  h+='<details class="teach"><summary>'+CHEV+'What we are dealing with today</summary><div class="prose">'+d.teaching.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div></details>';

  h+='<section class="checklist" aria-label="Today\u2019s checklist"><h2>Today\u2019s checklist</h2>';
  d.sessions.forEach(function(s,si){ var ok=sessDone(n,si);
    h+='<button class="cl-item" data-jump="'+si+'"><span class="tick'+(ok?' on':'')+'">'+CHECK+'</span><span class="t">'+esc(s.time)+' \u2022 '+esc(s.watch)+'</span><span class="c">'+sessCount(n,si)+'/'+s.points.length+'</span></button>'; });
  h+='<button class="cl-item" data-jump="q"><span class="tick'+(qDone(n)?' on':'')+'">'+CHECK+'</span><span class="t">The digging questions</span><span class="c">'+qCount(n)+'/'+d.questions.length+'</span></button></section>';

  d.sessions.forEach(function(s,si){
    var ok=sessDone(n,si), open=!!openSessions[si];
    h+='<section class="session" id="s'+si+'"><button class="s-head" data-toggle="'+si+'" aria-expanded="'+open+'"><span class="tick'+(ok?' on':'')+'">'+CHECK+'</span><span class="s-main"><span class="s-time">'+esc(s.time)+' \u2022 '+esc(s.watch)+'</span><span class="s-title">'+esc(s.title)+'</span></span><span class="s-count">'+sessCount(n,si)+'/'+s.points.length+'</span></button>';
    if(open){
      h+='<div class="s-body">';
      if(s.subtitle) h+='<p class="s-sub">'+esc(s.subtitle)+'</p>';
      var clamp = s.about.length>1 && !openSessions['m'+si];
      h+='<div class="s-about'+(clamp?' clamp':'')+'">'+s.about.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>';
      if(s.about.length>1) h+='<button class="more" data-more="'+si+'">'+(clamp?'Read the full explanation':'Show less')+'</button>';
      h+='<div class="scrip"><h3>Scriptures</h3><div class="chips">'+s.scriptures.map(function(r){return KJV[r]? '<button class="chip" data-ref="'+esc(r)+'" aria-expanded="false" aria-haspopup="dialog">'+esc(r)+'</button>' : '<span class="chip">'+esc(r)+'</span>';}).join('')+'</div></div>';
      if(s.note) h+='<p class="note">'+esc(s.note)+'</p>';
      h+='<div class="points-h"><h3>Prayer points</h3>'+(ok?'':'<button data-all="'+si+'">Check all</button>')+'</div><ol class="points">';
      s.points.forEach(function(p,i){ var id=pk(n,si,i);
        h+='<li class="pt"><label><input type="checkbox" data-pt="'+id+'"'+(S.c[id]?' checked':'')+'><span class="box">'+CHECK+'</span><span class="n">'+(i+1)+'</span><span class="txt">'+esc(p)+'</span></label></li>'; });
      h+='</ol></div>';
    }
    h+='</section>';
  });

  h+='<section class="questions" id="sq"><h2>The digging questions</h2><p class="qnote">Write your answers here, then check each one off.'+(d.questionNote?' '+esc(d.questionNote):'')+'</p>';
  d.questions.forEach(function(q,i){ var k=n+"-"+i;
    h+='<div class="q"><p><strong>'+(i+1)+'.</strong> '+esc(q)+'</p><textarea data-note="'+k+'" aria-label="Your answer to question '+(i+1)+'" placeholder="Write your answer\u2026">'+esc(S.notes[k]||'')+'</textarea>'+
       '<label class="qcheck"><input type="checkbox" data-q="'+k+'"'+(S.q[k]?' checked':'')+'><span class="box">'+CHECK+'</span>I\u2019ve answered this</label></div>'; });
  h+='</section>';

  if(dayComplete(n)){
    var next = n<21 ? status(n+1) : null, msg, btn='';
    if(n===21) msg="You finished all 21 days. Keep the well open.";
    else if(next.open){ msg="Day "+(n+1)+" is ready."; btn='<button class="btn" data-open="'+(n+1)+'">Go to Day '+(n+1)+'</button>'; }
    else msg="Day "+(n+1)+" opens "+longDate(n+1)+".";
    h+='<section class="done-card"><h2>Day '+n+' complete</h2><p>'+msg+'</p>'+btn+'</section>';
  }
  document.getElementById('day').innerHTML=h;
  var t=totals(n); document.getElementById('tbBar').style.width=(100*t.got/t.tot)+'%'; document.getElementById('tbCount').textContent=t.got+'/'+t.tot;
}

function afterChange(){
  var n=openDay, was=everDone(n);
  if(dayComplete(n) && !was){ S.done[n]=Date.now(); persist(); renderDay(); toast("Day "+n+" complete"); return true; }
  persist(); return false;
}
function patchCounts(){ // light update without re-rendering (keeps scroll and focus)
  var n=openDay, d=D(n);
  document.querySelectorAll('.cl-item').forEach(function(el){ var j=el.getAttribute('data-jump');
    if(j==='q'){ el.querySelector('.tick').classList.toggle('on',qDone(n)); el.querySelector('.c').textContent=qCount(n)+'/'+d.questions.length; }
    else { var si=+j; el.querySelector('.tick').classList.toggle('on',sessDone(n,si)); el.querySelector('.c').textContent=sessCount(n,si)+'/'+d.sessions[si].points.length; } });
  document.querySelectorAll('.s-head').forEach(function(el){ var si=+el.getAttribute('data-toggle');
    el.querySelector('.tick').classList.toggle('on',sessDone(n,si)); el.querySelector('.s-count').textContent=sessCount(n,si)+'/'+d.sessions[si].points.length; });
  var t=totals(n); document.getElementById('tbBar').style.width=(100*t.got/t.tot)+'%'; document.getElementById('tbCount').textContent=t.got+'/'+t.tot;
}

/* ---------- navigation ---------- */
function show(n){
  if(n){ openDay=n; openSessions={}; var first=null; for(var s=0;s<4;s++){ if(!sessDone(n,s)){ first=s; break; } } if(first!==null) openSessions[first]=true;
    renderDay(); document.getElementById('home').classList.add('hidden'); document.getElementById('dayview').classList.remove('hidden'); window.scrollTo(0,0);
    try{ history.replaceState(null,'','#day-'+n); }catch(e){}
  } else { openDay=null; renderHome(); document.getElementById('dayview').classList.add('hidden'); document.getElementById('home').classList.remove('hidden'); window.scrollTo(0,0);
    try{ history.replaceState(null,'','#'); }catch(e){} }
}
function render(){ if(openDay) renderDay(); else renderHome(); }

document.addEventListener('click', function(e){
  var el;
  if((el=e.target.closest('[data-open]'))){ var n=+el.getAttribute('data-open'), s=status(n); if(s.open) show(n); else toast(s.why+"."); return; }
  if(e.target.closest('#backBtn')){ show(null); return; }
  if(e.target.closest('#resetBtn')){ if(confirm("Reset all progress and journal answers? This can\u2019t be undone.")){ S=blank(); persist(); renderHome(); toast("Progress reset"); } return; }
  if((el=e.target.closest('[data-toggle]'))){ var si=+el.getAttribute('data-toggle'); openSessions[si]=!openSessions[si]; renderDay(); var sec=document.getElementById('s'+si); if(openSessions[si] && sec) sec.scrollIntoView({block:'start'}); return; }
  if((el=e.target.closest('[data-more]'))){ var m='m'+el.getAttribute('data-more'); openSessions[m]=!openSessions[m]; renderDay(); return; }
  if((el=e.target.closest('[data-jump]'))){ var j=el.getAttribute('data-jump'); if(j==='q'){ document.getElementById('sq').scrollIntoView({block:'start'}); return; }
    openSessions[+j]=true; renderDay(); document.getElementById('s'+j).scrollIntoView({block:'start'}); return; }
  if((el=e.target.closest('[data-all]'))){ var si2=+el.getAttribute('data-all'); D(openDay).sessions[si2].points.forEach(function(_,i){ S.c[pk(openDay,si2,i)]=1; });
    if(!afterChange()){ renderDay(); } toast(D(openDay).sessions[si2].watch+" complete"); return; }
});
document.addEventListener('change', function(e){
  var t=e.target, id;
  if((id=t.getAttribute('data-pt'))){ if(t.checked) S.c[id]=1; else delete S.c[id];
    var parts=id.split('-'), si=+parts[1], wasDone=sessDone(openDay,si);
    if(!afterChange()){ patchCounts(); if(t.checked && sessDone(openDay,si)) toast(D(openDay).sessions[si].watch+" complete"); } return; }
  if((id=t.getAttribute('data-q'))){ if(t.checked) S.q[id]=1; else delete S.q[id]; if(!afterChange()) patchCounts(); return; }
});
var noteTimer=null;
document.addEventListener('input', function(e){ var k=e.target.getAttribute && e.target.getAttribute('data-note'); if(!k) return; S.notes[k]=e.target.value; clearTimeout(noteTimer); noteTimer=setTimeout(persist,500); });


/* ---------- scripture popover ---------- */
var pop=document.getElementById('pop'), popChip=null;
function closePop(){ if(!popChip) return; pop.classList.remove('show'); pop.hidden=true; popChip.setAttribute('aria-expanded','false'); popChip=null; }
function openPop(chip){
  if(popChip===chip){ closePop(); return; }
  closePop();
  var ref=chip.getAttribute('data-ref'), vs=KJV[ref]; if(!vs) return;
  var multi = vs.length && vs[0][0]!==vs[vs.length-1][0];
  var body = vs.map(function(v,i){ var lab = (multi && (i===0 || v[0]!==vs[i-1][0])) ? v[0]+':'+v[1] : v[1]; return '<sup>'+lab+'</sup>'+esc(v[2]); }).join(' ');
  pop.innerHTML='<div class="pop-h"><div><strong>'+esc(ref)+'</strong><span>KJV</span></div><button class="pop-x" aria-label="Close">'+
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><p>'+body+'</p>';
  pop.setAttribute('aria-label', ref); pop.hidden=false; pop.scrollTop=0;
  var r=chip.getBoundingClientRect(), vw=document.documentElement.clientWidth, vh=window.innerHeight, pw=pop.offsetWidth, ph=pop.offsetHeight, gap=8;
  var left=Math.max(12, Math.min(r.left + r.width/2 - pw/2, vw - pw - 12));
  var below = vh - r.bottom, top = (below >= ph + gap + 12 || below >= r.top) ? r.bottom + gap : r.top - ph - gap;
  top=Math.max(12, Math.min(top, vh - ph - 12));
  pop.style.left=left+'px'; pop.style.top=top+'px';
  popChip=chip; chip.setAttribute('aria-expanded','true');
  requestAnimationFrame(function(){ pop.classList.add('show'); });
}
document.addEventListener('click', function(e){
  var c=e.target.closest('[data-ref]'); if(c){ openPop(c); return; }
  if(e.target.closest('.pop-x')){ var ch=popChip; closePop(); if(ch) ch.focus(); return; }
  if(popChip && !e.target.closest('#pop')) closePop();
}, true);
window.addEventListener('scroll', closePop, {passive:true});
window.addEventListener('resize', closePop);
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && popChip){ var ch=popChip; closePop(); ch.focus(); } });

var m=/^#day-(\d+)$/.exec(location.hash||''); if(m && status(+m[1]).open) show(+m[1]); else renderHome();
})();
</script>
</body>
</html>
