d there was light."]],"Genesis 20:2":[[20,2,"And Abraham said of Sarah his wife, She is my sister: and Abimelech king of Gerar sent, and took Sarah."]],"Genesis 20:3":[[20,3,"But God came to Abimelech in a dream by night, and said to him, Behold, thou art but a dead man, for the woman which thou hast taken; for she is a man’s wife."]],"Genesis 21:1 to 2":[[21,1,"And the LORD visited Sarah as he had said, and the LORD did unto Sarah as he had spoken."],[21,2,"For Sarah conceived, and bare Abraham a son in his old age, at the set time of which God had spoken to him."]],"Genesis 21:14 to 19":[[21,14,"And Abraham rose up early in the morning, and took bread, and a bottle of water, and gave it unto Hagar, putting it on her shoulder, and the child, and sent her away: and she departed, and wandered in the wilderness of Beer-sheba."],[21,15,"And the water was spent in the bottle, and she cast the child under one of the shrubs."],[21,16,"And she went, and sat her down over against him a good way off, as it were a bowshot: for she said, Let me not see the death of the child. And she sat over against him, and lift up her voice, and wept."],[21,17,"And God heard the voice of the lad; and the angel of God called to Hagar out of heaven, and said unto her, What aileth thee, Hagar? fear not; for God hath heard the voice of the lad where he is."],[21,18,"Arise, lift up the lad, and hold him in thine hand; for I will make him a great nation."],[21,19,"And God opened her eyes, and she saw a well of water; and she went, and filled the bottle with water, and gave the lad drink."]],"Genesis 22:14":[[22,14,"And Abraham called the name of that place Jehovah-jireh: as it is said to this day, In the mount of the LORD it shall be seen."]],"Genesis 24:1 to 27":[[24,1,"And Abraham was old, and well stricken in age: and the LORD had blessed Abraham in all things."],[24,2,"And Abraham said unto his eldest servant of his house, that ruled over all that he had, Put, I pray thee, thy hand under my thigh:"],[24,3,"And I will make thee swear by the LORD, the God of heaven, and the God of the earth, that thou shalt not take a wife unto my son of the daughters of the Canaanites, among whom I dwell:"],[24,4,"But thou shalt go unto my country, and to my kindred, and take a wife unto my son Isaac."],[24,5,"And the servant said unto him, Peradventure the woman will not be willing to follow me unto this land: must I needs bring thy son again unto the land from whence thou camest?"],[24,6,"And Abraham said unto him, Beware thou that thou bring not my son thither again."],[24,7,"The LORD God of heaven, which took me from my father’s house, and from the land of my kindred, and which spake unto me, and that sware unto me, saying, Unto thy seed will I give this land; he shall send his angel before thee, and thou shalt take a wife unto my son from thence."],[24,8,"And if the woman will not be willing to follow thee, then thou shalt be clear from this my oath: only bring not my son thither again."],[24,9,"And the servant put his hand under the thigh of Abraham his master, and sware to him concerning that matter."],[24,10,"And the servant took ten camels of the camels of his master, and departed; for all the goods of his master were in his hand: and he arose, and went to Mesopotamia, unto the city of Nahor."],[24,11,"And he made his camels to kneel down without the city by a well of water at the time of the evening, even the time that women go out to draw water."],[24,12,"And he said, O LORD God of my master Abraham, I pray thee, send me good speed this day, and shew kindness unto my master Abraham."],[24,13,"Behold, I stand here by the well of water; and the daughters of the men of the city come out to draw water:"],[24,14,"And let it come to pass, that the damsel to whom I shall say, Let down thy pitcher, I pray thee, that I may drink; and she shall say, Drink, and I will give thy camels drink also: let the same be she that thou hast appointed for thy servant Isaac; and thereby shall I know that thou hast shewed kindness unto my master."],[24,15,"And it came to pass, before he had done speaking, that, behold, Rebekah came out, who was born to Bethuel, son of Milcah, the wife of Nahor, Abraham’s brother, with her pitcher upon her shoulder."],[24,16,"And the damsel was very fair to look upon, a virgin, neither had any man known her: and she went down to the well, and filled her pitcher, and came up."],[24,17,"And the servant ran to meet her, and said, Let me, I pray thee, drink a little water of thy pitcher."],[24,18,"And she said, Drink, my lord: and she hasted, and let down her pitcher upon her hand, and gave him drink."],[24,19,"And when she had done giving him drink, she said, I will draw water for thy camels also, until they have done drinking."],[24,20,"And she hasted, and emptied her pitcher into the trough, and ran again unto the well to draw water, and drew for all his camels."],[24,21,"And the man wondering at her held his peace, to wit whether the LORD had made his journey prosperous or not."],[24,22,"And it came to pass, as the camels had done drinking, that the man took a golden earring of half a shekel weight, and two bracelets for her hands of ten shekels weight of gold;"],[24,23,"And said, Whose daughter art thou? tell me, I pray thee: is there room in thy father’s house for us to lodge in?"],[24,24,"And she said unto him, I am the daughter of Bethuel the son of Milcah, which she bare unto Nahor."],[24,25,"She said moreover unto him, We have both straw and provender enough, and room to lodge in."],[24,26,"And the man bowed down his head, and worshipped the LORD."],[24,27,"And he said, Blessed be the LORD God of my master Abraham, who hath not left destitute my master of his mercy and his truth: I being in the way, the LORD led me to the house of my master’s brethren."]],"Genesis 24:58 to 67":[[24,58,"And they called Rebekah, and said unto her, Wilt thou go with this man? And she said, I will go."],[24,59,"And they sent away Rebekah their sister, and her nurse, and Abraham’s servant, and his men."],[24,60,"And they blessed Rebekah, and said unto her, Thou art our sister, be thou the mother of thousands of millions, and let thy seed possess the gate of those which hate them."],[24,61,"And Rebekah arose, and her damsels, and they rode upon the camels, and followed the man: and the servant took Rebekah, and went his way."],[24,62,"And Isaac came from the way of the well Lahai-roi; for he dwelt in the south country."],[24,63,"And Isaac went out to meditate in the field at the eventide: and he lifted up his eyes, and saw, and, behold, the camels were coming."],[24,64,"And Rebekah lifted up her eyes, and when she saw Isaac, she lighted off the camel."],[24,65,"For she had said unto the servant, What man is this that walketh in the field to meet us? And the servant had said, It is my master: therefore she took a vail, and covered herself."],[24,66,"And the servant told Isaac all things that he had done."],[24,67,"And Isaac brought her into his mother Sarah’s tent, and took Rebekah, and she became his wife; and he loved her: and Isaac was comforted after his mother’s death."]],"Genesis 25:21":[[25,21,"And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived."]],"Genesis 26:12":[[26,12,"Then Isaac sowed in that land, and received in the same year an hundredfold: and the LORD blessed him."]],"Genesis 26:12 to 14":[[26,12,"Then Isaac sowed in that land, and received in the same year an hundredfold: and the LORD blessed him."],[26,13,"And the man waxed great, and went forward, and grew until he became very great:"],[26,14,"For he had possession of flocks, and possession of herds, and great store of servants: and the Philistines envied him."]],"Genesis 26:14 to 16":[[26,14,"For he had possession of flocks, and possession of herds, and great store of servants: and the Philistines envied him."],[26,15,"For all the wells which his father’s servants had digged in the days of Abraham his father, the Philistines had stopped them, and filled them with earth."],[26,16,"And Abimelech said unto Isaac, Go from us; for thou art much mightier than we."]],"Genesis 26:15":[[26,15,"For all the wells which his father’s servants had digged in the days of Abraham his father, the Philistines had stopped them, and filled them with earth."]],"Genesis 26:18":[[26,18,"And Isaac digged again the wells of water, which they had digged in the days of Abraham his father; for the Philistines had stopped them after the death of Abraham: and he called their names after the names by which his father had called them."]],"Genesis 26:19 to 20":[[26,19,"And Isaac’s servants digged in the valley, and found there a well of springing water."],[26,20,"And the herdmen of Gerar did strive with Isaac’s herdmen, saying, The water is ours: and he called the name of the well Esek; because they strove with him."]],"Genesis 26:21":[[26,21,"And they digged another well, and strove for that also: and he called the name of it Sitnah."]],"Genesis 26:22":[[26,22,"And he removed from thence, and digged another well; and for that they strove not: and he called the name of it Rehoboth; and he said, For now the LORD hath made room for us, and we shall be fruitful in the land."]],"Genesis 26:23 to 24":[[26,23,"And he went up from thence to Beer-sheba."],[26,24,"And the LORD appeared unto him the same night, and said, I am the God of Abraham thy father: fear not, for I am with thee, and will bless thee, and multiply thy seed for my servant Abraham’s sake."]],"Genesis 26:24":[[26,24,"And the LORD appeared unto him the same night, and said, I am the God of Abraham thy father: fear not, for I am with thee, and will bless thee, and multiply thy seed for my servant Abraham’s sake."]],"Genesis 26:24 to 25":[[26,24,"And the LORD appeared unto him the same night, and said, I am the God of Abraham thy father: fear not, for I am with thee, and will bless thee, and multiply thy seed for my servant Abraham’s sake."],[26,25,"And he builded an altar there, and called upon the name of the LORD, and pitched his tent there: and there Isaac’s servants digged a well."]],"Genesis 26:25":[[26,25,"And he builded an altar there, and called upon the name of the LORD, and pitched his tent there: and there Isaac’s servants digged a well."]],"Genesis 26:26 to 31":[[26,26,"Then Abimelech went to him from Gerar, and Ahuzzath one of his friends, and Phichol the chief captain of his army."],[26,27,"And Isaac said unto them, Wherefore come ye to me, seeing ye hate me, and have sent me away from you?"],[26,28,"And they said, We saw certainly that the LORD was with thee: and we said, Let there be now an oath betwixt us, even betwixt us and thee, and let us make a covenant with thee;"],[26,29,"That thou wilt do us no hurt, as we have not touched thee, and as we have done unto thee nothing but good, and have sent thee away in peace: thou art now the blessed of the LORD."],[26,30,"And he made them a feast, and they did eat and drink."],[26,31,"And they rose up betimes in the morning, and sware one to another: and Isaac sent them away, and they departed from him in peace."]],"Genesis 26:28":[[26,28,"And they said, We saw certainly that the LORD was with thee: and we said, Let there be now an oath betwixt us, even betwixt us and thee, and let us make a covenant with thee;"]],"Genesis 26:31 to 33":[[26,31,"And they rose up betimes in the morning, and sware one to another: and Isaac sent them away, and they departed from him in peace."],[26,32,"And it came to pass the same day, that Isaac’s servants came, and told him concerning the well which they had digged, and said unto him, We have found water."],[26,33,"And he called it Shebah: therefore the name of the city is Beer-sheba unto this day."]],"Genesis 26:32":[[26,32,"And it came to pass the same day, that Isaac’s servants came, and told him concerning the well which they had digged, and said unto him, We have found water."]],"Genesis 26:7":[[26,7,"And the men of the place asked him of his wife; and he said, She is my sister: for he feared to say, She is my wife; lest, said he, the men of the place should kill me for Rebekah; because she was fair to look upon."]],"Genesis 26:8":[[26,8,"And it came to pass, when he had been there a long time, that Abimelech king of the Philistines looked out at a window, and saw, and, behold, Isaac was sporting with Rebekah his wife."]],"Genesis 27:33 to 37":[[27,33,"And Isaac trembled very exceedingly, and said, Who? where is he that hath taken venison, and brought it me, and I have eaten of all before thou camest, and have blessed him? yea, and he shall be blessed."],[27,34,"And when Esau heard the words of his father, he cried with a great and exceeding bitter cry, and said unto his father, Bless me, even me also, O my father."],[27,35,"And he said, Thy brother came with subtilty, and hath taken away thy blessing."],[27,36,"And he said, Is not he rightly named Jacob? for he hath supplanted me these two times: he took away my birthright; and, behold, now he hath taken away my blessing. And he said, Hast thou not reserved a blessing for me?"],[27,37,"And Isaac answered and said unto Esau, Behold, I have made him thy lord, and all his brethren have I given to him for servants; and with corn and wine have I sustained him: and what shall I do now unto thee, my son?"]],"Genesis 28:10 to 17":[[28,10,"And Jacob went out from Beer-sheba, and went toward Haran."],[28,11,"And he lighted upon a certain place, and tarried there all night, because the sun was set; and he took of the stones of that place, and put them for his pillows, and lay down in that place to sleep."],[28,12,"And he dreamed, and behold a ladder set up on the earth, and the top of it reached to heaven: and behold the angels of God ascending and descending on it."],[28,13,"And, behold, the LORD stood above it, and said, I am the LORD God of Abraham thy father, and the God of Isaac: the land whereon thou liest, to thee will I give it, and to thy seed;"],[28,14,"And thy seed shall be as the dust of the earth, and thou shalt spread abroad to the west, and to the east, and to the north, and to the south: and in thee and in thy seed shall all the families of the earth be blessed."],[28,15,"And, behold, I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land; for I will not leave thee, until I have done that which I have spoken to thee of."],[28,16,"And Jacob awaked out of his sleep, and he said, Surely the LORD is in this place; and I knew it not."],[28,17,"And he was afraid, and said, How dreadful is this place! this is none other but the house of God, and this is the gate of heaven."]],"Genesis 28:11 to 18":[[28,11,"And he lighted upon a certain place, and tarried there all night, because the sun was set; and he took of the stones of that place, and put them for his pillows, and lay down in that place to sleep."],[28,12,"And he dreamed, and behold a ladder set up on the earth, and the top of it reached to heaven: and behold the angels of God ascending and descending on it."],[28,13,"And, behold, the LORD stood above it, and said, I am the LORD God of Abraham thy father, and the God of Isaac: the land whereon thou liest, to thee will I give it, and to thy seed;"],[28,14,"And thy seed shall be as the dust of the earth, and thou shalt spread abroad to the west, and to the east, and to the north, and to the south: and in thee and in thy seed shall all the families of the earth be blessed."],[28,15,"And, behold, I am with thee, and will keep thee in all places whither thou goest, and will bring thee again into this land; for I will not leave thee, until I have done that which I have spoken to thee of."],[28,16,"And Jacob awaked out of his sleep, and he said, Surely the LORD is in this place; and I knew it not."],[28,17,"And he was afraid, and said, How dreadful is this place! this is none other but the house of God, and this is the gate of heaven."],[28,18,"And Jacob rose up early in the morning, and took the stone that he had put for his pillows, and set it up for a pillar, and poured oil upon the top of it."]],"Genesis 28:18 to 22":[[28,18,"And Jacob rose up early in the morning, and took the stone that he had put for his pillows, and set it up for a pillar, and poured oil upon the top of it."],[28,19,"And he called the name of that place Beth-el: but the name of that city was called Luz at the first."],[28,20,"And Jacob vowed a vow, saying, If God will be with me, and will keep me in this way that I go, and will give me bread to eat, and raiment to put on,"],[28,21,"So that I come again to my father’s house in peace; then shall the LORD be my God:"],[28,22,"And this stone, which I have set for a pillar, shall be God’s house: and of all that thou shalt give me I will surely give the tenth unto thee."]],"Genesis 29:1 to 12":[[29,1,"Then Jacob went on his journey, and came into the land of the people of the east."],[29,2,"And he looked, and behold a well in the field, and, lo, there were three flocks of sheep lying by it; for out of that well they watered the flocks: and a great stone was upon the well’s mouth."],[29,3,"And thither were all the flocks gathered: and they rolled the stone from the well’s mouth, and watered the sheep, and put the stone again upon the well’s mouth in his place."],[29,4,"And Jacob said unto them, My brethren, whence be ye? And they said, Of Haran are we."],[29,5,"And he said unto them, Know ye Laban the son of Nahor? And they said, We know him."],[29,6,"And he said unto them, Is he well? And they said, He is well: and, behold, Rachel his daughter cometh with the sheep."],[29,7,"And he said, Lo, it is yet high day, neither is it time that the cattle should be gathered together: water ye the sheep, and go and feed them."],[29,8,"And they said, We cannot, until all the flocks be gathered together, and till they roll the stone from the well’s mouth; then we water the sheep."],[29,9,"And while he yet spake with them, Rachel came with her father’s sheep: for she kept them."],[29,10,"And it came to pass, when Jacob saw Rachel the daughter of Laban his mother’s brother, and the sheep of Laban his mother’s brother, that Jacob went near, and rolled the stone from the well’s mouth, and watered the flock of Laban his mother’s brother."],[29,11,"And Jacob kissed Rachel, and lifted up his voice, and wept."],[29,12,"And Jacob told Rachel that he was her father’s brother, and that he was Rebekah’s son: and she ran and told her father."]],"Genesis 29:2 to 3":[[29,2,"And he looked, and behold a well in the field, and, lo, there were three flocks of sheep lying by it; for out of that well they watered the flocks: and a great stone was upon the well’s mouth."],[29,3,"And thither were all the flocks gathered: and they rolled the stone from the well’s mouth, and watered the sheep, and put the stone again upon the well’s mouth in his place."]],"Genesis 2:18 to 24":[[2,18,"And the LORD God said, It is not good that the man should be alone; I will make him an help meet for him."],[2,19,"And out of the ground the LORD God formed every beast of the field, and every fowl of the air; and brought them unto Adam to see what he would call them: and whatsoever Adam called every living creature, that was the name thereof."],[2,20,"And Adam gave names to all cattle, and to the fowl of the air, and to every beast of the field; but for Adam there was not found an help meet for him."],[2,21,"And the LORD God caused a deep sleep to fall upon Adam, and he slept: and he took one of his ribs, and closed up the flesh instead thereof;"],[2,22,"And the rib, which the LORD God had taken from man, made he a woman, and brought her unto the man."],[2,23,"And Adam said, This is now bone of my bones, and flesh of my flesh: she shall be called Woman, because she was taken out of Man."],[2,24,"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh."]],"Genesis 2:18 to 25":[[2,18,"And the LORD God said, It is not good that the man should be alone; I will make him an help meet for him."],[2,19,"And out of the ground the LORD God formed every beast of the field, and every fowl of the air; and brought them unto Adam to see what he would call them: and whatsoever Adam called every living creature, that was the name thereof."],[2,20,"And Adam gave names to all cattle, and to the fowl of the air, and to every beast of the field; but for Adam there was not found an help meet for him."],[2,21,"And the LORD God caused a deep sleep to fall upon Adam, and he slept: and he took one of his ribs, and closed up the flesh instead thereof;"],[2,22,"And the rib, which the LORD God had taken from man, made he a woman, and brought her unto the man."],[2,23,"And Adam said, This is now bone of my bones, and flesh of my flesh: she shall be called Woman, because she was taken out of Man."],[2,24,"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh."],[2,25,"And they were both naked, the man and his wife, and were not ashamed."]],"Genesis 2:24":[[2,24,"Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh."]],"Genesis 30:22":[[30,22,"And God remembered Rachel, and God hearkened to her, and opened her womb."]],"Genesis 30:22 to 24":[[30,22,"And God remembered Rachel, and God hearkened to her, and opened her womb."],[30,23,"And she conceived, and bare a son; and said, God hath taken away my reproach:"],[30,24,"And she called his name Joseph; and said, The LORD shall add to me another son."]],"Genesis 31:24":[[31,24,"And God came to Laban the Syrian in a dream by night, and said unto him, Take heed that thou speak not to Jacob either good or bad."]],"Genesis 32:24 to 30":[[32,24,"And Jacob was left alone; and there wrestled a man with him until the breaking of the day."],[32,25,"And when he saw that he prevailed not against him, he touched the hollow of his thigh; and the hollow of Jacob’s thigh was out of joint, as he wrestled with him."],[32,26,"And he said, Let me go, for the day breaketh. And he said, I will not let thee go, except thou bless me."],[32,27,"And he said unto him, What is thy name? And he said, Jacob."],[32,28,"And he said, Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God and with men, and hast prevailed."],[32,29,"And Jacob asked him, and said, Tell me, I pray thee, thy name. And he said, Wherefore is it that thou dost ask after my name? And he blessed him there."],[32,30,"And Jacob called the name of the place Peniel: for I have seen God face to face, and my life is preserved."]],"Genesis 32:24 to 31":[[32,24,"And Jacob was left alone; and there wrestled a man with him until the breaking of the day."],[32,25,"And when he saw that he prevailed not against him, he touched the hollow of his thigh; and the hollow of Jacob’s thigh was out of joint, as he wrestled with him."],[32,26,"And he said, Let me go, for the day breaketh. And he said, I will not let thee go, except thou bless me."],[32,27,"And he said unto him, What is thy name? And he said, Jacob."],[32,28,"And he said, Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God and with men, and hast prevailed."],[32,29,"And Jacob asked him, and said, Tell me, I pray thee, thy name. And he said, Wherefore is it that thou dost ask after my name? And he blessed him there."],[32,30,"And Jacob called the name of the place Peniel: for I have seen God face to face, and my life is preserved."],[32,31,"And as he passed over Penuel the sun rose upon him, and he halted upon his thigh."]],"Genesis 32:27 to 28":[[32,27,"And he said unto him, What is thy name? And he said, Jacob."],[32,28,"And he said, Thy name shall be called no more Jacob, but Israel: for as a prince hast thou power with God and with men, and hast prevailed."]],"Genesis 35:18":[[35,18,"And it came to pass, as her soul was in departing, (for she died) that she called his name Ben-oni: but his father called him Benjamin."]],"Genesis 37:11":[[37,11,"And his brethren envied him; but his father observed the saying."]],"Genesis 37:18 to 20":[[37,18,"And when they saw him afar off, even before he came near unto them, they conspired against him to slay him."],[37,19,"And they said one to another, Behold, this dreamer cometh."],[37,20,"Come now therefore, and let us slay him, and cast him into some pit, and we will say, Some evil beast hath devoured him: and we shall see what will become of his dreams."]],"Genesis 37:19 to 20":[[37,19,"And they said one to another, Behold, this dreamer cometh."],[37,20,"Come now therefore, and let us slay him, and cast him into some pit, and we will say, Some evil beast hath devoured him: and we shall see what will become of his dreams."]],"Genesis 37:3 to 11":[[37,3,"Now Israel loved Joseph more than all his children, because he was the son of his old age: and he made him a coat of many colours."],[37,4,"And when his brethren saw that their father loved him more than all his brethren, they hated him, and could not speak peaceably unto him."],[37,5,"And Joseph dreamed a dream, and he told it his brethren: and they hated him yet the more."],[37,6,"And he said unto them, Hear, I pray you, this dream which I have dreamed:"],[37,7,"For, behold, we were binding sheaves in the field, and, lo, my sheaf arose, and also stood upright; and, behold, your sheaves stood round about, and made obeisance to my sheaf."],[37,8,"And his brethren said to him, Shalt thou indeed reign over us? or shalt thou indeed have dominion over us? And they hated him yet the more for his dreams, and for his words."],[37,9,"And he dreamed yet another dream, and told it his brethren, and said, Behold, I have dreamed a dream more; and, behold, the sun and the moon and the eleven stars made obeisance to me."],[37,10,"And he told it to his father, and to his brethren: and his father rebuked him, and said unto him, What is this dream that thou hast dreamed? Shall I and thy mother and thy brethren indeed come to bow down ourselves to thee to the earth?"],[37,11,"And his brethren envied him; but his father observed the saying."]],"Genesis 37:5 to 11":[[37,5,"And Joseph dreamed a dream, and he told it his brethren: and they hated him yet the more."],[37,6,"And he said unto them, Hear, I pray you, this dream which I have dreamed:"],[37,7,"For, behold, we were binding sheaves in the field, and, lo, my sheaf arose, and also stood upright; and, behold, your sheaves stood round about, and made obeisance to my sheaf."],[37,8,"And his brethren said to him, Shalt thou indeed reign over us? or shalt thou indeed have dominion over us? And they hated him yet the more for his dreams, and for his words."],[37,9,"And he dreamed yet another dream, and told it his brethren, and said, Behold, I have dreamed a dream more; and, behold, the sun and the moon and the eleven stars made obeisance to me."],[37,10,"And he told it to his father, and to his brethren: and his father rebuked him, and said unto him, What is this dream that thou hast dreamed? Shall I and thy mother and thy brethren indeed come to bow down ourselves to thee to the earth?"],[37,11,"And his brethren envied him; but his father observed the saying."]],"Genesis 39:2 to 5":[[39,2,"And the LORD was with Joseph, and he was a prosperous man; and he was in the house of his master the Egyptian."],[39,3,"And his master saw that the LORD was with him, and that the LORD made all that he did to prosper in his hand."],[39,4,"And Joseph found grace in his sight, and he served him: and he made him overseer over his house, and all that he had he put into his hand."],[39,5,"And it came to pass from the time that he had made him overseer in his house, and over all that he had, that the LORD blessed the Egyptian’s house for Joseph’s sake; and the blessing of the LORD was upon all that he had in the house, and in the field."]],"Genesis 40:23 to 41:14":[[40,23,"Yet did not the chief butler remember Joseph, but forgat him."],[41,1,"And it came to pass at the end of two full years, that Pharaoh dreamed: and, behold, he stood by the river."],[41,2,"And, behold, there came up out of the river seven well favoured kine and fatfleshed; and they fed in a meadow."],[41,3,"And, behold, seven other kine came up after them out of the river, ill favoured and leanfleshed; and stood by the other kine upon the brink of the river."],[41,4,"And the ill favoured and leanfleshed kine did eat up the seven well favoured and fat kine. So Pharaoh awoke."],[41,5,"And he slept and dreamed the second time: and, behold, seven ears of corn came up upon one stalk, rank and good."],[41,6,"And, behold, seven thin ears and blasted with the east wind sprung up after them."],[41,7,"And the seven thin ears devoured the seven rank and full ears. And Pharaoh awoke, and, behold, it was a dream."],[41,8,"And it came to pass in the morning that his spirit was troubled; and he sent and called for all the magicians of Egypt, and all the wise men thereof: and Pharaoh told them his dream; but there was none that could interpret them unto Pharaoh."],[41,9,"Then spake the chief butler unto Pharaoh, saying, I do remember my faults this day:"],[41,10,"Pharaoh was wroth with his servants, and put me in ward in the captain of the guard’s house, both me and the chief baker:"],[41,11,"And we dreamed a dream in one night, I and he; we dreamed each man according to the interpretation of his dream."],[41,12,"And there was there with us a young man, an Hebrew, servant to the captain of the guard; and we told him, and he interpreted to us our dreams; to each man according to his dream he did interpret."],[41,13,"And it came to pass, as he interpreted to us, so it was; me he restored unto mine office, and him he hanged."],[41,14,"Then Pharaoh sent and called Joseph, and they brought him hastily out of the dungeon: and he shaved himself, and changed his raiment, and came in unto Pharaoh."]],"Genesis 4:10":[[4,10,"And he said, What hast thou done? the voice of thy brother’s blood crieth unto me from the ground."]],"Genesis 4:5 to 8":[[4,5,"But unto Cain and to his offering he had not respect. And Cain was very wroth, and his countenance fell."],[4,6,"And the LORD said unto Cain, Why art thou wroth? and why is thy countenance fallen?"],[4,7,"If thou doest well, shalt thou not be accepted? and if thou doest not well, sin lieth at the door. And unto thee shall be his desire, and thou shalt rule over him."],[4,8,"And Cain talked with Abel his brother: and it came to pass, when they were in the field, that Cain rose up against Abel his brother, and slew him."]],"Genesis 50:15 to 21":[[50,15,"And when Joseph’s brethren saw that their father was dead, they said, Joseph will peradventure hate us, and will certainly requite us all the evil which we did unto him."],[50,16,"And they sent a messenger unto Joseph, saying, Thy father did command before he died, saying,"],[50,17,"So shall ye say unto Joseph, Forgive, I pray thee now, the trespass of thy brethren, and their sin; for they did unto thee evil: and now, we pray thee, forgive the trespass of the servants of the God of thy father. And Joseph wept when they spake unto him."],[50,18,"And his brethren also went and fell down before his face; and they said, Behold, we be thy servants."],[50,19,"And Joseph said unto them, Fear not: for am I in the place of God?"],[50,20,"But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive."],[50,21,"Now therefore fear ye not: I will nourish you, and your little ones. And he comforted them, and spake kindly unto them."]],"Habakkuk 2:1 to 3":[[2,1,"I will stand upon my watch, and set me upon the tower, and will watch to see what he will say unto me, and what I shall answer when I am reproved."],[2,2,"And the LORD answered me, and said, Write the vision, and make it plain upon tables, that he may run that readeth it."],[2,3,"For the vision is yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry."]],"Habakkuk 2:2 to 3":[[2,2,"And the LORD answered me, and said, Write the vision, and make it plain upon tables, that he may run that readeth it."],[2,3,"For the vision is yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry."]],"Habakkuk 2:3":[[2,3,"For the vision is yet for an appointed time, but at the end it shall speak, and not lie: though it tarry, wait for it; because it will surely come, it will not tarry."]],"Habakkuk 3:2":[[3,2,"O LORD, I have heard thy speech, and was afraid: O LORD, revive thy work in the midst of the years, in the midst of the years make known; in wrath remember mercy."]],"Haggai 1:5 to 11":[[1,5,"Now therefore thus saith the LORD of hosts; Consider your ways."],[1,6,"Ye have sown much, and bring in little; ye eat, but ye have not enough; ye drink, but ye are not filled with drink; ye clothe you, but there is none warm; and he that earneth wages earneth wages to put it into a bag with holes."],[1,7,"Thus saith the LORD of hosts; Consider your ways."],[1,8,"Go up to the mountain, and bring wood, and build the house; and I will take pleasure in it, and I will be glorified, saith the LORD."],[1,9,"Ye looked for much, and, lo, it came to little; and when ye brought it home, I did blow upon it. Why? saith the LORD of hosts. Because of mine house that is waste, and ye run every man unto his own house."],[1,10,"Therefore the heaven over you is stayed from dew, and the earth is stayed from her fruit."],[1,11,"And I called for a drought upon the land, and upon the mountains, and upon the corn, and upon the new wine, and upon the oil, and upon that which the ground bringeth forth, and upon men, and upon cattle, and upon all the labour of the hands."]],"Haggai 1:6 to 9":[[1,6,"Ye have sown much, and bring in little; ye eat, but ye have not enough; ye drink, but ye are not filled with drink; ye clothe you, but there is none warm; and he that earneth wages earneth wages to put it into a bag with holes."],[1,7,"Thus saith the LORD of hosts; Consider your ways."],[1,8,"Go up to the mountain, and bring wood, and build the house; and I will take pleasure in it, and I will be glorified, saith the LORD."],[1,9,"Ye looked for much, and, lo, it came to little; and when ye brought it home, I did blow upon it. Why? saith the LORD of hosts. Because of mine house that is waste, and ye run every man unto his own house."]],"Hebrews 10:35 to 36":[[10,35,"Cast not away therefore your confidence, which hath great recompence of reward."],[10,36,"For ye have need of patience, that, after ye have done the will of God, ye might receive the promise."]],"Hebrews 10:35 to 39":[[10,35,"Cast not away therefore your confidence, which hath great recompence of reward."],[10,36,"For ye have need of patience, that, after ye have done the will of God, ye might receive the promise."],[10,37,"For yet a little while, and he that shall come will come, and will not tarry."],[10,38,"Now the just shall live by faith: but if any man draw back, my soul shall have no pleasure in him."],[10,39,"But we are not of them who draw back unto perdition; but of them that believe to the saving of the soul."]],"Hebrews 11:11":[[11,11,"Through faith also Sara herself received strength to conceive seed, and was delivered of a child when she was past age, because she judged him faithful who had promised."]],"Hebrews 11:3":[[11,3,"Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear."]],"Hebrews 12:1 to 2":[[12,1,"Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,"],[12,2,"Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God."]],"Hebrews 12:14 to 15":[[12,14,"Follow peace with all men, and holiness, without which no man shall see the Lord:"],[12,15,"Looking diligently lest any man fail of the grace of God; lest any root of bitterness springing up trouble you, and thereby many be defiled;"]],"Hebrews 12:15":[[12,15,"Looking diligently lest any man fail of the grace of God; lest any root of bitterness springing up trouble you, and thereby many be defiled;"]],"Hebrews 12:22 to 24":[[12,22,"But ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem, and to an innumerable company of angels,"],[12,23,"To the general assembly and church of the firstborn, which are written in heaven, and to God the Judge of all, and to the spirits of just men made perfect,"],[12,24,"And to Jesus the mediator of the new covenant, and to the blood of sprinkling, that speaketh better things than that of Abel."]],"Hebrews 12:24":[[12,24,"And to Jesus the mediator of the new covenant, and to the blood of sprinkling, that speaketh better things than that of Abel."]],"Hebrews 13:4":[[13,4,"Marriage is honourable in all, and the bed undefiled: but whoremongers and adulterers God will judge."]],"Hebrews 13:5 to 6":[[13,5,"Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee."],[13,6,"So that we may boldly say, The Lord is my helper, and I will not fear what man shall do unto me."]],"Hebrews 1:14":[[1,14,"Are they not all ministering spirits, sent forth to minister for them who shall be heirs of salvation?"]],"Hebrews 2:14 to 15":[[2,14,"Forasmuch then as the children are partakers of flesh and blood, he also himself likewise took part of the same; that through death he might destroy him that had the power of death, that is, the devil;"],[2,15,"And deliver them who through fear of death were all their lifetime subject to bondage."]],"Hebrews 4:12":[[4,12,"For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart."]],"Hebrews 4:12 to 13":[[4,12,"For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart."],[4,13,"Neither is there any creature that is not manifest in his sight: but all things are naked and opened unto the eyes of him with whom we have to do."]],"Hebrews 5:14":[[5,14,"But strong meat belongeth to them that are of full age, even those who by reason of use have their senses exercised to discern both good and evil."]],"Hebrews 6:10":[[6,10,"For God is not unrighteous to forget your work and labour of love, which ye have shewed toward his name, in that ye have ministered to the saints, and do minister."]],"Hebrews 7:25":[[7,25,"Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them."]],"Hebrews 8:6":[[8,6,"But now hath he obtained a more excellent ministry, by how much also he is the mediator of a better covenant, which was established upon better promises."]],"Hebrews 9:11 to 14":[[9,11,"But Christ being come an high priest of good things to come, by a greater and more perfect tabernacle, not made with hands, that is to say, not of this building;"],[9,12,"Neither by the blood of goats and calves, but by his own blood he entered in once into the holy place, having obtained eternal redemption for us."],[9,13,"For if the blood of bulls and of goats, and the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh:"],[9,14,"How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?"]],"Hebrews 9:13 to 14":[[9,13,"For if the blood of bulls and of goats, and the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh:"],[9,14,"How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?"]],"Hosea 2:16 to 20":[[2,16,"And it shall be at that day, saith the LORD, that thou shalt call me Ishi; and shalt call me no more Baali."],[2,17,"For I will take away the names of Baalim out of her mouth, and they shall no more be remembered by their name."],[2,18,"And in that day will I make a covenant for them with the beasts of the field, and with the fowls of heaven, and with the creeping things of the ground: and I will break the bow and the sword and the battle out of the earth, and will make them to lie down safely."],[2,19,"And I will betroth thee unto me for ever; yea, I will betroth thee unto me in righteousness, and in judgment, and in lovingkindness, and in mercies."],[2,20,"I will even betroth thee unto me in faithfulness: and thou shalt know the LORD."]],"Hosea 4:6":[[4,6,"My people are destroyed for lack of knowledge: because thou hast rejected knowledge, I will also reject thee, that thou shalt be no priest to me: seeing thou hast forgotten the law of thy God, I will also forget thy children."]],"Hosea 6:3":[[6,3,"Then shall we know, if we follow on to know the LORD: his going forth is prepared as the morning; and he shall come unto us as the rain, as the latter and former rain unto the earth."]],"Isaiah 10:27":[[10,27,"And it shall come to pass in that day, that his burden shall be taken away from off thy shoulder, and his yoke from off thy neck, and the yoke shall be destroyed because of the anointing."]],"Isaiah 12:1 to 6":[[12,1,"And in that day thou shalt say, O LORD, I will praise thee: though thou wast angry with me, thine anger is turned away, and thou comfortedst me."],[12,2,"Behold, God is my salvation; I will trust, and not be afraid: for the LORD JEHOVAH is my strength and my song; he also is become my salvation."],[12,3,"Therefore with joy shall ye draw water out of the wells of salvation."],[12,4,"And in that day shall ye say, Praise the LORD, call upon his name, declare his doings among the people, make mention that his name is exalted."],[12,5,"Sing unto the LORD; for he hath done excellent things: this is known in all the earth."],[12,6,"Cry out and shout, thou inhabitant of Zion: for great is the Holy One of Israel in the midst of thee."]],"Isaiah 12:3":[[12,3,"Therefore with joy shall ye draw water out of the wells of salvation."]],"Isaiah 21:11 to 12":[[21,11,"The burden of Dumah. He calleth to me out of Seir, Watchman, what of the night? Watchman, what of the night?"],[21,12,"The watchman said, The morning cometh, and also the night: if ye will enquire, enquire ye: return, come."]],"Isaiah 22:22":[[22,22,"And the key of the house of David will I lay upon his shoulder; so he shall open, and none shall shut; and he shall shut, and none shall open."]],"Isaiah 26:3":[[26,3,"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee."]],"Isaiah 28:18":[[28,18,"And your covenant with death shall be disannulled, and your agreement with hell shall not stand; when the overflowing scourge shall pass through, then ye shall be trodden down by it."]],"Isaiah 29:10 to 12":[[29,10,"For the LORD hath poured out upon you the spirit of deep sleep, and hath closed your eyes: the prophets and your rulers, the seers hath he covered."],[29,11,"And the vision of all is become unto you as the words of a book that is sealed, which men deliver to one that is learned, saying, Read this, I pray thee: and he saith, I cannot; for it is sealed:"],[29,12,"And the book is delivered to him that is not learned, saying, Read this, I pray thee: and he saith, I am not learned."]],"Isaiah 32:18":[[32,18,"And my people shall dwell in a peaceable habitation, and in sure dwellings, and in quiet resting places;"]],"Isaiah 34:16":[[34,16,"Seek ye out of the book of the LORD, and read: no one of these shall fail, none shall want her mate: for my mouth it hath commanded, and his spirit it hath gathered them."]],"Isaiah 37:3":[[37,3,"And they said unto him, Thus saith Hezekiah, This day is a day of trouble, and of rebuke, and of blasphemy: for the children are come to the birth, and there is not strength to bring forth."]],"Isaiah 40:2":[[40,2,"Speak ye comfortably to Jerusalem, and cry unto her, that her warfare is accomplished, that her iniquity is pardoned: for she hath received of the LORD’s hand double for all her sins."]],"Isaiah 41:10":[[41,10,"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."]],"Isaiah 41:10 to 13":[[41,10,"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."],[41,11,"Behold, all they that were incensed against thee shall be ashamed and confounded: they shall be as nothing; and they that strive with thee shall perish."],[41,12,"Thou shalt seek them, and shalt not find them, even them that contended with thee: they that war against thee shall be as nothing, and as a thing of nought."],[41,13,"For I the LORD thy God will hold thy right hand, saying unto thee, Fear not; I will help thee."]],"Isaiah 43:1":[[43,1,"But now thus saith the LORD that created thee, O Jacob, and he that formed thee, O Israel, Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine."]],"Isaiah 43:1 to 5":[[43,1,"But now thus saith the LORD that created thee, O Jacob, and he that formed thee, O Israel, Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine."],[43,2,"When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee."],[43,3,"For I am the LORD thy God, the Holy One of Israel, thy Saviour: I gave Egypt for thy ransom, Ethiopia and Seba for thee."],[43,4,"Since thou wast precious in my sight, thou hast been honourable, and I have loved thee: therefore will I give men for thee, and people for thy life."],[43,5,"Fear not: for I am with thee: I will bring thy seed from the east, and gather thee from the west;"]],"Isaiah 43:18 to 19":[[43,18,"Remember ye not the former things, neither consider the things of old."],[43,19,"Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert."]],"Isaiah 44:3":[[44,3,"For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring:"]],"Isaiah 45:1 to 3":[[45,1,"Thus saith the LORD to his anointed, to Cyrus, whose right hand I have holden, to subdue nations before him; and I will loose the loins of kings, to open before him the two leaved gates; and the gates shall not be shut;"],[45,2,"I will go before thee, and make the crooked places straight: I will break in pieces the gates of brass, and cut in sunder the bars of iron:"],[45,3,"And I will give thee the treasures of darkness, and hidden riches of secret places, that thou mayest know that I, the LORD, which call thee by thy name, am the God of Israel."]],"Isaiah 45:2":[[45,2,"I will go before thee, and make the crooked places straight: I will break in pieces the gates of brass, and cut in sunder the bars of iron:"]],"Isaiah 45:3":[[45,3,"And I will give thee the treasures of darkness, and hidden riches of secret places, that thou mayest know that I, the LORD, which call thee by thy name, am the God of Israel."]],"Isaiah 47:9 to 14":[[47,9,"But these two things shall come to thee in a moment in one day, the loss of children, and widowhood: they shall come upon thee in their perfection for the multitude of thy sorceries, and for the great abundance of thine enchantments."],[47,10,"For thou hast trusted in thy wickedness: thou hast said, None seeth me. Thy wisdom and thy knowledge, it hath perverted thee; and thou hast said in thine heart, I am, and none else beside me."],[47,11,"Therefore shall evil come upon thee; thou shalt not know from whence it riseth: and mischief shall fall upon thee; thou shalt not be able to put it off: and desolation shall come upon thee suddenly, which thou shalt not know."],[47,12,"Stand now with thine enchantments, and with the multitude of thy sorceries, wherein thou hast laboured from thy youth; if so be thou shalt be able to profit, if so be thou mayest prevail."],[47,13,"Thou art wearied in the multitude of thy counsels. Let now the astrologers, the stargazers, the monthly prognosticators, stand up, and save thee from these things that shall come upon thee."],[47,14,"Behold, they shall be as stubble; the fire shall burn them; they shall not deliver themselves from the power of the flame: there shall not be a coal to warm at, nor fire to sit before it."]],"Isaiah 49:15":[[49,15,"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget thee."]],"Isaiah 49:15 to 16":[[49,15,"Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget thee."],[49,16,"Behold, I have graven thee upon the palms of my hands; thy walls are continually before me."]],"Isaiah 49:24 to 25":[[49,24,"Shall the prey be taken from the mighty, or the lawful captive delivered?"],[49,25,"But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children."]],"Isaiah 49:24 to 26":[[49,24,"Shall the prey be taken from the mighty, or the lawful captive delivered?"],[49,25,"But thus saith the LORD, Even the captives of the mighty shall be taken away, and the prey of the terrible shall be delivered: for I will contend with him that contendeth with thee, and I will save thy children."],[49,26,"And I will feed them that oppress thee with their own flesh; and they shall be drunken with their own blood, as with sweet wine: and all flesh shall know that I the LORD am thy Saviour and thy Redeemer, the mighty One of Jacob."]],"Isaiah 4:5":[[4,5,"And the LORD will create upon every dwelling place of mount Zion, and upon her assemblies, a cloud and smoke by day, and the shining of a flaming fire by night: for upon all the glory shall be a defence."]],"Isaiah 4:5 to 6":[[4,5,"And the LORD will create upon every dwelling place of mount Zion, and upon her assemblies, a cloud and smoke by day, and the shining of a flaming fire by night: for upon all the glory shall be a defence."],[4,6,"And there shall be a tabernacle for a shadow in the daytime from the heat, and for a place of refuge, and for a covert from storm and from rain."]],"Isaiah 51:1":[[51,1,"Hearken to me, ye that follow after righteousness, ye that seek the LORD: look unto the rock whence ye are hewn, and to the hole of the pit whence ye are digged."]],"Isaiah 54:1":[[54,1,"Sing, O barren, thou that didst not bear; break forth into singing, and cry aloud, thou that didst not travail with child: for more are the children of the desolate than the children of the married wife, saith the LORD."]],"Isaiah 54:13":[[54,13,"And all thy children shall be taught of the LORD; and great shall be the peace of thy children."]],"Isaiah 54:15 to 17":[[54,15,"Behold, they shall surely gather together, but not by me: whosoever shall gather together against thee shall fall for thy sake."],[54,16,"Behold, I have created the smith that bloweth the coals in the fire, and that bringeth forth an instrument for his work; and I have created the waster to destroy."],[54,17,"No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the LORD, and their righteousness is of me, saith the LORD."]],"Isaiah 54:17":[[54,17,"No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the LORD, and their righteousness is of me, saith the LORD."]],"Isaiah 54:2 to 3":[[54,2,"Enlarge the place of thy tent, and let them stretch forth the curtains of thine habitations: spare not, lengthen thy cords, and strengthen thy stakes;"],[54,3,"For thou shalt break forth on the right hand and on the left; and thy seed shall inherit the Gentiles, and make the desolate cities to be inhabited."]],"Isaiah 54:2 to 5":[[54,2,"Enlarge the place of thy tent, and let them stretch forth the curtains of thine habitations: spare not, lengthen thy cords, and strengthen thy stakes;"],[54,3,"For thou shalt break forth on the right hand and on the left; and thy seed shall inherit the Gentiles, and make the desolate cities to be inhabited."],[54,4,"Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more."],[54,5,"For thy Maker is thine husband; the LORD of hosts is his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called."]],"Isaiah 54:4":[[54,4,"Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth, and shalt not remember the reproach of thy widowhood any more."]],"Isaiah 54:5 to 17":[[54,5,"For thy Maker is thine husband; the LORD of hosts is his name; and thy Redeemer the Holy One of Israel; The God of the whole earth shall he be called."],[54,6,"For the LORD hath called thee as a woman forsaken and grieved in spirit, and a wife of youth, when thou wast refused, saith thy God."],[54,7,"For a small moment have I forsaken thee; but with great mercies will I gather thee."],[54,8,"In a little wrath I hid my face from thee for a moment; but with everlasting kindness will I have mercy on thee, saith the LORD thy Redeemer."],[54,9,"For this is as the waters of Noah unto me: for as I have sworn that the waters of Noah should no more go over the earth; so have I sworn that I would not be wroth with thee, nor rebuke thee."],[54,10,"For the mountains shall depart, and the hills be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the LORD that hath mercy on thee."],[54,11,"O thou afflicted, tossed with tempest, and not comforted, behold, I will lay thy stones with fair colours, and lay thy foundations with sapphires."],[54,12,"And I will make thy windows of agates, and thy gates of carbuncles, and all thy borders of pleasant stones."],[54,13,"And all thy children shall be taught of the LORD; and great shall be the peace of thy children."],[54,14,"In righteousness shalt thou be established: thou shalt be far from oppression; for thou shalt not fear: and from terror; for it shall not come near thee."],[54,15,"Behold, they shall surely gather together, but not by me: whosoever shall gather together against thee shall fall for thy sake."],[54,16,"Behold, I have created the smith that bloweth the coals in the fire, and that bringeth forth an instrument for his work; and I have created the waster to destroy."],[54,17,"No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the LORD, and their righteousness is of me, saith the LORD."]],"Isaiah 55:11":[[55,11,"So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please, and it shall prosper in the thing whereto I sent it."]],"Isaiah 55:7":[[55,7,"Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the LORD, and he will have mercy upon him; and to our God, for he will abundantly pardon."]],"Isaiah 55:7 to 9":[[55,7,"Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the LORD, and he will have mercy upon him; and to our God, for he will abundantly pardon."],[55,8,"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD."],[55,9,"For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts."]],"Isaiah 60:1 to 3":[[60,1,"Arise, shine; for thy light is come, and the glory of the LORD is risen upon thee."],[60,2,"For, behold, the darkness shall cover the earth, and gross darkness the people: but the LORD shall arise upon thee, and his glory shall be seen upon thee."],[60,3,"And the Gentiles shall come to thy light, and kings to the brightness of thy rising."]],"Isaiah 60:14":[[60,14,"The sons also of them that afflicted thee shall come bending unto thee; and all they that despised thee shall bow themselves down at the soles of thy feet; and they shall call thee, The city of the LORD, The Zion of the Holy One of Israel."]],"Isaiah 61:10":[[61,10,"I will greatly rejoice in the LORD, my soul shall be joyful in my God; for he hath clothed me with the garments of salvation, he hath covered me with the robe of righteousness, as a bridegroom decketh himself with ornaments, and as a bride adorneth herself with her jewels."]],"Isaiah 61:3":[[61,3,"To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the LORD, that he might be glorified."]],"Isaiah 61:4 to 7":[[61,4,"And they shall build the old wastes, they shall raise up the former desolations, and they shall repair the waste cities, the desolations of many generations."],[61,5,"And strangers shall stand and feed your flocks, and the sons of the alien shall be your plowmen and your vinedressers."],[61,6,"But ye shall be named the Priests of the LORD: men shall call you the Ministers of our God: ye shall eat the riches of the Gentiles, and in their glory shall ye boast yourselves."],[61,7,"For your shame ye shall have double; and for confusion they shall rejoice in their portion: therefore in their land they shall possess the double: everlasting joy shall be unto them."]],"Isaiah 61:6 to 7":[[61,6,"But ye shall be named the Priests of the LORD: men shall call you the Ministers of our God: ye shall eat the riches of the Gentiles, and in their glory shall ye boast yourselves."],[61,7,"For your shame ye shall have double; and for confusion they shall rejoice in their portion: therefore in their land they shall possess the double: everlasting joy shall be unto them."]],"Isaiah 61:7":[[61,7,"For your shame ye shall have double; and for confusion they shall rejoice in their portion: therefore in their land they shall possess the double: everlasting joy shall be unto them."]],"Isaiah 62:12":[[62,12,"And they shall call them, The holy people, The redeemed of the LORD: and thou shalt be called, Sought out, A city not forsaken."]],"Isaiah 62:2 to 4":[[62,2,"And the Gentiles shall see thy righteousness, and all kings thy glory: and thou shalt be called by a new name, which the mouth of the LORD shall name."],[62,3,"Thou shalt also be a crown of glory in the hand of the LORD, and a royal diadem in the hand of thy God."],[62,4,"Thou shalt no more be termed Forsaken; neither shall thy land any more be termed Desolate: but thou shalt be called Hephzi-bah, and thy land Beulah: for the LORD delighteth in thee, and thy land shall be married."]],"Isaiah 62:2 to 4, 12":[[62,2,"And the Gentiles shall see thy righteousness, and all kings thy glory: and thou shalt be called by a new name, which the mouth of the LORD shall name."],[62,3,"Thou shalt also be a crown of glory in the hand of the LORD, and a royal diadem in the hand of thy God."],[62,4,"Thou shalt no more be termed Forsaken; neither shall thy land any more be termed Desolate: but thou shalt be called Hephzi-bah, and thy land Beulah: for the LORD delighteth in thee, and thy land shall be married."],[62,12,"And they shall call them, The holy people, The redeemed of the LORD: and thou shalt be called, Sought out, A city not forsaken."]],"Isaiah 62:6 to 7":[[62,6,"I have set watchmen upon thy walls, O Jerusalem, which shall never hold their peace day nor night: ye that make mention of the LORD, keep not silence, remembrancers"],[62,7,"And give him no rest, till he establish, and till he make Jerusalem a praise in the earth."]],"Isaiah 64:1 to 2":[[64,1,"Oh that thou wouldest rend the heavens, that thou wouldest come down, that the mountains might flow down at thy presence,"],[64,2,"As when the melting fire burneth, the fire causeth the waters to boil, to make thy name known to thine adversaries, that the nations may tremble at thy presence!"]],"Isaiah 66:7 to 9":[[66,7,"Before she travailed, she brought forth; before her pain came, she was delivered of a man child."],[66,8,"Who hath heard such a thing? who hath seen such things? Shall the earth be made to bring forth in one day? or shall a nation be born at once? for as soon as Zion travailed, she brought forth her children."],[66,9,"Shall I bring to the birth, and not cause to bring forth? saith the LORD: shall I cause to bring forth, and shut the womb? saith thy God."]],"Isaiah 6:1 to 8":[[6,1,"In the year that king Uzziah died I saw also the Lord sitting upon a throne, high and lifted up, and his train filled the temple."],[6,2,"Above it stood the seraphims: each one had six wings; with twain he covered his face, and with twain he covered his feet, and with twain he did fly."],[6,3,"And one cried unto another, and said, Holy, holy, holy, is the LORD of hosts: the whole earth is full of his glory."],[6,4,"And the posts of the door moved at the voice of him that cried, and the house was filled with smoke."],[6,5,"Then said I, Woe is me! for I am undone; because I am a man of unclean lips, and I dwell in the midst of a people of unclean lips: for mine eyes have seen the King, the LORD of hosts."],[6,6,"Then flew one of the seraphims unto me, having a live coal in his hand, which he had taken with the tongs from off the altar:"],[6,7,"And he laid it upon my mouth, and said, Lo, this hath touched thy lips; and thine iniquity is taken away, and thy sin purged."],[6,8,"Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here am I; send me."]],"Isaiah 6:5 to 7":[[6,5,"Then said I, Woe is me! for I am undone; because I am a man of unclean lips, and I dwell in the midst of a people of unclean lips: for mine eyes have seen the King, the LORD of hosts."],[6,6,"Then flew one of the seraphims unto me, having a live coal in his hand, which he had taken with the tongs from off the altar:"],[6,7,"And he laid it upon my mouth, and said, Lo, this hath touched thy lips; and thine iniquity is taken away, and thy sin purged."]],"Isaiah 8:18":[[8,18,"Behold, I and the children whom the LORD hath given me are for signs and for wonders in Israel from the LORD of hosts, which dwelleth in mount Zion."]],"Isaiah 8:9 to 10":[[8,9,"Associate yourselves, O ye people, and ye shall be broken in pieces; and give ear, all ye of far countries: gird yourselves, and ye shall be broken in pieces; gird yourselves, and ye shall be broken in pieces."],[8,10,"Take counsel together, and it shall come to nought; speak the word, and it shall not stand: for God is with us."]],"James 1:5 to 8":[[1,5,"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."],[1,6,"But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed."],[1,7,"For let not that man think that he shall receive any thing of the Lord."],[1,8,"A double minded man is unstable in all his ways."]],"James 3:13 to 18":[[3,13,"Who is a wise man and endued with knowledge among you? let him shew out of a good conversation his works with meekness of wisdom."],[3,14,"But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth."],[3,15,"This wisdom descendeth not from above, but is earthly, sensual, devilish."],[3,16,"For where envying and strife is, there is confusion and every evil work."],[3,17,"But the wisdom that is from above is first pure, then peaceable, gentle, and easy to be intreated, full of mercy and good fruits, without partiality, and without hypocrisy."],[3,18,"And the fruit of righteousness is sown in peace of them that make peace."]],"James 3:14 to 18":[[3,14,"But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth."],[3,15,"This wisdom descendeth not from above, but is earthly, sensual, devilish."],[3,16,"For where envying and strife is, there is confusion and every evil work."],[3,17,"But the wisdom that is from above is first pure, then peaceable, gentle, and easy to be intreated, full of mercy and good fruits, without partiality, and without hypocrisy."],[3,18,"And the fruit of righteousness is sown in peace of them that make peace."]],"James 3:16":[[3,16,"For where envying and strife is, there is confusion and every evil work."]],"James 3:2 to 10":[[3,2,"For in many things we offend all. If any man offend not in word, the same is a perfect man, and able also to bridle the whole body."],[3,3,"Behold, we put bits in the horses’ mouths, that they may obey us; and we turn about their whole body."],[3,4,"Behold also the ships, which though they be so great, and are driven of fierce winds, yet are they turned about with a very small helm, whithersoever the governor listeth."],[3,5,"Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!"],[3,6,"And the tongue is a fire, a world of iniquity: so is the tongue among our members, that it defileth the whole body, and setteth on fire the course of nature; and it is set on fire of hell."],[3,7,"For every kind of beasts, and of birds, and of serpents, and of things in the sea, is tamed, and hath been tamed of mankind:"],[3,8,"But the tongue can no man tame; it is an unruly evil, full of deadly poison."],[3,9,"Therewith bless we God, even the Father; and therewith curse we men, which are made after the similitude of God."],[3,10,"Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be."]],"Jeremiah 1:10":[[1,10,"See, I have this day set thee over the nations and over the kingdoms, to root out, and to pull down, and to destroy, and to throw down, to build, and to plant."]],"Jeremiah 1:5":[[1,5,"Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations."]],"Jeremiah 20:9":[[20,9,"Then I said, I will not make mention of him, nor speak any more in his name. But his word was in mine heart as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay."]],"Jeremiah 23:16":[[23,16,"Thus saith the LORD of hosts, Hearken not unto the words of the prophets that prophesy unto you: they make you vain: they speak a vision of their own heart, and not out of the mouth of the LORD."]],"Jeremiah 23:25 to 28":[[23,25,"I have heard what the prophets said, that prophesy lies in my name, saying, I have dreamed, I have dreamed."],[23,26,"How long shall this be in the heart of the prophets that prophesy lies? yea, they are prophets of the deceit of their own heart;"],[23,27,"Which think to cause my people to forget my name by their dreams which they tell every man to his neighbour, as their fathers have forgotten my name for Baal."],[23,28,"The prophet that hath a dream, let him tell a dream; and he that hath my word, let him speak my word faithfully. What is the chaff to the wheat? saith the LORD."]],"Jeremiah 29:13":[[29,13,"And ye shall seek me, and find me, when ye shall search for me with all your heart."]],"Jeremiah 2:13":[[2,13,"For my people have committed two evils; they have forsaken me the fountain of living waters, and hewed them out cisterns, broken cisterns, that can hold no water."]],"Jeremiah 30:16 to 17":[[30,16,"Therefore all they that devour thee shall be devoured; and all thine adversaries, every one of them, shall go into captivity; and they that spoil thee shall be a spoil, and all that prey upon thee will I give for a prey."],[30,17,"For I will restore health unto thee, and I will heal thee of thy wounds, saith the LORD; because they called thee an Outcast, saying, This is Zion, whom no man seeketh after."]],"Jeremiah 31:15 to 17":[[31,15,"Thus saith the LORD; A voice was heard in Ramah, lamentation, and bitter weeping; Rahel weeping for her children refused to be comforted for her children, because they were not."],[31,16,"Thus saith the LORD; Refrain thy voice from weeping, and thine eyes from tears: for thy work shall be rewarded, saith the LORD; and they shall come again from the land of the enemy."],[31,17,"And there is hope in thine end, saith the LORD, that thy children shall come again to their own border."]],"Jeremiah 31:29 to 30":[[31,29,"In those days they shall say no more, The fathers have eaten a sour grape, and the children’s teeth are set on edge."],[31,30,"But every one shall die for his own iniquity: every man that eateth the sour grape, his teeth shall be set on edge."]],"Jeremiah 32:18":[[32,18,"Thou shewest lovingkindness unto thousands, and recompensest the iniquity of the fathers into the bosom of their children after them: the Great, the Mighty God, the LORD of hosts, is his name,"]],"Jeremiah 33:16":[[33,16,"In those days shall Judah be saved, and Jerusalem shall dwell safely: and this is the name wherewith she shall be called, The LORD our righteousness. …: Heb. Jehovah-tsidkenu"]],"Jeremiah 4:14":[[4,14,"O Jerusalem, wash thine heart from wickedness, that thou mayest be saved. How long shall thy vain thoughts lodge within thee?"]],"Job 12:22":[[12,22,"He discovereth deep things out of darkness, and bringeth out to light the shadow of death."]],"Job 14:7 to 9":[[14,7,"For there is hope of a tree, if it be cut down, that it will sprout again, and that the tender branch thereof will not cease."],[14,8,"Though the root thereof wax old in the earth, and the stock thereof die in the ground;"],[14,9,"Yet through the scent of water it will bud, and bring forth boughs like a plant."]],"Job 1:5":[[1,5,"And it was so, when the days of their feasting were gone about, that Job sent and sanctified them, and rose up early in the morning, and offered burnt offerings according to the number of them all: for Job said, It may be that my sons have sinned, and cursed God in their hearts. Thus did Job continually."]],"Job 1:6 to 11":[[1,6,"Now there was a day when the sons of God came to present themselves before the LORD, and Satan came also among them."],[1,7,"And the LORD said unto Satan, Whence comest thou? Then Satan answered the LORD, and said, From going to and fro in the earth, and from walking up and down in it."],[1,8,"And the LORD said unto Satan, Hast thou considered my servant Job, that there is none like him in the earth, a perfect and an upright man, one that feareth God, and escheweth evil?"],[1,9,"Then Satan answered the LORD, and said, Doth Job fear God for nought?"],[1,10,"Hast not thou made an hedge about him, and about his house, and about all that he hath on every side? thou hast blessed the work of his hands, and his substance is increased in the land."],[1,11,"But put forth thine hand now, and touch all that he hath, and he will curse thee to thy face."]],"Job 1:9 to 10":[[1,9,"Then Satan answered the LORD, and said, Doth Job fear God for nought?"],[1,10,"Hast not thou made an hedge about him, and about his house, and about all that he hath on every side? thou hast blessed the work of his hands, and his substance is increased in the land."]],"Job 22:28":[[22,28,"Thou shalt also decree a thing, and it shall be established unto thee: and the light shall shine upon thy ways."]],"Job 33:14 to 18":[[33,14,"For God speaketh once, yea twice, yet man perceiveth it not."],[33,15,"In a dream, in a vision of the night, when deep sleep falleth upon men, in slumberings upon the bed;"],[33,16,"Then he openeth the ears of men, and sealeth their instruction,"],[33,17,"That he may withdraw man from his purpose, and hide pride from man."],[33,18,"He keepeth back his soul from the pit, and his life from perishing by the sword."]],"Job 33:4":[[33,4,"The Spirit of God hath made me, and the breath of the Almighty hath given me life."]],"Job 3:1 to 3":[[3,1,"After this opened Job his mouth, and cursed his day."],[3,2,"And Job spake, and said,"],[3,3,"Let the day perish wherein I was born, and the night in which it was said, There is a man child conceived."]],"Job 3:25":[[3,25,"For the thing which I greatly feared is come upon me, and that which I was afraid of is come unto me."]],"Job 42:10 to 12":[[42,10,"And the LORD turned the captivity of Job, when he prayed for his friends: also the LORD gave Job twice as much as he had before."],[42,11,"Then came there unto him all his brethren, and all his sisters, and all they that had been of his acquaintance before, and did eat bread with him in his house: and they bemoaned him, and comforted him over all the evil that the LORD had brought upon him: every man also gave him a piece of money, and every one an earring of gold."],[42,12,"So the LORD blessed the latter end of Job more than his beginning: for he had fourteen thousand sheep, and six thousand camels, and a thousand yoke of oxen, and a thousand she asses."]],"Job 42:5 to 6":[[42,5,"I have heard of thee by the hearing of the ear: but now mine eye seeth thee."],[42,6,"Wherefore I abhor myself, and repent in dust and ashes."]],"Joel 2:12 to 13":[[2,12,"Therefore also now, saith the LORD, turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning:"],[2,13,"And rend your heart, and not your garments, and turn unto the LORD your God: for he is gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil."]],"Joel 2:22":[[2,22,"Be not afraid, ye beasts of the field: for the pastures of the wilderness do spring, for the tree beareth her fruit, the fig tree and the vine do yield their strength."]],"Joel 2:25 to 26":[[2,25,"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you."],[2,26,"And ye shall eat in plenty, and be satisfied, and praise the name of the LORD your God, that hath dealt wondrously with you: and my people shall never be ashamed."]],"Joel 2:25 to 27":[[2,25,"And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you."],[2,26,"And ye shall eat in plenty, and be satisfied, and praise the name of the LORD your God, that hath dealt wondrously with you: and my people shall never be ashamed."],[2,27,"And ye shall know that I am in the midst of Israel, and that I am the LORD your God, and none else: and my people shall never be ashamed."]],"Joel 2:26":[[2,26,"And ye shall eat in plenty, and be satisfied, and praise the name of the LORD your God, that hath dealt wondrously with you: and my people shall never be ashamed."]],"Joel 2:28":[[2,28,"And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:"]],"John 10:10":[[10,10,"The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly."]],"John 11:38 to 44":[[11,38,"Jesus therefore again groaning in himself cometh to the grave. It was a cave, and a stone lay upon it."],[11,39,"Jesus said, Take ye away the stone. Martha, the sister of him that was dead, saith unto him, Lord, by this time he stinketh: for he hath been dead four days."],[11,40,"Jesus saith unto her, Said I not unto thee, that, if thou wouldest believe, thou shouldest see the glory of God?"],[11,41,"Then they took away the stone from the place where the dead was laid. And Jesus lifted up his eyes, and said, Father, I thank thee that thou hast heard me."],[11,42,"And I knew that thou hearest me always: but because of the people which stand by I said it, that they may believe that thou hast sent me."],[11,43,"And when he thus had spoken, he cried with a loud voice, Lazarus, come forth."],[11,44,"And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go."]],"John 14:18":[[14,18,"I will not leave you comfortless: I will come to you."]],"John 15:18 to 25":[[15,18,"If the world hate you, ye know that it hated me before it hated you."],[15,19,"If ye were of the world, the world would love his own: but because ye are not of the world, but I have chosen you out of the world, therefore the world hateth you."],[15,20,"Remember the word that I said unto you, The servant is not greater than his lord. If they have persecuted me, they will also persecute you; if they have kept my saying, they will keep yours also."],[15,21,"But all these things will they do unto you for my name’s sake, because they know not him that sent me."],[15,22,"If I had not come and spoken unto them, they had not had sin: but now they have no cloke for their sin."],[15,23,"He that hateth me hateth my Father also."],[15,24,"If I had not done among them the works which none other man did, they had not had sin: but now have they both seen and hated both me and my Father."],[15,25,"But this cometh to pass, that the word might be fulfilled that is written in their law, They hated me without a cause."]],"John 17:17":[[17,17,"Sanctify them through thy truth: thy word is truth."]],"John 1:42":[[1,42,"And he brought him to Jesus. And when Jesus beheld him, he said, Thou art Simon the son of Jona: thou shalt be called Cephas, which is by interpretation, A stone."]],"John 20:14 to 16":[[20,14,"And when she had thus said, she turned herself back, and saw Jesus standing, and knew not that it was Jesus."],[20,15,"Jesus saith unto her, Woman, why weepest thou? whom seekest thou? She, supposing him to be the gardener, saith unto him, Sir, if thou have borne him hence, tell me where thou hast laid him, and I will take him away."],[20,16,"Jesus saith unto her, Mary. She turned herself, and saith unto him, Rabboni; which is to say, Master."]],"John 3:8":[[3,8,"The wind bloweth where it listeth, and thou hearest the sound thereof, but canst not tell whence it cometh, and whither it goeth: so is every one that is born of the Spirit."]],"John 4:38":[[4,38,"I sent you to reap that whereon ye bestowed no labour: other men laboured, and ye are entered into their labours."]],"John 4:6 to 15, 28 to 29":[[4,6,"Now Jacob’s
