 liveth, I will not leave thee. So they came to Jericho."],[2,5,"And the sons of the prophets that were at Jericho came to Elisha, and said unto him, Knowest thou that the LORD will take away thy master from thy head to day? And he answered, Yea, I know it; hold ye your peace."],[2,6,"And Elijah said unto him, Tarry, I pray thee, here; for the LORD hath sent me to Jordan. And he said, As the LORD liveth, and as thy soul liveth, I will not leave thee. And they two went on."],[2,7,"And fifty men of the sons of the prophets went, and stood to view afar off: and they two stood by Jordan."],[2,8,"And Elijah took his mantle, and wrapped it together, and smote the waters, and they were divided hither and thither, so that they two went over on dry ground."],[2,9,"And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I be taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me."],[2,10,"And he said, Thou hast asked a hard thing: nevertheless, if thou see me when I am taken from thee, it shall be so unto thee; but if not, it shall not be so."],[2,11,"And it came to pass, as they still went on, and talked, that, behold, there appeared a chariot of fire, and horses of fire, and parted them both asunder; and Elijah went up by a whirlwind into heaven."],[2,12,"And Elisha saw it, and he cried, My father, my father, the chariot of Israel, and the horsemen thereof. And he saw him no more: and he took hold of his own clothes, and rent them in two pieces."],[2,13,"He took up also the mantle of Elijah that fell from him, and went back, and stood by the bank of Jordan;"],[2,14,"And he took the mantle of Elijah that fell from him, and smote the waters, and said, Where is the LORD God of Elijah? and when he also had smitten the waters, they parted hither and thither: and Elisha went over."],[2,15,"And when the sons of the prophets which were to view at Jericho saw him, they said, The spirit of Elijah doth rest on Elisha. And they came to meet him, and bowed themselves to the ground before him."]],"2 Kings 4:1 to 7":[[4,1,"Now there cried a certain woman of the wives of the sons of the prophets unto Elisha, saying, Thy servant my husband is dead; and thou knowest that thy servant did fear the LORD: and the creditor is come to take unto him my two sons to be bondmen."],[4,2,"And Elisha said unto her, What shall I do for thee? tell me, what hast thou in the house? And she said, Thine handmaid hath not any thing in the house, save a pot of oil."],[4,3,"Then he said, Go, borrow thee vessels abroad of all thy neighbours, even empty vessels; borrow not a few."],[4,4,"And when thou art come in, thou shalt shut the door upon thee and upon thy sons, and shalt pour out into all those vessels, and thou shalt set aside that which is full."],[4,5,"So she went from him, and shut the door upon her and upon her sons, who brought the vessels to her; and she poured out."],[4,6,"And it came to pass, when the vessels were full, that she said unto her son, Bring me yet a vessel. And he said unto her, There is not a vessel more. And the oil stayed."],[4,7,"Then she came and told the man of God. And he said, Go, sell the oil, and pay thy debt, and live thou and thy children of the rest."]],"2 Kings 4:14 to 17":[[4,14,"And he said, What then is to be done for her? And Gehazi answered, Verily she hath no child, and her husband is old."],[4,15,"And he said, Call her. And when he had called her, she stood in the door."],[4,16,"And he said, About this season, according to the time of life, thou shalt embrace a son. And she said, Nay, my lord, thou man of God, do not lie unto thine handmaid."],[4,17,"And the woman conceived, and bare a son at that season that Elisha had said unto her, according to the time of life."]],"2 Kings 6:15 to 17":[[6,15,"And when the servant of the man of God was risen early, and gone forth, behold, an host compassed the city both with horses and chariots. And his servant said unto him, Alas, my master! how shall we do?"],[6,16,"And he answered, Fear not: for they that be with us are more than they that be with them."],[6,17,"And Elisha prayed, and said, LORD, I pray thee, open his eyes, that he may see. And the LORD opened the eyes of the young man; and he saw: and, behold, the mountain was full of horses and chariots of fire round about Elisha."]],"2 Kings 6:8 to 12":[[6,8,"Then the king of Syria warred against Israel, and took counsel with his servants, saying, In such and such a place shall be my camp."],[6,9,"And the man of God sent unto the king of Israel, saying, Beware that thou pass not such a place; for thither the Syrians are come down."],[6,10,"And the king of Israel sent to the place which the man of God told him and warned him of, and saved himself there, not once nor twice."],[6,11,"Therefore the heart of the king of Syria was sore troubled for this thing; and he called his servants, and said unto them, Will ye not shew me which of us is for the king of Israel?"],[6,12,"And one of his servants said, None, my lord, O king: but Elisha, the prophet that is in Israel, telleth the king of Israel the words that thou speakest in thy bedchamber."]],"2 Kings 6:8 to 23":[[6,8,"Then the king of Syria warred against Israel, and took counsel with his servants, saying, In such and such a place shall be my camp."],[6,9,"And the man of God sent unto the king of Israel, saying, Beware that thou pass not such a place; for thither the Syrians are come down."],[6,10,"And the king of Israel sent to the place which the man of God told him and warned him of, and saved himself there, not once nor twice."],[6,11,"Therefore the heart of the king of Syria was sore troubled for this thing; and he called his servants, and said unto them, Will ye not shew me which of us is for the king of Israel?"],[6,12,"And one of his servants said, None, my lord, O king: but Elisha, the prophet that is in Israel, telleth the king of Israel the words that thou speakest in thy bedchamber."],[6,13,"And he said, Go and spy where he is, that I may send and fetch him. And it was told him, saying, Behold, he is in Dothan."],[6,14,"Therefore sent he thither horses, and chariots, and a great host: and they came by night, and compassed the city about."],[6,15,"And when the servant of the man of God was risen early, and gone forth, behold, an host compassed the city both with horses and chariots. And his servant said unto him, Alas, my master! how shall we do?"],[6,16,"And he answered, Fear not: for they that be with us are more than they that be with them."],[6,17,"And Elisha prayed, and said, LORD, I pray thee, open his eyes, that he may see. And the LORD opened the eyes of the young man; and he saw: and, behold, the mountain was full of horses and chariots of fire round about Elisha."],[6,18,"And when they came down to him, Elisha prayed unto the LORD, and said, Smite this people, I pray thee, with blindness. And he smote them with blindness according to the word of Elisha."],[6,19,"And Elisha said unto them, This is not the way, neither is this the city: follow me, and I will bring you to the man whom ye seek. But he led them to Samaria."],[6,20,"And it came to pass, when they were come into Samaria, that Elisha said, LORD, open the eyes of these men, that they may see. And the LORD opened their eyes, and they saw; and, behold, they were in the midst of Samaria."],[6,21,"And the king of Israel said unto Elisha, when he saw them, My father, shall I smite them? shall I smite them?"],[6,22,"And he answered, Thou shalt not smite them: wouldest thou smite those whom thou hast taken captive with thy sword and with thy bow? set bread and water before them, that they may eat and drink, and go to their master."],[6,23,"And he prepared great provision for them: and when they had eaten and drunk, he sent them away, and they went to their master. So the bands of Syria came no more into the land of Israel."]],"2 Kings 9:22":[[9,22,"And it came to pass, when Joram saw Jehu, that he said, Is it peace, Jehu? And he answered, What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?"]],"2 Samuel 21:1 to 3":[[21,1,"Then there was a famine in the days of David three years, year after year; and David enquired of the LORD. And the LORD answered, It is for Saul, and for his bloody house, because he slew the Gibeonites."],[21,2,"And the king called the Gibeonites, and said unto them; (now the Gibeonites were not of the children of Israel, but of the remnant of the Amorites; and the children of Israel had sworn unto them: and Saul sought to slay them in his zeal to the children of Israel and Judah.)"],[21,3,"Wherefore David said unto the Gibeonites, What shall I do for you? and wherewith shall I make the atonement, that ye may bless the inheritance of the LORD?"]],"2 Samuel 23:4":[[23,4,"And he shall be as the light of the morning, when the sun riseth, even a morning without clouds; as the tender grass springing out of the earth by clear shining after rain."]],"2 Samuel 6:14 to 22":[[6,14,"And David danced before the LORD with all his might; and David was girded with a linen ephod."],[6,15,"So David and all the house of Israel brought up the ark of the LORD with shouting, and with the sound of the trumpet."],[6,16,"And as the ark of the LORD came into the city of David, Michal Saul’s daughter looked through a window, and saw king David leaping and dancing before the LORD; and she despised him in her heart."],[6,17,"And they brought in the ark of the LORD, and set it in his place, in the midst of the tabernacle that David had pitched for it: and David offered burnt offerings and peace offerings before the LORD."],[6,18,"And as soon as David had made an end of offering burnt offerings and peace offerings, he blessed the people in the name of the LORD of hosts."],[6,19,"And he dealt among all the people, even among the whole multitude of Israel, as well to the women as men, to every one a cake of bread, and a good piece of flesh, and a flagon of wine. So all the people departed every one to his house."],[6,20,"Then David returned to bless his household. And Michal the daughter of Saul came out to meet David, and said, How glorious was the king of Israel to day, who uncovered himself to day in the eyes of the handmaids of his servants, as one of the vain fellows shamelessly uncovereth himself!"],[6,21,"And David said unto Michal, It was before the LORD, which chose me before thy father, and before all his house, to appoint me ruler over the people of the LORD, over Israel: therefore will I play before the LORD."],[6,22,"And I will yet be more vile than thus, and will be base in mine own sight: and of the maidservants which thou hast spoken of, of them shall I be had in honour."]],"2 Thessalonians 2:10 to 12":[[2,10,"And with all deceivableness of unrighteousness in them that perish; because they received not the love of the truth, that they might be saved."],[2,11,"And for this cause God shall send them strong delusion, that they should believe a lie:"],[2,12,"That they all might be damned who believed not the truth, but had pleasure in unrighteousness."]],"2 Thessalonians 3:3":[[3,3,"But the Lord is faithful, who shall stablish you, and keep you from evil."]],"2 Timothy 1:5":[[1,5,"When I call to remembrance the unfeigned faith that is in thee, which dwelt first in thy grandmother Lois, and thy mother Eunice; and I am persuaded that in thee also."]],"2 Timothy 1:7":[[1,7,"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind."]],"2 Timothy 3:12":[[3,12,"Yea, and all that will live godly in Christ Jesus shall suffer persecution."]],"2 Timothy 4:7":[[4,7,"I have fought a good fight, I have finished my course, I have kept the faith:"]],"3 John 2":[[1,2,"Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth."]],"Acts 10:2":[[10,2,"A devout man, and one that feared God with all his house, which gave much alms to the people, and prayed to God alway."]],"Acts 10:38":[[10,38,"How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him."]],"Acts 13:8 to 11":[[13,8,"But Elymas the sorcerer (for so is his name by interpretation) withstood them, seeking to turn away the deputy from the faith."],[13,9,"Then Saul, (who also is called Paul,) filled with the Holy Ghost, set his eyes on him,"],[13,10,"And said, O full of all subtilty and all mischief, thou child of the devil, thou enemy of all righteousness, wilt thou not cease to pervert the right ways of the Lord?"],[13,11,"And now, behold, the hand of the Lord is upon thee, and thou shalt be blind, not seeing the sun for a season. And immediately there fell on him a mist and a darkness; and he went about seeking some to lead him by the hand."]],"Acts 16:16 to 18":[[16,16,"And it came to pass, as we went to prayer, a certain damsel possessed with a spirit of divination met us, which brought her masters much gain by soothsaying:"],[16,17,"The same followed Paul and us, and cried, saying, These men are the servants of the most high God, which shew unto us the way of salvation."],[16,18,"And this did she many days. But Paul, being grieved, turned and said to the spirit, I command thee in the name of Jesus Christ to come out of her. And he came out the same hour."]],"Acts 16:25":[[16,25,"And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them."]],"Acts 16:25 to 26":[[16,25,"And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them."],[16,26,"And suddenly there was a great earthquake, so that the foundations of the prison were shaken: and immediately all the doors were opened, and every one’s bands were loosed."]],"Acts 16:6 to 10":[[16,6,"Now when they had gone throughout Phrygia and the region of Galatia, and were forbidden of the Holy Ghost to preach the word in Asia,"],[16,7,"After they were come to Mysia, they assayed to go into Bithynia: but the Spirit suffered them not."],[16,8,"And they passing by Mysia came down to Troas."],[16,9,"And a vision appeared to Paul in the night; There stood a man of Macedonia, and prayed him, saying, Come over into Macedonia, and help us."],[16,10,"And after he had seen the vision, immediately we endeavoured to go into Macedonia, assuredly gathering that the Lord had called us for to preach the gospel unto them."]],"Acts 19:1 to 6":[[19,1,"And it came to pass, that, while Apollos was at Corinth, Paul having passed through the upper coasts came to Ephesus: and finding certain disciples,"],[19,2,"He said unto them, Have ye received the Holy Ghost since ye believed? And they said unto him, We have not so much as heard whether there be any Holy Ghost."],[19,3,"And he said unto them, Unto what then were ye baptized? And they said, Unto John’s baptism."],[19,4,"Then said Paul, John verily baptized with the baptism of repentance, saying unto the people, that they should believe on him which should come after him, that is, on Christ Jesus."],[19,5,"When they heard this, they were baptized in the name of the Lord Jesus."],[19,6,"And when Paul had laid his hands upon them, the Holy Ghost came on them; and they spake with tongues, and prophesied."]],"Acts 19:18 to 20":[[19,18,"And many that believed came, and confessed, and shewed their deeds."],[19,19,"Many of them also which used curious arts brought their books together, and burned them before all men: and they counted the price of them, and found it fifty thousand pieces of silver."],[19,20,"So mightily grew the word of God and prevailed."]],"Acts 19:19":[[19,19,"Many of them also which used curious arts brought their books together, and burned them before all men: and they counted the price of them, and found it fifty thousand pieces of silver."]],"Acts 19:20 to 23":[[19,20,"So mightily grew the word of God and prevailed."],[19,21,"After these things were ended, Paul purposed in the spirit, when he had passed through Macedonia and Achaia, to go to Jerusalem, saying, After I have been there, I must also see Rome."],[19,22,"So he sent into Macedonia two of them that ministered unto him, Timotheus and Erastus; but he himself stayed in Asia for a season."],[19,23,"And the same time there arose no small stir about that way."]],"Acts 1:8":[[1,8,"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judæa, and in Samaria, and unto the uttermost part of the earth."]],"Acts 22:3":[[22,3,"I am verily a man which am a Jew, born in Tarsus, a city in Cilicia, yet brought up in this city at the feet of Gamaliel, and taught according to the perfect manner of the law of the fathers, and was zealous toward God, as ye all are this day."]],"Acts 26:18":[[26,18,"To open their eyes, and to turn them from darkness to light, and from the power of Satan unto God, that they may receive forgiveness of sins, and inheritance among them which are sanctified by faith that is in me."]],"Acts 2:1 to 4":[[2,1,"And when the day of Pentecost was fully come, they were all with one accord in one place."],[2,2,"And suddenly there came a sound from heaven as of a rushing mighty wind, and it filled all the house where they were sitting."],[2,3,"And there appeared unto them cloven tongues like as of fire, and it sat upon each of them."],[2,4,"And they were all filled with the Holy Ghost, and began to speak with other tongues, as the Spirit gave them utterance."]],"Acts 2:17":[[2,17,"And it shall come to pass in the last days, saith God, I will pour out of my Spirit upon all flesh: and your sons and your daughters shall prophesy, and your young men shall see visions, and your old men shall dream dreams:"]],"Acts 2:2":[[2,2,"And suddenly there came a sound from heaven as of a rushing mighty wind, and it filled all the house where they were sitting."]],"Acts 2:39":[[2,39,"For the promise is unto you, and to your children, and to all that are afar off, even as many as the Lord our God shall call."]],"Acts 2:4":[[2,4,"And they were all filled with the Holy Ghost, and began to speak with other tongues, as the Spirit gave them utterance."]],"Acts 3:19":[[3,19,"Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;"]],"Acts 4:13":[[4,13,"Now when they saw the boldness of Peter and John, and perceived that they were unlearned and ignorant men, they marvelled; and they took knowledge of them, that they had been with Jesus."]],"Acts 4:29 to 31":[[4,29,"And now, Lord, behold their threatenings: and grant unto thy servants, that with all boldness they may speak thy word,"],[4,30,"By stretching forth thine hand to heal; and that signs and wonders may be done by the name of thy holy child Jesus."],[4,31,"And when they had prayed, the place was shaken where they were assembled together; and they were all filled with the Holy Ghost, and they spake the word of God with boldness."]],"Acts 8:9 to 24":[[8,9,"But there was a certain man, called Simon, which beforetime in the same city used sorcery, and bewitched the people of Samaria, giving out that himself was some great one:"],[8,10,"To whom they all gave heed, from the least to the greatest, saying, This man is the great power of God."],[8,11,"And to him they had regard, because that of long time he had bewitched them with sorceries."],[8,12,"But when they believed Philip preaching the things concerning the kingdom of God, and the name of Jesus Christ, they were baptized, both men and women."],[8,13,"Then Simon himself believed also: and when he was baptized, he continued with Philip, and wondered, beholding the miracles and signs which were done."],[8,14,"Now when the apostles which were at Jerusalem heard that Samaria had received the word of God, they sent unto them Peter and John:"],[8,15,"Who, when they were come down, prayed for them, that they might receive the Holy Ghost:"],[8,16,"(For as yet he was fallen upon none of them: only they were baptized in the name of the Lord Jesus.)"],[8,17,"Then laid they their hands on them, and they received the Holy Ghost."],[8,18,"And when Simon saw that through laying on of the apostles’ hands the Holy Ghost was given, he offered them money,"],[8,19,"Saying, Give me also this power, that on whomsoever I lay hands, he may receive the Holy Ghost."],[8,20,"But Peter said unto him, Thy money perish with thee, because thou hast thought that the gift of God may be purchased with money."],[8,21,"Thou hast neither part nor lot in this matter: for thy heart is not right in the sight of God."],[8,22,"Repent therefore of this thy wickedness, and pray God, if perhaps the thought of thine heart may be forgiven thee."],[8,23,"For I perceive that thou art in the gall of bitterness, and in the bond of iniquity."],[8,24,"Then answered Simon, and said, Pray ye to the Lord for me, that none of these things which ye have spoken come upon me."]],"Amos 3:3":[[3,3,"Can two walk together, except they be agreed?"]],"Colossians 1:13 to 14":[[1,13,"Who hath delivered us from the power of darkness, and hath translated us into the kingdom of his dear Son:"],[1,14,"In whom we have redemption through his blood, even the forgiveness of sins:"]],"Colossians 2:13 to 15":[[2,13,"And you, being dead in your sins and the uncircumcision of your flesh, hath he quickened together with him, having forgiven you all trespasses;"],[2,14,"Blotting out the handwriting of ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his cross;"],[2,15,"And having spoiled principalities and powers, he made a shew of them openly, triumphing over them in it."]],"Colossians 2:14":[[2,14,"Blotting out the handwriting of ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his cross;"]],"Colossians 2:14 to 15":[[2,14,"Blotting out the handwriting of ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his cross;"],[2,15,"And having spoiled principalities and powers, he made a shew of them openly, triumphing over them in it."]],"Colossians 3:13":[[3,13,"Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye."]],"Colossians 3:16":[[3,16,"Let the word of Christ dwell in you richly in all wisdom; teaching and admonishing one another in psalms and hymns and spiritual songs, singing with grace in your hearts to the Lord."]],"Colossians 3:18 to 19":[[3,18,"Wives, submit yourselves unto your own husbands, as it is fit in the Lord."],[3,19,"Husbands, love your wives, and be not bitter against them."]],"Colossians 4:3":[[4,3,"Withal praying also for us, that God would open unto us a door of utterance, to speak the mystery of Christ, for which I am also in bonds:"]],"Daniel 10:12 to 13":[[10,12,"Then said he unto me, Fear not, Daniel: for from the first day that thou didst set thine heart to understand, and to chasten thyself before thy God, thy words were heard, and I am come for thy words."],[10,13,"But the prince of the kingdom of Persia withstood me one and twenty days: but, lo, Michael, one of the chief princes, came to help me; and I remained there with the kings of Persia."]],"Daniel 2:19":[[2,19,"Then was the secret revealed unto Daniel in a night vision. Then Daniel blessed the God of heaven."]],"Daniel 2:22":[[2,22,"He revealeth the deep and secret things: he knoweth what is in the darkness, and the light dwelleth with him."]],"Daniel 3:24 to 27":[[3,24,"Then Nebuchadnezzar the king was astonied, and rose up in haste, and spake, and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king."],[3,25,"He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God."],[3,26,"Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, and spake, and said, Shadrach, Meshach, and Abed-nego, ye servants of the most high God, come forth, and come hither. Then Shadrach, Meshach, and Abed-nego, came forth of the midst of the fire."],[3,27,"And the princes, governors, and captains, and the king’s counsellors, being gathered together, saw these men, upon whose bodies the fire had no power, nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed on them."]],"Daniel 5:11 to 12":[[5,11,"There is a man in thy kingdom, in whom is the spirit of the holy gods; and in the days of thy father light and understanding and wisdom, like the wisdom of the gods, was found in him; whom the king Nebuchadnezzar thy father, the king, I say, thy father, made master of the magicians, astrologers, Chaldeans, and soothsayers;"],[5,12,"Forasmuch as an excellent spirit, and knowledge, and understanding, interpreting of dreams, and shewing of hard sentences, and dissolving of doubts, were found in the same Daniel, whom the king named Belteshazzar: now let Daniel be called, and he will shew the interpretation."]],"Daniel 6:10":[[6,10,"Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime."]],"Daniel 6:3":[[6,3,"Then this Daniel was preferred above the presidents and princes, because an excellent spirit was in him; and the king thought to set him over the whole realm."]],"Daniel 7:1":[[7,1,"In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed: then he wrote the dream, and told the sum of the matters."]],"Daniel 7:9 to 10, 22":[[7,9,"I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment was white as snow, and the hair of his head like the pure wool: his throne was like the fiery flame, and his wheels as burning fire."],[7,10,"A fiery stream issued and came forth from before him: thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened."],[7,22,"Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom."]],"Daniel 9:4 to 11":[[9,4,"And I prayed unto the LORD my God, and made my confession, and said, O Lord, the great and dreadful God, keeping the covenant and mercy to them that love him, and to them that keep his commandments;"],[9,5,"We have sinned, and have committed iniquity, and have done wickedly, and have rebelled, even by departing from thy precepts and from thy judgments:"],[9,6,"Neither have we hearkened unto thy servants the prophets, which spake in thy name to our kings, our princes, and our fathers, and to all the people of the land."],[9,7,"O Lord, righteousness belongeth unto thee, but unto us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, that are near, and that are far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee."],[9,8,"O Lord, to us belongeth confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee."],[9,9,"To the Lord our God belong mercies and forgivenesses, though we have rebelled against him;"],[9,10,"Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets."],[9,11,"Yea, all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that is written in the law of Moses the servant of God, because we have sinned against him."]],"Daniel 9:5 to 8":[[9,5,"We have sinned, and have committed iniquity, and have done wickedly, and have rebelled, even by departing from thy precepts and from thy judgments:"],[9,6,"Neither have we hearkened unto thy servants the prophets, which spake in thy name to our kings, our princes, and our fathers, and to all the people of the land."],[9,7,"O Lord, righteousness belongeth unto thee, but unto us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, that are near, and that are far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee."],[9,8,"O Lord, to us belongeth confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee."]],"Deuteronomy 11:24":[[11,24,"Every place whereon the soles of your feet shall tread shall be yours: from the wilderness and Lebanon, from the river, the river Euphrates, even unto the uttermost sea shall your coast be."]],"Deuteronomy 12:2 to 3":[[12,2,"Ye shall utterly destroy all the places, wherein the nations which ye shall possess served their gods, upon the high mountains, and upon the hills, and under every green tree:"],[12,3,"And ye shall overthrow their altars, and break their pillars, and burn their groves with fire; and ye shall hew down the graven images of their gods, and destroy the names of them out of that place."]],"Deuteronomy 12:20":[[12,20,"When the LORD thy God shall enlarge thy border, as he hath promised thee, and thou shalt say, I will eat flesh, because thy soul longeth to eat flesh; thou mayest eat flesh, whatsoever thy soul lusteth after."]],"Deuteronomy 18:10 to 12":[[18,10,"There shall not be found among you any one that maketh his son or his daughter to pass through the fire, or that useth divination, or an observer of times, or an enchanter, or a witch,"],[18,11,"Or a charmer, or a consulter with familiar spirits, or a wizard, or a necromancer."],[18,12,"For all that do these things are an abomination unto the LORD: and because of these abominations the LORD thy God doth drive them out from before thee."]],"Deuteronomy 1:6 to 8":[[1,6,"The LORD our God spake unto us in Horeb, saying, Ye have dwelt long enough in this mount:"],[1,7,"Turn you, and take your journey, and go to the mount of the Amorites, and unto all the places nigh thereunto, in the plain, in the hills, and in the vale, and in the south, and by the sea side, to the land of the Canaanites, and unto Lebanon, unto the great river, the river Euphrates."],[1,8,"Behold, I have set the land before you: go in and possess the land which the LORD sware unto your fathers, Abraham, Isaac, and Jacob, to give unto them and to their seed after them."]],"Deuteronomy 26:16 to 19":[[26,16,"This day the LORD thy God hath commanded thee to do these statutes and judgments: thou shalt therefore keep and do them with all thine heart, and with all thy soul."],[26,17,"Thou hast avouched the LORD this day to be thy God, and to walk in his ways, and to keep his statutes, and his commandments, and his judgments, and to hearken unto his voice:"],[26,18,"And the LORD hath avouched thee this day to be his peculiar people, as he hath promised thee, and that thou shouldest keep all his commandments;"],[26,19,"And to make thee high above all nations which he hath made, in praise, and in name, and in honour; and that thou mayest be an holy people unto the LORD thy God, as he hath spoken."]],"Deuteronomy 28:1 to 13":[[28,1,"And it shall come to pass, if thou shalt hearken diligently unto the voice of the LORD thy God, to observe and to do all his commandments which I command thee this day, that the LORD thy God will set thee on high above all nations of the earth:"],[28,2,"And all these blessings shall come on thee, and overtake thee, if thou shalt hearken unto the voice of the LORD thy God."],[28,3,"Blessed shalt thou be in the city, and blessed shalt thou be in the field."],[28,4,"Blessed shall be the fruit of thy body, and the fruit of thy ground, and the fruit of thy cattle, the increase of thy kine, and the flocks of thy sheep."],[28,5,"Blessed shall be thy basket and thy store."],[28,6,"Blessed shalt thou be when thou comest in, and blessed shalt thou be when thou goest out."],[28,7,"The LORD shall cause thine enemies that rise up against thee to be smitten before thy face: they shall come out against thee one way, and flee before thee seven ways."],[28,8,"The LORD shall command the blessing upon thee in thy storehouses, and in all that thou settest thine hand unto; and he shall bless thee in the land which the LORD thy God giveth thee."],[28,9,"The LORD shall establish thee an holy people unto himself, as he hath sworn unto thee, if thou shalt keep the commandments of the LORD thy God, and walk in his ways."],[28,10,"And all people of the earth shall see that thou art called by the name of the LORD; and they shall be afraid of thee."],[28,11,"And the LORD shall make thee plenteous in goods, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy ground, in the land which the LORD sware unto thy fathers to give thee."],[28,12,"The LORD shall open unto thee his good treasure, the heaven to give the rain unto thy land in his season, and to bless all the work of thine hand: and thou shalt lend unto many nations, and thou shalt not borrow."],[28,13,"And the LORD shall make thee the head, and not the tail; and thou shalt be above only, and thou shalt not be beneath; if that thou hearken unto the commandments of the LORD thy God, which I command thee this day, to observe and to do them:"]],"Deuteronomy 28:15 to 24, 38 to 44":[[28,15,"But it shall come to pass, if thou wilt not hearken unto the voice of the LORD thy God, to observe to do all his commandments and his statutes which I command thee this day; that all these curses shall come upon thee, and overtake thee:"],[28,16,"Cursed shalt thou be in the city, and cursed shalt thou be in the field."],[28,17,"Cursed shall be thy basket and thy store."],[28,18,"Cursed shall be the fruit of thy body, and the fruit of thy land, the increase of thy kine, and the flocks of thy sheep."],[28,19,"Cursed shalt thou be when thou comest in, and cursed shalt thou be when thou goest out."],[28,20,"The LORD shall send upon thee cursing, vexation, and rebuke, in all that thou settest thine hand unto for to do, until thou be destroyed, and until thou perish quickly; because of the wickedness of thy doings, whereby thou hast forsaken me."],[28,21,"The LORD shall make the pestilence cleave unto thee, until he have consumed thee from off the land, whither thou goest to possess it."],[28,22,"The LORD shall smite thee with a consumption, and with a fever, and with an inflammation, and with an extreme burning, and with the sword, and with blasting, and with mildew; and they shall pursue thee until thou perish."],[28,23,"And thy heaven that is over thy head shall be brass, and the earth that is under thee shall be iron."],[28,24,"The LORD shall make the rain of thy land powder and dust: from heaven shall it come down upon thee, until thou be destroyed."],[28,38,"Thou shalt carry much seed out into the field, and shalt gather but little in; for the locust shall consume it."],[28,39,"Thou shalt plant vineyards, and dress them, but shalt neither drink of the wine, nor gather the grapes; for the worms shall eat them."],[28,40,"Thou shalt have olive trees throughout all thy coasts, but thou shalt not anoint thyself with the oil; for thine olive shall cast his fruit."],[28,41,"Thou shalt beget sons and daughters, but thou shalt not enjoy them; for they shall go into captivity."],[28,42,"All thy trees and fruit of thy land shall the locust consume."],[28,43,"The stranger that is within thee shall get up above thee very high; and thou shalt come down very low."],[28,44,"He shall lend to thee, and thou shalt not lend to him: he shall be the head, and thou shalt be the tail."]],"Deuteronomy 28:4":[[28,4,"Blessed shall be the fruit of thy body, and the fruit of thy ground, and the fruit of thy cattle, the increase of thy kine, and the flocks of thy sheep."]],"Deuteronomy 2:1 to 3":[[2,1,"Then we turned, and took our journey into the wilderness by the way of the Red sea, as the LORD spake unto me: and we compassed mount Seir many days."],[2,2,"And the LORD spake unto me, saying,"],[2,3,"Ye have compassed this mountain long enough: turn you northward."]],"Deuteronomy 6:10 to 11":[[6,10,"And it shall be, when the LORD thy God shall have brought thee into the land which he sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give thee great and goodly cities, which thou buildedst not,"],[6,11,"And houses full of all good things, which thou filledst not, and wells digged, which thou diggedst not, vineyards and olive trees, which thou plantedst not; when thou shalt have eaten and be full;"]],"Deuteronomy 6:10 to 12":[[6,10,"And it shall be, when the LORD thy God shall have brought thee into the land which he sware unto thy fathers, to Abraham, to Isaac, and to Jacob, to give thee great and goodly cities, which thou buildedst not,"],[6,11,"And houses full of all good things, which thou filledst not, and wells digged, which thou diggedst not, vineyards and olive trees, which thou plantedst not; when thou shalt have eaten and be full;"],[6,12,"Then beware lest thou forget the LORD, which brought thee forth out of the land of Egypt, from the house of bondage."]],"Deuteronomy 6:6 to 9":[[6,6,"And these words, which I command thee this day, shall be in thine heart:"],[6,7,"And thou shalt teach them diligently unto thy children, and shalt talk of them when thou sittest in thine house, and when thou walkest by the way, and when thou liest down, and when thou risest up."],[6,8,"And thou shalt bind them for a sign upon thine hand, and they shall be as frontlets between thine eyes."],[6,9,"And thou shalt write them upon the posts of thy house, and on thy gates."]],"Deuteronomy 7:13 to 14":[[7,13,"And he will love thee, and bless thee, and multiply thee: he will also bless the fruit of thy womb, and the fruit of thy land, thy corn, and thy wine, and thine oil, the increase of thy kine, and the flocks of thy sheep, in the land which he sware unto thy fathers to give thee."],[7,14,"Thou shalt be blessed above all people: there shall not be male or female barren among you, or among your cattle."]],"Deuteronomy 7:26":[[7,26,"Neither shalt thou bring an abomination into thine house, lest thou be a cursed thing like it: but thou shalt utterly detest it, and thou shalt utterly abhor it; for it is a cursed thing."]],"Deuteronomy 7:9 to 10":[[7,9,"Know therefore that the LORD thy God, he is God, the faithful God, which keepeth covenant and mercy with them that love him and keep his commandments to a thousand generations;"],[7,10,"And repayeth them that hate him to their face, to destroy them: he will not be slack to him that hateth him, he will repay him to his face."]],"Deuteronomy 8:11 to 18":[[8,11,"Beware that thou forget not the LORD thy God, in not keeping his commandments, and his judgments, and his statutes, which I command thee this day:"],[8,12,"Lest when thou hast eaten and art full, and hast built goodly houses, and dwelt therein;"],[8,13,"And when thy herds and thy flocks multiply, and thy silver and thy gold is multiplied, and all that thou hast is multiplied;"],[8,14,"Then thine heart be lifted up, and thou forget the LORD thy God, which brought thee forth out of the land of Egypt, from the house of bondage;"],[8,15,"Who led thee through that great and terrible wilderness, wherein were fiery serpents, and scorpions, and drought, where there was no water; who brought thee forth water out of the rock of flint;"],[8,16,"Who fed thee in the wilderness with manna, which thy fathers knew not, that he might humble thee, and that he might prove thee, to do thee good at thy latter end;"],[8,17,"And thou say in thine heart, My power and the might of mine hand hath gotten me this wealth."],[8,18,"But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant which he sware unto thy fathers, as it is this day."]],"Deuteronomy 8:17 to 18":[[8,17,"And thou say in thine heart, My power and the might of mine hand hath gotten me this wealth."],[8,18,"But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant which he sware unto thy fathers, as it is this day."]],"Ecclesiastes 10:20":[[10,20,"Curse not the king, no not in thy thought; and curse not the rich in thy bedchamber: for a bird of the air shall carry the voice, and that which hath wings shall tell the matter."]],"Ecclesiastes 10:8":[[10,8,"He that diggeth a pit shall fall into it; and whoso breaketh an hedge, a serpent shall bite him."]],"Ecclesiastes 11:4 to 6":[[11,4,"He that observeth the wind shall not sow; and he that regardeth the clouds shall not reap."],[11,5,"As thou knowest not what is the way of the spirit, nor how the bones do grow in the womb of her that is with child: even so thou knowest not the works of God who maketh all."],[11,6,"In the morning sow thy seed, and in the evening withhold not thine hand: for thou knowest not whether shall prosper, either this or that, or whether they both shall be alike good."]],"Ecclesiastes 11:5":[[11,5,"As thou knowest not what is the way of the spirit, nor how the bones do grow in the womb of her that is with child: even so thou knowest not the works of God who maketh all."]],"Ecclesiastes 12:14":[[12,14,"For God shall bring every work into judgment, with every secret thing, whether it be good, or whether it be evil."]],"Ecclesiastes 3:11":[[3,11,"He hath made every thing beautiful in his time: also he hath set the world in their heart, so that no man can find out the work that God maketh from the beginning to the end."]],"Ecclesiastes 4:12":[[4,12,"And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken."]],"Ecclesiastes 4:9 to 12":[[4,9,"Two are better than one; because they have a good reward for their labour."],[4,10,"For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up."],[4,11,"Again, if two lie together, then they have heat: but how can one be warm alone?"],[4,12,"And if one prevail against him, two shall withstand him; and a threefold cord is not quickly broken."]],"Ecclesiastes 5:19":[[5,19,"Every man also to whom God hath given riches and wealth, and hath given him power to eat thereof, and to take his portion, and to rejoice in his labour; this is the gift of God."]],"Ecclesiastes 5:3":[[5,3,"For a dream cometh through the multitude of business; and a fool’s voice is known by multitude of words."]],"Ecclesiastes 5:4 to 5":[[5,4,"When thou vowest a vow unto God, defer not to pay it; for he hath no pleasure in fools: pay that which thou hast vowed."],[5,5,"Better is it that thou shouldest not vow, than that thou shouldest vow and not pay."]],"Ecclesiastes 5:4 to 6":[[5,4,"When thou vowest a vow unto God, defer not to pay it; for he hath no pleasure in fools: pay that which thou hast vowed."],[5,5,"Better is it that thou shouldest not vow, than that thou shouldest vow and not pay."],[5,6,"Suffer not thy mouth to cause thy flesh to sin; neither say thou before the angel, that it was an error: wherefore should God be angry at thy voice, and destroy the work of thine hands?"]],"Ecclesiastes 5:6":[[5,6,"Suffer not thy mouth to cause thy flesh to sin; neither say thou before the angel, that it was an error: wherefore should God be angry at thy voice, and destroy the work of thine hands?"]],"Ephesians 1:17 to 18":[[1,17,"That the God of our Lord Jesus Christ, the Father of glory, may give unto you the spirit of wisdom and revelation in the knowledge of him:"],[1,18,"The eyes of your understanding being enlightened; that ye may know what is the hope of his calling, and what the riches of the glory of his inheritance in the saints,"]],"Ephesians 1:18":[[1,18,"The eyes of your understanding being enlightened; that ye may know what is the hope of his calling, and what the riches of the glory of his inheritance in the saints,"]],"Ephesians 1:20 to 22":[[1,20,"Which he wrought in Christ, when he raised him from the dead, and set him at his own right hand in the heavenly places,"],[1,21,"Far above all principality, and power, and might, and dominion, and every name that is named, not only in this world, but also in that which is to come:"],[1,22,"And hath put all things under his feet, and gave him to be the head over all things to the church,"]],"Ephesians 1:7":[[1,7,"In whom we have redemption through his blood, the forgiveness of sins, according to the riches of his grace;"]],"Ephesians 2:6":[[2,6,"And hath raised us up together, and made us sit together in heavenly places in Christ Jesus:"]],"Ephesians 3:20":[[3,20,"Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us,"]],"Ephesians 4:26 to 27":[[4,26,"Be ye angry, and sin not: let not the sun go down upon your wrath:"],[4,27,"Neither give place to the devil."]],"Ephesians 4:26 to 32":[[4,26,"Be ye angry, and sin not: let not the sun go down upon your wrath:"],[4,27,"Neither give place to the devil."],[4,28,"Let him that stole steal no more: but rather let him labour, working with his hands the thing which is good, that he may have to give to him that needeth."],[4,29,"Let no corrupt communication proceed out of your mouth, but that which is good to the use of edifying, that it may minister grace unto the hearers."],[4,30,"And grieve not the holy Spirit of God, whereby ye are sealed unto the day of redemption."],[4,31,"Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice:"],[4,32,"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you."]],"Ephesians 4:30":[[4,30,"And grieve not the holy Spirit of God, whereby ye are sealed unto the day of redemption."]],"Ephesians 4:31 to 32":[[4,31,"Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice:"],[4,32,"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you."]],"Ephesians 5:11 to 13":[[5,11,"And have no fellowship with the unfruitful works of darkness, but rather reprove them."],[5,12,"For it is a shame even to speak of those things which are done of them in secret."],[5,13,"But all things that are reproved are made manifest by the light: for whatsoever doth make manifest is light."]],"Ephesians 5:22 to 33":[[5,22,"Wives, submit yourselves unto your own husbands, as unto the Lord."],[5,23,"For the husband is the head of the wife, even as Christ is the head of the church: and he is the saviour of the body."],[5,24,"Therefore as the church is subject unto Christ, so let the wives be to their own husbands in every thing."],[5,25,"Husbands, love your wives, even as Christ also loved the church, and gave himself for it;"],[5,26,"That he might sanctify and cleanse it with the washing of water by the word,"],[5,27,"That he might present it to himself a glorious church, not having spot, or wrinkle, or any such thing; but that it should be holy and without blemish."],[5,28,"So ought men to love their wives as their own bodies. He that loveth his wife loveth himself."],[5,29,"For no man ever yet hated his own flesh; but nourisheth and cherisheth it, even as the Lord the church:"],[5,30,"For we are members of his body, of his flesh, and of his bones."],[5,31,"For this cause shall a man leave his father and mother, and shall be joined unto his wife, and they two shall be one flesh."],[5,32,"This is a great mystery: but I speak concerning Christ and the church."],[5,33,"Nevertheless let every one of you in particular so love his wife even as himself; and the wife see that she reverence her husband."]],"Ephesians 5:26":[[5,26,"That he might sanctify and cleanse it with the washing of water by the word,"]],"Ephesians 5:31 to 32":[[5,31,"For this cause shall a man leave his father and mother, and shall be joined unto his wife, and they two shall be one flesh."],[5,32,"This is a great mystery: but I speak concerning Christ and the church."]],"Ephesians 6:18":[[6,18,"Praying always with all prayer and supplication in the Spirit, and watching thereunto with all perseverance and supplication for all saints;"]],"Esther 3:1 to 6":[[3,1,"After these things did king Ahasuerus promote Haman the son of Hammedatha the Agagite, and advanced him, and set his seat above all the princes that were with him."],[3,2,"And all the king’s servants, that were in the king’s gate, bowed, and reverenced Haman: for the king had so commanded concerning him. But Mordecai bowed not, nor did him reverence."],[3,3,"Then the king’s servants, which were in the king’s gate, said unto Mordecai, Why transgressest thou the king’s commandment?"],[3,4,"Now it came to pass, when they spake daily unto him, and he hearkened not unto them, that they told Haman, to see whether Mordecai’s matters would stand: for he had told them that he was a Jew."],[3,5,"And when Haman saw that Mordecai bowed not, nor did him reverence, then was Haman full of wrath."],[3,6,"And he thought scorn to lay hands on Mordecai alone; for they had shewed him the people of Mordecai: wherefore Haman sought to destroy all the Jews that were throughout the whole kingdom of Ahasuerus, even the people of Mordecai."]],"Esther 6:6 to 11":[[6,6,"So Haman came in. And the king said unto him, What shall be done unto the man whom the king delighteth to honour? Now Haman thought in his heart, To whom would the king delight to do honour more than to myself?"],[6,7,"And Haman answered the king, For the man whom the king delighteth to honour,"],[6,8,"Let the royal apparel be brought which the king useth to wear, and the horse that the king rideth upon, and the crown royal which is set upon his head:"],[6,9,"And let this apparel and horse be delivered to the hand of one of the king’s most noble princes, that they may array the man withal whom the king delighteth to honour, and bring him on horseback through the street of the city, and proclaim before him, Thus shall it be done to the man whom the king delighteth to honour."],[6,10,"Then the king said to Haman, Make haste, and take the apparel and the horse, as thou hast said, and do even so to Mordecai the Jew, that sitteth at the king’s gate: let nothing fail of all that thou hast spoken."],[6,11,"Then took Haman the apparel and the horse, and arrayed Mordecai, and brought him on horseback through the street of the city, and proclaimed before him, Thus shall it be done unto the man whom the king delighteth to honour."]],"Esther 9:20 to 28":[[9,20,"And Mordecai wrote these things, and sent letters unto all the Jews that were in all the provinces of the king Ahasuerus, both nigh and far,"],[9,21,"To stablish this among them, that they should keep the fourteenth day of the month Adar, and the fifteenth day of the same, yearly,"],[9,22,"As the days wherein the Jews rested from their enemies, and the month which was turned unto them from sorrow to joy, and from mourning into a good day: that they should make them days of feasting and joy, and of sending portions one to another, and gifts to the poor."],[9,23,"And the Jews undertook to do as they had begun, and as Mordecai had written unto them;"],[9,24,"Because Haman the son of Hammedatha, the Agagite, the enemy of all the Jews, had devised against the Jews to destroy them, and had cast Pur, that is, the lot, to consume them, and to destroy them;"],[9,25,"But when Esther came before the king, he commanded by letters that his wicked device, which he devised against the Jews, should return upon his own head, and that he and his sons should be hanged on the gallows."],[9,26,"Wherefore they called these days Purim after the name of Pur. Therefore for all the words of this letter, and of that which they had seen concerning this matter, and which had come unto them,"],[9,27,"The Jews ordained, and took upon them, and upon their seed, and upon all such as joined themselves unto them, so as it should not fail, that they would keep these two days according to their writing, and according to their appointed time every year;"],[9,28,"And that these days should be remembered and kept throughout every generation, every family, every province, and every city; and that these days of Purim should not fail from among the Jews, nor the memorial of them perish from their seed."]],"Exodus 12:1 to 13":[[12,1,"And the LORD spake unto Moses and Aaron in the land of Egypt, saying,"],[12,2,"This month shall be unto you the beginning of months: it shall be the first month of the year to you."],[12,3,"Speak ye unto all the congregation of Israel, saying, In the tenth day of this month they shall take to them every man a lamb, according to the house of their fathers, a lamb for an house:"],[12,4,"And if the household be too little for the lamb, let him and his neighbour next unto his house take it according to the number of the souls; every man according to his eating shall make your count for the lamb."],[12,5,"Your lamb shall be without blemish, a male of the first year: ye shall take it out from the sheep, or from the goats:"],[12,6,"And ye shall keep it up until the fourteenth day of the same month: and the whole assembly of the congregation of Israel shall kill it in the evening."],[12,7,"And they shall take of the blood, and strike it on the two side posts and on the upper door post of the houses, wherein they shall eat it."],[12,8,"And they shall eat the flesh in that night, roast with fire, and unleavened bread; and with bitter herbs they shall eat it."],[12,9,"Eat not of it raw, nor sodden at all with water, but roast with fire; his head with his legs, and with the purtenance thereof."],[12,10,"And ye shall let nothing of it remain until the morning; and that which remaineth of it until the morning ye shall burn with fire."],[12,11,"And thus shall ye eat it; with your loins girded, your shoes on your feet, and your staff in your hand; and ye shall eat it in haste: it is the LORD’s passover."],[12,12,"For I will pass through the land of Egypt this night, and will smite all the firstborn in the land of Egypt, both man and beast; and against all the gods of Egypt I will execute judgment: I am the LORD."],[12,13,"And the blood shall be to you for a token upon the houses where ye are: and when I see the blood, I will pass over you, and the plague shall not be upon you to destroy you, when I smite the land of Egypt."]],"Exodus 12:13":[[12,13,"And the blood shall be to you for a token upon the houses where ye are: and when I see the blood, I will pass over you, and the plague shall not be upon you to destroy you, when I smite the land of Egypt."]],"Exodus 12:21 to 23":[[12,21,"Then Moses called for all the elders of Israel, and said unto them, Draw out and take you a lamb according to your families, and kill the passover."],[12,22,"And ye shall take a bunch of hyssop, and dip it in the blood that is in the bason, and strike the lintel and the two side posts with the blood that is in the bason; and none of you shall go out at the door of his house until the morning."],[12,23,"For the LORD will pass through to smite the Egyptians; and when he seeth the blood upon the lintel, and on the two side posts, the LORD will pass over the door, and will not suffer the destroyer to come in unto your houses to smite you."]],"Exodus 12:29":[[12,29,"And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne unto the firstborn of the captive that was in the dungeon; and all the firstborn of cattle."]],"Exodus 12:29 to 31":[[12,29,"And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne unto the firstborn of the captive that was in the dungeon; and all the firstborn of cattle."],[12,30,"And Pharaoh rose up in the night, he, and all his servants, and all the Egyptians; and there was a great cry in Egypt; for there was not a house where there was not one dead."],[12,31,"And he called for Moses and Aaron by night, and said, Rise up, and get you forth from among my people, both ye and the children of Israel; and go, serve the LORD, as ye have said."]],"Exodus 12:35 to 36":[[12,35,"And the children of Israel did according to the word of Moses; and they borrowed of the Egyptians jewels of silver, and jewels of gold, and raiment:"],[12,36,"And the LORD gave the people favour in the sight of the Egyptians, so that they lent unto them such things as they required. And they spoiled the Egyptians."]],"Exodus 14:9 to 14":[[14,9,"But the Egyptians pursued after them, all the horses and chariots of Pharaoh, and his horsemen, and his army, and overtook them encamping by the sea, beside Pi-hahiroth, before Baal-zephon."],[14,10,"And when Pharaoh drew nigh, the children of Israel lifted up their eyes, and, behold, the Egyptians marched after them; and they were sore afraid: and the children of Israel cried out unto the LORD."],[14,11,"And they said unto Moses, Because there were no graves in Egypt, hast thou taken us away to die in the wilderness? wherefore hast thou dealt thus with us, to carry us forth out of Egypt?"],[14,12,"Is not this the word that we did tell thee in Egypt, saying, Let us alone, that we may serve the Egyptians? For it had been better for us to serve the Egyptians, than that we should die in the wilderness."],[14,13,"And Moses said unto the people, Fear ye not, stand still, and see the salvation of the LORD, which he will shew to you to day: for the Egyptians whom ye have seen to day, ye shall see them again no more for ever."],[14,14,"The LORD shall fight for you, and ye shall hold your peace."]],"Exodus 16:2 to 3":[[16,2,"And the whole congregation of the children of Israel murmured against Moses and Aaron in the wilderness:"],[16,3,"And the children of Israel said unto them, Would to God we had died by the hand of the LORD in the land of Egypt, when we sat by the flesh pots, and when we did eat bread to the full; for ye have brought us forth into this wilderness, to kill this whole assembly with hunger."]],"Exodus 17:15":[[17,15,"And Moses built an altar, and called the name of it Jehovah-nissi: my banner"]],"Exodus 17:8 to 13":[[17,8,"Then came Amalek, and fought with Israel in Rephidim."],[17,9,"And Moses said unto Joshua, Choose us out men, and go out, fight with Amalek: to morrow I will stand on the top of the hill with the rod of God in mine hand."],[17,10,"So Joshua did as Moses had said to him, and fought with Amalek: and Moses, Aaron, and Hur went up to the top of the hill."],[17,11,"And it came to pass, when Moses held up his hand, that Israel prevailed: and when he let down his hand, Amalek prevailed."],[17,12,"But Moses’ hands were heavy; and they took a stone, and put it under him, and he sat thereon; and Aaron and Hur stayed up his hands, the one on the one side, and the other on the other side; and his hands were steady until the going down of the sun."],[17,13,"And Joshua discomfited Amalek and his people with the edge of the sword."]],"Exodus 1:19":[[1,19,"And the midwives said unto Pharaoh, Because the Hebrew women are not as the Egyptian women; for they are lively, and are delivered ere the midwives come in unto them."]],"Exodus 1:8 to 22":[[1,8,"Now there arose up a new king over Egypt, which knew not Joseph."],[1,9,"And he said unto his people, Behold, the people of the children of Israel are more and mightier than we:"],[1,10,"Come on, let us deal wisely with them; lest they multiply, and it come to pass, that, when there falleth out any war, they join also unto our enemies, and fight against us, and so get them up out of the land."],[1,11,"Therefore they did set over them taskmasters to afflict them with their burdens. And they built for Pharaoh treasure cities, Pithom and Raamses."],[1,12,"But the more they afflicted them, the more they multiplied and grew. And they were grieved because of the children of Israel."],[1,13,"And the Egyptians made the children of Israel to serve with rigour:"],[1,14,"And they made their lives bitter with hard bondage, in morter, and in brick, and in all manner of service in the field: all their service, wherein they made them serve, was with rigour."],[1,15,"And the king of Egypt spake to the Hebrew midwives, of which the name of the one was Shiphrah, and the name of the other Puah:"],[1,16,"And he said, When ye do the office of a midwife to the Hebrew women, and see them upon the stools; if it be a son, then ye shall kill him: but if it be a daughter, then she shall live."],[1,17,"But the midwives feared God, and did not as the king of Egypt commanded them, but saved the men children alive."],[1,18,"And the king of Egypt called for the midwives, and said unto them, Why have ye done this thing, and have saved the men children alive?"],[1,19,"And the midwives said unto Pharaoh, Because the Hebrew women are not as the Egyptian women; for they are lively, and are delivered ere the midwives come in unto them."],[1,20,"Therefore God dealt well with the midwives: and the people multiplied, and waxed very mighty."],[1,21,"And it came to pass, because the midwives feared God, that he made them houses."],[1,22,"And Pharaoh charged all his people, saying, Every son that is born ye shall cast into the river, and every daughter ye shall save alive."]],"Exodus 20:24":[[20,24,"An altar of earth thou shalt make unto me, and shalt sacrifice thereon thy burnt offerings, and thy peace offerings, thy sheep, and thine oxen: in all places where I record my name I will come unto thee, and I will bless thee."]],"Exodus 20:5":[[20,5,"Thou shalt not bow down thyself to them, nor serve them: for I the LORD thy God am a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth generation of them that hate me;"]],"Exodus 22:1 to 9":[[22,1,"If a man shall steal an ox, or a sheep, and kill it, or sell it; he shall restore five oxen for an ox, and four sheep for a sheep."],[22,2,"If a thief be found breaking up, and be smitten that he die, there shall no blood be shed for him."],[22,3,"If the sun be risen upon him, there shall be blood shed for him; for he should make full restitution; if he have nothing, then he shall be sold for his theft."],[22,4,"If the theft be certainly found in his hand alive, whether it be ox, or ass, or sheep; he shall restore double."],[22,5,"If a man shall cause a field or vineyard to be eaten, and shall put in his beast, and shall feed in another man’s field; of the best of his own field, and of the best of his own vineyard, shall he make restitution."],[22,6,"If fire break out, and catch in thorns, so that the stacks of corn, or the standing corn, or the field, be consumed therewith; he that kindled the fire shall surely make restitution."],[22,7,"If a man shall deliver unto his neighbour money or stuff to keep, and it be stolen out of the man’s house; if the thief be found, let him pay double."],[22,8,"If the thief be not found, then the master of the house shall be brought unto the judges, to see whether he have put his hand unto his neighbour’s goods."],[22,9,"For all manner of trespass, whether it be for ox, for ass, for sheep, for raiment, or for any manner of lost thing, which another challengeth to be his, the cause of both parties shall come before the judges; and whom the judges shall condemn, he shall pay double unto his neighbour."]],"Exodus 23:25 to 26":[[23,25,"And ye shall serve the LORD your God, and he shall bless thy bread, and thy water; and I will take sickness away from the midst of thee."],[23,26,"There shall nothing cast their young, nor be barren, in thy land: the number of thy days I will fulfil."]],"Exodus 30:22 to 33":[[30,22,"Moreover the LORD spake unto Moses, saying,"],[30,23,"Take thou also unto thee principal spices, of pure myrrh five hundred shekels, and of sweet cinnamon half so much, even two hundred and fifty shekels, and of sweet calamus two hundred and fifty shekels,"],[30,24,"And of cassia five hundred shekels, after the shekel of the sanctuary, and of oil olive an hin:"],[30,25,"And thou shalt make it an oil of holy ointment, an ointment compound after the art of the apothecary: it shall be an holy anointing oil."],[30,26,"And thou shalt anoint the tabernacle of the congregation therewith, and the ark of the testimony,"],[30,27,"And the table and all his vessels, and the candlestick and his vessels, and the altar of incense,"],[30,28,"And the altar of burnt offering with all his vessels, and the laver and his foot."],[30,29,"And thou shalt sanctify them, that they may be most holy: whatsoever toucheth them shall be holy."],[30,30,"And thou shalt anoint Aaron and his sons, and consecrate them, that they may minister unto me in the priest’s office."],[30,31,"And thou shalt speak unto the children of Israel, saying, This shall be an holy anointing oil unto me throughout your generations."],[30,32,"Upon man’s flesh shall it not be poured, neither shall ye make any other like it, after the composition of it: it is holy, and it shall be holy unto you."],[30,33,"Whosoever compoundeth any like it, or whosoever putteth any of it upon a stranger, shall even be cut off from his people."]],"Exodus 33:13 to 18":[[33,13,"Now therefore, I pray thee, if I have found grace in thy sight, shew me now thy way, that I may know thee, that I may find grace in thy sight: and consider that this nation is thy people."],[33,14,"And he said, My presence shall go with thee, and I will give thee rest."],[33,15,"And he said unto him, If thy presence go not with me, carry us not up hence."],[33,16,"For wherein shall it be known here that I and thy people have found grace in thy sight? is it not in that thou goest with us? so shall we be separated, I and thy people, from all the people that are upon the face of the earth."],[33,17,"And the LORD said unto Moses, I will do this thing also that thou hast spoken: for thou hast found grace in my sight, and I know thee by name."],[33,18,"And he said, I beseech thee, shew me thy glory."]],"Exodus 33:13 to 23":[[33,13,"Now therefore, I pray thee, if I have found grace in thy sight, shew me now thy way, that I may know thee, that I may find grace in thy sight: and consider that this nation is thy people."],[33,14,"And he said, My presence shall go with thee, and I will give thee rest."],[33,15,"And he said unto him, If thy presence go not with me, carry us not up hence."],[33,16,"For wherein shall it be known here that I and thy people have found grace in thy sight? is it not in that thou goest with us? so shall we be separated, I and thy people, from all the people that are upon the face of the earth."],[33,17,"And the LORD said unto Moses, I will do this thing also that thou hast spoken: for thou hast found grace in my sight, and I know thee by name."],[33,18,"And he said, I beseech thee, shew me thy glory."],[33,19,"And he said, I will make all my goodness pass before thee, and I will proclaim the name of the LORD before thee; and will be gracious to whom I will be gracious, and will shew mercy on whom I will shew mercy."],[33,20,"And he said, Thou canst not see my face: for there shall no man see me, and live."],[33,21,"And the LORD said, Behold, there is a place by me, and thou shalt stand upon a rock:"],[33,22,"And it shall come to pass, while my glory passeth by, that I will put thee in a clift of the rock, and will cover thee with my hand while I pass by:"],[33,23,"And I will take away mine hand, and thou shalt see my back parts: but my face shall not be seen."]],"Exodus 34:13":[[34,13,"But ye shall destroy their altars, break their images, and cut down their groves:"]],"Exodus 5:6 to 9":[[5,6,"And Pharaoh commanded the same day the taskmasters of the people, and their officers, saying,"],[5,7,"Ye shall no more give the people straw to make brick, as heretofore: let them go and gather straw for themselves."],[5,8,"And the tale of the bricks, which they did make heretofore, ye shall lay upon them; ye shall not diminish ought thereof: for they be idle; therefore they cry, saying, Let us go and sacrifice to our God."],[5,9,"Let there more work be laid upon the men, that they may labour therein; and let them not regard vain words."]],"Ezekiel 16:44":[[16,44,"Behold, every one that useth proverbs shall use this proverb against thee, saying, As is the mother, so is her daughter."]],"Ezekiel 18:2 to 3":[[18,2,"What mean ye, that ye use this proverb concerning the land of Israel, saying, The fathers have eaten sour grapes, and the children’s teeth are set on edge?"],[18,3,"As I live, saith the Lord GOD, ye shall not have occasion any more to use this proverb in Israel."]],"Ezekiel 22:30":[[22,30,"And I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none."]],"Ezekiel 34:11 to 16":[[34,11,"For thus saith the Lord GOD; Behold, I, even I, will both search my sheep, and seek them out."],[34,12,"As a shepherd seeketh out his flock in the day that he is among his sheep that are scattered; so will I seek out my sheep, and will deliver them out of all places where they have been scattered in the cloudy and dark day."],[34,13,"And I will bring them out from the people, and gather them from the countries, and will bring them to their own land, and feed them upon the mountains of Israel by the rivers, and in all the inhabited places of the country."],[34,14,"I will feed them in a good pasture, and upon the high mountains of Israel shall their fold be: there shall they lie in a good fold, and in a fat pasture shall they feed upon the mountains of Israel."],[34,15,"I will feed my flock, and I will cause them to lie down, saith the Lord GOD."],[34,16,"I will seek that which was lost, and bring again that which was driven away, and will bind up that which was broken, and will strengthen that which was sick: but I will destroy the fat and the strong; I will feed them with judgment."]],"Ezekiel 37:1 to 10":[[37,1,"The hand of the LORD was upon me, and carried me out in the spirit of the LORD, and set me down in the midst of the valley which was full of bones,"],[37,2,"And caused me to pass by them round about: and, behold, there were very many in the open valley; and, lo, they were very dry."],[37,3,"And he said unto me, Son of man, can these bones live? And I answered, O Lord GOD, thou knowest."],[37,4,"Again he said unto me, Prophesy upon these bones, and say unto them, O ye dry bones, hear the word of the LORD."],[37,5,"Thus saith the Lord GOD unto these bones; Behold, I will cause breath to enter into you, and ye shall live:"],[37,6,"And I will lay sinews upon you, and will bring up flesh upon you, and cover you with skin, and put breath in you, and ye shall live; and ye shall know that I am the LORD."],[37,7,"So I prophesied as I was commanded: and as I prophesied, there was a noise, and behold a shaking, and the bones came together, bone to his bone."],[37,8,"And when I beheld, lo, the sinews and the flesh came up upon them, and the skin covered them above: but there was no breath in them."],[37,9,"Then said he unto me, Prophesy unto the wind, prophesy, son of man, and say to the wind, Thus saith the Lord GOD; Come from the four winds, O breath, and breathe upon these slain, that they may live."],[37,10,"So I prophesied as he commanded me, and the breath came into them, and they lived, and stood up upon their feet, an exceeding great army."]],"Ezekiel 37:11 to 14":[[37,11,"Then he said unto me, Son of man, these bones are the whole house of Israel: behold, they say, Our bones are dried, and our hope is lost: we are cut off for our parts."],[37,12,"Therefore prophesy and say unto them, Thus saith the Lord GOD; Behold, O my people, I will open your graves, and cause you to come up out of your graves, and bring you into the land of Israel."],[37,13,"And ye shall know that I am the LORD, when I have opened your graves, O my people, and brought you up out of your graves,"],[37,14,"And shall put my spirit in you, and ye shall live, and I shall place you in your own land: then shall ye know that I the LORD have spoken it, and performed it, saith the LORD."]],"Ezekiel 37:9 to 10":[[37,9,"Then said he unto me, Prophesy unto the wind, prophesy, son of man, and say to the wind, Thus saith the Lord GOD; Come from the four winds, O breath, and breathe upon these slain, that they may live."],[37,10,"So I prophesied as he commanded me, and the breath came into them, and they lived, and stood up upon their feet, an exceeding great army."]],"Ezra 3:11 to 13":[[3,11,"And they sang together by course in praising and giving thanks unto the LORD; because he is good, for his mercy endureth for ever toward Israel. And all the people shouted with a great shout, when they praised the LORD, because the foundation of the house of the LORD was laid."],[3,12,"But many of the priests and Levites and chief of the fathers, who were ancient men, that had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice; and many shouted aloud for joy:"],[3,13,"So that the people could not discern the noise of the shout of joy from the noise of the weeping of the people: for the people shouted with a loud shout, and the noise was heard afar off."]],"Galatians 1:15 to 16":[[1,15,"But when it pleased God, who separated me from my mother’s womb, and called me by his grace,"],[1,16,"To reveal his Son in me, that I might preach him among the heathen; immediately I conferred not with flesh and blood:"]],"Galatians 3:13":[[3,13,"Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree:"]],"Galatians 3:13 to 14":[[3,13,"Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree:"],[3,14,"That the blessing of Abraham might come on the Gentiles through Jesus Christ; that we might receive the promise of the Spirit through faith."]],"Galatians 4:19":[[4,19,"My little children, of whom I travail in birth again until Christ be formed in you,"]],"Galatians 4:27":[[4,27,"For it is written, Rejoice, thou barren that bearest not; break forth and cry, thou that travailest not: for the desolate hath many more children than she which hath an husband."]],"Galatians 4:6 to 7":[[4,6,"And because ye are sons, God hath sent forth the Spirit of his Son into your hearts, crying, Abba, Father."],[4,7,"Wherefore thou art no more a servant, but a son; and if a son, then an heir of God through Christ."]],"Galatians 5:19 to 21":[[5,19,"Now the works of the flesh are manifest, which are these; Adultery, fornication, uncleanness, lasciviousness,"],[5,20,"Idolatry, witchcraft, hatred, variance, emulations, wrath, strife, seditions, heresies,"],[5,21,"Envyings, murders, drunkenness, revellings, and such like: of the which I tell you before, as I have also told you in time past, that they which do such things shall not inherit the kingdom of God."]],"Galatians 6:7 to 9":[[6,7,"Be not deceived; God is not mocked: for whatsoever a man soweth, that shall he also reap."],[6,8,"For he that soweth to his flesh shall of the flesh reap corruption; but he that soweth to the Spirit shall of the Spirit reap life everlasting."],[6,9,"And let us not be weary in well doing: for in due season we shall reap, if we faint not."]],"Galatians 6:9":[[6,9,"And let us not be weary in well doing: for in due season we shall reap, if we faint not."]],"Genesis 12:1":[[12,1,"Now the LORD had said unto Abram, Get thee out of thy country, and from thy kindred, and from thy father’s house, unto a land that I will shew thee:"]],"Genesis 12:11 to 13":[[12,11,"And it came to pass, when he was come near to enter into Egypt, that he said unto Sarai his wife, Behold now, I know that thou art a fair woman to look upon:"],[12,12,"Therefore it shall come to pass, when the Egyptians shall see thee, that they shall say, This is his wife: and they will kill me, but they will save thee alive."],[12,13,"Say, I pray thee, thou art my sister: that it may be well with me for thy sake; and my soul shall live because of thee."]],"Genesis 12:7 to 8":[[12,7,"And the LORD appeared unto Abram, and said, Unto thy seed will I give this land: and there builded he an altar unto the LORD, who appeared unto him."],[12,8,"And he removed from thence unto a mountain on the east of Beth-el, and pitched his tent, having Beth-el on the west, and Hai on the east: and there he builded an altar unto the LORD, and called upon the name of the LORD."]],"Genesis 13:3 to 4":[[13,3,"And he went on his journeys from the south even to Beth-el, unto the place where his tent had been at the beginning, between Beth-el and Hai;"],[13,4,"Unto the place of the altar, which he had made there at the first: and there Abram called on the name of the LORD."]],"Genesis 13:7 to 9":[[13,7,"And there was a strife between the herdmen of Abram’s cattle and the herdmen of Lot’s cattle: and the Canaanite and the Perizzite dwelled then in the land."],[13,8,"And Abram said unto Lot, Let there be no strife, I pray thee, between me and thee, and between my herdmen and thy herdmen; for we be brethren."],[13,9,"Is not the whole land before thee? separate thyself, I pray thee, from me: if thou wilt take the left hand, then I will go to the right; or if thou depart to the right hand, then I will go to the left."]],"Genesis 16:7 to 14":[[16,7,"And the angel of the LORD found her by a fountain of water in the wilderness, by the fountain in the way to Shur."],[16,8,"And he said, Hagar, Sarai’s maid, whence camest thou? and whither wilt thou go? And she said, I flee from the face of my mistress Sarai."],[16,9,"And the angel of the LORD said unto her, Return to thy mistress, and submit thyself under her hands."],[16,10,"And the angel of the LORD said unto her, I will multiply thy seed exceedingly, that it shall not be numbered for multitude."],[16,11,"And the angel of the LORD said unto her, Behold, thou art with child, and shalt bear a son, and shalt call his name Ishmael; because the LORD hath heard thy affliction."],[16,12,"And he will be a wild man; his hand will be against every man, and every man’s hand against him; and he shall dwell in the presence of all his brethren."],[16,13,"And she called the name of the LORD that spake unto her, Thou God seest me: for she said, Have I also here looked after him that seeth me?"],[16,14,"Wherefore the well was called Beer-lahai-roi; behold, it is between Kadesh and Bered."]],"Genesis 18:19":[[18,19,"For I know him, that he will command his children and his household after him, and they shall keep the way of the LORD, to do justice and judgment; that the LORD may bring upon Abraham that which he hath spoken of him."]],"Genesis 1:1 to 3":[[1,1,"In the beginning God created the heaven and the earth."],[1,2,"And the earth was without form, and void; and darkness was upon the face of the deep. And the Spirit of God moved upon the face of the waters."],[1,3,"And God said, Let there be light: and there was light."]],"Genesis 1:3":[[1,3,"And God said, Let there be light: an
