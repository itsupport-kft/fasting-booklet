 slow accumulation of ordinary things that nobody flagged as spiritual.","And notice something else that should provoke you. The Philistines never drank from those wells. They had no use for the water. There is no record that they were thirsty. They filled them for one reason only: so that Isaac could not drink. That is the signature of the spirit we are confronting today. It is not appetite. It is denial. It does not want your marriage because it wants a marriage of its own. It wants your marriage buried because it cannot bear to see you drink. There are people and there are spirits assigned to your life whose entire assignment is not to gain, but to block. They are not competing with you. They are containing you.","Today we do the inventory. What exactly is in the hole? For some of you it is trauma. For others it is a sequence of disappointments that quietly taught you not to expect. For others it is an actual covenant. For others it is a decade of small compromises that individually meant nothing and collectively filled a well.","And tonight we deal with the stone.","Because after the earth, there is always a stone. Jacob found a stone on the well's mouth in Genesis 29. Martha faced a stone at the tomb in John 11. Mary found a stone at the sepulchre in Matthew 28. Every resurrection in Scripture has a stone in front of it.","Tonight the stone moves."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Inventory of the Earth","subtitle":"","about":["Before a well is cleared, somebody has to look down into it and see what is actually in there.","Tonight we are not praying against the enemy in general. We are asking the Holy Spirit for a specific inventory. What went into my well? When did it go in? Who put it there? Was it grief? Was it a word? Was it a relationship? Was it a decision I made at nineteen that I have never once brought to God?","\"He discovereth deep things out of darkness, and bringeth out to light the shadow of death\" (Job 12:22). That is God's job description for a night like this."],"scriptures":["Genesis 26:15","Job 12:22","Daniel 2:22","Psalm 44:21","1 Corinthians 4:5","Ecclesiastes 12:14","Luke 8:17"],"note":"","points":["Father, at this hour I ask You to show me exactly what has been poured into my well.","Holy Spirit, give me a specific inventory tonight, not a general feeling. Name the thing to me.","Every shovel of earth thrown into my destiny that I never noticed, be exposed now in Jesus' name.","Lord, You discover deep things out of darkness. Discover mine tonight. Job 12:22.","Every burial that happened slowly in my life so that no one raised an alarm, I expose you now.","Every dead season I have accepted as my permanent identity, I refuse you in the name of Jesus.","Father, show me the exact year my well was stopped, and let me pray from that point.","Every event in my past that the enemy converted into a blockage, be uncovered tonight.","Every trauma buried in me that is still functioning as a stopper, come to the surface now.","Lord, I bring every unprocessed grief in my life to You. Do not let it remain in the well.","Every disappointment that quietly taught me not to expect from God, be dug out tonight.","Every abandoned dream buried under years of survival, resurface now in the name of Jesus.","Every gift in me that stopped functioning without explanation, I command your flow to be restored.","Every good thing in my marriage that has been slowly buried, come back up in Jesus' name.","Father, expose every person in my life who has been quietly adding earth to my well.","Every secret work of darkness against my household, be made manifest in the name of Jesus.","Lord, there is nothing covered that shall not be revealed. Reveal it to me tonight. Luke 8:17.","Every silent burial ceremony conducted over my destiny, I reverse it now by the blood of Jesus.","Father, give me the strength to look at what You are about to show me without running from it.","Every layer of earth on my well, begin to loosen at this midnight hour.","I decree that what was buried in silence will be exposed in power, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"They Cannot Drink, But They Will Not Let You Drink","subtitle":"","about":["This morning we identify the Philistine pattern in operation around your life.","The Philistine is not an enemy who wants what you have. The Philistine is an enemy who cannot stand that you have it. There is no record anywhere in Genesis 26 of a Philistine drinking from Abraham's wells. They filled them and walked away. You will recognise this spirit by a few marks.","It works through people who gain nothing from your loss. The colleague who blocks your promotion and does not get the position either. The relative who sabotages a marriage and does not benefit from the divorce. The friend who spreads a report and gets nothing out of it but the satisfaction of watching you shrink. It targets what was inherited, not what was earned. The Philistines went after Abraham's wells. They went after generational property. Some of you have been under attack in an area you did not even build.","And it operates in seasons of visible increase. Verse 14 says Isaac had great store of servants and \"the Philistines envied him.\" Verse 15 is the immediate response. Envy came first, then the filling.","This morning we serve notice on that pattern."],"scriptures":["Genesis 26:14 to 16","Proverbs 27:4","James 3:16","Genesis 37:11","Numbers 22:6","Psalm 37:12 to 15","Isaiah 54:15 to 17","Nehemiah 4:1 to 9"],"note":"","points":["Father, this morning I identify and I confront every Philistine spirit operating around my life.","Every enemy who cannot drink from my well but will not let me drink, be disgraced in Jesus' name.","Every envy assigned against my increase, be neutralised by the blood of Jesus.","Every person who gains nothing from my loss but works for it anyway, be exposed and be restrained.","Every hand that has been filling my well with earth, wither now in the name of Jesus.","Every conspiracy formed against my inheritance, scatter now. Isaiah 8:9 to 10.","Every Sanballat and Tobiah mocking the wall I am rebuilding, be silenced in Jesus' name.","I decree that the weapon formed against me shall not prosper, and the tongue that rises I condemn.","Every eye monitoring my progress in order to attack it, be blinded in the name of Jesus.","Every enemy who envied me before they ever spoke to me, I cancel your assignment today.","Lord, let every Philistine who chased me away come back saying, we saw that the Lord is with you.","Every blockage placed on my career, my business, and my open doors, be removed in Jesus' name.","Every attack targeted specifically at what I inherited and did not build, I resist you now.","Every household enemy operating as a Philistine in my family, be exposed by the Spirit of God.","Every spirit assigned to make sure my marriage never enjoys its own water, I cast you out.","Father, cause my enemies to be at peace with me because my ways please You. Proverbs 16:7.","Every gathering against me that You did not authorise shall fall for my sake. Isaiah 54:15.","I refuse to become a Philistine to anyone else. Deliver me from envy in Jesus' name.","Every place where I stopped digging because of opposition, give me the courage to return.","Lord, let my increase this season be so evident that denial becomes impossible.","I decree that no Philistine will outlast my digging. I will drink from my own well, in Jesus' name."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Stones of Delay, Stones of Shame","subtitle":"","about":["Earth buries. Stones seal. There are two different things happening at a blocked well, and they need two different prayers. The earth is the accumulation. The stone is the deliberate seal placed on top so that nothing can rise even if the earth is disturbed.","The stone of delay does not deny that God said it. It simply keeps it permanently in the category of \"not yet.\" You still believe. You still confess. But nothing arrives. Delay is one of the most effective weapons in the enemy's hand because it does not create rebellion, it creates fatigue. And a tired believer stops digging without ever announcing that they stopped.","The stone of shame is worse, because shame closes your mouth. Guilt says I did something wrong. Shame says I am something wrong. Guilt can be repented of. Shame convinces you that you are disqualified from the very well you are standing on. That is why the enemy works so hard to attach a shame narrative to your delay. If he can make you ashamed of the wait, he can make you silent in the wait, and a silent digger digs nothing. Today we take both stones off."],"scriptures":["Genesis 29:2 to 3","Habakkuk 2:3","Isaiah 54:4","Joel 2:26","Psalm 34:5","Romans 10:11","Isaiah 61:7","Hebrews 10:35 to 36","Genesis 40:23 to 41:14"],"note":"","points":["Father, every stone of delay sitting on the mouth of my well, I command you to move today.","Every promise of God in my life that has been sitting in the category of not yet, be released now.","Every appointed time that has been tampered with in the spirit, be restored in Jesus' name.","The vision is for an appointed time. It shall speak and not lie. I wait, but I wait with my mouth open.","Every fatigue the enemy has produced in me through delay, be replaced with fresh strength today.","Every place where I stopped believing quietly, revive my expectation in the name of Jesus.","Every stone of shame sealing my testimony, I roll you away by the blood of Jesus.","Lord, I look unto You and I am lightened, and my face shall not be ashamed. Psalm 34:5.","Every reproach attached to my delay, be lifted from my name in the name of Jesus.","Every whisper of disqualification over my life, be silenced permanently in Jesus' name.","For my shame I receive double, and for confusion I receive rejoicing in my portion. Isaiah 61:7.","Every stone of shame over my marriage and over my singleness, be removed today.","Every reproach of barrenness, of failure, of divorce, and of loss, be rolled away in Jesus' name.","Lord, restore to me the years the locust has eaten, and let me never be ashamed. Joel 2:25 to 26.","Every butler who forgot me, let the Lord provoke his memory today, as He did for Joseph.","Every file of mine sitting on a desk in the natural or the spiritual, be brought forward now.","Every delayed answer being held in transit, be released and be delivered in Jesus' name.","Every generational stone of stagnation in my family line, I break you today.","Father, do not let me cast away my confidence. Let me finish this digging with patience.","Every mouth waiting to mock my delay, be shut by my testimony in Jesus' name.","I decree that my season of not yet has ended, and my season of now has begun."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Roll Away the Stone","subtitle":"","about":["Tonight we go after the stone with force.","Look at Genesis 29. Jacob arrives at a well in Haran. There is a great stone on the well's mouth, and the custom was that all the flocks had to gather and the shepherds would roll it away together. Then Rachel appears. And Jacob, a man who had never been described as physically mighty, \"went near, and rolled the stone from the well's mouth\" (Genesis 29:10) by himself. Understand the picture. The stone stood between the man and the woman he was destined for. Between covenant and the water that would sustain it. He did not wait for the committee. Something rose in him when he saw what was on the other side of the stone.","Then John 11. Lazarus is dead four days. Jesus, who could have spoken the stone away, says \"Take ye away the stone\" (John 11:39). Martha objects on the grounds of smell. Jesus insists. God will raise the dead, but He will ask you to move the stone. There is a part of this that heaven will not do for you.","And Matthew 28. \"And, behold, there was a great earthquake: for the angel of the Lord descended from heaven, and came and rolled back the stone from the door, and sat upon it\" (Matthew 28:2). Notice the posture. The angel did not roll it away and leave. He sat on it. That is finality. That stone is not going back. Tonight, three assignments. We identify the stone. We roll it. And we sit on it.","Come standing. Use your hands tonight. When you say roll, push."],"scriptures":["Genesis 29:1 to 12","John 11:38 to 44","Matthew 28:1 to 6","Mark 16:3 to 4","Zechariah 4:7","Isaiah 45:2","Psalm 118:22","Micah 2:13","Luke 24:2"],"note":"Stand. Speak with authority.","points":["Every great stone on the mouth of my well, I command you to roll away tonight in the name of Jesus.","Who art thou, O great mountain? Before my God thou shalt become a plain. Zechariah 4:7.","I will go before thee and make the crooked places straight. Lord, break in pieces the gates of brass.","Every stone standing between me and my covenant, be rolled away as it was for Jacob.","Every stone standing between my household and our water, move now in Jesus' name.","Every stone requiring a committee to move, I decree the strength of God upon me to move it alone.","Every grave clothes still wrapped around a resurrected area of my life, be loosed and let go.","Lord, You raise the dead, but You said take away the stone. Give me the strength to obey.","Every stench, every reputation, every four day report the enemy uses to keep the tomb closed, I overrule you.","Let the breaker go up before me tonight. Let Him break the gate and let me pass through. Micah 2:13.","Every earthquake needed to shift my situation, let it happen tonight in the name of Jesus.","Like the angel, I roll away the stone and I sit upon it. It shall not return in Jesus' name.","Every stone of infertility on my womb and my seed, be rolled away tonight.","Every stone of financial blockage sealing my prosperity, be removed by the power of God.","Every stone the enemy placed over my calling and my ministry, move now in Jesus' name.","Every stone of silence over my prayers, break. Let heaven answer me tonight.","The stone which the builders rejected is become the head of the corner. Lord, promote what they discarded.","Every sealed door in my life, be opened by the One who has the keys of death and hell.","Every human hand and every demonic hand holding a stone in place over my life, be paralysed now.","Father, let there be an audible shift in the spirit tonight over my case.","I decree the well is open, the water is rising, and the stone will never return, in the name of Jesus."]}],"questions":["The Philistines filled the wells slowly, one shovel at a time. Name three specific things that went into your well between the ages of ten and twenty five. Be honest and be specific.","Is the thing blocking you earth or a stone? In other words, is it accumulation you need to clear out, or is it a deliberate seal that requires force? Write down which one, and what you will do about it tonight."],"questionNote":""},{"n":6,"date":"Saturday, October 10","title":"The Waters of My Mother's House","subtitle":"","anchor":{"text":"Behold, every one that useth proverbs shall use this proverb against thee, saying, As is the mother, so is her daughter.","ref":"Ezekiel 16:44"},"teaching":["Yesterday we cleared the earth. Today we follow the pipe back to the source.","There is an uncomfortable truth in Scripture that modern preaching tends to avoid: you inherited more than eye colour.","Exodus 20:5 speaks of iniquity visited upon the third and fourth generation. Now let us be precise, because this doctrine gets abused in both directions. The blood of Jesus has completely broken the legal power of every generational curse. That is settled. Galatians 3:13 is final. But a legal victory that is never enforced changes nothing in practice. A man can be legally free and remain in a cell if nobody opens the door and he never walks out. There are believers who are legally redeemed and practically bound, because they have never once specifically renounced what was specifically transmitted.","Today we enforce the verdict.","We are going into the mother's house and the father's house, and we are going in with honour. Let this be said plainly because it matters: breaking a covenant your grandmother made is not an accusation against your grandmother. She may have made it in famine. She may have made it in fear. She may have made it because a village elder told her it was the only way the child would live. You can grieve for her and still renounce it. Honour and renunciation are two different transactions on two different tables.","Watch particularly for the marriage patterns, because this is a marriage and destiny fast.","Some of you come from a line where no woman has been married past fifteen years. Some come from a line where the men are physically present and emotionally absent for three generations running. Some come from a line where the first daughter never marries, or where every marriage begins with pregnancy, or where there is a documented history of husbands dying young. That is not culture. That is not coincidence. That is a pattern, and patterns are held in place by agreements.","Tonight we cut."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Bloodline Ledger","subtitle":"","about":["A ledger is a record of accounts. Every family line has one in the realm of the spirit, and there are entries on it that are still generating consequences generations after the transaction closed.","Tonight we ask God to open the ledger.","Daniel did this. He was personally righteous, and he still prayed \"we have sinned, and have committed iniquity\" (Daniel 9:5). He included himself in a guilt he did not personally incur, because he understood that identificational repentance is how a man stands in the gap for a bloodline. Nehemiah did the same. \"Both I and my father's house have sinned\" (Nehemiah 1:6).","You may be the first person in your entire lineage with the standing to do this. That is not an accident."],"scriptures":["Daniel 9:4 to 11","Nehemiah 1:6 to 7","Nehemiah 9:2","Leviticus 26:40 to 42","Exodus 20:5","Jeremiah 32:18","Ezekiel 22:30","Colossians 2:14"],"note":"","points":["Father, open the ledger of my bloodline tonight and show me what is written against my family.","I stand in the gap for my father's house and my mother's house tonight. Ezekiel 22:30.","I confess the sins of my fathers and my mothers, both known and unknown. Have mercy, O God.","Every iniquity being visited to the third and fourth generation, I terminate you at my generation.","Every entry in my family ledger that gives the enemy legal access, be blotted out by the blood of Jesus.","Every handwriting of ordinances written against my bloodline, be nailed to the cross. Colossians 2:14.","Lord, I am the first in my line with the authority to do this. Let my prayer be effective tonight.","Every debt in the spirit realm my ancestors incurred, I declare it paid by the blood of Jesus.","Every ancestral transaction still generating consequences in my life, be terminated now.","Father, remember Your covenant with me and forget the covenant they made without You.","Every altar receiving payment on behalf of my family, your account is closed in Jesus' name.","Every family shrine and every family god, I renounce your claim over me and my seed.","Lord, I accept the punishment of our iniquity as Leviticus 26 instructs, and I ask for mercy.","Every silent agreement my bloodline has with darkness, I break it at this midnight hour.","Every entry on the ledger concerning marriage in my family, be cancelled in the name of Jesus.","Every entry concerning death, sickness, and poverty in my line, be cancelled now.","Father, write my family into a new record. Let there be a new ledger from tonight.","Every intercessor in my bloodline whose prayers were never answered, let them be answered through me.","Every good covenant in my lineage that was abandoned, I pick it up again tonight.","Lord, let there be a permanent divide between what my family was and what my family is becoming.","I decree that the record of my family in heaven is being rewritten tonight, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Covenants I Never Signed","subtitle":"","about":["A covenant is a binding agreement, and in Scripture it is always sealed with something. Blood. A meal. An oath. An exchange of items. A name. Here is what makes this morning necessary: you can be bound by an agreement you were not present for.","Look at Joshua 9. The Gibeonites deceived Israel into a covenant using mouldy bread and worn out shoes. Israel did not consult God. They made the agreement in error. And four hundred years later in 2 Samuel 21, there was a famine in the land, and God told David it was because Saul had violated that same Gibeonite covenant. Four centuries. The agreement was still legally active.","Nobody alive in David's day had signed it. It still bound them. So this morning, we go looking. Ask the Holy Spirit about: Dedications made at your birth. Ritual washings, incisions, marks, and beads. Naming ceremonies performed at a shrine. Family oaths and secret society memberships in your line. Items handed down that carry an attachment: rings, cloth, land, a house, a family name. Betrothals or promises made concerning your marriage before you were of age. Sacrifices made for the survival of the family during a famine, a war, or an illness. You did not sign it. You can still cancel it, because you carry the name of the One whose covenant supersedes every other."],"scriptures":["Joshua 9:3 to 20","2 Samuel 21:1 to 3","Ecclesiastes 5:4 to 6","Numbers 30:1 to 5","Isaiah 28:18","Galatians 3:13","Hebrews 8:6","Deuteronomy 7:26","Acts 19:19"],"note":"","points":["Father, every covenant made over my life that I never signed, I bring it to Your court this morning.","Every dedication performed over me at my birth, I renounce and I cancel it by the blood of Jesus.","Every naming ceremony conducted at a shrine or before an idol on my behalf, I nullify it now.","Every ritual washing, marking, incision, or bead placed on my body as a child, lose your power.","Every oath sworn by my ancestors that still binds my generation, I break it in Jesus' name.","Every secret society membership in my bloodline, I renounce it and I withdraw my name.","Your covenant with death is disannulled and your agreement with hell shall not stand. Isaiah 28:18.","Every Gibeonite covenant made in my family through deception, be cancelled by the blood of Jesus.","Every promise made concerning my marriage before I could consent, I overrule it now.","Every betrothal made in the spirit realm over my life, I annul it in the name of Jesus.","Every inherited item in my possession carrying a demonic attachment, be exposed and be removed.","Every accursed thing in my house, I refuse to bring it into my dwelling. Deuteronomy 7:26.","Lord, show me anything in my home today that must go, and give me the courage to burn it.","Every sacrifice made for my survival that was offered to a wrong god, I renounce it now.","Every land, house, or property inherited with a covenant attached, I cleanse it by the blood of Jesus.","I am redeemed from the curse of the law, for Christ was made a curse for me. Galatians 3:13.","Jesus is the mediator of a better covenant established upon better promises. I stand on the better one.","Every soul tie formed through an ancestral agreement, I sever you by the sword of the Spirit.","Every spirit enforcing an old covenant in my life, your contract is void. Leave now in Jesus' name.","Father, seal me today in the covenant of the blood, and let no other agreement have a voice.","I decree that I belong to Jesus Christ alone, and every competing claim is illegal."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"The Dowry of Sorrow: Marriage Patterns in the Bloodline","subtitle":"","about":["This session is the heart of why this is called a marriage and destiny fast.","Sit down and trace it honestly. Your mother's marriage. Her mother's marriage. Your father's. His father's. Your aunts and your uncles. What happened, and at what point did it happen? Families carry marriage scripts. Not curses in a vague sense, but repeating scripts with observable timing. The marriages that fracture in year seven. The women who are always the strong one carrying a passive man. The men who provide financially and vanish emotionally. The first daughters who never marry. The unions that only ever begin with a pregnancy. The families where every wife is a widow before sixty.","And here is the part that will help many of you today: a pattern you have not named is a pattern you will repeat. Not because you are weak, but because you learned marriage before you had language. What you saw at four years old became your definition of normal before anyone taught you a definition. So today we do two things. We break the spiritual agreement holding the pattern. And we ask God to reprogram the internal template, because deliverance without renewal simply leaves the room swept and empty.","If you are single, do this work now. It is far easier to break a pattern before you sign a covenant than after.","If you are married, do this work with your spouse if you can. Two people breaking one pattern is a different weight than one person trying alone."],"scriptures":["Ezekiel 16:44","Genesis 12:11 to 13","Genesis 26:7","Genesis 20:2","Proverbs 5:15 to 19","Malachi 2:14 to 16","1 Peter 3:7","Ephesians 5:31 to 32","Hosea 4:6"],"note":"","points":["Father, expose to me today every marriage pattern operating in my bloodline.","Every marriage script I inherited before I had language, I renounce you in the name of Jesus.","Every repeating timeline of marital collapse in my family, be broken at my generation.","As Abraham lied about his wife and Isaac repeated it, every inherited pattern of deception in marriage, break now.","Every spirit of divorce assigned to my family line, I terminate your assignment in Jesus' name.","Every pattern of absent fathers and abandoned homes in my lineage, break permanently today.","Every pattern of widowhood, of premature loss of a spouse, I cancel you in the name of Jesus.","Every pattern of unfaithfulness running through my bloodline, dry up from the root today.","Every pattern of violence and abuse in my family line, I break you and I refuse to transmit you.","Every cycle where marriage in my family only begins in crisis, be broken in Jesus' name.","Every dowry of sorrow paid over the women in my line, I return it to the sender today.","Every unrepeatable good marriage in my line, let it become the new pattern for my house.","Lord, reprogram the template in me. Teach me marriage from Your word and not from my memory.","Every fear of marriage I developed from watching my parents, be healed and be removed today.","Every vow I made as a child about never being like them, I release it to God for correction.","Father, I ask for a marriage that becomes a new landmark in my family history.","Every generational curse of loneliness and delay in marriage, I break you in Jesus' name.","My people are destroyed for lack of knowledge. Lord, give me knowledge for my covenant. Hosea 4:6.","I decree that my children will inherit a marriage worth copying, in the name of Jesus.","Let my fountain be blessed, and let me rejoice with the spouse of my covenant. Proverbs 5:18.","Father, let my marriage be the generation where the pattern finally breaks and the water flows clean."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Cutting the Cord","subtitle":"","about":["Tonight we cut.","There is a moment at every birth when the cord that sustained the child becomes the thing that must be severed. If it stays connected past its time, the very channel that carried life begins to carry danger.","That is a picture of the ungodly generational tie. Understand what we are and are not doing tonight. We are not cutting off our families. We are cutting the ungodly channel. Love stays. Honour stays. Relationship stays. What goes is the pipe through which sickness, poverty, and marital destruction have been transmitted without anybody's consent.","And here is the legal ground we stand on, and it is total. \"Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree\" (Galatians 3:13). Redeemed is a market word. It means bought out and taken off the shelf. You are not on sale anymore. Also Colossians 2:14 to 15. He blotted out the handwriting of ordinances that was against us, took it out of the way, nailed it to His cross, \"and having spoiled principalities and powers, he made a shew of them openly, triumphing over them in it.\" Spoiled means stripped of weapons. The powers that have been ruling your bloodline were publicly disarmed at the cross. Tonight we enforce that in your specific family.","Come with the list you made this morning. Call things by name. Vague renunciation produces vague results."],"scriptures":["Galatians 3:13 to 14","Colossians 2:13 to 15","Deuteronomy 7:9 to 10","Nahum 1:9","Isaiah 49:24 to 25","Matthew 15:13","Luke 10:19","Revelation 12:11","Zechariah 3:1 to 4","Numbers 23:23","Jeremiah 31:29 to 30"],"note":"Stand. Name the specific things God showed you this morning.","points":["Father, I stand on Galatians 3:13. I am redeemed from the curse of the law by the blood of Jesus.","Every ungodly cord connecting me to my father's house, I cut you now by the sword of the Spirit.","Every ungodly cord connecting me to my mother's house, I cut you now in the name of Jesus.","I cut, and I declare that what is cut tonight will never be rejoined. Nahum 1:9.","Every generational curse of poverty in my bloodline, I break you and I terminate you at my generation.","Every generational curse of sickness attacking the same organ in my family, break now in Jesus' name.","Every generational curse of premature death, I break your assignment over my household.","Every generational curse of marital failure, I destroy you tonight by the blood of Jesus.","Every generational curse of barrenness and miscarriage, be broken in the name of Jesus.","Every generational curse of addiction in my family line, be broken and never reassigned.","Every generational curse of madness, depression, and torment, I break you tonight.","Every generational curse of failure at the edge of success, be broken in the name of Jesus.","Every generational curse of shame and family disgrace, be destroyed by the blood of Jesus.","Every prey being held by the mighty over my family, be delivered. Isaiah 49:24 to 25.","Every principality ruling over my bloodline, you were spoiled at the cross. I enforce your defeat now.","Every accuser standing to speak against my family, the Lord rebuke thee. Zechariah 3:2.","Take away the filthy garments from my bloodline and clothe us with change of raiment.","Every plant my heavenly Father has not planted in my lineage, be rooted up tonight.","There is no enchantment against Jacob, neither is there any divination against Israel. Numbers 23:23.","I overcome by the blood of the Lamb and by the word of my testimony. Revelation 12:11.","The sour grapes stop with me. My children's teeth shall not be set on edge. Jeremiah 31:29 to 30. It is finished."]}],"questions":["Trace the marriages in your family back three generations. Write down what actually happened in each one and at what point. What pattern do you see, and have you ever named it out loud before today?","Is there an object, a piece of jewellery, a garment, or an inheritance in your home that God brought to your mind today? What are you going to do about it before this fast ends?"],"questionNote":""},{"n":7,"date":"Sunday, October 11","title":"And God Opened Her Eyes","subtitle":"","anchor":{"text":"And God opened her eyes, and she saw a well of water; and she went, and filled the bottle with water, and gave the lad drink.","ref":"Genesis 21:19"},"teaching":["This may be the most important verse of the entire fast, and it is only fifteen words long.","Hagar is in the wilderness of Beersheba. The water in her skin is finished. Her son is dying. She puts him under a shrub, walks a bowshot away, and sits down, because she says \"Let me not see the death of the child\" (Genesis 21:16). She has already accepted the outcome. She is not looking for a solution. She is positioning herself to survive the grief.","Then God speaks. And notice very carefully what God does not do.","He does not create a well. He does not make water spring out of a rock as He did for Moses. There is no miracle of production recorded in this passage at all.","\"And God opened her eyes, and she saw a well of water.\"","The well was already there. It had been there the entire time she was weeping. It was there while she measured out the last of the water. It was there while she carried the boy. She was dying of thirst within walking distance of an open well, and the only thing standing between her and the water was sight.","Beloved, sit with that.","How much of what you have been begging God to provide has He already provided? How many of the things you have been praying for are not absent but simply invisible to you?","This is why today matters so much in the middle of a fast about wells. Some of you do not need a new well. You need your eyes opened to the one you are standing on.","There is a spirit whose entire assignment is to keep provision invisible. Paul names him directly: \"the god of this world hath blinded the minds of them which believe not\" (2 Corinthians 4:4). And Elisha's servant in 2 Kings 6 panicked at an army he could see while surrounded by an army he could not, until Elisha prayed one sentence: \"LORD, I pray thee, open his eyes, that he may see\" (2 Kings 6:17).","Two men. Same hill. Same morning. Completely different realities. The difference was not the situation. The difference was the sight.","Today, we ask for eyes."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Well Was Always There","subtitle":"","about":["Tonight we repent of praying for what we already have.","That sounds strange until you consider how much of Hagar's crisis was a sight crisis and not a supply crisis. She was not lied to. She was not abandoned. She was blind.","At this hour we are asking God to show us what has been in the room the whole time. The resource. The person. The open door. The gift lying dormant. The answer already delivered and never collected."],"scriptures":["Genesis 21:14 to 19","2 Kings 6:15 to 17","Luke 24:15 to 16, 31","John 20:14 to 16","Ephesians 1:18","Psalm 119:18","Numbers 22:31"],"note":"","points":["Father, open my eyes tonight and let me see what has been in front of me all along.","Every well I have been sitting beside without seeing, be revealed to me now in Jesus' name.","Lord, open the eyes of my understanding, that I may know the hope of Your calling. Ephesians 1:18.","Open thou mine eyes, that I may behold wondrous things out of Your law. Psalm 119:18.","Every provision already released to me that I have not collected, let me see it and take it.","Every resource in my hand that I have been despising, show me its value tonight.","Lord, I repent of begging for what You have already given me. Forgive my blindness.","Every gift lying dormant in me because I never recognised it, awake now in Jesus' name.","Every door standing open that I have walked past for years, reveal it to me tonight.","Every person You sent into my life that I dismissed, open my eyes to them in Jesus' name.","Lord, like the men on the road to Emmaus, let my eyes be opened and let me recognise You.","Every situation where I have concluded death while You have provided water, correct me tonight.","Every place where I sat down and stopped looking, cause me to stand and look again.","Father, show me the well in my marriage that we have both stopped drawing from.","Every answer that has already been delivered into my life, let me see it and use it.","Lord, let me not mourn beside a supply that is already mine.","Every veil over my perception of my own life, be removed by the Spirit of God.","Father, open my eyes to see the army that is with me and not only the army against me.","Every wrong conclusion I have reached about my situation, be corrected by revelation tonight.","Lord, do not let this fast end with me still blind to something obvious.","I decree that from this night my seeing changes, and what changes my seeing will change my season."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Seen by the God Who Sees","subtitle":"","about":["Before Hagar ever saw the well, she was seen.","In Genesis 16, before this scene, Hagar was already in a wilderness and God met her there. Her response was to name Him: \"Thou God seest me\" (Genesis 16:13). And she called the place Beer lahai roi, which means the well of the Living One who sees me. She named a well after being seen.","That is the order. Being seen produces wells.","Some of you this morning are not primarily in a resource crisis. You are in an invisibility crisis. You feel unnoticed by your family, overlooked at work, unseen in your marriage, forgotten in your service to God. You are doing the right things and nobody is watching.","God saw a discarded slave woman in a desert nobody had mapped. He knew her name. He asked her a question. He gave her a promise for her son.","He sees you."],"scriptures":["Genesis 16:7 to 14","Psalm 139:1 to 12","Hebrews 6:10","Luke 12:6 to 7","Psalm 56:8","2 Chronicles 16:9","Isaiah 49:15 to 16","Matthew 6:6"],"note":"","points":["Father, thank You that You are the God who sees me. I am not invisible to heaven.","Every feeling of being overlooked and unseen, be replaced with the confidence of being known.","Lord, You know my downsitting and my uprising. You understand my thought afar off. Thank You.","Every labour of mine that no human has acknowledged, let it be remembered before God. Hebrews 6:10.","Father, You have put my tears into Your bottle. Not one of them was wasted. Psalm 56:8.","Every wilderness season where I felt abandoned, let it become Beer lahai roi in my testimony.","Lord, the eyes of the Lord run to and fro to show Yourself strong on my behalf. 2 Chronicles 16:9.","Every place of hiddenness in my life, let it become a place of encounter and not of shame.","Father, I am graven upon the palms of Your hands. My walls are continually before You. Isaiah 49:16.","Every rejection that made me believe I am forgettable, be healed this morning in Jesus' name.","Lord, see the situation in my home that nobody outside my walls knows about.","Every unseen sacrifice I have made for my family, let heaven reward it openly.","Father, You reward openly what is done in secret. Reward me openly. Matthew 6:6.","Every spirit of insignificance and obscurity assigned to my life, I break you in Jesus' name.","Lord, let me see my spouse the way You see them. Give me eyes for the person and not the problem.","Every child in my house who feels unseen, let them encounter the God who sees.","Father, thank You that You know my name and You have called me by it.","Every hidden gift that has been waiting for recognition, let the right eyes find it this season.","Lord, You saw Hagar before she saw the well. See me before my breakthrough comes.","I refuse to define my worth by who noticed me. I am seen by God and that settles it.","Thank You, Father, that even here in this wilderness, You are the Living One who sees me."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Blindfolds and Blur","subtitle":"","about":["There are specific spirits whose work is to distort perception, and today we name them. Confusion. \"God is not the author of confusion\" (1 Corinthians 14:33). If you have been in a fog for months, unable to decide, unable to see a way forward, second guessing every choice, that is not a personality trait. Confusion is a spirit and it can be cast out. Delusion. 2 Thessalonians 2:11 speaks of a strong delusion. This is when a person genuinely believes something false and defends it with sincerity. The most dangerous deception is the one you are certain about.","The veil. 2 Corinthians 3:15 to 16 says a veil sits on the heart, \"nevertheless when it shall turn to the Lord, the vail shall be taken away.\" Turning removes veils.","Wrong counsel. Some of you cannot see because you have been listening to people who cannot see. Blind guides lead into ditches (Matthew 15:14). Not every advisor around you has functioning eyes.","And familiarity, which is its own blindfold. Jesus could do no mighty work in Nazareth because they knew Him too well to receive Him (Mark 6:4 to 5). Some of you cannot see the value in your own spouse because you have known them too long. Today we take the blindfolds off."],"scriptures":["1 Corinthians 14:33","2 Corinthians 3:14 to 16","2 Corinthians 4:3 to 6","2 Thessalonians 2:10 to 12","Matthew 15:14","Mark 6:4 to 6","Isaiah 29:10 to 12","James 1:5 to 8","Proverbs 11:14"],"note":"","points":["Every spirit of confusion operating in my mind and my decisions, I cast you out today in Jesus' name.","God is not the author of confusion. Every fog over my life, clear now in the name of Jesus.","Every strong delusion I have sincerely believed, be exposed and be broken today.","Every veil sitting on my heart, be taken away as I turn fully to the Lord. 2 Corinthians 3:16.","Every blindfold placed on me by the god of this world, I tear you off by the blood of Jesus.","Every blind guide speaking into my life, be removed and be replaced with seers in Jesus' name.","Lord, give me counsellors who can actually see. In the multitude of counsellors there is safety.","Every spirit of deep sleep poured over my discernment, I break you now. Isaiah 29:10.","Every double mindedness making me unstable in all my ways, be broken today. James 1:8.","Lord, I ask for wisdom liberally and without reproach, and I receive it now. James 1:5.","Every familiarity blinding me to the value of my spouse, be broken in the name of Jesus.","Every familiarity blinding me to the value of my church, my calling, and my season, break now.","Every voice of doubt disguising itself as wisdom in my ear, be silenced in Jesus' name.","Lord, shine into my heart and give me the light of the knowledge of Your glory. 2 Corinthians 4:6.","Every mental blur that has kept me from making a decision for months, lift now in Jesus' name.","Every distortion of how I see myself, be corrected by the word of God today.","Every distortion of how I see my future, be corrected by the promise of God today.","Father, let me see people as You see them, not as my wounds have taught me to see them.","Every deception operating in my household right now, be exposed by the light in Jesus' name.","Lord, if I am wrong about something important, I would rather know today than discover it too late.","I decree clarity over my mind, my marriage, and my direction, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Lord, Open His Eyes","subtitle":"","about":["Tonight we war for sight, and we war for the sight of others.","2 Kings 6. Dothan is surrounded. Horses, chariots, a great host, and they came for one man. Elisha's servant gets up early, walks outside, and panics. \"Alas, my master! how shall we do?\" (2 Kings 6:15).","Elisha's answer is one of the most confident sentences in Scripture: \"Fear not: for they that be with us are more than they that be with them\" (2 Kings 6:16).","More. Not equal. More.","The servant is looking at the same hill and seeing the opposite. So Elisha prays a prayer that costs nothing and changes everything: \"LORD, I pray thee, open his eyes, that he may see. And the LORD opened the eyes of the young man; and he saw: and, behold, the mountain was full of horses and chariots of fire round about Elisha\" (2 Kings 6:17).","Nothing changed on that mountain. The chariots were already there. Elisha did not summon them. They had been there the whole time the young man was panicking.","Then notice the second half of the story, because most people stop reading at verse 17. When the army came down, Elisha prayed again, and this time he asked God to strike them with blindness (2 Kings 6:18). One prayer for sight. One prayer for blindness. He knew how to open eyes and he knew how to close them.","Tonight we do both. We open our own eyes and the eyes of our households. And we blind the eyes that have been monitoring our lives without permission.","This is a seeing service. Come expecting to see something."],"scriptures":["2 Kings 6:8 to 23","2 Corinthians 4:3 to 4","Ephesians 1:17 to 18","Acts 26:18","Acts 13:8 to 11","Psalm 34:7","Hebrews 1:14","Revelation 3:18","John 9:25","Numbers 22:31"],"note":"Stand. Lay your hand on your eyes for the first seven points.","points":["Lord, open my eyes that I may see. Do not let me leave this session blind.","Every scale on my spiritual eyes, fall off now in the name of Jesus. Acts 9:18.","Father, let me see the horses and chariots of fire that surround me. They are already here.","They that be with me are more than they that be with them. I receive that as fact tonight.","Every fear born out of partial information, be destroyed by full revelation in Jesus' name.","Lord, give me the spirit of wisdom and revelation in the knowledge of You. Ephesians 1:17.","I anoint my eyes with eyesalve that I may see. Revelation 3:18.","Lord, open the eyes of my spouse. Let us see the same mountain the same way.","Open the eyes of my children. Do not let this generation grow up spiritually blind.","Open the eyes of my father and my mother, and of every unsaved person in my bloodline.","Every mind blinded by the god of this world in my family, let the light of the gospel shine in.","Turn them from darkness to light, and from the power of Satan unto God. Acts 26:18.","Every evil eye monitoring my household, I strike you with blindness as Elisha did in Jesus' name.","Every witchcraft eye reading my life and reporting on my progress, go blind now.","Every satellite, mirror, and monitoring device in the spirit trained on my family, be destroyed by fire.","Every Elymas standing between me and my breakthrough, be blinded for a season. Acts 13:11.","Every enemy that has been seeing clearly into my affairs, lose your access tonight.","Lord, let my enemies be led away as the Syrian army was, into a place of Your choosing.","The angel of the Lord encampeth round about them that fear Him and delivereth them. Psalm 34:7.","Father, let me become a person who prays open the eyes of others.","Whereas I was blind, now I see. I decree it over my life and my house tonight, in Jesus' name."]}],"questions":["Hagar was dying beside an open well. What is one thing in your life right now that you have been asking God to provide that He may have already provided and you have not seen?","Elisha prayed for the eyes of someone else. Write down the name of one person whose eyes you are going to war for through the rest of this fast."],"questionNote":""},{"n":8,"date":"Monday, October 12","title":"What Moves When the Light Is Out","subtitle":"","anchor":{"text":"He discovereth deep things out of darkness, and bringeth out to light the shadow of death.","ref":"Job 12:22"},"teaching":["Yesterday God opened our eyes. Today we use them.","There is a category of activity in Scripture that operates specifically in the dark, and it is not a metaphor. \"For we wrestle not against flesh and blood, but against principalities, against powers, against the rulers of the darkness of this world\" (Ephesians 6:12). Rulers of the darkness. That is a jurisdiction and a working environment.","Let us be balanced here, because this teaching goes wrong in two directions.","Some believers see a demon behind every inconvenience, blame witchcraft for their own laziness, and live in permanent suspicion of everyone around them. That is not discernment. That is paranoia wearing a spiritual costume, and it produces exhausted, fearful Christians who accomplish nothing.","Others swing so far the other way that they will not acknowledge the plain testimony of Scripture. But the Bible names witches, diviners, enchanters, familiar spirits, and workers of darkness in dozens of passages, and it never once treats them as fiction. Simon in Acts 8 was real. Elymas in Acts 13 was real. The girl with the spirit of divination in Acts 16 was real. The woman at Endor was real.","The correct posture is not fear and not denial. It is authority.","Today we deal with three things.","Dreams, because the dream life is a legitimate channel of God and a heavily contested one. Job 33:15 to 16 says God speaks in a dream and opens the ears of men. But there is also traffic in that channel that did not come from heaven, and many believers have never learned to tell the difference or to respond. Monitoring, because Ecclesiastes 10:20 warns that a bird of the air shall carry the voice. There are eyes that watch and report. And tonight, witchcraft itself, exposed and dismantled. Not sensationalised. Named, confronted, and stripped of authority. One promise to hold on to all day: \"There is nothing covered, that shall not be revealed; neither hid, that shall not be known\" (Luke 12:2)."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"He Discovereth Deep Things Out of Darkness","subtitle":"","about":["Midnight belongs to God. The enemy has convinced many believers that the night hours are his territory. Scripture says otherwise. \"The day is thine, the night also is thine\" (Psalm 74:16). Egypt's firstborn fell at midnight. The prison at Philippi shook at midnight. The bridegroom came at midnight. Boaz woke at midnight and covenant was established.","Tonight we occupy the hour rather than fearing it, and we ask God to bring things out of darkness into the light."],"scriptures":["Job 12:22","Psalm 74:16","Daniel 2:22","Luke 12:2 to 3","Ephesians 5:11 to 13","1 Corinthians 4:5","Exodus 12:29","Ruth 3:8","Matthew 25:6"],"note":"","points":["Father, the day is Yours and the night also is Yours. I occupy this hour in Your name.","Lord, discover deep things out of darkness concerning my life tonight. Job 12:22.","Every hidden work of darkness against my household, be brought into the light now.","Every secret meeting held concerning my destiny, be exposed and be scattered in Jesus' name.","Every agreement reached about me in the dark, be nullified by the blood of Jesus.","Lord, You reveal the deep and secret things and You know what is in the darkness. Daniel 2:22.","Every plan concluded against my marriage in the night season, be aborted now.","Every unfruitful work of darkness around my life, I reprove you and expose you. Ephesians 5:11.","Every enemy operating under cover of night against my family, lose your covering now.","Every midnight assignment against my health and my children, be cancelled in Jesus' name.","As the firstborn of Egypt fell at midnight, let every stronghold over my life fall tonight.","Every prison holding a member of my household, be shaken at this midnight hour.","Lord, let this hour become a gate of revelation and not a gate of torment for me.","Every voice of fear that speaks to me in the night, be permanently silenced in Jesus' name.","Father, give me songs in the night. Let me be found praising and not panicking.","Every trap set for me in the dark, be exposed before my foot ever reaches it.","Every sleeping watchman over my life and family, wake up now in the name of Jesus.","Lord, let me hear what You are saying in this hour. Open my ears tonight.","Every reproach planned to be revealed against my name, I cancel it by the blood of Jesus.","Father, let the light of God flood every dark corner of my family history.","I decree that nothing hidden against me will remain hidden, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Dreams: The Screen of the Spirit","subtitle":"","about":["God speaks in dreams. That is not fringe teaching. It is Scripture.","\"For God speaketh once, yea twice, yet man perceiveth it not. In a dream, in a vision of the night, when deep sleep falleth upon men... then he openeth the ears of men, and sealeth their instruction\" (Job 33:14 to 16). Joseph, Daniel, Solomon, Jacob, Pharaoh, Nebuchadnezzar, Joseph the husband of Mary, Pilate's wife, and Paul all received direction through dreams. But the same channel carries other traffic, and many believers have been passive about dreams that should have been resisted. Learn the categories.","Revelation dreams come from God. They instruct, warn, or reveal. They leave you with clarity even when the content is heavy. Soulish dreams are simply your own mind processing your day. Ecclesiastes 5:3 says a dream comes through the multitude of business. Not everything means something.","Attack dreams are the ones we address this morning. Being chased. Eating in a dream. Seeing yourself in your old house, your old school, your old village. Sexual encounters in dreams. Falling from a height. Seeing yourself naked, or writing an exam you cannot finish, or missing a flight repeatedly. Being buried or seeing a coffin. Dreaming of a person who has died. Here is the key: do not merely report an attack dream. Cancel it. A dream you narrate at breakfast without praying is a dream you have agreed to.","And a practical word: keep a notebook by your bed for the rest of this fast. Write immediately on waking, before you speak to anyone."],"scriptures":["Job 33:14 to 18","Genesis 20:3","Genesis 31:24","Genesis 37:5 to 11","Daniel 2:19","Daniel 7:1","Matthew 1:20","Matthew 2:12 to 13","Ecclesiastes 5:3","Jeremiah 23:25 to 28","Acts 2:17"],"note":"","points":["Father, restore my dream life. Let me hear from You in the night as Your word promises.","Every closure over my dream channel, be opened by the Spirit of God this morning.","Lord, I ask for dreams that instruct, warn, and direct, and I ask for the interpretation with them.","Every dream God has given me that I forgot on waking, restore it to my memory now.","Every evil dream I have had in the past year, I cancel your effect by the blood of Jesus.","Every dream where I was pursued, I decree that my pursuers are permanently defeated.","Every food I have eaten in a dream, I vomit you out by the blood of Jesus and I refuse your effect.","Every dream that returned me to my old house, my old school, or my old village, I cancel your assignment.","Every sexual encounter in a dream, I renounce it and I break every covenant it attempted to establish.","Every spirit spouse operating through my dream life, I divorce you and I cast you out in Jesus' name.","Every dream of falling, drowning, or being buried, be reversed in the name of Jesus.","Every coffin, grave, and death symbol shown over my life in a dream, I destroy you by fire.","Every dead relative appearing to me in dreams, you are not my relative. I command you to leave.","Every dream manipulation over my spouse and my children, be broken in Jesus' name.","Lord, teach me to discern between a dream from You, a dream from my soul, and a dream from the enemy.","Every dream I narrated instead of cancelling, I go back and I cancel it now by the blood of Jesus.","Father, seal my sleep. Let me lie down and my sleep be sweet. Proverbs 3:24.","Every insomnia and night terror assigned to my household, be broken in the name of Jesus.","Your sons and your daughters shall prophesy, and your old men shall dream dreams. Acts 2:17.","Lord, let there be a dream this week that changes the direction of something in my life.","I decree that my night season is now a season of revelation and not of attack."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Who Is Watching Your Life","subtitle":"","about":["\"Curse not the king, no not in thy thought; and curse not the rich in thy bedchamber: for a bird of the air shall carry the voice, and that which hath wings shall tell the matter\" (Ecclesiastes 10:20).","There is such a thing as spiritual surveillance, and Scripture treats it as ordinary.","Consider Elisha and the king of Syria in 2 Kings 6. The Syrians kept getting ambushed, and the king assumed there was a traitor in his war council. His servant corrected him: \"Elisha, the prophet that is in Israel, telleth the king of Israel the words that thou speakest in thy bedchamber\" (2 Kings 6:12). A prophet was accessing enemy war rooms from another country.","If a prophet of God can do that, understand that the counterfeit exists too.","You will recognise monitoring by its fruit. Attacks that arrive with unnerving timing, precisely when you were about to move forward and before anyone knew. People who know things about your life you never told them. A pattern where every plan leaks before it launches. Sudden withdrawal from a person right at the moment you needed them most.","Now hear the balance clearly, because this teaching can breed paranoia: you do not fight this by suspecting everybody. You fight it by covering, by cutting off access, and by asking God to blind what has been watching. And you fight it by wisdom, because some of what leaks in your life leaks because you talk too much.","Not everything needs to be announced. Some things need to be built in silence."],"scriptures":["Ecclesiastes 10:20","2 Kings 6:8 to 12","Job 1:9 to 10","Psalm 91:1 to 6","Psalm 121:3 to 8","Genesis 37:19 to 20","Nehemiah 6:1 to 9","Proverbs 29:11","Isaiah 4:5"],"note":"","points":["Father, I cover my life, my home, and my family with the blood of Jesus this afternoon.","Every eye monitoring my progress in order to attack it, I blind you in the name of Jesus.","Every bird of the air carrying my voice to my enemies, be brought down now in Jesus' name.","Every spiritual surveillance over my household, be terminated by the fire of God.","Every mirror, crystal, water, or object being used to view my life, be shattered in Jesus' name.","Every messenger reporting my movements in the spirit realm, be arrested and be silenced.","Lord, put a hedge about me, about my house, and about all that I have. Job 1:10.","Every leak in my life through which my plans escape, be sealed in the name of Jesus.","Father, teach me wisdom. Show me what to say, who to say it to, and what to keep silent.","Every dreamer killer waiting for me to speak so they can plot, be exposed and be disgraced.","Every counsel of Ahithophel concerning my life, be turned to foolishness. 2 Samuel 15:31.","Every Sanballat sending letters to distract me from my building, I refuse to come down. Nehemiah 6:3.","Every information about my life that has been illegally accessed, be rendered useless in Jesus' name.","Lord, let there be a cloud by day and a flaming fire by night over my dwelling. Isaiah 4:5.","He that keepeth me will not slumber. My Keeper never sleeps. Psalm 121:3.","Every trap that has been set based on inside information, be dismantled before I arrive.","Every person operating as an informant against my family, be exposed and be removed.","Father, cover my marriage. Let what happens in my home stay in my home.","Every attack timed to arrive exactly at my breakthrough, be intercepted and be cancelled.","Lord, hide my life in the secret place of the most High. Psalm 91:1.","I decree that my life becomes unreadable to every unauthorised eye, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Witchcraft Exposed and Dismantled","subtitle":"","about":["Tonight we confront it directly.","Let us start with what witchcraft actually is, because the word gets used carelessly.","Witchcraft is the use of spiritual power to control, manipulate, or destroy a person outside of God's authority. That is the essence of it. Control that bypasses consent. It is listed among the works of the flesh in Galatians 5:20 alongside hatred and envy, which tells you it can operate through a religious person who has never touched an occult object in their life.","Scripture identifies several faces of it.","Occult witchcraft. Deuteronomy 18:10 to 12 lists divination, observing times, enchanting, consulting familiar spirits, and necromancy. God calls all of it an abomination.","The Jezebel operation. Jehu asked, \"What peace, so long as the whoredoms of thy mother Jezebel and her witchcrafts are so many?\" (2 Kings 9:22). Jezebel worked through seduction, intimidation, false accusation, and the systematic murder of prophets. She rarely appeared with a wand. She appeared with a letter and a signature.","Household witchcraft, which is the most painful. \"A man's foes shall be they of his own household\" (Matthew 10:36). Manipulation and control in relationships, which most people never label as witchcraft but Samuel did: \"For rebellion is as the sin of witchcraft, and stubbornness is as iniquity and idolatry\" (1 Samuel 15:23). Emotional manipulation in a marriage, control through guilt, control through silence, control through threat, these operate in the same realm.","And now hear the good news, and hear it loudly: Balaam could not curse what God had blessed. He tried three times from three different mountains with seven altars each, and every single time the curse came out of his mouth as a blessing. His conclusion, after all that effort, is one of the most powerful verses in the Bible for a night like this:","\"Surely there is no enchantment against Jacob, neither is any divination against Israel\" (Numbers 23:23).","Tonight we are not afraid. We are dismantling.","Come standing. Speak with authority. Do not whisper."],"scriptures":["Numbers 22:1 to 23:23","Deuteronomy 18:10 to 12","1 Samuel 15:23","2 Kings 9:22","Nahum 3:4 to 5","Micah 5:12","Acts 8:9 to 24","Acts 13:8 to 11","Acts 19:18 to 20","Isaiah 47:9 to 14","Galatians 5:19 to 21","Luke 10:19","Revelation 12:11","Isaiah 54:17"],"note":"Stand for this entire session.","points":["In the name of Jesus, I take authority over every power of witchcraft assigned to my life.","Behold, I give unto you power to tread on serpents and scorpions, and over all the power of the enemy.","There is no enchantment against Jacob and no divination against Israel. Numbers 23:23.","Every Balaam hired to curse my family, let your curse be turned into a blessing tonight.","Every altar raised to enquire against me, be scattered by the fire of God in Jesus' name.","I renounce every involvement with divination, fortune telling, horoscopes, and the occult in my life.","I renounce every consultation my ancestors made with diviners, herbalists, and mediums.","Every familiar spirit passed down my bloodline, I cut you off permanently in the name of Jesus.","Every Jezebel spirit operating against my ministry, my marriage, and my peace, I resist you now.","Every seduction, intimidation, and false accusation from a Jezebel operation, fall to the ground.","Every witchcraft in my own household, be exposed and be dismantled in Jesus' name.","Every manipulation and control operating in my relationships, I renounce it and I refuse it.","Lord, deliver me from being a controlling person. Take manipulation out of my own hands.","Every witchcraft cauldron, pot, or fire cooking my destiny, be quenched by the blood of Jesus.","Every witchcraft burial of my prosperity, my health, or my marriage, be exhumed in Jesus' name.","Every witchcraft padlock on my progress, be broken. Every witchcraft chain, fall off now.","I will cut off witchcrafts out of thine hand, and thou shalt have no more soothsayers. Micah 5:12.","Every Elymas seeking to turn me from the faith, be blinded for a season. Acts 13:11.","Every sorcerer who has taken payment against my family, your money is returned and your work is void.","No weapon formed against me shall prosper, and every tongue that rises against me I condemn.","I overcome by the blood of the Lamb and by the word of my testimony. Every witchcraft against my life is broken tonight, in the name of Jesus."]}],"questions":["Write down the dream you have had more than once. What is the recurring element, and have you ever specifically cancelled it in prayer?","Witchcraft was defined tonight as control that bypasses consent. Where in your own life are you the one doing the controlling? Be honest, and repent of it before you sleep."],"questionNote":""},{"n":9,"date":"Tuesday, October 13","title":"The Mind Is Also a Well","subtitle":"","anchor":{"text":"Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ.","ref":"2 Corinthians 10:5"},"teaching":["You can break every altar in your father's house and still lose, if the war in your head is left unattended.","Paul uses military language in 2 Corinthians 10:4 to 5 and it is worth reading slowly. Strongholds. Imaginations. High things. Captivity.","A stronghold is a fortified position. In ancient warfare, an army could hold a fortress in enemy territory for years even after the surrounding land had been conquered. That is what a stronghold is in a believer's mind: a fortified position of thought that survives your conversion, your baptism, your calling, and your deliverance, because nobody ever went in to take it.","And notice what the fortress is built out of. Not sin. Imaginations. Reasonings. Arguments. Logic. The word Paul uses is the root of our word logistics. Strongholds are made of thoughts that make sense.","That is why they are so hard to remove. A demon you can cast out. A stronghold you must dismantle, brick by brick, with truth. Look at what a stronghold sounds like from the inside. \"We were in our own sight as grasshoppers, and so we were in their sight\" (Numbers 13:33). Ten spies, one report. And look at the sequence carefully, because it is devastating. First they saw themselves as grasshoppers. Then they assumed that is how the giants saw them. The self image came first, and then it projected outward and became a report, and the report cost an entire generation their inheritance.","Nobody in Canaan called them grasshoppers. They called themselves that.","So today we deal with the mind.","We are going after the orphan mind, which serves God faithfully while secretly believing it has no father and must earn everything. We are going after the poverty mentality, which is not the absence of money but a relationship with lack that survives the arrival of money. We are going after fear, torment, and the voices that some of you have been living with for years and have never once addressed as spiritual.","And we are going to renew, because deliverance without renewal is a swept room waiting to be reoccupied (Matthew 12:43 to 45)."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Fortress in My Head","subtitle":"","about":["Tonight we locate the fortresses.","Ask the Holy Spirit for the specific sentences. Not themes, sentences. Every stronghold has a sentence at the centre of it, and most people can name theirs in under a minute if they are honest.","I always ruin things eventually. Nobody stays. I am too much. I am not enough. If they really knew me they would leave. This is just how our family is. It is too late for me.","That sentence is the load bearing wall. Tonight we find it and we bring it down."],"scriptures":["2 Corinthians 10:3 to 5","Numbers 13:31 to 33","Proverbs 23:7","Romans 12:2","Isaiah 55:7 to 9","Jeremiah 4:14","Philippians 4:8"],"note":"","points":["Father, tonight expose every stronghold of thought fortified in my mind.","Holy Spirit, give me the exact sentence at the centre of my stronghold. Name it to me now.","Every imagination exalting itself against the knowledge of God in me, I cast you down tonight.","Every high thing built in my mind over years of wrong believing, come down in Jesus' name.","I bring into captivity every thought to the obedience of Christ. 2 Corinthians 10:5.","Every grasshopper image of myself, I reject you in the name of Jesus. I am not a grasshopper.","Every self report I have given that contradicted what God said about me, I retract it now.","Every fortress the enemy holds in my mind after all these years, I lay siege to you tonight.","Lord, my weapons are not carnal but mighty through God to the pulling down of strongholds.","Every lie I have believed so long that it feels like truth, be exposed by the word tonight.","Every thought pattern inherited from my mother and my father, be brought under Christ.","Father, wash my heart from wickedness, that I may be saved. Jeremiah 4:14.","Every mental prison holding my expectations low, be broken in the name of Jesus.","As a man thinketh in his heart, so is he. Lord, correct my thinking and correct my life.","Every stronghold affecting how I see my spouse, be dismantled tonight in Jesus' name.","Every stronghold that keeps me sabotaging good things, be pulled down now.","Lord, let my thoughts be Your thoughts and my ways be Your ways. Isaiah 55:8 to 9.","Every mental agreement I have made with the enemy about my future, I break it tonight.","Father, give me a new inner sentence and let me hear it clearly before this fast ends.","Every generational way of thinking that limits my family, be terminated at my generation.","I decree that my mind is being renewed and my life is being transformed, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Washing With the Water of the Word","subtitle":"","about":["You cannot cast out a thought. You have to replace it.","\"That he might sanctify and cleanse it with the washing of water by the word\" (Ephesians 5:26). Notice the metaphor. Washing. Not a single event. A repeated, ordinary, daily action that removes what has accumulated.","And notice where that verse sits. It is in the middle of Paul's instruction on marriage. The washing of the word is presented as what a husband does for a wife. Words wash people. That is a truth to carry into your home for the rest of your life. This morning we do the replacing. For every lie you identified at midnight, find a verse. Not a general encouraging verse. A verse that specifically contradicts the specific lie. Write them side by side. That page becomes your weapon for the rest of the fast. Jesus modelled this in the wilderness. Three temptations, three responses, all beginning with the same three words: \"It is written.\" He did not argue with the devil. He quoted."],"scriptures":["Ephesians 5:26","Romans 12:2","Psalm 119:9 to 11","John 17:17","Matthew 4:1 to 11","Joshua 1:8","Hebrews 4:12","Colossians 3:16","Philippians 4:8","Isaiah 26:3"],"note":"","points":["Father, wash my mind this morning with the water of Your word.","Every lie identified in me last night, I replace it with the truth of Scripture today.","Lord, be not conformed to this world but transformed by the renewing of my mind. Do the renewing.","Thy word have I hid in mine heart, that I might not sin against thee. Psalm 119:11.","Every empty space where a lie is being evicted, let Your word fill it in Jesus' name.","Lord, teach me to answer the enemy the way Jesus did, with it is written.","Every argument in my head that Scripture has already settled, let me stop reopening it.","Father, let Your word dwell in me richly in all wisdom. Colossians 3:16.","Every meditation on wrong things, be replaced with meditation on whatsoever is true and lovely.","Lord, keep me in perfect peace because my mind is stayed on You. Isaiah 26:3.","Every anxious thought that runs in me on repeat, be brought under the peace of God.","Father, give me discipline for daily washing. Do not let this be a fasting season habit only.","Every word I speak in my home today, let it wash and not wound.","Lord, teach me to speak words over my spouse that cleanse and build.","Every negative word I have been washing my children with, forgive me and correct me today.","Let this book of the law not depart out of my mouth. I will meditate day and night. Joshua 1:8.","Every dullness toward Scripture in me, be broken. Give me hunger for Your word.","Lord, let Your word be quick and powerful in me, dividing between soul and spirit.","Sanctify me through Your truth. Your word is truth. John 17:17.","Every place where my feelings contradict Your word, let Your word have the final say.","I decree that my mind is being washed daily, and what is washed daily stays clean."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"The Orphan Mind and the Poverty Mentality","subtitle":"","about":["Two mindsets, one root. The orphan mind is the belief that you have no father, so everything must be earned, secured, and defended by you alone. Look at the elder brother in Luke 15. He lived in his father's house for years and said, \"Lo, these many years do I serve thee, neither transgressed I at any time thy commandment: and yet thou never gavest me a kid\" (Luke 15:29). His father's answer exposed the whole thing: \"Son, thou art ever with me, and all that I have is thine\" (Luke 15:31).","He had access to everything and enjoyed nothing. Because he had a servant's mind in a son's house.","That is why some of you are exhausted. You are working for what has already been given to you.","The poverty mentality is its financial cousin, and it is not about how much money you have. Israel came out of Egypt with the wealth of Egypt in their hands and still wanted to go back, because you can take a person out of slavery in a day and it takes considerably longer to take slavery out of a person. It shows up as an inability to receive. As guilt when things go well. As sabotage right at the point of increase. As the belief that God is holding out on you. As a scarcity reflex that hoards, or a shame reflex that gives everything away so as not to be seen having something.","And here is why this belongs in a marriage fast: an orphan cannot receive love, and a person with a poverty mentality cannot receive a good spouse. They will find the flaw. They will test it. They will wait for it to be withdrawn. And often, they will withdraw first, to control the timing of an abandonment they are certain is coming.","Today we deal with both."],"scriptures":["Luke 15:25 to 32","Romans 8:15 to 17","John 14:18","Galatians 4:6 to 7","Exodus 16:2 to 3","Numbers 11:4 to 6","Deuteronomy 8:17 to 18","Matthew 6:31 to 33","Philippians 4:19","3 John 2"],"note":"","points":["Father, I renounce the orphan spirit today. I am not fatherless. I am a son and a daughter.","I have not received the spirit of bondage again to fear, but the Spirit of adoption. Romans 8:15.","Every striving in me to earn what has already been given, cease now in the name of Jesus.","Lord, deliver me from the elder brother mindset. Let me enjoy what is already mine.","Every exhaustion born of working for my own security, be replaced with rest in the Father.","I will not leave you comfortless, I will come to you. John 14:18. Thank You, Father.","Every abandonment wound driving my behaviour, be healed today in Jesus' name.","Every poverty mentality inherited from my family line, I break you now in the name of Jesus.","Every slave mentality that survived my deliverance, come out of me today.","Every desire in me to go back to Egypt when the wilderness gets hard, I renounce you.","Every inability in me to receive good things, be broken in the name of Jesus.","Every guilt I feel when something goes well for me, be removed by the Spirit of God.","Every self sabotage at the point of increase, be exposed and be terminated in Jesus' name.","Lord, remove the fear that makes me withdraw before I can be left.","Every scarcity reflex that makes me hoard, be broken. Teach me to hold things open handed.","Father, heal my capacity to receive love from my spouse without testing it.","Every belief that God is withholding good from me, I renounce it. No good thing will He withhold.","Thou shalt remember the Lord thy God, for it is He that giveth thee power to get wealth.","My God shall supply all my need according to His riches in glory by Christ Jesus.","Lord, prosper me even as my soul prospers. Heal the soul first. 3 John 2.","I decree that I think like a son, I live like an heir, and I receive like a beloved child."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Casting Down Imaginations: War in the Realm of Thought","subtitle":"","about":["Tonight is for those who have been fighting in their heads for years and calling it normal. Let us be careful and pastoral here, because two things are true at the same time.","First, some mental suffering is medical, and the church has done enormous damage by pretending otherwise. If you are under a doctor's care, stay under it. Take your medication. There is no shame in it, and there is nothing spiritual about stopping treatment because somebody prayed for you. Discernment is not unbelief.","Second, some mental suffering is spiritual, and the world has done enormous damage by pretending otherwise. Scripture speaks plainly of a spirit of fear (2 Timothy 1:7), of tormentors (Matthew 18:34), of a spirit of heaviness (Isaiah 61:3), and of a distressing spirit that came upon Saul and lifted when David played (1 Samuel 16:14 to 23).","Tonight we deal with the second category, and we deal with it without shame and without fear.","Look at Elijah under the juniper tree in 1 Kings 19. Days after the greatest public victory of his ministry, he asked God to kill him. And look at how heaven responded. No rebuke. No sermon. An angel fed him, and let him sleep, and fed him again (1 Kings 19:5 to 8). God treated the exhaustion before He addressed the theology. There is enormous pastoral wisdom in that. Then at Horeb, God dealt with the lie. Elijah said twice, \"I, even I only, am left\" (1 Kings 19:10, 14). God's answer: \"Yet I have left me seven thousand in Israel\" (1 Kings 19:18). The isolation was a stronghold, not a fact. He was off by seven thousand. Tonight we cast down fear, torment, heaviness, and isolation. If you are struggling tonight, do not fight alone. Speak to somebody. Reach out to a leader. Isolation is the enemy's preferred terrain, and stepping out of it is itself an act of warfare."],"scriptures":["2 Timothy 1:7","1 Kings 19:1 to 18","Isaiah 61:3","Matthew 18:34 to 35","1 Samuel 16:14 to 23","Psalm 42:5 to 11","Psalm 94:19","Isaiah 41:10","Philippians 4:6 to 7","1 Peter 5:7 to 9","Romans 8:38 to 39","John 8:32"],"note":"Stand. Speak to your own soul where the points instruct you to.","points":["God has not given me the spirit of fear, but of power, and of love, and of a sound mind.","Every spirit of fear operating in my life, I cast you out tonight in the name of Jesus.","Every spirit of torment that gained access through unforgiveness, your ground is gone. Leave now.","Every spirit of heaviness on my life, I exchange you tonight for the garment of praise.","Every voice speaking to me that is not the voice of God, be permanently silenced in Jesus' name.","Why art thou cast down, O my soul? Hope thou in God. I speak to my own soul tonight.","Every suicidal thought and every thought of self destruction, I reject you in the name of Jesus.","Every lie of isolation telling me I am the only one left, be broken. There are seven thousand.","Lord, send me the ministry of the angel. Feed me, let me rest, and speak to me at Horeb.","Every mental exhaustion in me, be replaced with the strength that comes from God tonight.","Every anxiety I have been carrying, I cast it upon Him, for He careth for me. 1 Peter 5:7.","Let the peace of God which passeth all understanding keep my heart and my mind. Philippians 4:7.","In the multitude of my thoughts within me, let Your comforts delight my soul. Psalm 94:19.","Every panic that rises in my bod
