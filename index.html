 well was there. Jesus therefore, being wearied with his journey, sat thus on the well: and it was about the sixth hour."],[4,7,"There cometh a woman of Samaria to draw water: Jesus saith unto her, Give me to drink."],[4,8,"(For his disciples were gone away unto the city to buy meat.)"],[4,9,"Then saith the woman of Samaria unto him, How is it that thou, being a Jew, askest drink of me, which am a woman of Samaria? for the Jews have no dealings with the Samaritans."],[4,10,"Jesus answered and said unto her, If thou knewest the gift of God, and who it is that saith to thee, Give me to drink; thou wouldest have asked of him, and he would have given thee living water."],[4,11,"The woman saith unto him, Sir, thou hast nothing to draw with, and the well is deep: from whence then hast thou that living water?"],[4,12,"Art thou greater than our father Jacob, which gave us the well, and drank thereof himself, and his children, and his cattle?"],[4,13,"Jesus answered and said unto her, Whosoever drinketh of this water shall thirst again:"],[4,14,"But whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall be in him a well of water springing up into everlasting life."],[4,15,"The woman saith unto him, Sir, give me this water, that I thirst not, neither come hither to draw."],[4,28,"The woman then left her waterpot, and went her way into the city, and saith to the men,"],[4,29,"Come, see a man, which told me all things that ever I did: is not this the Christ?"]],"John 5:5 to 9":[[5,5,"And a certain man was there, which had an infirmity thirty and eight years."],[5,6,"When Jesus saw him lie, and knew that he had been now a long time in that case, he saith unto him, Wilt thou be made whole?"],[5,7,"The impotent man answered him, Sir, I have no man, when the water is troubled, to put me into the pool: but while I am coming, another steppeth down before me."],[5,8,"Jesus saith unto him, Rise, take up thy bed, and walk."],[5,9,"And immediately the man was made whole, and took up his bed, and walked: and on the same day was the sabbath."]],"John 7:37 to 39":[[7,37,"In the last day, that great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink."],[7,38,"He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water."],[7,39,"(But this spake he of the Spirit, which they that believe on him should receive: for the Holy Ghost was not yet given; because that Jesus was not yet glorified.)"]],"John 8:32":[[8,32,"And ye shall know the truth, and the truth shall make you free."]],"John 9:25":[[9,25,"He answered and said, Whether he be a sinner or no, I know not: one thing I know, that, whereas I was blind, now I see."]],"Joshua 13:1":[[13,1,"Now Joshua was old and stricken in years; and the LORD said unto him, Thou art old and stricken in years, and there remaineth yet very much land to be possessed."]],"Joshua 1:1 to 3":[[1,1,"Now after the death of Moses the servant of the LORD it came to pass, that the LORD spake unto Joshua the son of Nun, Moses’ minister, saying,"],[1,2,"Moses my servant is dead; now therefore arise, go over this Jordan, thou, and all this people, unto the land which I do give to them, even to the children of Israel."],[1,3,"Every place that the sole of your foot shall tread upon, that have I given unto you, as I said unto Moses."]],"Joshua 1:1 to 9":[[1,1,"Now after the death of Moses the servant of the LORD it came to pass, that the LORD spake unto Joshua the son of Nun, Moses’ minister, saying,"],[1,2,"Moses my servant is dead; now therefore arise, go over this Jordan, thou, and all this people, unto the land which I do give to them, even to the children of Israel."],[1,3,"Every place that the sole of your foot shall tread upon, that have I given unto you, as I said unto Moses."],[1,4,"From the wilderness and this Lebanon even unto the great river, the river Euphrates, all the land of the Hittites, and unto the great sea toward the going down of the sun, shall be your coast."],[1,5,"There shall not any man be able to stand before thee all the days of thy life: as I was with Moses, so I will be with thee: I will not fail thee, nor forsake thee."],[1,6,"Be strong and of a good courage: for unto this people shalt thou divide for an inheritance the land, which I sware unto their fathers to give them."],[1,7,"Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left, that thou mayest prosper whithersoever thou goest."],[1,8,"This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success."],[1,9,"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."]],"Joshua 1:5 to 9":[[1,5,"There shall not any man be able to stand before thee all the days of thy life: as I was with Moses, so I will be with thee: I will not fail thee, nor forsake thee."],[1,6,"Be strong and of a good courage: for unto this people shalt thou divide for an inheritance the land, which I sware unto their fathers to give them."],[1,7,"Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left, that thou mayest prosper whithersoever thou goest."],[1,8,"This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success."],[1,9,"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."]],"Joshua 1:8":[[1,8,"This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success."]],"Joshua 21:44":[[21,44,"And the LORD gave them rest round about, according to all that he sware unto their fathers: and there stood not a man of all their enemies before them; the LORD delivered all their enemies into their hand."]],"Joshua 24:13":[[24,13,"And I have given you a land for which ye did not labour, and cities which ye built not, and ye dwell in them; of the vineyards and oliveyards which ye planted not do ye eat."]],"Joshua 24:14 to 15":[[24,14,"Now therefore fear the LORD, and serve him in sincerity and in truth: and put away the gods which your fathers served on the other side of the flood, and in Egypt; and serve ye the LORD."],[24,15,"And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD."]],"Joshua 24:14 to 27":[[24,14,"Now therefore fear the LORD, and serve him in sincerity and in truth: and put away the gods which your fathers served on the other side of the flood, and in Egypt; and serve ye the LORD."],[24,15,"And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD."],[24,16,"And the people answered and said, God forbid that we should forsake the LORD, to serve other gods;"],[24,17,"For the LORD our God, he it is that brought us up and our fathers out of the land of Egypt, from the house of bondage, and which did those great signs in our sight, and preserved us in all the way wherein we went, and among all the people through whom we passed:"],[24,18,"And the LORD drave out from before us all the people, even the Amorites which dwelt in the land: therefore will we also serve the LORD; for he is our God."],[24,19,"And Joshua said unto the people, Ye cannot serve the LORD: for he is an holy God; he is a jealous God; he will not forgive your transgressions nor your sins."],[24,20,"If ye forsake the LORD, and serve strange gods, then he will turn and do you hurt, and consume you, after that he hath done you good."],[24,21,"And the people said unto Joshua, Nay; but we will serve the LORD."],[24,22,"And Joshua said unto the people, Ye are witnesses against yourselves that ye have chosen you the LORD, to serve him. And they said, We are witnesses."],[24,23,"Now therefore put away, said he, the strange gods which are among you, and incline your heart unto the LORD God of Israel."],[24,24,"And the people said unto Joshua, The LORD our God will we serve, and his voice will we obey."],[24,25,"So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem."],[24,26,"And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the LORD."],[24,27,"And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the LORD which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God."]],"Joshua 24:15":[[24,15,"And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD."]],"Joshua 4:1 to 24":[[4,1,"And it came to pass, when all the people were clean passed over Jordan, that the LORD spake unto Joshua, saying,"],[4,2,"Take you twelve men out of the people, out of every tribe a man,"],[4,3,"And command ye them, saying, Take you hence out of the midst of Jordan, out of the place where the priests’ feet stood firm, twelve stones, and ye shall carry them over with you, and leave them in the lodging place, where ye shall lodge this night."],[4,4,"Then Joshua called the twelve men, whom he had prepared of the children of Israel, out of every tribe a man:"],[4,5,"And Joshua said unto them, Pass over before the ark of the LORD your God into the midst of Jordan, and take ye up every man of you a stone upon his shoulder, according unto the number of the tribes of the children of Israel:"],[4,6,"That this may be a sign among you, that when your children ask their fathers in time to come, saying, What mean ye by these stones?"],[4,7,"Then ye shall answer them, That the waters of Jordan were cut off before the ark of the covenant of the LORD; when it passed over Jordan, the waters of Jordan were cut off: and these stones shall be for a memorial unto the children of Israel for ever."],[4,8,"And the children of Israel did so as Joshua commanded, and took up twelve stones out of the midst of Jordan, as the LORD spake unto Joshua, according to the number of the tribes of the children of Israel, and carried them over with them unto the place where they lodged, and laid them down there."],[4,9,"And Joshua set up twelve stones in the midst of Jordan, in the place where the feet of the priests which bare the ark of the covenant stood: and they are there unto this day."],[4,10,"For the priests which bare the ark stood in the midst of Jordan, until every thing was finished that the LORD commanded Joshua to speak unto the people, according to all that Moses commanded Joshua: and the people hasted and passed over."],[4,11,"And it came to pass, when all the people were clean passed over, that the ark of the LORD passed over, and the priests, in the presence of the people."],[4,12,"And the children of Reuben, and the children of Gad, and half the tribe of Manasseh, passed over armed before the children of Israel, as Moses spake unto them:"],[4,13,"About forty thousand prepared for war passed over before the LORD unto battle, to the plains of Jericho."],[4,14,"On that day the LORD magnified Joshua in the sight of all Israel; and they feared him, as they feared Moses, all the days of his life."],[4,15,"And the LORD spake unto Joshua, saying,"],[4,16,"Command the priests that bear the ark of the testimony, that they come up out of Jordan."],[4,17,"Joshua therefore commanded the priests, saying, Come ye up out of Jordan."],[4,18,"And it came to pass, when the priests that bare the ark of the covenant of the LORD were come up out of the midst of Jordan, and the soles of the priests’ feet were lifted up unto the dry land, that the waters of Jordan returned unto their place, and flowed over all his banks, as they did before."],[4,19,"And the people came up out of Jordan on the tenth day of the first month, and encamped in Gilgal, in the east border of Jericho."],[4,20,"And those twelve stones, which they took out of Jordan, did Joshua pitch in Gilgal."],[4,21,"And he spake unto the children of Israel, saying, When your children shall ask their fathers in time to come, saying, What mean these stones?"],[4,22,"Then ye shall let your children know, saying, Israel came over this Jordan on dry land."],[4,23,"For the LORD your God dried up the waters of Jordan from before you, until ye were passed over, as the LORD your God did to the Red sea, which he dried up from before us, until we were gone over:"],[4,24,"That all the people of the earth might know the hand of the LORD, that it is mighty: that ye might fear the LORD your God for ever."]],"Joshua 4:1 to 9":[[4,1,"And it came to pass, when all the people were clean passed over Jordan, that the LORD spake unto Joshua, saying,"],[4,2,"Take you twelve men out of the people, out of every tribe a man,"],[4,3,"And command ye them, saying, Take you hence out of the midst of Jordan, out of the place where the priests’ feet stood firm, twelve stones, and ye shall carry them over with you, and leave them in the lodging place, where ye shall lodge this night."],[4,4,"Then Joshua called the twelve men, whom he had prepared of the children of Israel, out of every tribe a man:"],[4,5,"And Joshua said unto them, Pass over before the ark of the LORD your God into the midst of Jordan, and take ye up every man of you a stone upon his shoulder, according unto the number of the tribes of the children of Israel:"],[4,6,"That this may be a sign among you, that when your children ask their fathers in time to come, saying, What mean ye by these stones?"],[4,7,"Then ye shall answer them, That the waters of Jordan were cut off before the ark of the covenant of the LORD; when it passed over Jordan, the waters of Jordan were cut off: and these stones shall be for a memorial unto the children of Israel for ever."],[4,8,"And the children of Israel did so as Joshua commanded, and took up twelve stones out of the midst of Jordan, as the LORD spake unto Joshua, according to the number of the tribes of the children of Israel, and carried them over with them unto the place where they lodged, and laid them down there."],[4,9,"And Joshua set up twelve stones in the midst of Jordan, in the place where the feet of the priests which bare the ark of the covenant stood: and they are there unto this day."]],"Joshua 6:16 to 20":[[6,16,"And it came to pass at the seventh time, when the priests blew with the trumpets, Joshua said unto the people, Shout; for the LORD hath given you the city."],[6,17,"And the city shall be accursed, even it, and all that are therein, to the LORD: only Rahab the harlot shall live, she and all that are with her in the house, because she hid the messengers that we sent."],[6,18,"And ye, in any wise keep yourselves from the accursed thing, lest ye make yourselves accursed, when ye take of the accursed thing, and make the camp of Israel a curse, and trouble it."],[6,19,"But all the silver, and gold, and vessels of brass and iron, are consecrated unto the LORD: they shall come into the treasury of the LORD."],[6,20,"So the people shouted when the priests blew with the trumpets: and it came to pass, when the people heard the sound of the trumpet, and the people shouted with a great shout, that the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city."]],"Joshua 6:20":[[6,20,"So the people shouted when the priests blew with the trumpets: and it came to pass, when the people heard the sound of the trumpet, and the people shouted with a great shout, that the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city."]],"Joshua 9:3 to 20":[[9,3,"And when the inhabitants of Gibeon heard what Joshua had done unto Jericho and to Ai,"],[9,4,"They did work wilily, and went and made as if they had been ambassadors, and took old sacks upon their asses, and wine bottles, old, and rent, and bound up;"],[9,5,"And old shoes and clouted upon their feet, and old garments upon them; and all the bread of their provision was dry and mouldy."],[9,6,"And they went to Joshua unto the camp at Gilgal, and said unto him, and to the men of Israel, We be come from a far country: now therefore make ye a league with us."],[9,7,"And the men of Israel said unto the Hivites, Peradventure ye dwell among us; and how shall we make a league with you?"],[9,8,"And they said unto Joshua, We are thy servants. And Joshua said unto them, Who are ye? and from whence come ye?"],[9,9,"And they said unto him, From a very far country thy servants are come because of the name of the LORD thy God: for we have heard the fame of him, and all that he did in Egypt,"],[9,10,"And all that he did to the two kings of the Amorites, that were beyond Jordan, to Sihon king of Heshbon, and to Og king of Bashan, which was at Ashtaroth."],[9,11,"Wherefore our elders and all the inhabitants of our country spake to us, saying, Take victuals with you for the journey, and go to meet them, and say unto them, We are your servants: therefore now make ye a league with us."],[9,12,"This our bread we took hot for our provision out of our houses on the day we came forth to go unto you; but now, behold, it is dry, and it is mouldy:"],[9,13,"And these bottles of wine, which we filled, were new; and, behold, they be rent: and these our garments and our shoes are become old by reason of the very long journey."],[9,14,"And the men took of their victuals, and asked not counsel at the mouth of the LORD."],[9,15,"And Joshua made peace with them, and made a league with them, to let them live: and the princes of the congregation sware unto them."],[9,16,"And it came to pass at the end of three days after they had made a league with them, that they heard that they were their neighbours, and that they dwelt among them."],[9,17,"And the children of Israel journeyed, and came unto their cities on the third day. Now their cities were Gibeon, and Chephirah, and Beeroth, and Kirjath-jearim."],[9,18,"And the children of Israel smote them not, because the princes of the congregation had sworn unto them by the LORD God of Israel. And all the congregation murmured against the princes."],[9,19,"But all the princes said unto all the congregation, We have sworn unto them by the LORD God of Israel: now therefore we may not touch them."],[9,20,"This we will do to them; we will even let them live, lest wrath be upon us, because of the oath which we sware unto them."]],"Jude 20":[[1,20,"But ye, beloved, building up yourselves on your most holy faith, praying in the Holy Ghost,"]],"Jude 20 to 21":[[1,20,"But ye, beloved, building up yourselves on your most holy faith, praying in the Holy Ghost,"],[1,21,"Keep yourselves in the love of God, looking for the mercy of our Lord Jesus Christ unto eternal life."]],"Judges 13:2 to 3":[[13,2,"And there was a certain man of Zorah, of the family of the Danites, whose name was Manoah; and his wife was barren, and bare not."],[13,3,"And the angel of the LORD appeared unto the woman, and said unto her, Behold now, thou art barren, and bearest not: but thou shalt conceive, and bear a son."]],"Judges 16:4 to 21":[[16,4,"And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name was Delilah."],[16,5,"And the lords of the Philistines came up unto her, and said unto her, Entice him, and see wherein his great strength lieth, and by what means we may prevail against him, that we may bind him to afflict him: and we will give thee every one of us eleven hundred pieces of silver."],[16,6,"And Delilah said to Samson, Tell me, I pray thee, wherein thy great strength lieth, and wherewith thou mightest be bound to afflict thee."],[16,7,"And Samson said unto her, If they bind me with seven green withs that were never dried, then shall I be weak, and be as another man."],[16,8,"Then the lords of the Philistines brought up to her seven green withs which had not been dried, and she bound him with them."],[16,9,"Now there were men lying in wait, abiding with her in the chamber. And she said unto him, The Philistines be upon thee, Samson. And he brake the withs, as a thread of tow is broken when it toucheth the fire. So his strength was not known."],[16,10,"And Delilah said unto Samson, Behold, thou hast mocked me, and told me lies: now tell me, I pray thee, wherewith thou mightest be bound."],[16,11,"And he said unto her, If they bind me fast with new ropes that never were occupied, then shall I be weak, and be as another man."],[16,12,"Delilah therefore took new ropes, and bound him therewith, and said unto him, The Philistines be upon thee, Samson. And there were liers in wait abiding in the chamber. And he brake them from off his arms like a thread."],[16,13,"And Delilah said unto Samson, Hitherto thou hast mocked me, and told me lies: tell me wherewith thou mightest be bound. And he said unto her, If thou weavest the seven locks of my head with the web."],[16,14,"And she fastened it with the pin, and said unto him, The Philistines be upon thee, Samson. And he awaked out of his sleep, and went away with the pin of the beam, and with the web."],[16,15,"And she said unto him, How canst thou say, I love thee, when thine heart is not with me? thou hast mocked me these three times, and hast not told me wherein thy great strength lieth."],[16,16,"And it came to pass, when she pressed him daily with her words, and urged him, so that his soul was vexed unto death;"],[16,17,"That he told her all his heart, and said unto her, There hath not come a razor upon mine head; for I have been a Nazarite unto God from my mother’s womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any other man."],[16,18,"And when Delilah saw that he had told her all his heart, she sent and called for the lords of the Philistines, saying, Come up this once, for he hath shewed me all his heart. Then the lords of the Philistines came up unto her, and brought money in their hand."],[16,19,"And she made him sleep upon her knees; and she called for a man, and she caused him to shave off the seven locks of his head; and she began to afflict him, and his strength went from him."],[16,20,"And she said, The Philistines be upon thee, Samson. And he awoke out of his sleep, and said, I will go out as at other times before, and shake myself. And he wist not that the LORD was departed from him."],[16,21,"But the Philistines took him, and put out his eyes, and brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison house."]],"Judges 1:1 to 2":[[1,1,"Now after the death of Joshua it came to pass, that the children of Israel asked the LORD, saying, Who shall go up for us against the Canaanites first, to fight against them?"],[1,2,"And the LORD said, Judah shall go up: behold, I have delivered the land into his hand."]],"Judges 1:19":[[1,19,"And the LORD was with Judah; and he drave out the inhabitants of the mountain; but could not drive out the inhabitants of the valley, because they had chariots of iron."]],"Judges 6:1 to 6, 25 to 27":[[6,1,"And the children of Israel did evil in the sight of the LORD: and the LORD delivered them into the hand of Midian seven years."],[6,2,"And the hand of Midian prevailed against Israel: and because of the Midianites the children of Israel made them the dens which are in the mountains, and caves, and strong holds."],[6,3,"And so it was, when Israel had sown, that the Midianites came up, and the Amalekites, and the children of the east, even they came up against them;"],[6,4,"And they encamped against them, and destroyed the increase of the earth, till thou come unto Gaza, and left no sustenance for Israel, neither sheep, nor ox, nor ass."],[6,5,"For they came up with their cattle and their tents, and they came as grasshoppers for multitude; for both they and their camels were without number: and they entered into the land to destroy it."],[6,6,"And Israel was greatly impoverished because of the Midianites; and the children of Israel cried unto the LORD."],[6,25,"And it came to pass the same night, that the LORD said unto him, Take thy father’s young bullock, even the second bullock of seven years old, and throw down the altar of Baal that thy father hath, and cut down the grove that is by it:"],[6,26,"And build an altar unto the LORD thy God upon the top of this rock, in the ordered place, and take the second bullock, and offer a burnt sacrifice with the wood of the grove which thou shalt cut down."],[6,27,"Then Gideon took ten men of his servants, and did as the LORD had said unto him: and so it was, because he feared his father’s household, and the men of the city, that he could not do it by day, that he did it by night."]],"Judges 6:12":[[6,12,"And the angel of the LORD appeared unto him, and said unto him, The LORD is with thee, thou mighty man of valour."]],"Judges 6:25 to 32":[[6,25,"And it came to pass the same night, that the LORD said unto him, Take thy father’s young bullock, even the second bullock of seven years old, and throw down the altar of Baal that thy father hath, and cut down the grove that is by it:"],[6,26,"And build an altar unto the LORD thy God upon the top of this rock, in the ordered place, and take the second bullock, and offer a burnt sacrifice with the wood of the grove which thou shalt cut down."],[6,27,"Then Gideon took ten men of his servants, and did as the LORD had said unto him: and so it was, because he feared his father’s household, and the men of the city, that he could not do it by day, that he did it by night."],[6,28,"And when the men of the city arose early in the morning, behold, the altar of Baal was cast down, and the grove was cut down that was by it, and the second bullock was offered upon the altar that was built."],[6,29,"And they said one to another, Who hath done this thing? And when they enquired and asked, they said, Gideon the son of Joash hath done this thing."],[6,30,"Then the men of the city said unto Joash, Bring out thy son, that he may die: because he hath cast down the altar of Baal, and because he hath cut down the grove that was by it."],[6,31,"And Joash said unto all that stood against him, Will ye plead for Baal? will ye save him? he that will plead for him, let him be put to death whilst it is yet morning: if he be a god, let him plead for himself, because one hath cast down his altar."],[6,32,"Therefore on that day he called him Jerubbaal, saying, Let Baal plead against him, because he hath thrown down his altar."]],"Lamentations 2:19":[[2,19,"Arise, cry out in the night: in the beginning of the watches pour out thine heart like water before the face of the Lord: lift up thy hands toward him for the life of thy young children, that faint for hunger in the top of every street."]],"Lamentations 3:22 to 23":[[3,22,"It is of the LORD’s mercies that we are not consumed, because his compassions fail not."],[3,23,"They are new every morning: great is thy faithfulness."]],"Lamentations 3:40":[[3,40,"Let us search and try our ways, and turn again to the LORD."]],"Leviticus 10:1 to 3":[[10,1,"And Nadab and Abihu, the sons of Aaron, took either of them his censer, and put fire therein, and put incense thereon, and offered strange fire before the LORD, which he commanded them not."],[10,2,"And there went out fire from the LORD, and devoured them, and they died before the LORD."],[10,3,"Then Moses said unto Aaron, This is it that the LORD spake, saying, I will be sanctified in them that come nigh me, and before all the people I will be glorified. And Aaron held his peace."]],"Leviticus 17:11":[[17,11,"For the life of the flesh is in the blood: and I have given it to you upon the altar to make an atonement for your souls: for it is the blood that maketh an atonement for the soul."]],"Leviticus 26:40 to 42":[[26,40,"If they shall confess their iniquity, and the iniquity of their fathers, with their trespass which they trespassed against me, and that also they have walked contrary unto me;"],[26,41,"And that I also have walked contrary unto them, and have brought them into the land of their enemies; if then their uncircumcised hearts be humbled, and they then accept of the punishment of their iniquity:"],[26,42,"Then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land."]],"Luke 10:19":[[10,19,"Behold, I give unto you power to tread on serpents and scorpions, and over all the power of the enemy: and nothing shall by any means hurt you."]],"Luke 11:13":[[11,13,"If ye then, being evil, know how to give good gifts unto your children: how much more shall your heavenly Father give the Holy Spirit to them that ask him?"]],"Luke 12:2 to 3":[[12,2,"For there is nothing covered, that shall not be revealed; neither hid, that shall not be known."],[12,3,"Therefore whatsoever ye have spoken in darkness shall be heard in the light; and that which ye have spoken in the ear in closets shall be proclaimed upon the housetops."]],"Luke 12:6 to 7":[[12,6,"Are not five sparrows sold for two farthings, and not one of them is forgotten before God?"],[12,7,"But even the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows."]],"Luke 13:11 to 16":[[13,11,"And, behold, there was a woman which had a spirit of infirmity eighteen years, and was bowed together, and could in no wise lift up herself."],[13,12,"And when Jesus saw her, he called her to him, and said unto her, Woman, thou art loosed from thine infirmity."],[13,13,"And he laid his hands on her: and immediately she was made straight, and glorified God."],[13,14,"And the ruler of the synagogue answered with indignation, because that Jesus had healed on the sabbath day, and said unto the people, There are six days in which men ought to work: in them therefore come and be healed, and not on the sabbath day."],[13,15,"The Lord then answered him, and said, Thou hypocrite, doth not each one of you on the sabbath loose his ox or his ass from the stall, and lead him away to watering?"],[13,16,"And ought not this woman, being a daughter of Abraham, whom Satan hath bound, lo, these eighteen years, be loosed from this bond on the sabbath day?"]],"Luke 14:28 to 30":[[14,28,"For which of you, intending to build a tower, sitteth not down first, and counteth the cost, whether he have sufficient to finish it?"],[14,29,"Lest haply, after he hath laid the foundation, and is not able to finish it, all that behold it begin to mock him,"],[14,30,"Saying, This man began to build, and was not able to finish."]],"Luke 15:17 to 24":[[15,17,"And when he came to himself, he said, How many hired servants of my father’s have bread enough and to spare, and I perish with hunger!"],[15,18,"I will arise and go to my father, and will say unto him, Father, I have sinned against heaven, and before thee,"],[15,19,"And am no more worthy to be called thy son: make me as one of thy hired servants."],[15,20,"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."],[15,21,"And the son said unto him, Father, I have sinned against heaven, and in thy sight, and am no more worthy to be called thy son."],[15,22,"But the father said to his servants, Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet:"],[15,23,"And bring hither the fatted calf, and kill it; and let us eat, and be merry:"],[15,24,"For this my son was dead, and is alive again; he was lost, and is found. And they began to be merry."]],"Luke 15:22 to 24":[[15,22,"But the father said to his servants, Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet:"],[15,23,"And bring hither the fatted calf, and kill it; and let us eat, and be merry:"],[15,24,"For this my son was dead, and is alive again; he was lost, and is found. And they began to be merry."]],"Luke 15:25 to 32":[[15,25,"Now his elder son was in the field: and as he came and drew nigh to the house, he heard musick and dancing."],[15,26,"And he called one of the servants, and asked what these things meant."],[15,27,"And he said unto him, Thy brother is come; and thy father hath killed the fatted calf, because he hath received him safe and sound."],[15,28,"And he was angry, and would not go in: therefore came his father out, and intreated him."],[15,29,"And he answering said to his father, Lo, these many years do I serve thee, neither transgressed I at any time thy commandment: and yet thou never gavest me a kid, that I might make merry with my friends:"],[15,30,"But as soon as this thy son was come, which hath devoured thy living with harlots, thou hast killed for him the fatted calf."],[15,31,"And he said unto him, Son, thou art ever with me, and all that I have is thine."],[15,32,"It was meet that we should make merry, and be glad: for this thy brother was dead, and is alive again; and was lost, and is found."]],"Luke 18:1 to 8":[[18,1,"And he spake a parable unto them to this end, that men ought always to pray, and not to faint;"],[18,2,"Saying, There was in a city a judge, which feared not God, neither regarded man:"],[18,3,"And there was a widow in that city; and she came unto him, saying, Avenge me of mine adversary."],[18,4,"And he would not for a while: but afterward he said within himself, Though I fear not God, nor regard man;"],[18,5,"Yet because this widow troubleth me, I will avenge her, lest by her continual coming she weary me."],[18,6,"And the Lord said, Hear what the unjust judge saith."],[18,7,"And shall not God avenge his own elect, which cry day and night unto him, though he bear long with them?"],[18,8,"I tell you that he will avenge them speedily. Nevertheless when the Son of man cometh, shall he find faith on the earth?"]],"Luke 19:8":[[19,8,"And Zacchæus stood, and said unto the Lord; Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold."]],"Luke 1:5 to 25":[[1,5,"There was in the days of Herod, the king of Judæa, a certain priest named Zacharias, of the course of Abia: and his wife was of the daughters of Aaron, and her name was Elisabeth."],[1,6,"And they were both righteous before God, walking in all the commandments and ordinances of the Lord blameless."],[1,7,"And they had no child, because that Elisabeth was barren, and they both were now well stricken in years."],[1,8,"And it came to pass, that while he executed the priest’s office before God in the order of his course,"],[1,9,"According to the custom of the priest’s office, his lot was to burn incense when he went into the temple of the Lord."],[1,10,"And the whole multitude of the people were praying without at the time of incense."],[1,11,"And there appeared unto him an angel of the Lord standing on the right side of the altar of incense."],[1,12,"And when Zacharias saw him, he was troubled, and fear fell upon him."],[1,13,"But the angel said unto him, Fear not, Zacharias: for thy prayer is heard; and thy wife Elisabeth shall bear thee a son, and thou shalt call his name John."],[1,14,"And thou shalt have joy and gladness; and many shall rejoice at his birth."],[1,15,"For he shall be great in the sight of the Lord, and shall drink neither wine nor strong drink; and he shall be filled with the Holy Ghost, even from his mother’s womb."],[1,16,"And many of the children of Israel shall he turn to the Lord their God."],[1,17,"And he shall go before him in the spirit and power of Elias, to turn the hearts of the fathers to the children, and the disobedient to the wisdom of the just; to make ready a people prepared for the Lord."],[1,18,"And Zacharias said unto the angel, Whereby shall I know this? for I am an old man, and my wife well stricken in years."],[1,19,"And the angel answering said unto him, I am Gabriel, that stand in the presence of God; and am sent to speak unto thee, and to shew thee these glad tidings."],[1,20,"And, behold, thou shalt be dumb, and not able to speak, until the day that these things shall be performed, because thou believest not my words, which shall be fulfilled in their season."],[1,21,"And the people waited for Zacharias, and marvelled that he tarried so long in the temple."],[1,22,"And when he came out, he could not speak unto them: and they perceived that he had seen a vision in the temple: for he beckoned unto them, and remained speechless."],[1,23,"And it came to pass, that, as soon as the days of his ministration were accomplished, he departed to his own house."],[1,24,"And after those days his wife Elisabeth conceived, and hid herself five months, saying,"],[1,25,"Thus hath the Lord dealt with me in the days wherein he looked on me, to take away my reproach among men."]],"Luke 22:31 to 32":[[22,31,"And the Lord said, Simon, Simon, behold, Satan hath desired to have you, that he may sift you as wheat:"],[22,32,"But I have prayed for thee, that thy faith fail not: and when thou art converted, strengthen thy brethren."]],"Luke 24:15 to 16, 31":[[24,15,"And it came to pass, that, while they communed together and reasoned, Jesus himself drew near, and went with them."],[24,16,"But their eyes were holden that they should not know him."],[24,31,"And their eyes were opened, and they knew him; and he vanished out of their sight."]],"Luke 24:2":[[24,2,"And they found the stone rolled away from the sepulchre."]],"Luke 24:49":[[24,49,"And, behold, I send the promise of my Father upon you: but tarry ye in the city of Jerusalem, until ye be endued with power from on high."]],"Luke 3:9":[[3,9,"And now also the axe is laid unto the root of the trees: every tree therefore which bringeth not forth good fruit is hewn down, and cast into the fire."]],"Luke 4:18 to 19":[[4,18,"The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised,"],[4,19,"To preach the acceptable year of the Lord."]],"Luke 5:16":[[5,16,"And he withdrew himself into the wilderness, and prayed."]],"Luke 6:27 to 28":[[6,27,"But I say unto you which hear, Love your enemies, do good to them which hate you,"],[6,28,"Bless them that curse you, and pray for them which despitefully use you."]],"Luke 6:38":[[6,38,"Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye mete withal it shall be measured to you again."]],"Luke 8:17":[[8,17,"For nothing is secret, that shall not be made manifest; neither any thing hid, that shall not be known and come abroad."]],"Malachi 2:13 to 16":[[2,13,"And this have ye done again, covering the altar of the LORD with tears, with weeping, and with crying out, insomuch that he regardeth not the offering any more, or receiveth it with good will at your hand."],[2,14,"Yet ye say, Wherefore? Because the LORD hath been witness between thee and the wife of thy youth, against whom thou hast dealt treacherously: yet is she thy companion, and the wife of thy covenant."],[2,15,"And did not he make one? Yet had he the residue of the spirit. And wherefore one? That he might seek a godly seed. Therefore take heed to your spirit, and let none deal treacherously against the wife of his youth."],[2,16,"For the LORD, the God of Israel, saith that he hateth putting away: for one covereth violence with his garment, saith the LORD of hosts: therefore take heed to your spirit, that ye deal not treacherously."]],"Malachi 2:14 to 15":[[2,14,"Yet ye say, Wherefore? Because the LORD hath been witness between thee and the wife of thy youth, against whom thou hast dealt treacherously: yet is she thy companion, and the wife of thy covenant."],[2,15,"And did not he make one? Yet had he the residue of the spirit. And wherefore one? That he might seek a godly seed. Therefore take heed to your spirit, and let none deal treacherously against the wife of his youth."]],"Malachi 2:14 to 16":[[2,14,"Yet ye say, Wherefore? Because the LORD hath been witness between thee and the wife of thy youth, against whom thou hast dealt treacherously: yet is she thy companion, and the wife of thy covenant."],[2,15,"And did not he make one? Yet had he the residue of the spirit. And wherefore one? That he might seek a godly seed. Therefore take heed to your spirit, and let none deal treacherously against the wife of his youth."],[2,16,"For the LORD, the God of Israel, saith that he hateth putting away: for one covereth violence with his garment, saith the LORD of hosts: therefore take heed to your spirit, that ye deal not treacherously."]],"Malachi 3:10 to 11":[[3,10,"Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it."],[3,11,"And I will rebuke the devourer for your sakes, and he shall not destroy the fruits of your ground; neither shall your vine cast her fruit before the time in the field, saith the LORD of hosts."]],"Malachi 3:16":[[3,16,"Then they that feared the LORD spake often one to another: and the LORD hearkened, and heard it, and a book of remembrance was written before him for them that feared the LORD, and that thought upon his name."]],"Malachi 3:8 to 12":[[3,8,"Will a man rob God? Yet ye have robbed me. But ye say, Wherein have we robbed thee? In tithes and offerings."],[3,9,"Ye are cursed with a curse: for ye have robbed me, even this whole nation."],[3,10,"Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it."],[3,11,"And I will rebuke the devourer for your sakes, and he shall not destroy the fruits of your ground; neither shall your vine cast her fruit before the time in the field, saith the LORD of hosts."],[3,12,"And all nations shall call you blessed: for ye shall be a delightsome land, saith the LORD of hosts."]],"Malachi 4:2":[[4,2,"But unto you that fear my name shall the Sun of righteousness arise with healing in his wings; and ye shall go forth, and grow up as calves of the stall."]],"Malachi 4:6":[[4,6,"And he shall turn the heart of the fathers to the children, and the heart of the children to their fathers, lest I come and smite the earth with a curse."]],"Mark 11:22 to 23":[[11,22,"And Jesus answering saith unto them, Have faith in God."],[11,23,"For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith."]],"Mark 11:22 to 24":[[11,22,"And Jesus answering saith unto them, Have faith in God."],[11,23,"For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith."],[11,24,"Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them."]],"Mark 11:25 to 26":[[11,25,"And when ye stand praying, forgive, if ye have ought against any: that your Father also which is in heaven may forgive you your trespasses."],[11,26,"But if ye do not forgive, neither will your Father which is in heaven forgive your trespasses."]],"Mark 16:3 to 4":[[16,3,"And they said among themselves, Who shall roll us away the stone from the door of the sepulchre?"],[16,4,"And when they looked, they saw that the stone was rolled away: for it was very great."]],"Mark 6:4 to 6":[[6,4,"But Jesus said unto them, A prophet is not without honour, but in his own country, and among his own kin, and in his own house."],[6,5,"And he could there do no mighty work, save that he laid his hands upon a few sick folk, and healed them."],[6,6,"And he marvelled because of their unbelief. And he went round about the villages, teaching."]],"Mark 9:20 to 27":[[9,20,"And they brought him unto him: and when he saw him, straightway the spirit tare him; and he fell on the ground, and wallowed foaming."],[9,21,"And he asked his father, How long is it ago since this came unto him? And he said, Of a child."],[9,22,"And ofttimes it hath cast him into the fire, and into the waters, to destroy him: but if thou canst do any thing, have compassion on us, and help us."],[9,23,"Jesus said unto him, If thou canst believe, all things are possible to him that believeth."],[9,24,"And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief."],[9,25,"When Jesus saw that the people came running together, he rebuked the foul spirit, saying unto him, Thou dumb and deaf spirit, I charge thee, come out of him, and enter no more into him."],[9,26,"And the spirit cried, and rent him sore, and came out of him: and he was as one dead; insomuch that many said, He is dead."],[9,27,"But Jesus took him by the hand, and lifted him up; and he arose."]],"Matthew 11:12":[[11,12,"And from the days of John the Baptist until now the kingdom of heaven suffereth violence, and the violent take it by force."]],"Matthew 12:25":[[12,25,"And Jesus knew their thoughts, and said unto them, Every kingdom divided against itself is brought to desolation; and every city or house divided against itself shall not stand:"]],"Matthew 12:29":[[12,29,"Or else how can one enter into a strong man’s house, and spoil his goods, except he first bind the strong man? and then he will spoil his house."]],"Matthew 12:36 to 37":[[12,36,"But I say unto you, That every idle word that men shall speak, they shall give account thereof in the day of judgment."],[12,37,"For by thy words thou shalt be justified, and by thy words thou shalt be condemned."]],"Matthew 12:43 to 45":[[12,43,"When the unclean spirit is gone out of a man, he walketh through dry places, seeking rest, and findeth none."],[12,44,"Then he saith, I will return into my house from whence I came out; and when he is come, he findeth it empty, swept, and garnished."],[12,45,"Then goeth he, and taketh with himself seven other spirits more wicked than himself, and they enter in and dwell there: and the last state of that man is worse than the first. Even so shall it be also unto this wicked generation."]],"Matthew 15:13":[[15,13,"But he answered and said, Every plant, which my heavenly Father hath not planted, shall be rooted up."]],"Matthew 15:14":[[15,14,"Let them alone: they be blind leaders of the blind. And if the blind lead the blind, both shall fall into the ditch."]],"Matthew 16:19":[[16,19,"And I will give unto thee the keys of the kingdom of heaven: and whatsoever thou shalt bind on earth shall be bound in heaven: and whatsoever thou shalt loose on earth shall be loosed in heaven."]],"Matthew 18:21 to 35":[[18,21,"Then came Peter to him, and said, Lord, how oft shall my brother sin against me, and I forgive him? till seven times?"],[18,22,"Jesus saith unto him, I say not unto thee, Until seven times: but, Until seventy times seven."],[18,23,"Therefore is the kingdom of heaven likened unto a certain king, which would take account of his servants."],[18,24,"And when he had begun to reckon, one was brought unto him, which owed him ten thousand talents."],[18,25,"But forasmuch as he had not to pay, his lord commanded him to be sold, and his wife, and children, and all that he had, and payment to be made."],[18,26,"The servant therefore fell down, and worshipped him, saying, Lord, have patience with me, and I will pay thee all."],[18,27,"Then the lord of that servant was moved with compassion, and loosed him, and forgave him the debt."],[18,28,"But the same servant went out, and found one of his fellowservants, which owed him an hundred pence: and he laid hands on him, and took him by the throat, saying, Pay me that thou owest."],[18,29,"And his fellowservant fell down at his feet, and besought him, saying, Have patience with me, and I will pay thee all."],[18,30,"And he would not: but went and cast him into prison, till he should pay the debt."],[18,31,"So when his fellowservants saw what was done, they were very sorry, and came and told unto their lord all that was done."],[18,32,"Then his lord, after that he had called him, said unto him, O thou wicked servant, I forgave thee all that debt, because thou desiredst me:"],[18,33,"Shouldest not thou also have had compassion on thy fellowservant, even as I had pity on thee?"],[18,34,"And his lord was wroth, and delivered him to the tormentors, till he should pay all that was due unto him."],[18,35,"So likewise shall my heavenly Father do also unto you, if ye from your hearts forgive not every one his brother their trespasses."]],"Matthew 18:34 to 35":[[18,34,"And his lord was wroth, and delivered him to the tormentors, till he should pay all that was due unto him."],[18,35,"So likewise shall my heavenly Father do also unto you, if ye from your hearts forgive not every one his brother their trespasses."]],"Matthew 19:4 to 6":[[19,4,"And he answered and said unto them, Have ye not read, that he which made them at the beginning made them male and female,"],[19,5,"And said, For this cause shall a man leave father and mother, and shall cleave to his wife: and they twain shall be one flesh?"],[19,6,"Wherefore they are no more twain, but one flesh. What therefore God hath joined together, let not man put asunder."]],"Matthew 1:20":[[1,20,"But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost."]],"Matthew 25:6":[[25,6,"And at midnight there was a cry made, Behold, the bridegroom cometh; go ye out to meet him."]],"Matthew 28:1 to 6":[[28,1,"In the end of the sabbath, as it began to dawn toward the first day of the week, came Mary Magdalene and the other Mary to see the sepulchre."],[28,2,"And, behold, there was a great earthquake: for the angel of the Lord descended from heaven, and came and rolled back the stone from the door, and sat upon it."],[28,3,"His countenance was like lightning, and his raiment white as snow:"],[28,4,"And for fear of him the keepers did shake, and became as dead men."],[28,5,"And the angel answered and said unto the women, Fear not ye: for I know that ye seek Jesus, which was crucified."],[28,6,"He is not here: for he is risen, as he said. Come, see the place where the Lord lay."]],"Matthew 28:18 to 20":[[28,18,"And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth."],[28,19,"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"],[28,20,"Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."]],"Matthew 2:1 to 16":[[2,1,"Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem,"],[2,2,"Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him."],[2,3,"When Herod the king had heard these things, he was troubled, and all Jerusalem with him."],[2,4,"And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born."],[2,5,"And they said unto him, In Bethlehem of Judaea: for thus it is written by the prophet,"],[2,6,"And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel."],[2,7,"Then Herod, when he had privily called the wise men, enquired of them diligently what time the star appeared."],[2,8,"And he sent them to Bethlehem, and said, Go and search diligently for the young child; and when ye have found him, bring me word again, that I may come and worship him also."],[2,9,"When they had heard the king, they departed; and, lo, the star, which they saw in the east, went before them, till it came and stood over where the young child was."],[2,10,"When they saw the star, they rejoiced with exceeding great joy."],[2,11,"And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh."],[2,12,"And being warned of God in a dream that they should not return to Herod, they departed into their own country another way."],[2,13,"And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him."],[2,14,"When he arose, he took the young child and his mother by night, and departed into Egypt:"],[2,15,"And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son."],[2,16,"Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently enquired of the wise men."]],"Matthew 2:12 to 13":[[2,12,"And being warned of God in a dream that they should not return to Herod, they departed into their own country another way."],[2,13,"And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him."]],"Matthew 2:13 to 18":[[2,13,"And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him."],[2,14,"When he arose, he took the young child and his mother by night, and departed into Egypt:"],[2,15,"And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son."],[2,16,"Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently enquired of the wise men."],[2,17,"Then was fulfilled that which was spoken by Jeremy the prophet, saying,"],[2,18,"In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children, and would not be comforted, because they are not."]],"Matthew 4:1 to 11":[[4,1,"Then was Jesus led up of the Spirit into the wilderness to be tempted of the devil."],[4,2,"And when he had fasted forty days and forty nights, he was afterward an hungred."],[4,3,"And when the tempter came to him, he said, If thou be the Son of God, command that these stones be made bread."],[4,4,"But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God."],[4,5,"Then the devil taketh him up into the holy city, and setteth him on a pinnacle of the temple,"],[4,6,"And saith unto him, If thou be the Son of God, cast thyself down: for it is written, He shall give his angels charge concerning thee: and in their hands they shall bear thee up, lest at any time thou dash thy foot against a stone."],[4,7,"Jesus said unto him, It is written again, Thou shalt not tempt the Lord thy God."],[4,8,"Again, the devil taketh him up into an exceeding high mountain, and sheweth him all the kingdoms of the world, and the glory of them;"],[4,9,"And saith unto him, All these things will I give thee, if thou wilt fall down and worship me."],[4,10,"Then saith Jesus unto him, Get thee hence, Satan: for it is written, Thou shalt worship the Lord thy God, and him only shalt thou serve."],[4,11,"Then the devil leaveth him, and, behold, angels came and ministered unto him."]],"Matthew 5:10 to 12":[[5,10,"Blessed are they which are persecuted for righteousness’ sake: for theirs is the kingdom of heaven."],[5,11,"Blessed are ye, when men shall revile you, and persecute you, and shall say all manner of evil against you falsely, for my sake."],[5,12,"Rejoice, and be exceeding glad: for great is your reward in heaven: for so persecuted they the prophets which were before you."]],"Matthew 5:14 to 16":[[5,14,"Ye are the light of the world. A city that is set on an hill cannot be hid."],[5,15,"Neither do men light a candle, and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house."],[5,16,"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."]],"Matthew 5:6":[[5,6,"Blessed are they which do hunger and thirst after righteousness: for they shall be filled."]],"Matthew 5:9":[[5,9,"Blessed are the peacemakers: for they shall be called the children of God."]],"Matthew 6:14 to 15":[[6,14,"For if ye forgive men their trespasses, your heavenly Father will also forgive you:"],[6,15,"But if ye forgive not men their trespasses, neither will your Father forgive your trespasses."]],"Matthew 6:31 to 33":[[6,31,"Therefore take no thought, saying, What shall we eat? or, What shall we drink? or, Wherewithal shall we be clothed?"],[6,32,"(For after all these things do the Gentiles seek:) for your heavenly Father knoweth that ye have need of all these things."],[6,33,"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."]],"Matthew 6:6":[[6,6,"But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly."]],"Matthew 7:22 to 23":[[7,22,"Many will say to me in that day, Lord, Lord, have we not prophesied in thy name? and in thy name have cast out devils? and in thy name done many wonderful works?"],[7,23,"And then will I profess unto them, I never knew you: depart from me, ye that work iniquity."]],"Micah 2:13":[[2,13,"The breaker is come up before them: they have broken up, and have passed through the gate, and are gone out by it: and their king shall pass before them, and the LORD on the head of them."]],"Micah 5:12":[[5,12,"And I will cut off witchcrafts out of thine hand; and thou shalt have no more soothsayers:"]],"Micah 7:5 to 7":[[7,5,"Trust ye not in a friend, put ye not confidence in a guide: keep the doors of thy mouth from her that lieth in thy bosom."],[7,6,"For the son dishonoureth the father, the daughter riseth up against her mother, the daughter in law against her mother in law; a man’s enemies are the men of his own house."],[7,7,"Therefore I will look unto the LORD; I will wait for the God of my salvation: my God will hear me."]],"Micah 7:8":[[7,8,"Rejoice not against me, O mine enemy: when I fall, I shall arise; when I sit in darkness, the LORD shall be a light unto me."]],"Nahum 1:14":[[1,14,"And the LORD hath given a commandment concerning thee, that no more of thy name be sown: out of the house of thy gods will I cut off the graven image and the molten image: I will make thy grave; for thou art vile."]],"Nahum 1:9":[[1,9,"What do ye imagine against the LORD? he will make an utter end: affliction shall not rise up the second time."]],"Nahum 2:2":[[2,2,"For the LORD hath turned away the excellency of Jacob, as the excellency of Israel: for the emptiers have emptied them out, and marred their vine branches."]],"Nahum 3:4 to 5":[[3,4,"Because of the multitude of the whoredoms of the wellfavoured harlot, the mistress of witchcrafts, that selleth nations through her whoredoms, and families through her witchcrafts."],[3,5,"Behold, I am against thee, saith the LORD of hosts; and I will discover thy skirts upon thy face, and I will shew the nations thy nakedness, and the kingdoms thy shame."]],"Nehemiah 1:6 to 7":[[1,6,"Let thine ear now be attentive, and thine eyes open, that thou mayest hear the prayer of thy servant, which I pray before thee now, day and night, for the children of Israel thy servants, and confess the sins of the children of Israel, which we have sinned against thee: both I and my father’s house have sinned."],[1,7,"We have dealt very corruptly against thee, and have not kept the commandments, nor the statutes, nor the judgments, which thou commandedst thy servant Moses."]],"Nehemiah 4:1 to 3":[[4,1,"But it came to pass, that when Sanballat heard that we builded the wall, he was wroth, and took great indignation, and mocked the Jews."],[4,2,"And he spake before his brethren and the army of Samaria, and said, What do these feeble Jews? will they fortify themselves? will they sacrifice? will they make an end in a day? will they revive the stones out of the heaps of the rubbish which are burned?"],[4,3,"Now Tobiah the Ammonite was by him, and he said, Even that which they build, if a fox go up, he shall even break down their stone wall."]],"Nehemiah 4:1 to 9":[[4,1,"But it came to pass, that when Sanballat heard that we builded the wall, he was wroth, and took great indignation, and mocked the Jews."],[4,2,"And he spake before his brethren and the army of Samaria, and said, What do these feeble Jews? will they fortify themselves? will they sacrifice? will they make an end in a day? will they revive the stones out of the heaps of the rubbish which are burned?"],[4,3,"Now Tobiah the Ammonite was by him, and he said, Even that which they build, if a fox go up, he shall even break down their stone wall."],[4,4,"Hear, O our God; for we are despised: and turn their reproach upon their own head, and give them for a prey in the land of captivity:"],[4,5,"And cover not their iniquity, and let not their sin be blotted out from before thee: for they have provoked thee to anger before the builders."],[4,6,"So built we the wall; and all the wall was joined together unto the half thereof: for the people had a mind to work."],[4,7,"But it came to pass, that when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the walls of Jerusalem were made up, and that the breaches began to be stopped, then they were very wroth,"],[4,8,"And conspired all of them together to come and to fight against Jerusalem, and to hinder it."],[4,9,"Nevertheless we made our prayer unto our God, and set a watch against them day and night, because of them."]],"Nehemiah 4:14":[[4,14,"And I looked, and rose up, and said unto the nobles, and to the rulers, and to the rest of the people, Be not ye afraid of them: remember the Lord, which is great and terrible, and fight for your brethren, your sons, and your daughters, your wives, and your houses."]],"Nehemiah 4:6 to 9":[[4,6,"So built we the wall; and all the wall was joined together unto the half thereof: for the people had a mind to work."],[4,7,"But it came to pass, that when Sanballat, and Tobiah, and the Arabians, and the Ammonites, and the Ashdodites, heard that the walls of Jerusalem were made up, and that the breaches began to be stopped, then they were very wroth,"],[4,8,"And conspired all of them together to come and to fight against Jerusalem, and to hinder it."],[4,9,"Nevertheless we made our prayer unto our God, and set a watch against them day and night, because of them."]],"Nehemiah 6:1 to 9":[[6,1,"Now it came to pass, when Sanballat, and Tobiah, and Geshem the Arabian, and the rest of our enemies, heard that I had builded the wall, and that there was no breach left therein; (though at that time I had not set up the doors upon the gates;)"],[6,2,"That Sanballat and Geshem sent unto me, saying, Come, let us meet together in some one of the villages in the plain of Ono. But they thought to do me mischief."],[6,3,"And I sent messengers unto them, saying, I am doing a great work, so that I cannot come down: why should the work cease, whilst I leave it, and come down to you?"],[6,4,"Yet they sent unto me four times after this sort; and I answered them after the same manner."],[6,5,"Then sent Sanballat his servant unto me in like manner the fifth time with an open letter in his hand;"],[6,6,"Wherein was written, It is reported among the heathen, and Gashmu saith it, that thou and the Jews think to rebel: for which cause thou buildest the wall, that thou mayest be their king, according to these words."],[6,7,"And thou hast also appointed prophets to preach of thee at Jerusalem, saying, There is a king in Judah: and now shall it be reported to the king according to these words. Come now therefore, and let us take counsel together."],[6,8,"Then I sent unto him, saying, There are no such things done as thou sayest, but thou feignest them out of thine own heart."],[6,9,"For they all made us afraid, saying, Their hands shall be weakened from the work, that it be not done. Now therefore, O God, strengthen my hands."]],"Nehemiah 6:16":[[6,16,"And it came to pass, that when all our enemies heard thereof, and all the heathen that were about us saw these things, they were much cast down in their own eyes: for they perceived that this work was wrought of our God."]],"Nehemiah 8:10":[[8,10,"Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the LORD is your strength."]],"Nehemiah 9:2":[[9,2,"And the seed of Israel separated themselves from all strangers, and stood and confessed their sins, and the iniquities of their fathers."]],"Numbers 11:4 to 6":[[11,4,"And the mixt multitude that was among them fell a lusting: and the children of Israel also wept again, and said, Who shall give us flesh to eat?"],[11,5,"We remember the fish, which we did eat in Egypt freely; the cucumbers, and the melons, and the leeks, and the onions, and the garlick:"],[11,6,"But now our soul is dried away: there is nothing at all, beside this manna, before our eyes."]],"Numbers 13:26 to 33":[[13,26,"And they went and came to Moses, and to Aaron, and to all the congregation of the children of Israel, unto the wilderness of Paran, to Kadesh; and brought back word unto them, and unto all the congregation, and shewed them the fruit of the land."],[13,27,"And they told him, and said, We came unto the land whither thou sentest us, and surely it floweth with milk and honey; and this is the fruit of it."],[13,28,"Nevertheless the people be strong that dwell in the land, and the cities are walled, and very great: and moreover we saw the children of Anak there."],[13,29,"The Amalekites dwell in the land of the south: and the Hittites, and the Jebusites, and the Amorites, dwell in the mountains: and the Canaanites dwell by the sea, and by the coast of Jordan."],[13,30,"And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it."],[13,31,"But the men that went up with him said, We be not able to go up against the people; for they are stronger than we."],[13,32,"And they brought up an evil report of the land which they had searched unto the children of Israel, saying, The land, through which we have gone to search it, is a land that eateth up the inhabitants thereof; and all the people that we saw in it are men of a great stature."],[13,33,"And there we saw the giants, the sons of Anak, which come of the giants: and we were in our own sight as grasshoppers, and so we were in their sight."]],"Numbers 13:30":[[13,30,"And Caleb stilled the people before Moses, and said, Let us go up at once, and possess it; for we are well able to overcome it."]],"Numbers 13:31 to 33":[[13,31,"But the men that went up with him said, We be not able to go up against the people; for they are stronger than we."],[13,32,"And they brought up an evil report of the land which they had searched unto the children of Israel, saying, The land, through which we have gone to search it, is a land that eateth up the inhabitants thereof; and all the people that we saw in it are men of a great stature."],[13,33,"And there we saw the giants, the sons of Anak, which come of the giants: and we were in our own sight as grasshoppers, and so we were in their sight."]],"Numbers 14:1 to 4, 26 to 35":[[14,1,"And all the congregation lifted up their voice, and cried; and the people wept that night."],[14,2,"And all the children of Israel murmured against Moses and against Aaron: and the whole congregation said unto them, Would God that we had died in the land of Egypt! or would God we had died in this wilderness!"],[14,3,"And wherefore hath the LORD brought us unto this land, to fall by the sword, that our wives and our children should be a prey? were it not better for us to return into Egypt?"],[14,4,"And they said one to another, Let us make a captain, and let us return into Egypt."],[14,26,"And the LORD spake unto Moses and unto Aaron, saying,"],[14,27,"How long shall I bear with this evil congregation, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me."],[14,28,"Say unto them, As truly as I live, saith the LORD, as ye have spoken in mine ears, so will I do to you:"],[14,29,"Your carcases shall fall in this wilderness; and all that were numbered of you, according to your whole number, from twenty years old and upward, which have murmured against me,"],[14,30,"Doubtless ye shall not come into the land, concerning which I sware to make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun."],[14,31,"But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised."],[14,32,"But as for you, your carcases, they shall fall in this wilderness."],[14,33,"And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness."],[14,34,"After the number of the days in which ye searched the land, even forty days, each day for a year, shall ye bear your iniquities, even forty years, and ye shall know my breach of promise."],[14,35,"I the LORD have said, I will surely do it unto all this evil congregation, that are gathered together against me: in this wilderness they shall be consumed, and there they shall die."]],"Numbers 14:18":[[14,18,"The LORD is longsuffering, and of great mercy, forgiving iniquity and transgression, and by no means clearing the guilty, visiting the iniquity of the fathers upon the children unto the third and fourth generation."]],"Numbers 14:26 to 30":[[14,26,"And the LORD spake unto Moses and unto Aaron, saying,"],[14,27,"How long shall I bear with this evil congregation, which murmur against me? I have heard the murmurings of the children of Israel, which they murmur against me."],[14,28,"Say unto them, As truly as I live, saith the LORD, as ye have spoken in mine ears, so will I do to you:"],[14,29,"Your carcases shall fall in this wilderness; and all that were numbered of you, according to your whole number, from twenty years old and upward, which have murmured against me,"],[14,30,"Doubtless ye shall not come into the land, concerning which I sware to make you dwell therein, save Caleb the son of Jephunneh, and Joshua the son of Nun."]],"Numbers 16:1 to 3":[[16,1,"Now Korah, the son of Izhar, the son of Kohath, the son of Levi, and Dathan and Abiram, the sons of Eliab, and On, the son of Peleth, sons of Reuben, took men:"],[16,2,"And they rose up before Moses, with certain of the children of Israel, two hundred and fifty princes of the assembly, famous in the congregation, men of renown:"],[16,3,"And they gathered themselves together against Moses and against Aaron, and said unto them, Ye take too much upon you, seeing all the congregation are holy, every one of them, and the LORD is among them: wherefore then lift ye up yourselves above the congregation of the LORD?"]],"Numbers 21:16 to 18":[[21,16,"And from thence they went to Beer: that is the well whereof the LORD spake unto Moses, Gather the people together, and I will give them water."],[21,17,"Then Israel sang this song, Spring up, O well; sing ye unto it:"],[21,18,"The princes digged the well, the nobles of the people digged it, by the direction of the lawgiver, with their staves. And from the wilderness they went to Mattanah:"]],"Numbers 22:1 to 23:23":[[22,1,"And the children of Israel set forward, and pitched in the plains of Moab on this side Jordan by Jericho."],[22,2,"And Balak the son of Zippor saw all that Israel had done to the Amorites."],[22,3,"And Moab was sore afraid of the people, because they were many: and Moab was distressed because of the children of Israel."],[22,4,"And Moab said unto the elders of Midian, Now shall this company lick up all that are round about us, as the ox licketh up the grass of the field. And Balak the son of Zippor was king of the Moabites at that time."],[22,5,"He sent messengers therefore unto Balaam the son of Beor to Pethor, which is by the river of the land of the children of his people, to call him, saying, Behold, there is a people come out from Egypt: behold, they cover the face of the earth, and they abide over against me:"],[22,6,"Come now therefore, I pray thee, curse me this people; for they are too mighty for me: peradventure I shall prevail, that we may smite them, and that I may drive them out of the land: for I wot that he whom thou blessest is blessed, and he whom thou cursest is cursed."],[22,7,"And the elders of Moab and the elders of Midian departed with the rewards of divination in their hand; and they came unto Balaam, and spake unto him the words of Balak."],[22,8,"And he said unto them, Lodge here this night, and I will bring you word again, as the LORD shall speak unto me: and the princes of Moab abode with Balaam."],[22,9,"And God came unto Balaam, and said, What men are these with thee?"],[22,10,"And Balaam said unto God, Balak the son of Zippor, king of Moab, hath sent unto me, saying,"],[22,11,"Behold, there is a people come out of Egypt, which covereth the face of the earth: come now, curse me them; peradventure I shall be able to overcome them, and drive them out."],[22,12,"And God said unto Balaam, Thou shalt not go with them; thou shalt not curse the people: for they are blessed."],[22,13,"And Balaam rose up in the morning, and said unto the princes of Balak, Get you into your land: for the LORD refuseth to give me leave to go with you."],[22,14,"And the princes of Moab rose up, and they went unto Balak, and said, Balaam refuseth to come with us."],[22,15,"And Balak sent yet again princes, more, and more honourable than they."],[22,16,"And they came to Balaam, and said to him, Thus saith Balak the son of Zippor, Let nothing, I pray thee, hinder thee from coming unto me:"],[22,17,"For I will promote thee unto very great honour, and I will do whatsoever thou sayest unto me: come therefore, I pray thee, curse me this people."],[22,18,"And Balaam answered and said unto the servants of Balak, If Balak would give me his house full of silver and gold, I cannot go beyond the word of the LORD my God, to do less or more."],[22,19,"Now therefore, I pray you, tarry ye also here this night, that I may know what the LORD will say unto me more."],[22,20,"And God came unto Balaam at night, and said unto him, If the men come to call thee, rise up, and go with them; but yet the word which I shall say unto thee, that shalt thou do."],[22,21,"And Balaam rose up in the morning, and saddled his ass, and went with the princes of Moab."],[22,22,"And God’s anger was kindled because he went: and the angel of the LORD stood in the way for an adversary against him. Now he was riding upon his ass, and his two servants were with him."],[22,23,"And the ass saw the angel of the LORD standing in the way, and his sword drawn in his hand: and the ass turned aside out of the way, and went into the field: and Balaam smote the ass, to turn her into the way."],[22,24,"But the angel of the LORD stood in a path of the vineyards, a wall being on this side, and a wall on that side."],[22,25,"And when the ass saw the angel of the LORD, she thrust herself unto the wall, and crushed Balaam’s foot against the wall: and he smote her again."],[22,26,"And the angel of the LORD went further, and stood in a narrow place, where was no way to turn either to the right hand or to the left."],[22,27,"And when the ass saw the angel of the LORD, she fell down under Balaam: and Balaam’s anger was kindled, and he smote the ass with a staff."],[22,28,"And the LORD opened the mouth of the ass, and she said unto Balaam, What have I done unto thee, that thou hast smitten me these three times?"],[22,29,"And Balaam said unto the ass, Because thou hast mocked me: I would there were a sword in mine hand, for now would I kill thee."],[22,30,"And the ass said unto Balaam, Am not I thine ass, upon which thou hast ridden ever since I was thine unto this day? was I ever wont to do so unto thee? And he said, Nay."],[22,31,"Then the LORD opened the eyes of Balaam, and he saw the angel of the LORD standing in the way, and his sword drawn in his hand: and he bowed down his head, and fell flat on his face."],[22,32,"And the angel of the LORD said unto him, Wherefore hast thou smitten thine ass these three times? behold, I went out to withstand thee, because thy way is perverse before me:"],[22,33,"And the ass saw me, and turned from me these three times: unless she had turned from me, surely now also I had slain thee, and saved her alive."],[22,34,"And Balaam said unto the angel of the LORD, I have sinned; for I knew not that thou stoodest in the way against me: now therefor
