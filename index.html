y without warning, be stilled by the name of Jesus.","Every replay of trauma running in my mind, be interrupted and be healed tonight.","Every shame keeping me silent about what I am facing, break now. I will not suffer alone.","Lord, send me a David. Send someone whose sound brings relief to my life.","Make me a David. Let my presence bring peace into rooms that are tormented.","Every mental battle in my spouse and my children, I war for them tonight in Jesus' name.","Nothing shall separate me from the love of God. Not depression, not fear, not this season.","I decree freedom over my mind tonight. I shall know the truth and the truth shall make me free."]}],"questions":["Write the exact sentence that plays in your head about yourself. Then find one verse that directly contradicts it and write them next to each other. Read both out loud every day for the rest of this fast.","Elijah was off by seven thousand. Where has isolation lied to you about your situation, and who is one person you will reach out to this week?"],"questionNote":"If you are struggling with your mental health, please speak with your pastor, a trusted person, or a medical professional. We are praying with you and we are not asking you to walk this alone."},{"n":10,"date":"Wednesday, October 14","title":"Spring Up, O Well: The Tongue That Digs","subtitle":"","anchor":{"text":"Spring up, O well; sing ye unto it: the princes digged the well, the nobles of the people digged it, by the direction of the lawgiver, with their staves.","ref":"Numbers 21:17 to 18"},"teaching":["There is a well in the book of Numbers that nobody dug with a shovel.","Israel is in the wilderness. God tells Moses in verse 16, \"Gather the people together, and I will give them water.\" And then the strangest construction project in Scripture takes place. They sang to the well.","\"Spring up, O well; sing ye unto it.\"","Read verse 18 carefully, because the details matter enormously. The princes digged it. The nobles digged it. By the direction of the lawgiver. With their staves.","Four things.","Princes and nobles. Not labourers. Not the servant class. This was not manual work. It was authority work. It took people who understood who they were.","By the direction of the lawgiver. Not random declaration. Not shouting into the air. It was governed by the word of God. This is the difference between biblical decree and positive thinking. One is aligned with what God has already said. The other is your own wishful noise with a Christian accent. With their staves. A staff is the symbol of authority. Moses' staff parted a sea. Aaron's staff budded. These men dug with the instrument of their rank.","And they sang. The digging was singing. The singing was the digging.","Today we deal with the tongue, and specifically with the tongue as an excavating instrument.","Job 22:28 says \"Thou shalt also decree a thing, and it shall be established unto thee.\" Proverbs 18:21 says death and life are in the power of the tongue. Romans 4:17 says God calls things that be not as though they were. And Jesus, who could have done anything, spoke to a tree and it died from the roots (Mark 11:14, 20).","But there is a second half to this, and it is the harder half. Some of the earth in your well was thrown in by your own mouth.","The words you spoke over yourself at your lowest. The vows you made after a betrayal. The verdicts you pronounced over your marriage in an argument. The things you said about your own children in frustration. Today we do not only learn to decree. We retrieve."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"Sing to the Well","subtitle":"","about":["Tonight we sing to what has not yet produced.","That is the whole assignment. Not sing after the water comes. Sing to the dry ground and call the water up.","This is faith speech, and it is not denial. Denial says there is no problem. Faith says there is a problem and there is a God who outranks it, and I will address the ground rather than the drought.","Ezekiel had to prophesy to bones before there was any evidence (Ezekiel 37:4). Elijah heard the sound of abundance of rain when the sky was still empty (1 Kings 18:41). The sound came before the rain."],"scriptures":["Numbers 21:16 to 18","Ezekiel 37:1 to 10","1 Kings 18:41 to 45","Romans 4:17 to 21","Mark 11:22 to 24","2 Corinthians 4:13","Psalm 42:8"],"note":"","points":["Father, tonight I sing to every dry place in my life. Spring up, O well.","Spring up, O well of my marriage. Spring up, O well of my finances. Spring up in Jesus' name.","Spring up, O well of my calling. Spring up, O well of my health. Spring up now.","Every dry ground in my life, hear the word of the Lord and produce water.","I prophesy to the dry bones in my situation. Live, in the name of Jesus. Ezekiel 37:4.","Lord, let me hear the sound of abundance of rain before I see a single cloud.","I call those things which be not as though they were, after the pattern of my God. Romans 4:17.","Every dead thing in my household, receive resurrection life at this midnight hour.","Father, give me the faith of Abraham, who staggered not at the promise through unbelief.","I believed, therefore have I spoken. I will not be a silent believer. 2 Corinthians 4:13.","Every mountain in my path, I speak to you and I do not doubt in my heart. Be removed.","Lord, teach me to address the ground and not merely complain about the drought.","Every song the enemy stole from me, I take it back tonight in the name of Jesus.","Father, put a new song in my mouth for this season. Psalm 40:3.","In the night His song shall be with me. Psalm 42:8. Give me a night song, Lord.","Every place where I have gone silent out of disappointment, restore my voice.","I sing over my children tonight. I call forth destiny in each of them by name.","I sing over my spouse tonight. Let the well of our covenant spring up.","Every wilderness in my life, become the place where God gives water.","Lord, let my singing be recognised in the realm of the spirit as digging.","I decree that water is rising in every place I have sung over tonight, in Jesus' name."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Thou Shalt Decree a Thing","subtitle":"","about":["\"Thou shalt also decree a thing, and it shall be established unto thee: and the light shall shine upon thy ways\" (Job 22:28).","A decree is not a wish. A decree is an official pronouncement issued by someone with the authority to issue it. When a king decreed, the matter was settled before anything visibly changed, because the authority behind the word was the guarantee of the outcome.","Two things must be true for a decree to work.","You must know your standing. Numbers 21 says the princes and nobles dug that well. If you do not know who you are, your words are just noise. This is why the enemy fights so hard to keep believers in identity confusion. A person who does not know they are seated with Christ (Ephesians 2:6) will never speak from that position.","And it must align with the lawgiver. \"By the direction of the lawgiver.\" Your decree has power to the degree that it agrees with what God has already said. You cannot decree what contradicts Scripture and you cannot decree what contradicts God's revealed will for your life. But everything He has already promised, you have the right to enforce with your mouth.","This morning, we practise. Speak. Out loud. Do not mumble a decree."],"scriptures":["Job 22:28","Proverbs 18:20 to 21","Ephesians 2:6","Isaiah 55:11","Mark 11:22 to 23","Matthew 16:19","Genesis 1:3","Psalm 33:6","Romans 10:10","Hebrews 11:3"],"note":"","points":["Father, I take my seat in Christ this morning, and I speak from that position and no lower.","I decree a thing and it is established unto me, and light shines upon my ways. Job 22:28.","Whatsoever I bind on earth is bound in heaven, and whatsoever I loose on earth is loosed.","I bind every spirit of delay over my life and I loose acceleration in the name of Jesus.","I bind every spirit of confusion over my household and I loose clarity and order.","I bind poverty over my family line and I loose provision and abundance.","I bind strife in my marriage and I loose peace and understanding, in the name of Jesus.","I decree that my household serves the Lord, every one of us, in Jesus' name.","I decree open doors that no man can shut over my career and my business.","I decree divine health over my body and over every member of my household.","I decree that my children are taught of the Lord and great is their peace. Isaiah 54:13.","I decree that my finances obey the word of God and no longer obey my history.","Death and life are in the power of the tongue. I choose life with my words today.","Lord, let every word I send out today not return void but accomplish what You please.","Every decree I make in alignment with Your word, let heaven back it in Jesus' name.","Father, correct me where I have been decreeing outside Your will. Align my mouth.","I decree restoration over everything the enemy has taken from my family.","I decree that the second half of my life will be greater than the first.","I decree that my name is being cleared where it was defamed, in the name of Jesus.","I decree that the fruit of my lips brings satisfaction and not regret. Proverbs 18:20.","Let there be light over every dark area of my life. And there was light. In Jesus' name."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Retrieving the Words I Spoke Against Myself","subtitle":"","about":["This session is uncomfortable and it is necessary.","Some of the dirt in your well has your own fingerprints on it. \"Thou art snared with the words of thy mouth, thou art taken with the words of thy mouth\" (Proverbs 6:2). Snared. Trapped. By your own words.","Look at what God said to Israel in Numbers 14:28. \"As ye have spoken in mine ears, so will I do to you.\" They said in verse 2, \"Would God that we had died in this wilderness!\" And God gave them exactly that. He honoured their words even though the words were destructive.","Here is what to bring to God today.","Vows made in pain. I will never trust anyone again. I will never let anyone that close. I am done with church people. Vows made in a wound will govern your life for decades unless they are revoked. Some of you are single because of a vow you made at nineteen after a betrayal, and you have never once brought it back to God.","Verdicts spoken in anger. What did you say in the middle of that fight? Some words were said in your marriage that were not observations but sentences, and the marriage has been serving that sentence ever since.","Words over your children. You are just like your father. You will never amount to anything. Parents carry prophetic authority in the lives of their children whether they know it or not. Self curses. I always mess things up. My family is cursed. I will probably die young like my father. Nothing ever works out for me.","Today we go back and retrieve them. Numbers 30 gives us the pattern: a vow could be disallowed by one in authority, and \"the LORD shall forgive her\" (Numbers 30:8). Your Father in heaven has the authority to disallow every destructive vow you have made.","Bring your list."],"scriptures":["Proverbs 6:1 to 5","Numbers 14:26 to 30","Numbers 30:1 to 8","Matthew 12:36 to 37","James 3:2 to 10","Psalm 141:3","Proverbs 12:18","Job 3:1 to 3","Isaiah 6:5 to 7","Ecclesiastes 5:6"],"note":"","points":["Father, I bring back to You every word I have spoken against my own life.","Every vow I made in pain that has been governing my life, I revoke it now in Jesus' name.","Every vow I made after betrayal about never trusting again, I break it and I release it.","Every vow I made about never loving again, I cancel it. My heart is not sealed shut.","Every self curse I have pronounced over my body, I retract it by the blood of Jesus.","Every time I said I will die young like my father, I cancel it. I shall live and not die.","Every time I said my family is cursed, I retract it. My family is blessed in Jesus' name.","Every time I said nothing ever works out for me, I revoke that sentence today.","Every verdict I spoke over my marriage in anger, I cancel it by the blood of Jesus.","Every word I spoke over my spouse that wounded rather than washed, forgive me and heal it.","Every negative word I have spoken over my children, I retract it and I replace it today.","I speak life over each of my children by name, and I cancel every contrary word.","Lord, as You have spoken in Your ears, so will You do. Let only life proceed from my mouth.","I am snared with the words of my mouth. Lord, deliver me out of my own snare. Proverbs 6:2.","Set a watch, O Lord, before my mouth. Keep the door of my lips. Psalm 141:3.","Every idle word I will give account for, I ask for mercy and I ask for restraint.","Lord, touch my lips with a live coal from the altar. My iniquity is taken away. Isaiah 6:7.","Every complaint that became a prophecy over my life, I cancel it in the name of Jesus.","Every time I cursed my day as Job did, I retract it. This day is the Lord's making.","Father, disallow every destructive vow I made, and let it stand disallowed forever.","From this day my mouth is a well and not a grave, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Silencing Evil Verdicts","subtitle":"","about":["Tonight we deal with what other people have spoken over you, and what the enemy has decreed against you.","There are three sources of evil pronouncement and they need to be handled differently.","Words from people with authority over you. A parent, a teacher, a pastor, a spouse. These carry weight because of position. Isaac's blessing over Jacob could not be reversed even though it was obtained deceitfully, because the words of a father carry legal force (Genesis 27:33 to 37). If a parent pronounced something over you, it needs to be formally cancelled, not just forgotten.","Curses from those who wish you harm. Balaam was hired for this. But note Proverbs 26:2: \"As the bird by wandering, as the swallow by flying, so the curse causeless shall not come.\" A curse needs a landing place. Deal with your own house and the curse has nowhere to alight.","Decrees from the accuser himself. Revelation 12:10 calls him the accuser of the brethren, and he accuses day and night. Zechariah 3 shows the mechanism: Joshua the high priest standing before the angel with Satan at his right hand to resist him. And the response is stunning. God does not argue the evidence. \"The LORD rebuke thee\" (Zechariah 3:2). Then He changes the garment. \"Take away the filthy garments from him... Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment\" (Zechariah 3:4). The accusation was true. The garments were genuinely filthy. God did not dispute the charge. He changed the defendant.","That is your standing tonight. Not that you are innocent, but that you are clothed.","Come standing. Cancel out loud. Be specific."],"scriptures":["Zechariah 3:1 to 5","Revelation 12:10 to 11","Isaiah 54:17","Proverbs 26:2","Numbers 23:8","Genesis 27:33 to 37","Job 3:25","Ecclesiastes 10:20","Romans 8:33 to 34","1 John 2:1","Colossians 2:14","Psalm 109:17 to 20","Isaiah 8:9 to 10"],"note":"Stand. Speak with authority. Where you know the specific words, say them and cancel them.","points":["Every evil word spoken over my life from birth until now, I cancel you by the blood of Jesus.","Every negative pronouncement made by my father over my life, I revoke it in Jesus' name.","Every negative pronouncement made by my mother over my life, I revoke it in Jesus' name.","Every curse spoken over me by a teacher, a leader, or an elder, be cancelled now.","Every word spoken over my marriage by a person who wished us harm, fall to the ground.","Every prophecy given to me that did not come from God, I nullify it by the blood of Jesus.","The curse causeless shall not come. Every curse aimed at me finds no landing place. Proverbs 26:2.","How shall I curse whom God hath not cursed? I am blessed and it cannot be reversed.","Every altar where my name is being mentioned tonight, be silenced in the name of Jesus.","Every decree issued against me in any dark gathering, be reversed by the blood of Jesus.","Satan, the accuser of the brethren, the Lord rebuke thee concerning my life. Zechariah 3:2.","Every filthy garment the accuser points to, Lord take it away and clothe me with change of raiment.","Who shall lay anything to the charge of God's elect? It is God that justifieth. Romans 8:33.","I have an advocate with the Father, Jesus Christ the righteous. He speaks for me tonight.","Every handwriting of ordinances against me, be blotted out and nailed to the cross.","No weapon formed against me shall prosper, and every tongue that rises in judgement I condemn.","This is my heritage as a servant of the Lord, and my righteousness is of Him. Isaiah 54:17.","Take counsel together and it shall come to nought. Speak the word and it shall not stand.","Every fear that I feared which has been drawing disaster toward me, I break your law tonight.","Every evil verdict currently in force over my family, I appeal to a higher court and I overturn it.","I overcome by the blood of the Lamb and by the word of my testimony. Every evil decree over my life is null and void, in the name of Jesus."]}],"questions":["Write down one vow you made in a season of pain. What exactly did you say, how old were you, and have you ever revoked it before today?","What is the one word a person in authority spoke over you that you still hear? Cancel it in writing, then write what God says instead."],"questionNote":""},{"n":11,"date":"Thursday, October 15","title":"The Blood That Speaks Better Things","subtitle":"","anchor":{"text":"And to Jesus the mediator of the new covenant, and to the blood of sprinkling, that speaketh better things than that of Abel.","ref":"Hebrews 12:24"},"teaching":["Everything we have done for ten days has been leading here. We have exposed foundations, broken altars, cut covenants, opened eyes, dismantled witchcraft, renewed minds, and retrieved words. Today we settle the question of legal authority. Because every single thing we have broken was broken on one basis, and it was never our fasting, our volume, or our sincerity.","Hebrews 12:24 makes an extraordinary claim. The blood speaks.","And it does not merely speak. It speaks better things than the blood of Abel. Go back to Genesis 4:10, where God says to Cain, \"The voice of thy brother's blood crieth unto me from the ground.\" Abel's blood had a voice, and what it said was: justice, vengeance, judgement. It was a legitimate cry and God heard it. Now understand the comparison the writer of Hebrews is making. If innocent blood spilled on the ground has enough voice to reach God's ears and demand a verdict, how much more does the blood of the Son of God?","Here is the point that matters for your family: there is blood in your foundation that has been speaking. Sacrifices offered generations ago. Covenants sealed in blood. Bloodshed on the land your ancestors lived on. Blood spoken over your birth. And that blood has been making legal statements about your bloodline for decades.","The blood of Jesus does not merely silence it. It outranks it, and it says better things.","Today we take three positions.","At midnight, the blood at the door. Exodus 12. Applied blood, not merely available blood. There was blood in every Israelite home in Egypt that night. The only blood that saved was the blood that got applied to the doorpost.","At noon, the hedge. Job 1:10 records Satan's own complaint: \"Hast not thou made an hedge about him, and about his house, and about all that he hath, on every side?\" The devil could see the hedge and it made him furious.","And tonight, we plead the blood against every remaining altar, because after ten days of digging, there are things still standing that only the blood can remove."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Blood at the Door","subtitle":"","about":["Exodus 12. The night before the exodus.","Every instruction God gave was precise. A lamb without blemish. Kept up four days. Killed in the evening. And then this: \"They shall take of the blood, and strike it on the two side posts and on the upper door post\" (Exodus 12:7).","Notice that the lamb being slain was not the salvation. The application was.","An Israelite family could have killed the lamb, cooked it, eaten it, and left the blood in the basin, and the destroyer would have entered that house. God did not say when I see the lamb. He said, \"When I see the blood, I will pass over you\" (Exodus 12:13). That is why so many believers who are genuinely saved are still under pressure. The blood has been shed. It has not been applied to the specific doorposts of their lives.","Tonight we apply it. Deliberately. By name. Room by room."],"scriptures":["Exodus 12:1 to 13","Exodus 12:21 to 23","Hebrews 9:11 to 14","Hebrews 12:22 to 24","1 Peter 1:18 to 19","Genesis 4:10","Leviticus 17:11","Revelation 12:11"],"note":"","points":["Father, tonight I apply the blood of Jesus to the doorposts of my life. It is not enough that it was shed.","I plead the blood of Jesus over my house, over every door and every window.","I apply the blood of Jesus over my bedroom, my children's rooms, and every room in my dwelling.","I apply the blood of Jesus over my body, my mind, my spirit, and my soul.","I apply the blood of Jesus over my marriage and every covenant God has joined in my life.","When You see the blood, You will pass over. Let every destroyer pass over my household tonight.","Every destroyer assigned to my family this season, you have no legal entry. The blood is applied.","The blood of Jesus speaks better things than the blood of Abel over my bloodline.","Every blood in my foundation crying against me, be answered and be overruled by the blood of Jesus.","Every sacrifice offered on my behalf in my family line, be cancelled by a superior sacrifice.","Every blood covenant cut over my ancestors, be broken by the blood of the Lamb tonight.","Every bloodshed on the land of my fathers still speaking, be silenced by the blood of Jesus.","Lord, purge my conscience from dead works to serve the living God. Hebrews 9:14.","I am redeemed not with corruptible things, but with the precious blood of Christ.","Every legal claim the enemy holds over my life, the blood of Jesus has settled it.","Every stain on my record that the accuser points to, be washed by the blood tonight.","I apply the blood over my going out and my coming in, over my travel and my work.","I apply the blood over my finances, my business, and every place my name is written.","Every door in my life the enemy has been using, I seal it with the blood of Jesus.","Father, let there be a visible difference in the spirit between my house and the house of the enemy.","I decree that my household is under the blood tonight, and the destroyer must pass over."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Bought Out of the Market","subtitle":"","about":["Redemption is a commercial word before it is a religious one.","To redeem meant to buy back. It was used of purchasing a slave out of the marketplace and setting them free. When Paul writes \"Ye are bought with a price\" (1 Corinthians 6:20), he is using the exact language of the slave market.","Which means a transaction took place. Ownership changed hands.","And ownership matters in the realm of the spirit, because demons operate on the basis of legal claim. This is why deliverance so often turns on the question of ground. Whose are you? Who paid for you? What claim still stands?","\"In whom we have redemption through his blood, the forgiveness of sins, according to the riches of his grace\" (Ephesians 1:7).","This morning you settle it. You are not on sale. You are not available. Whatever your ancestors pledged, whatever you yourself once agreed to, whatever a shrine still has your name written in, a higher price has been paid and the transaction is closed."],"scriptures":["Ephesians 1:7","1 Corinthians 6:19 to 20","Galatians 3:13","1 Peter 1:18 to 19","Colossians 1:13 to 14","Titus 2:14","Revelation 5:9","Isaiah 43:1","Romans 8:1 to 2","Psalm 107:2"],"note":"","points":["Father, I thank You that I have been bought with a price. I belong to Jesus Christ alone.","Let the redeemed of the Lord say so. I say so this morning. I am redeemed. Psalm 107:2.","Every claim of ownership over my life other than Christ, be cancelled in the name of Jesus.","Every shrine that has my name written in it, I withdraw my name by the blood of Jesus.","I am not on sale. I am not available. I am bought and I am kept.","Fear not, for I have redeemed thee, I have called thee by thy name, thou art mine. Isaiah 43:1.","Every price my ancestors paid to any spirit for my life, I declare it refunded and void.","He hath delivered me from the power of darkness and translated me into the kingdom of His Son.","Every legal ground the enemy claims over my body, it was bought and paid for. Get out.","My body is the temple of the Holy Ghost. I am not my own. I glorify God in my body.","Every addiction claiming ownership of me, your claim is illegal. I am redeemed.","Every generational owner of my bloodline, your title deed is cancelled by the blood.","There is therefore now no condemnation to them which are in Christ Jesus. Romans 8:1.","Every condemnation I have carried for years, be lifted this morning in Jesus' name.","Christ gave Himself for me to redeem me from all iniquity and purify me unto Himself.","Lord, thank You for redeeming my marriage, my children, and my household with me.","I plead the blood over every member of my family and I claim them for the kingdom.","Every unsaved person in my bloodline, I declare that they were also bought. Let them come home.","Worthy is the Lamb, for He was slain and has redeemed us to God by His blood.","Father, let my life reflect the value of the price that was paid for it.","I decree that I walk today as a redeemed person and not as a slave, in the name of Jesus."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"The Hedge Around My House","subtitle":"","about":["Job 1:9 to 10 contains one of the most useful pieces of information in Scripture, and it comes out of Satan's own mouth.","\"Doth Job fear God for nought? Hast not thou made an hedge about him, and about his house, and about all that he hath, on every side? thou hast blessed the work of his hands, and his substance is increased in the land.\"","Look at what the enemy admits.","There is a hedge. It exists, it is real, and it is visible to the spirit realm.","It has three layers. About him. About his house. About all that he hath. Person, household, possessions.","It is on every side. Not partial. Not front only. Every side. And it frustrated him. He had been circling that man's life looking for an opening and he could not find one, and it made him complain to God about it.","That hedge is available over your household today, and it is worth knowing that hedges are maintained by covenant, obedience, and intercession. Job offered sacrifices continually for his children \"for Job said, It may be that my sons have sinned\" (Job 1:5). He was covering people who did not know they were being covered. Today we build the hedge, and we build it around people who may never thank us for it."],"scriptures":["Job 1:5","Job 1:9 to 10","Psalm 91:1 to 12","Psalm 125:2","Zechariah 2:5","Isaiah 4:5 to 6","Psalm 34:7","Ecclesiastes 10:8","2 Thessalonians 3:3","Psalm 121:7 to 8"],"note":"","points":["Father, build a hedge about me, about my house, and about all that I have, on every side.","Let there be a wall of fire round about my household, and let You be the glory in the midst.","Every gap in my hedge that the enemy has found, be sealed today by the blood of Jesus.","Every breach in my covering caused by my own sin, be repaired by mercy this afternoon.","As the mountains are round about Jerusalem, so is the Lord round about me. Psalm 125:2.","He shall cover me with His feathers, and under His wings shall I trust. Psalm 91:4.","There shall no evil befall me, neither shall any plague come nigh my dwelling. Psalm 91:10.","He shall give His angels charge over me, to keep me in all my ways.","The angel of the Lord encampeth round about them that fear Him and delivereth them.","Lord, as Job covered his children, I cover mine today by name in prayer.","I cover my spouse today. Let no arrow find them, at work, on the road, or in their mind.","I cover every child in my household, at school, online, and in every friendship.","I cover my parents, my siblings, and every person under my spiritual responsibility.","Every serpent waiting at a broken hedge in my life, you will not bite me. Ecclesiastes 10:8.","The Lord is faithful, who shall stablish me and keep me from evil. 2 Thessalonians 3:3.","Lord, preserve my going out and my coming in from this time forth and even for evermore.","Every plan of the enemy to enter my home through entertainment or media, be blocked now.","Every open door in my house through an object, a habit, or a guest, be closed in Jesus' name.","Father, let the enemy circle my life and find no opening, as he found none in Job.","Let my house be known in the realm of the spirit as a covered house.","I decree a hedge on every side of my family today, and I will maintain it daily, in Jesus' name."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Pleading the Blood Against Every Altar","subtitle":"","about":["Tonight is one of the heaviest sessions of this fast. Come ready.","We have been breaking altars since Day Four. Tonight we bring the blood to every one that is still standing.","Understand what pleading the blood actually means, because the phrase is often used without content. To plead is a legal term. It means to present a case before a court. When you plead the blood, you are not chanting a formula. You are standing in the court of heaven and presenting the finished work of Christ as the answer to every claim, every accusation, and every altar that has authority over your bloodline.","And here is why it wins every time. Colossians 2:15. \"And having spoiled principalities and powers, he made a shew of them openly, triumphing over them in it.\"","The word spoiled means stripped. Disarmed. It is the picture of a defeated army being publicly stripped of its weapons and paraded through the streets of the victor's city. That already happened. It happened at the cross. Every principality that has been ruling your family line was publicly disarmed two thousand years ago. So tonight we are not asking God to win a battle. We are enforcing a victory.","Bring everything you have identified across eleven days. The altars from Day Four. The covenants from Day Six. The witchcraft from Day Eight. The evil decrees from Day Ten. Anything that has resisted you. Bring it to the blood.","And a word to those in the room at Darien and those online: some of you will experience manifestation tonight. Do not be embarrassed and do not be afraid. Our ministers are available. Let it come out. What comes out tonight does not go back in."],"scriptures":["Colossians 2:13 to 15","Revelation 12:10 to 11","Hebrews 2:14 to 15","Hebrews 9:13 to 14","Hebrews 12:24","Exodus 12:13","1 John 1:7","Zechariah 9:11","Isaiah 49:24 to 26","Luke 10:19","Matthew 12:29","Ephesians 1:20 to 22","Nahum 1:9"],"note":"Stand. Speak loudly. Name what God has shown you across these eleven days.","points":["Father, I come to the court of heaven tonight and I plead the blood of Jesus over my bloodline.","Every altar still standing after eleven days of prayer, I bring you to the blood of Jesus.","Every altar in my father's house, be permanently silenced by the blood of the Lamb.","Every altar in my mother's house, be permanently silenced by the blood of the Lamb.","Every altar speaking against my marriage, the blood of Jesus speaks better things. Be silent.","Every altar speaking against my womb and my seed, be overruled by the blood tonight.","Every altar of poverty, of sickness, and of premature death, be dismantled by the blood.","Every principality ruling over my bloodline, you were spoiled at the cross. I enforce it now.","Every power that was publicly disarmed at Calvary, I refuse to submit to you any longer.","Through death He destroyed him that had the power of death, that is, the devil. Hebrews 2:14.","Every fear of death holding my family in bondage all their lifetime, be broken tonight.","By the blood of Your covenant, send forth my prisoners out of the pit. Zechariah 9:11.","Every captive of mine held by the mighty, I contend for you and I recover you. Isaiah 49:25.","I bind the strong man over my family line and I spoil his house tonight. Matthew 12:29.","Every unclean spirit resisting me at this hour, the blood of Jesus is against you. Come out.","The blood of Jesus cleanseth me from all sin, and I walk in the light tonight. 1 John 1:7.","Affliction shall not rise up the second time. Nahum 1:9. What breaks tonight stays broken.","Jesus is seated far above all principality and power, and I am seated with Him.","I overcome by the blood of the Lamb and by the word of my testimony, and I love not my life unto death.","Father, let there be evidence tonight. Let something break that I will be able to point to.","It is finished. Every altar over my bloodline is answered by the blood of Jesus, and I am free."]}],"questions":["The lamb was slain, but only applied blood saved. Name three specific areas of your life where the blood has been available but never deliberately applied. Apply it tonight, out loud, by name.","Job covered children who never knew they were being covered. Write down five names you are going to cover in prayer every day for the rest of this fast."],"questionNote":""},{"n":12,"date":"Friday, October 16","title":"The Well They Fought Me For","subtitle":"","anchor":{"text":"And the herdmen of Gerar did strive with Isaac's herdmen, saying, The water is ours: and he called the name of the well Esek; because they strove with him.","ref":"Genesis 26:20"},"teaching":["Here is something nobody tells you when they preach about digging wells.","The fighting starts after the water comes up.","Read the sequence in Genesis 26 carefully. Verse 19: \"And Isaac's servants digged in the valley, and found there a well of springing water.\" Springing water. Living water. Not a puddle. Not a trickle. The real thing.","And verse 20, immediately: \"And the herdmen of Gerar did strive with Isaac's herdmen, saying, The water is ours.\"","Nobody fought him while he was digging. Nobody argued with him while he was clearing earth out of a hole in the ground in the middle of a famine. He could have dug for a month in complete peace. The contention arrived the moment the water did.","That is the thing you must understand about the season you may be entering right now, on Day Twelve of this fast. If the pressure in your life has increased since Day One, that is not evidence that the fast is not working. It may be the clearest evidence that it is. A dry well attracts no argument. Nobody sends a delegation to fight you over a hole with nothing in it. The strife showed up because something came up.","And notice what they said. \"The water is ours.\" Not, there is no water. Not, you dug in the wrong place. They acknowledged the water and then claimed it. That is the voice of every enemy at the edge of your breakthrough: not denial, but claim.","So Isaac named it Esek, which in Hebrew carries the sense of contention, strife, quarrel. He did something remarkable. He named the well after the fight. He did not pretend it was peaceful. He documented the opposition and moved on. Today we deal with contention on three levels.","Contention at the edge of breakthrough, which is the enemy's last stand at the point of delivery.","Contention in the home, because the enemy knows that a house divided cannot stand, and a couple in strife will hand back what they fasted twelve days to obtain.","And tonight, deliverance from the spirit of contention itself, because for some of you, strife is not something that happens to you. It follows you. Every job. Every church. Every relationship. That is not personality. That is a spirit, and tonight it comes out."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"They Strove With Him","subtitle":"","about":["Tonight we reframe the fight.","Many believers interpret opposition as disapproval from God. They assume that if this were really His will, it would be smooth. Scripture teaches the opposite pattern almost everywhere you look. Paul wrote, \"For a great door and effectual is opened unto me, and there are many adversaries\" (1 Corinthians 16:9). Not but there are many adversaries. And. The adversaries were part of the evidence of the open door.","Tonight we stop asking why there is a fight and start asking what the fight is trying to protect."],"scriptures":["Genesis 26:19 to 20","1 Corinthians 16:9","Nehemiah 4:1 to 9","Acts 19:20 to 23","Exodus 5:6 to 9","2 Timothy 3:12","Matthew 11:12","Psalm 23:5"],"note":"","points":["Father, tonight I refuse to interpret opposition as Your disapproval. Teach me to read the season correctly.","Every fight that has arrived because water has come up in my life, I recognise you and I confront you.","Every enemy claiming what God has given me, saying the water is ours, be disgraced in Jesus' name.","A great door and effectual is opened unto me. Every adversary at that door, be removed.","Every contention that intensified since Day One of this fast, I decree it is the sound of breakthrough.","Every increased pressure at home since this fast began, I break your assignment tonight.","As Pharaoh increased the burden when deliverance came near, I decree every increased burden shall not last.","Every discouragement designed to make me abandon the well I have already opened, I resist you.","Lord, let me not walk away from a well I have already found water in.","Every Sanballat mocking my building at this stage, I refuse to come down. Nehemiah 6:3.","Father, prepare a table before me in the presence of my enemies. Let them watch me eat.","Every strife arranged to arrive exactly at the point of delivery, be cancelled in Jesus' name.","Every quarrel in my household tonight that was assigned to weaken this fast, be silenced now.","Lord, give me the wisdom of Isaac. Let me know what to fight for and what to walk away from.","Every accusation that the blessing on my life belongs to somebody else, I overrule it now.","Every legal claim laid on my breakthrough by any power, be answered by the blood of Jesus.","Father, thank You that no one contends over an empty life. The fight is proof of substance.","Every weariness building in me at this midway point, be replaced by fresh strength tonight.","Lord, let this contention become a documented testimony and not a permanent address.","Every enemy who thought this fast would break me, let them watch me finish it.","I decree that I will not surrender one drop of water God has brought up in my life."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"The Battle at the Edge of Breakthrough","subtitle":"","about":["There is a specific kind of attack that only shows up near the finish line.","Consider the pattern. Pharaoh's chariots came when Israel was already out of Egypt and standing at the sea. The Amalekites attacked at Rephidim, on the way to the mountain. The enemy did not attack Nehemiah when the wall was at ankle height. They came when \"the wall was joined together unto the half thereof\" (Nehemiah 4:6). And the temptation of Jesus came not before the baptism but immediately after, when heaven had just spoken over Him.","Then look at Mark 9. A father brings his son for deliverance. And Jesus says, \"When he had cried, and rent him sore, he came out of him; and he was as one dead\" (Mark 9:26). The worst manifestation happened on the way out. Many bystanders concluded the boy was dead. He was not dead. He was free, and the violence they saw was the exit, not the possession. Some of you are experiencing the exit and misreading it as defeat. This morning we hold the line at the edge."],"scriptures":["Exodus 14:9 to 14","Exodus 17:8 to 13","Nehemiah 4:6 to 9","Matthew 4:1 to 11","Mark 9:20 to 27","Galatians 6:9","Hebrews 10:35 to 39","2 Chronicles 20:15 to 17","Daniel 10:12 to 13"],"note":"","points":["Father, I hold the line this morning. I am closer than I have ever been and I will not turn back.","Every chariot pursuing me now that I am already out of Egypt, be drowned in the sea.","Every Amalek attacking me on the way to the mountain, be defeated in the name of Jesus.","Every attack timed for the halfway point of my building, be scattered in Jesus' name.","Every manifestation that looks like death but is actually deliverance, let me not misread it.","Lord, hold up my hands as Aaron and Hur held up Moses. Send me the people who hold arms.","Every weariness in well doing, be broken. In due season I shall reap if I faint not.","Every temptation that came immediately after heaven spoke over me, I overcome by the word.","Every prince of Persia withstanding my answer, be defeated. Let my Michael come. Daniel 10:13.","Every answer that was released from day one and delayed in transit, be delivered today.","Father, do not let me cast away my confidence which has great recompence of reward.","Every voice saying it is too late and too hard, be silenced in the name of Jesus.","Every last stand of the enemy over my situation, collapse now in Jesus' name.","The battle is not mine but God's. I stand still and I see the salvation of the Lord.","Every intensified attack on my marriage in this final stretch, be broken in Jesus' name.","Every attack on my children, my health, and my finances in this season, be cancelled.","Lord, strengthen the arms of my hands for the finish. Genesis 49:24.","Every plan to make me quit at ninety percent, I expose you and I overcome you.","Father, thank You that the fiercest fight is proof of the nearest breakthrough.","I decree that I finish what I started. I do not abandon wells I have already dug.","He that shall endure unto the end, the same shall be saved. I endure, in the name of Jesus."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Contention in My Own House","subtitle":"","about":["The enemy would rather split your house than fight your ministry, because a split house does his work for him.","Scripture is direct about this. \"It is better to dwell in the wilderness, than with a contentious and an angry woman\" (Proverbs 21:19). And also, \"A continual dropping in a very rainy day and a contentious woman are alike\" (Proverbs 27:15). Now, before anyone weaponises those verses, understand that Scripture is equally direct with men: \"Husbands, love your wives, and be not bitter against them\" (Colossians 3:19), and Peter warns that a husband who does not honour his wife will have his prayers hindered (1 Peter 3:7).","Read that again. Your prayers can be blocked by how you are treating the person you sleep next to.","Which means some of you have been fasting for eleven days with a hindrance you brought into the fast with you.","Here is what to look for at home today.","The continual dropping. Not one big fight. The steady, low grade correction. The tone. The sigh. The eye. Water torture rather than a flood.","Contempt. The moment you begin to find your spouse ridiculous rather than merely frustrating, something has crossed a line.","Score keeping. Love \"thinketh no evil\" (1 Corinthians 13:5), and that phrase in the original carries the sense of not keeping a ledger of wrongs.","Third parties. Strife multiplies when it gets an audience. Some marriages are being fought by six people because two people could not keep it in the room.","And notice one more thing about Genesis 26:20. It was not Isaac who was fighting. It was Isaac's herdmen. The contention was between the staff. Some of you are in strife with people who are on your side, over resources that belong to neither of you."],"scriptures":["Proverbs 17:14","Proverbs 21:9 to 19","Proverbs 27:15","Colossians 3:18 to 19","1 Peter 3:1 to 7","Ephesians 4:26 to 32","James 3:14 to 18","1 Corinthians 13:4 to 7","Amos 3:3","Matthew 12:25","Genesis 13:7 to 9"],"note":"","points":["Father, I bring the atmosphere of my home to You today. Let there be peace in my dwelling.","Every spirit of contention operating in my house, I cast you out in the name of Jesus.","Every continual dropping in my home, every constant correction and sigh, break now.","Lord, forgive me for every place I have been the contentious one in my own house.","Every root of contempt growing in my heart toward my spouse, be uprooted today.","Every ledger of wrongs I have been keeping, I burn it today in the name of Jesus.","Father, if my prayers have been hindered by how I treat my spouse, correct me today. 1 Peter 3:7.","Every third party who has been fuelling strife in my marriage, be removed in Jesus' name.","Lord, teach me to keep my house matters in my house.","The beginning of strife is as when one letteth out water. Lord, teach me to leave off before it starts.","Every argument that starts over nothing and ends in war, be disarmed in my home.","Father, give my spouse and me the grace of Abraham. Let there be no strife between us.","Every generational pattern of quarrelling in my family, be terminated at my generation.","A house divided against itself shall not stand. I refuse a divided house in Jesus' name.","Lord, let my children never learn contention by watching me.","Every word spoken in anger in my home this week, I ask for mercy and I ask for healing.","Let not the sun go down upon my wrath. I refuse to sleep in strife tonight.","Every bitterness, wrath, anger, and evil speaking, be put away from me. Ephesians 4:31.","Father, give me a soft answer that turns away wrath in my home.","Every strife among people who are actually on the same side, be exposed and be ended.","I decree that the wisdom from above rules my home: pure, peaceable, gentle, and full of mercy."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Silencing the Spirit of Strife","subtitle":"","about":["Tonight we go after strife as a spirit, not as a habit.","Some people carry conflict with them. It is not situational. Every workplace becomes hostile. Every church becomes political. Every friendship ends in an incident. Every relationship reaches the same explosion at roughly the same point. And every single time there is an explanation, and the explanation is always about somebody else.","When the location changes and the outcome does not, the problem is travelling.","Scripture is unusually severe about this. Proverbs 6:16 to 19 lists seven things the Lord hates, and the seventh, the one given climactic position, is \"he that soweth discord among brethren.\" Not commits discord. Sows it. Plants it deliberately and waits for a harvest.","James goes further and names the source: \"But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth. This wisdom descendeth not from above, but is earthly, sensual, devilish. For where envying and strife is, there is confusion and every evil work\" (James 3:14 to 16). Devilish. And notice the consequence: strife opens the door to \"every evil work.\" It is not one problem. It is an access point for everything else. Some of you have been fighting sickness, poverty, and confusion for years while leaving the door of strife wide open. Tonight we deal with:","The spirit of strife and discord. The spirit of anger and rage that runs in bloodlines. The spirit of division that splits churches, families, and businesses. Malice, envy, and the tongue that sows. And the wound underneath the anger, because most rage is grief that was never allowed to be sad.","Come humble tonight. Do not bring your list of who was wrong. Bring yourself."],"scriptures":["James 3:13 to 18","Proverbs 6:16 to 19","Galatians 5:19 to 21","Ephesians 4:26 to 27","Genesis 4:5 to 8","Numbers 16:1 to 3","Titus 3:9 to 11","1 Corinthians 3:3","Romans 12:18","Psalm 133:1 to 3","Hebrews 12:14 to 15","Matthew 5:9"],"note":"Stand. Where a point names a spirit, address it directly.","points":["In the name of Jesus, I take authority over every spirit of strife operating in and around my life.","Every spirit of contention that has followed me from job to job and place to place, come out now.","Every spirit of discord sowing division in my family, be exposed and be cast out tonight.","Every spirit of anger and rage inherited from my bloodline, I break your assignment now.","Every spirit of malice, envy, and bitterness in me, I renounce you and I cast you out.","Every root of bitterness springing up in me and defiling many, be uprooted tonight.","Where envying and strife is, there is confusion and every evil work. I close that door now.","Every access point in my life opened through strife, be sealed by the blood of Jesus.","Every Cain spirit that resents the acceptance of a brother, be destroyed in Jesus' name.","Every Korah spirit of rebellion against authority, come out of me and out of my house.","Lord, deliver me from being a person who sows discord. Take that seed out of my hand.","Every wound underneath my anger, be healed tonight. Let me grieve what I have been raging about.","Every unresolved offence I have converted into a personality, be dismantled in Jesus' name.","Father, forgive me for every church, family, or friendship I damaged with my mouth.","Every division in my local assembly that I have contributed to, forgive me and use me to repair it.","Give not place to the devil. Every place I have given him through anger, I take it back tonight.","Lord, make me a peacemaker, for they shall be called the children of God.","Follow peace with all men and holiness. Give me the discipline to pursue peace actively.","Behold how good and pleasant it is for brethren to dwell together in unity. Command the blessing.","As much as lieth in me, let me live peaceably with all men. Romans 12:18.","I decree tonight that strife loses its grip on me permanently, and the door it opened is shut in Jesus' name."]}],"questions":["The fight arrived when the water did. Where has opposition increased in your life since this fast began, and what might it be trying to protect?","When the location changes and the outcome stays the same, the problem is travelling. Is there a conflict pattern that has followed you into more than three different situations? Name it honestly."],"questionNote":""},{"n":13,"date":"Saturday, October 17","title":"Sitnah: Hated Without a Cause","subtitle":"","anchor":{"text":"And they digged another well, and strove for that also: and he called the name of it Sitnah.","ref":"Genesis 26:21"},"teaching":["Yesterday was Esek, contention. Today is Sitnah, and it is worse. The Hebrew word Sitnah comes from a root that means to oppose, to accuse, to bear a grudge. It is the same root that gives us the word satan, which means adversary or accuser. Yesterday's fight was over a resource. Today's fight is personal. That is the escalation Isaac experienced, and many of you have lived it.","At Esek, they wanted the water. At Sitnah, they wanted him gone. The first was competition. The second was hatred. And hatred does not negotiate, because hatred is not trying to gain. It is trying to remove.","Here is what makes this day necessary in a marriage and destiny fast: there are people who dislike you for reasons that have nothing to do with your behaviour.","Joseph is the clearest picture. \"And when his brethren saw that their father loved him more than all his brethren, they hated him\" (Genesis 37:4). Read the cause carefully. He was hated for being loved. Not for arrogance, not for his coat, not even for his dreams at that point. For favour he did not choose and could not return.","And then Jesus, quoting the Psalms about His own situation: \"They hated me without a cause\" (John 15:25). He then said something that should settle this for every believer: \"If the world hate you, ye know that it hated me before it hated you\" (John 15:18).","Some of you have spent years trying to fix a relationship by improving yourself, and you have been auditioning for the approval of people whose objection was never your performance. It was your assignment.","Today we deal with:","The hatred we did not earn, and the exhausting work of trying to be small enough to be acceptable.","Favour killers and destiny haters, the people positioned specifically at the point of your rising.","And tonight, the accuser himself, because behind every Sitnah is a legal case being argued in a realm you cannot see, and tonight we answer it."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Second Well","subtitle":"","about":["Isaac dug again. That is the sentence that matters tonight.","He had every reason not to. He had just lost the first well. He knew the second one would be contested too. And he still put the shovel in the ground.","Notice what he did not do. He did not go back and fight for Esek. He did not build a case, gather allies, or spend three years litigating. He let them have it and he dug again. There is a kind of strength that looks like surrender to onlookers and is actually the refusal to be delayed by a fight that God did not assign.","Tonight we ask for the grace to dig a second time."],"scriptures":["Genesis 26:21","Proverbs 24:16","Micah 7:8","2 Corinthians 4:8 to 9","Job 14:7 to 9","Psalm 37:1 to 8","Isaiah 43:18 to 19"],"note":"","points":["Father, give me the grace to dig again after losing the first well.","Every discouragement from losing something I fought for, be replaced with fresh resolve tonight.","Though I fall seven times, I shall rise again. Proverbs 24:16.","Rejoice not against me, O mine enemy. When I fall I shall arise. Micah 7:8.","Every place where I stopped digging because it was contested, give me courage to return.","Lord, teach me which battles to fight and which ground to leave behind.","Every fight I have been litigating for years that You never assigned to me, release me from it.","Father, deliver me from the need to be proven right. Let me dig instead.","I am troubled on every side yet not distressed, perplexed but not in despair, cast down but not destroyed.","Every attempt to make me bitter through repeated loss, fail in the name of Jesus.","Lord, there is hope for a tree that is cut down. At the scent of water it will bud again.","Every dry stump in my life, let it sprout again at the scent of the water of Your Spirit.","Father, do not let me remember the former things so hard that I miss the new thing.","Every fresh start You are offering me that I have been too wounded to accept, I receive it tonight.","Every wasted year spent defending ground I should have walked away from, redeem it now.","Lord, give my marriage the grace to dig again where we have been contested.","Every second attempt in my life, let it produce what the first attempt could not.","Father, fret not because of evildoers. Take the fretting out of me tonight.","Every enemy expecting me to give up after this loss, let them watch me start again.","Lord, let the digging itself become my worship tonight.","I decree that I am not finished. I am between wells, and I am digging again in Jesus' name."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"They Hated Me Without a Cause","subtitle":"","about":["This morning we stop auditioning.","There is an exhausting habit that many good people carry. When someone dislikes them, they assume they must have done something, and they set about making themselves smaller, quieter, less visible, less successful, less anointed, hoping that if they reduce themselves enough the hostility will finally lift.","It never lifts, because it was never about the size of you. Look at Joseph. Genesis 37:4 says his brothers \"could not speak peaceably unto him.\" They could not. Not would not. Something in them was incapable of ordinary conversation with him, and it was there before he ever opened his mouth about a dream. And look at what Jesus said in John 15, and He said it as comfort, not complaint. \"If ye were of the world, the world would love his own: but because ye are not of the world, but I have chosen you out of the world, therefore the world hateth you\" (John 15:19). The hatred was tied to the choosing.","Now the balance. Not all opposition is unearned. Some people dislike you because you were genuinely difficult, and part of this morning is having the humility to know the difference. Ask God for honest eyes. Where you were wrong, repent. Where you were simply chosen, stop apologising for it."],"scriptures":["John 15:18 to 25","Genesis 37:3 to 11","Psalm 69:4","Psalm 35:19","1 John 3:12 to 13","1 Samuel 18:6 to 12","Matthew 5:10 to 12","Romans 12:17 to 21","Luke 6:27 to 28"],"note":"","points":["Father, this morning I stop making myself smaller to be accepted by people who will never accept me.","Every exhausting attempt to earn the approval of my haters, I lay it down today.","Lord, give me honest eyes. Where I was genuinely wrong, show me and let me repent.","Where I was simply chosen, deliver me from apologising for the choosing.","Every hatred aimed at me because of the favour on my life, I overcome it by the blood of Jesus.","Every brother and sister who cannot speak peaceably to me, Lord change their heart or change my proximity.","If the world hated Him before it hated me, I count it as fellowship and not as failure.","Every rejection that has shaped my personality, be healed this morning in Jesus' name.","Every performance driven identity built on trying to be liked, be dismantled in Jesus' name.","Lord, take away my need to be understood by everybody.","Every Saul watching David play the harp with a javelin in his hand, be exposed in my life.","Every relationship where I am tolerated but not celebrated, give me wisdom about my place in it.","Father, teach me to bless those who curse me and pray for those who despitefully use me.","Every desire in me for revenge, I surrender it. Vengeance belongs to the Lord.","Lord, do not let hatred aimed at me turn me into a hater.","Every plot arranged against my life by people who smile at me, be exposed in Jesus' name.","Blessed am I when men revile me and persecute me falsely for His sake. Great is my reward.","Every false report circulating about me right now, let truth catch up with it publicly.","Father, protect my spouse and my children from the hatred aimed at me.","Lord, overcome evil in my life with good. Let my response preach louder than their attack.","I decree that the hatred of men will not determine the size of my obedience."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Favour Killers and Destiny Haters","subtitle":"","about":["Some opposition is generic. Some is positioned.","Study the pattern in Scripture and you find that certain enemies show up at precise moments in a person's story, and they are always assigned to the same thing: the point of transition. Pharaoh's order to kill the Hebrew boys came when the nation was multiplying (Exodus 1:9 to 16). Herod's order to kill the children in Bethlehem came when a King was born (Matthew 2:16). Haman's decree came when Mordecai would not bow (Esther 3:5 to 6). Sanballat's mockery came when the wall was going up (Nehemiah 4:1).","Each one arrived at a moment of increase, and each one had the same objective: stop the thing before it matures.","Recognise the operation by these marks.","It targets timing. The car breaks the week of the interview. The illness arrives the month of the wedding. The family crisis erupts the week you were meant to launch.","It works through proximity. Joseph was sold by his brothers, not by strangers. Delilah was in Samson's bed. The most effective destiny killers are close enough to know the schedule. And it hates the announcement more than the person. Joseph's brothers tolerated him until he opened his mouth about the dream. There is wisdom in knowing what to announce and what to carry quietly until it is too developed to abort. Today we war for the timing of our lives."],"scriptures":["Exodus 1:8 to 22","Matthew 2:1 to 16","Esther 3:1 to 6","Nehemiah 4:1 to 3","Genesis 37:18 to 20","Judges 16:4 to 21","Revelation 12:1 to 5","Psalm 41:9","Micah 7:5 to 7","Proverbs 29:11"],"note":"","points":["Father, every enemy positioned at the point of my transition, be removed in the name of Jesus.","Every Pharaoh assigned to stop my multiplication, your decree is cancelled in Jesus' name.","Every Herod assigned to kill what has just been born in my life, be exposed and be destroyed.","Every Haman building a gallows for my family, let him hang on his own construction.","Every attack timed to arrive at my point of increase, be intercepted in Jesus' name.","Every accident, illness, or crisis scheduled for my season of breakthrough, be cancelled.","Every dragon waiting to devour what I am carrying the moment it is delivered, be defeated.","Every destiny killer close enough to know my schedule, be exposed in the name of Jesus.","Every familiar friend who lifts up his heel against me, let your counsel come to nothing.","Every Delilah assigned to my life and my household, be removed in the name of Jesus.","Every Judas positioned at my table, be exposed before the kiss is given.","Lord, teach me what to announce and what to carry in silence until it is mature.","Every dream of mine that was aborted because I spoke it to the wrong person, be restored.","Father, guard my mouth. A fool uttereth all his mind but a wise man keepeth it in.","Every gathering that has been called to discuss how to stop me, be scattered in Jesus' name.","Every favour killer working against my marriage, be uprooted in the name of Jesus.","Lord, protect my children from every enemy assigned to their generation.","Every appointment on my calendar that the enemy has targeted, be covered by the blood.","Father, let my timing be protected. Let nothing arrive late and nothing be aborted early.","Every pit dug for me by my own brethren, let it become the road to my palace.","I decree that what is being carried in my life will be delivered safely, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"The Accuser at My Right Hand","subtitle":"","about":["Tonight we go behind the human opposition to the legal case being argued about your life. Zechariah 3 gives us the clearest courtroom picture in Scripture. \"And he shewed me Joshua the high priest standing before the angel of the LORD, and Satan standing at his right hand to resist him\" (Zechariah 3:1). The word translated resist is satan used as a verb. He was there in an official capacity, at the right hand, which was the position of the prosecutor in an ancient court. And the case was legitimate. Verse 3: \"Now Joshua was clothed with filthy garments, and stood before the angel.\" The high priest of Israel was standing before God in filth. The accusation was not fabricated.","Now watch what God does, because this is everything. He does not present counter evidence. He does not argue that the garments are actually clean. He rebukes the accuser and He changes the man. \"The LORD rebuke thee, O Satan... is not this a brand plucked out of the fire?\" (Zechariah 3:2). And then: \"Take away the filthy garments from him. And unto him he said, Behold, I have caused thine iniquity to pass from thee, and I will clothe thee with change of raiment\" (Zechariah 3:4). The charge was answered by a change of clothing.","That is your defence tonight. Not your record. Your robe. Revelation 12:10 to 11 tells us the accuser accuses \"day and night\", and it tells us exactly how he is overcome: \"by the blood of the Lamb, and by the word of their testimony.\" Two things. The blood, which is what Christ did. And the testimony, which is what you say about what He did.","Tonight we answer accusations, we reverse verdicts, and we receive new garments."],"scriptures":["Zechariah 3:1 to 7","Revelation 12:7 to 11","Job 1:6 to 11","Romans 8:1, 31 to 34","1 John 2:1 to 2","Colossians 2:13 to 15","Isaiah 61:10","Isaiah 54:17","Daniel 7:9 to 10, 22","Luke 22:31 to 32","Hebrews 7:25","Psalm 109:6, 31"],"note":"Stand. You are appearing in court tonight. Speak accordingly.","points":["Father, I come before Your throne tonight, and I stand on the finished work of Jesus Christ.","Every accusation being levelled against me in the realm of the spirit, I answer it by the blood.","Satan, accuser of my life and my bloodline, the Lord rebuke thee. Zechariah 3:2.","I am a brand plucked out of the fire. My past does not disqualify my future.","Every filthy garment the accuser points to, Lord take it away from me tonight.","Clothe me with change of raiment. Set a fair mitre upon my head. Zechariah 3:4 to 5.","Every legal case being argued against my family in the courts of heaven, be dismissed by the blood.","Who shall lay anything to the charge of God's elect? It is God that justifieth.","Christ is at the right hand of God making intercession for me. My advocate is speaking.","He stands at the right hand of the poor to save him from those that condemn. Psalm 109:31.","Every accusation from my past that has been blocking my breakthrough, be answered tonight.","Every accusation from my bloodline that is still being argued, be settled by the blood of Jesus.","Every handwriting of ordinances written against me, be blotted out and nailed to the cross.","I overcome by the blood of the Lamb and by the word of my testimony. I testify tonight.","Every verdict issued against me in a wrong court, I appeal to the Ancient of Days.","Judgement is given to the saints of the most High. Let judgement be given in my favour. Daniel 7:22.","Satan has desired to sift me, but Jesus has prayed for me and my faith will not fail.","Every accusation being brought against my marriage, be answered by the covenant of God.","Every accusation against my children, be silenced by the blood of Jesus tonight.","No weapon formed against me shall prosper, and every tongue that rises in judgement I condemn.","I decree that the case is closed, the accuser is rebuked, and I am clothed. It is finished, in Jesus' name."]}],"questions":["Is there someone whose approval you have been trying to earn for years? Write their name and write down what it has cost you to keep auditioning.","God answered a true accusation with a change of clothing, not a defence. What is the filthy garment you have been wearing, and what is God clothing you with instead?"],"questionNote":""},{"n":14,"date":"Sunday, October 18","title":"Rehoboth: The Lord Has Made Room","subtitle":"","anchor":{"text":"And he removed from thence, and digged another well; and for that they strove not: and he called the name of it Rehoboth; and he said, For now the LORD hath made room for us, and we shall be fruitful in the land.","ref":"Genesis 26:22"},"teaching":["Three wells. Esek. Sitnah. Rehoboth.","Contention. Hatred. Room.","You are on Day Fourteen of twenty one, and this is the turn. Everything before today has been about removal. Everything from today forward is about occupation.","Rehoboth means broad places, wide spaces, room. And Isaac's declaration when he named it contains two things joined by a word that should stop you: \"For now the LORD hath made room for us, and we shall be fruitful in the land.\"","Room, and therefore fruitfulness.","That connection is not decorative. It is the entire principle of this day. Fruitfulness requires space. You cannot bear what you have no room to carry. A plant with a healthy root system in a small pot does not die. It becomes root bound. It stops growing, not because it lacks life, but because it lacks space, and eventually the very roots that should sustain it begin to strangle it. Some of you are not lacking anointing. You are root bound. You have capacity you have never used because the container of your life is too small for it. Your thinking is too small. Your circle is too small. Your expectations were set by people who never went anywhere. Your idea of what is possible was formed in a house where nothing was possible.","God does not enlarge the plant. He enlarges the place. Look at how Isaiah puts it: \"Enlarge the place of thy tent, and let them stretch forth the curtains of thine habitations: spare not, lengthen thy cords, and strengthen thy stakes\" (Isaiah 54:2). And the very next verse gives the reason: \"For thou shalt break forth on the right hand and on the left; and thy seed shall inherit the Gentiles.\"","Notice the order. Enlarge first. Break forth second. The tent is expanded before the increase arrives, because increase that arrives with nowhere to go leaves.","And notice something else in that instruction: \"strengthen thy stakes.\" You do not only lengthen cords. If you widen a tent without deepening the anchors, the first wind takes the whole thing down. Expansion without foundation is collapse waiting for weather. That is why we spent Days Four through Eleven in the foundation before we came to today.","Today: room in the spirit, room in the mind, room in the tent, and tonight, the breaking of every limitation."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"The Third Well","subtitle":"","about":["\"And for that they strove not.\"","Six words that describe a real season. There is such a thing as a well nobody fights you for. There is ground God gives that arrives without a war attached.","Many believers have been in battle so long that they cannot recognise peace when it comes, and they will manufacture conflict out of sheer habit. Tonight we ask God for the third well, and we ask Him to prepare us to receive something easy."],"scriptures":["Genesis 26:22","Psalm 18:19","Psalm 31:8","Psalm 118:5","Deuteronomy 6:10 to 11","Joshua 21:44","Isaiah 32:18","Psalm 16:5 to 6"],"note":"","points":["Father, bring me to my Rehoboth. Bring me to the well they will not fight me for.","Every season of continuous contention in my life, let it end and let room begin.","He brought me forth also into a large place, He delivered me because He delighted in me.","I called upon the Lord in distress and He answered me and set me in a large place. Psalm 118:5.","Lord, prepare me to receive something that does not come with a war attached.","Every habit of manufacturing conflict because I have been fighting too long, be broken in me.","Father, give me houses full of good things which I did not fill and wells which I did not dig.","Every promise that has been contested for years, let it come to me quietly now.","Lord, let the Lord give me rest round about, as He did for Israel. Joshua 21:44.","My people shall dwell in a peaceable habitation and in quiet resting places. Isaiah 32:18.","Every restlessness in my spirit that survives every victory, be healed tonight.","The lines are fallen unto me in pleasant places. I have a goodly heritage.","Father, thank You that You have not set my feet in a narrow place but in a broad one.","Every third well assigned to my life, I locate you and I claim you tonight.","Lord, let my marriage enter a Rehoboth season. Give us room and give us rest.","Every constant crisis in my household, be replaced with a peaceable habitation.","Father, do not let me abandon peace because I am more familiar with struggle.","Every fear that says peace never lasts for me, be broken in the name of Jesus.","Lord, let this fast mark the end of an era of striving in my life.","Every wilderness season assigned to me that has run past its time, come to an end tonight.","I decree that from tonight the Lord has made room for me, and I shall be fruitful in the land."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Enlarge the Place of Thy Tent","subtitle":"","about":["Jabez is one of the strangest entries in Scripture. He appears in the middle of nine chapters of genealogy in 1 Chronicles, and the narrative stops to tell us about him.","\"And Jabez was more honourable than his brethren: and his mother called his name Jabez, saying, Because I bare him with sorrow\" (1 Chronicles 4:9).","His name means pain. His mother named him after the worst day of her life, and he carried that as his identity every time somebody called him. Imagine being addressed by the word sorrow for your entire childhood.","And then verse 10: \"And Jabez called on the God of Israel, saying, Oh that thou wouldest bless me indeed, and enlarge my coast, and that thine hand might be with me, and that thou wouldest keep me from evil, that it may not grieve me! And God granted him that which he requested.\"","He asked for four things. Blessing. Enlargement. Presence. Protection. And notice the last clause: that it may not grieve me. He asked God for expansion that would not cost him his soul. That is wisdom. There is a kind of increase that grieves you, and Jabez was specific enough to ask for the other kind. The man named Pain refused to build a life around his name."],"scriptures":["1 Chronicles 4:9 to 10","Isaiah 54:2 to 5","Genesis 26:22","Deuteronomy 12:20","Psalm 4:1","Psalm 119:32","2 Corinthians 6:11 to 13","Ephesians 3:20","Habakkuk 2:2 to 3"],"note":"","points":["Father, bless me indeed and enlarge my coast, and let Your hand be with me.","Keep me from evil, that it may not grieve me. Give me increase that does not cost my soul.","Every name of sorrow attached to me, I refuse to build my life around it.","Lord, enlarge the place of my tent. Let me stretch forth my curtains and spare not.","Lengthen my cords and strengthen my stakes. Give me expansion with anchoring.","I shall break forth on the right hand and on the left. Isaiah 54:3.","Every small thinking inherited from my upbringing, be enlarged by the Spirit of God today.","Every expectation set for me by people who never went anywhere, be broken today.","Lord, I am root bound. Take me out of the small container and put me in ground.","Every capacity in me that has never been used, let it find room this season.","Father, enlarge my heart, that I may run the way of Your commandments. Psalm 119:32.","Every straitness in me, every narrowness of soul, be widened by the love of God.","Lord, do exceeding abundantly above all that I ask or think, according to the power in me.","Every limitation placed on my life by a family script, be dismantled this morning.","Father, enlarge my marriage. Give us room to become who You called us to be together.","Lord, enlarge my capacity to give, to love, to forgive, and to carry others.","Every vision You gave me that I shrank to fit my circumstances, restore it to full size.","Write the vision and make it plain. Lord, give me clarity for what You are enlarging.","Every place where I have set my own ceiling, I break through it in the name of Jesus.","Father, prepare my character for the size of what You are about to give me.","I decree enlargement over my coast, my capacity, and my calling, in the name of Jesus."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Doors No Man Can Shut","subtitle":"","about":["\"These things saith he that is holy, he that is true, he that hath the key of David, he that openeth, and no man shutteth; and shutteth, and no man openeth; I know thy works: behold, I have set before thee an open door, and no man can shut it: for thou hast a little strength\" (Revelation 3:7 to 8).","Read the last clause slowly. For thou hast a little strength. The open door was not given to the strongest church in Asia. It was given to Philadelphia, a small congregation with limited resources, and God specifically named their smallness as part of the context of the promise. God is not waiting for you to be impressive before He opens doors.","Now understand what an open door means and does not mean. It does not mean an easy door. Paul's open door in 1 Corinthians 16:9 came with many adversaries.","It does mean a door that human beings cannot close. The key of David is a reference to Isaiah 22:22, where authority over the house was given to one man. When God opens, committees cannot close it. When God opens, family opposition cannot close it. When God opens, your own past cannot close it. Today we ask for doors, and we also ask for the discernment to walk through the right ones, because an open door is not automatically God's door. Paul had an open door at Troas and \"had no rest in my spirit\" and left (2 Corinthians 2:12 to 13). Opportunity and assignment are not the same thing."],"scriptures":["Revelation 3:7 to 8","Isaiah 22:22","Isaiah 45:1 to 3","1 Corinthians 16:8 to 9","2 Corinthians 2:12 to 13","Colossians 4:3","Acts 16:6 to 10","Psalm 24:7 to 10","Micah 2:13"],"note":"","points":["Father, set before me an open door that no man can shut, in the name of Jesus.","You are the One who openeth and no man shutteth. Open for me today.","Every door shut against me by a human hand, be opened by the key of David.","Every door shut against me by my own past, be opened by the mercy of God.","I will go before thee and make the crooked places straight. Break in pieces the gates of brass.","Give me the treasures of darkness and hidden riches of secret places. Isaiah 45:3.","Lord, I have but a little strength, and that has never disqualified anyone from an open door.","Every opportunity that is not my assignment, give me the grace to walk past it.","Lord, if I have no rest in my spirit about a door, give me courage to leave it.","Every wrong door I have been knocking on for years, take my hand off it today.","Father, forbid me where I need forbidding, as You forbade Paul in Asia.","Every Macedonian call assigned to my life, let me hear it clearly and answer it.","Lift up your heads, O ye gates, and let the King of glory come in. Open over my life.","Every gate of my city, my career, and my industry, open to me in the name of Jesus.","Let the breaker go up before me. Let Him break the gate and let me pass through.","Father, open doors for my spouse. Let us both walk into rooms we did not qualify for.","Every door of favour that has been shut for years, swing open this season.","Lord, open doors for my children that were closed to my generation.","Every gatekeeper assigned to block me, let God turn their heart or move them aside.","Father, when the door opens, give me the character to survive the room behind it.","I decree open doors over my life this season, and no man shall shut them, in Jesus' name."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Breaking Every Limitation","subtitle":"","about":["Tonight we deal with the cage.","There are two kinds of limitation and they need different weapons.","The first is external. Real barriers. Gates of brass and bars of iron, as Isaiah 45:2 describes them. Systems, structures, and powers that genuinely stand in your way and must be broken. The second is internal, and it is the more dangerous of the two, because it does not need a guard.","Read Numbers 13 again. Twelve men saw the same land. Ten came back and said, \"We be not able to go up against the people; for they are stronger than we\" (Numbers 13:31). Then they described the giants, and then they said the sentence that cost a generation everything: \"and we were in our own sight as grasshoppers, and so we were in their sight\" (Numbers 13:33). Nobody in Canaan ever called them grasshoppers. They assigned themselves that name and then attributed it to their enemies.","And here is the tragedy. The generation that died in the wilderness was not st
