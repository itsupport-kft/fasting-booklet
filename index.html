opped by giants. No battle was fought. No army defeated them. They were stopped by an assessment. Forty years of wandering resulted from a sentence spoken in a report.","Some of you have a wilderness in your life right now that has no enemy in it. There is no giant. There is only a conclusion you reached years ago and have never revisited.","Tonight we deal with:","Gates of brass and bars of iron. Spirits of stagnation and the cycle that returns you to the same point every year. The cage of limitation, familiarity, and low expectation. Deuteronomy 2:3, \"Ye have compassed this mountain long enough: turn you northward.\" And the grasshopper mentality, which must die tonight.","Come standing. Come expecting to break something."],"scriptures":["Numbers 13:26 to 33","Numbers 14:1 to 4, 26 to 35","Deuteronomy 2:1 to 3","Isaiah 45:1 to 3","Psalm 107:10 to 16","Micah 2:13","Luke 13:11 to 16","John 5:5 to 9","Joshua 1:1 to 3","Isaiah 43:18 to 19","Philippians 3:13 to 14","Judges 1:19"],"note":"Stand. Speak with force.","points":["In the name of Jesus, I break every limitation assigned to my life and my bloodline.","Every gate of brass standing before me, be broken in pieces in the name of Jesus.","Every bar of iron holding my destiny, be cut asunder tonight. Psalm 107:16.","Every grasshopper image of myself, I destroy you tonight. I am not a grasshopper.","Every report I have believed about my own inability, I retract it in the name of Jesus.","Every wilderness in my life with no enemy in it, I come out of you tonight.","I have compassed this mountain long enough. I turn northward now. Deuteronomy 2:3.","Every cycle that returns me to the same point every year, be broken in Jesus' name.","Every spirit of stagnation over my life, my career, and my household, be destroyed now.","Every spirit of infirmity that has bowed me down for eighteen years, be loosed tonight.","Woman, thou art loosed from thine infirmity. I receive that word over my life now.","Every impotent man at the pool waiting for a moving that never comes, rise, take up thy bed, and walk.","Every excuse I have used for thirty eight years, I abandon it tonight in Jesus' name.","Every chariot of iron that made me conclude a territory could not be taken, be destroyed.","Every place where the sole of my foot shall tread, God has given it to me. I possess it.","Every limitation placed on my marriage by our history, be broken tonight.","Every ceiling my parents hit that I assumed was mine, I break through it in Jesus' name.","Lord, do a new thing. Let it spring forth and let me perceive it. Isaiah 43:19.","Forgetting those things which are behind, I press toward the mark. Nothing behind me holds me.","Every giant standing between me and my inheritance, you will not stop me. I am well able.","I decree tonight that the Lord has made room for me, every limitation is broken, and I shall be fruitful in the land."]}],"questions":["Where in your life are you root bound? Name the area where you have capacity you have never used because there has been no room for it.","Ten men were stopped by an assessment, not by an army. What conclusion did you reach years ago that you have never revisited? Revisit it in writing today."],"questionNote":""},{"n":15,"date":"Monday, October 19","title":"Beersheba: He Appeared the Same Night","subtitle":"","anchor":{"text":"And the LORD appeared unto him the same night, and said, I am the God of Abraham thy father: fear not, for I am with thee, and will bless thee, and multiply thy seed for my servant Abraham's sake. And he builded an altar there, and called upon the name of the LORD, and pitched his tent there: and there Isaac's servants digged a well.","ref":"Genesis 26:24 to 25"},"teaching":["This is the centre of gravity for the entire fast. Everything before today has been mechanics: breaking, cutting, exposing, enlarging. Today is the encounter. And if this fast produces nothing else in you, it must produce this. Look at the timing. \"And the LORD appeared unto him the same night.\" The same night as what? Go back to verse 23: \"And he went up from thence to Beersheba.\" He had just left contested ground. He had lost two wells. He arrived somewhere new, probably tired, certainly uncertain. And God showed up the same night he arrived.","There was no waiting period. No probation. No proving himself in the new place first. He arrived, and heaven arrived with him. Now look at what God said, because every word matters. \"I am the God of Abraham thy father.\" Identity and inheritance. God introduced Himself by the covenant relationship, reminding Isaac that he was not starting from scratch. Some of you need to hear that God is not a stranger to your bloodline. \"Fear not, for I am with thee.\" The command and then the reason. Notice that God did not remove the threat. The Philistines were still there. Abimelech was still hostile. He did not change the circumstance. He announced His presence. That is almost always how God answers fear in Scripture. Not with a change of situation but with a declaration of company. \"And will bless thee, and multiply thy seed.\" Increase and generations. This is a marriage and destiny fast, and God's promise at Beersheba was about seed.","And then Isaac's response, in the exact order that closes the chapter of this fast.","He builded an altar. Worship first.","He called upon the name of the LORD. Prayer second. He pitched his tent there. Commitment third. He moved in. He did not visit the place of encounter, he relocated to it. And there Isaac's servants digged a well. Production last. Four movements, and the well is at the end. Not the beginning. Some of you have been trying to produce a well without pitching a tent. You want the water without relocating.","Today: encounter at midnight, the death of fear at dawn, the rebuilding of your altar at noon, and tonight, contending for fire."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"He Appeared the Same Night","subtitle":"","about":["Tonight we ask for God Himself.","Not answers. Not breakthrough. Not even the well. Him. There is a difference between a believer who knows about God and a believer who has met Him, and everyone in the room knows which one they are. Job said it after everything: \"I have heard of thee by the hearing of the ear: but now mine eye seeth thee\" (Job 42:5). Everything he had before that was hearsay.","Fourteen nights we have been in this hour. Tonight, do not ask for anything. Ask for Him."],"scriptures":["Genesis 26:23 to 24","Genesis 28:10 to 17","Genesis 32:24 to 30","Exodus 33:13 to 18","Job 42:5 to 6","Isaiah 6:1 to 8","Philippians 3:8 to 10","Psalm 27:8","Jeremiah 29:13"],"note":"","points":["Father, tonight I am not asking for things. I am asking for You. Appear to me.","Lord, appear to me the same night, as You did to Isaac. Do not let me wait a season for this.","Every religious distance between me and God, be closed tonight in Jesus' name.","Lord, I have heard of You by the hearing of the ear. Let my eye see You. Job 42:5.","Show me Your glory. I ask as Moses asked, and I will not be satisfied with less.","When You said seek ye my face, my heart said unto You, Thy face, Lord, will I seek.","Every substitute I have accepted in place of encounter, I lay it down tonight.","Lord, I count all things but loss for the excellency of the knowledge of Christ Jesus.","That I may know Him, and the power of His resurrection. That is my request tonight.","Every place in me that is content with information about God, be made hungry for God.","Father, if I have to wrestle until daybreak like Jacob, I will not let You go.","Lord, surely You are in this place and I did not know it. Open my eyes to Your presence.","Every ladder between heaven and my life, let it be set up tonight in Jesus' name.","Lord, meet me where I am, in the middle of my journey, in unfamiliar territory.","Every fear about the new place I have entered, be answered by Your presence tonight.","Father, introduce Yourself to me as the God of my fathers. Let me know I am not starting alone.","Lord, let this fast be remembered in my life as the season I met You.","Ye shall seek me and find me when ye shall search for me with all your heart.","Every hardness in me that has resisted intimacy with God, break tonight.","Lord, let my spouse and my children have their own encounter, not an inherited one.","I decree that heaven will not be silent over my life tonight, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Fear Not, for I Am With Thee","subtitle":"","about":["God's answer to fear in Scripture is almost never a change of circumstance. \"Fear not, for I am with thee.\" Not, fear not, because I have removed the Philistines. Not, fear not, because the famine is over. Fear not, because of who is standing next to you.","Study it and you will find the pattern everywhere. To Joshua: \"Be strong and of a good courage... for the LORD thy God is with thee whithersoever thou goest\" (Joshua 1:9). To Israel: \"When thou passest through the waters, I will be with thee\" (Isaiah 43:2). Through, not around. In the fiery furnace, the fire was not cancelled. A fourth man appeared in it (Daniel 3:25). Now here is what fear actually does, and this is why we deal with it on a marriage and destiny fast.","Fear is faith pointed in the wrong direction. It is the confident expectation of a bad outcome. Job said, \"For the thing which I greatly feared is come upon me\" (Job 3:25). Fear has a magnetic quality. What you fear, you often rehearse, and what you rehearse, you frequently attract.","And fear is a marriage killer. It produces the controlling husband who cannot trust. It produces the wife who tests love repeatedly until she breaks it. It produces the single person who rejects first to avoid being rejected. Fear makes you do the very thing you are afraid will be done to you.","This morning fear dies."],"scriptures":["Genesis 26:24","Isaiah 41:10 to 13","Isaiah 43:1 to 5","Joshua 1:5 to 9","Daniel 3:24 to 27","2 Timothy 1:7","1 John 4:18","Job 3:25","Psalm 27:1 to 3","Psalm 56:3 to 4","Hebrews 13:5 to 6","Romans 8:15"],"note":"","points":["Father, this morning I receive Your word: fear not, for I am with thee.","Every fear operating in my life, I confront you with the presence of God today.","God has not given me the spirit of fear, but of power, love, and a sound mind.","Perfect love casteth out fear, because fear hath torment. I receive perfect love today.","Every torment attached to my fear, be evicted in the name of Jesus.","Every thing I greatly fear that I have been rehearsing, I stop rehearsing it today.","Lord, break the magnetic pull of my fear. Let me stop attracting what I dread.","Every fear of abandonment operating in my relationships, be healed today.","Every fear of failure that has kept me from starting, be broken in Jesus' name.","Every fear of success that has made me sabotage good things, be exposed and removed.","Every fear of man that has been a snare to me, be broken. Proverbs 29:25.","Every fear of the future and of what might happen, be replaced with trust today.","When I pass through the waters, You will be with me. The rivers shall not overflow me.","When I walk through the fire, I shall not be burned. Let the fourth man walk with me.","Every control I exercise out of fear in my marriage, forgive me and heal me.","Every test I put my spouse through because I am afraid, I lay it down today.","Every rejection I do first to avoid being rejected, be broken in me in Jesus' name.","The Lord is my light and my salvation, whom shall I fear. He is the strength of my life.","I will not fear what man shall do unto me. The Lord is my helper. Hebrews 13:6.","Lord, do not let my children inherit my fears. Let the transmission stop with me.","I decree that fear loses its authority over my life today, in the name of Jesus."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Pitching My Tent: Rebuilding the Altar","subtitle":"","about":["\"And he builded an altar there, and called upon the name of the LORD, and pitched his tent there.\"","Isaac did not visit the place of encounter. He moved there. That is the difference between a spiritual experience and a spiritual life. Many believers have had genuine encounters and never relocated. They had a moment on a Sunday, a breakthrough at a conference, a night on a fast, and then went home and resumed a life built somewhere else.","Today we pitch a tent.","The personal altar. A fixed place, a fixed time, a fixed practice. Not when you feel like it. Daniel prayed three times a day \"as he did aforetime\" (Daniel 6:10), and the phrase means it was already his practice before the crisis came. His altar was not built in the emergency. It was built long before, which is why it held. The family altar. This is where many households are failing. Joshua said, \"as for me and my house, we will serve the LORD\" (Joshua 24:15), and Abraham was commended by God specifically because \"he will command his children and his household after him\" (Genesis 18:19). If there is no altar in your house, your children are being formed by whatever else is loudest.","Start small if you must. Ten minutes. A verse, a song, a prayer for each person by name. A small altar kept faithfully outranks a grand altar kept occasionally.","And a word to couples: pray together. Not just in the same house. Together, out loud, holding hands. Many marriages have never once heard the spouse pray for them by name."],"scriptures":["Genesis 26:25","Genesis 12:7 to 8","Genesis 13:3 to 4","Genesis 18:19","Joshua 24:14 to 15","Daniel 6:10","Deuteronomy 6:6 to 9","1 Kings 18:30","Matthew 6:6","Acts 10:2","Psalm 5:3","Luke 5:16"],"note":"","points":["Father, today I do not merely visit the place of encounter. I pitch my tent here.","Every spiritual experience I have had without relocating my life, correct me today.","Lord, help me build a personal altar with a fixed time and a fixed place.","Every inconsistency in my devotional life, be broken and be replaced with discipline.","Let me pray as Daniel did aforetime, so that when the crisis comes the altar is already standing.","Every altar of mine that has been broken down, let me repair it as Elijah did. 1 Kings 18:30.","Father, my voice shalt Thou hear in the morning. Restore my morning altar.","Lord, establish a family altar in my house. Let it not depend on my feelings.","Every household in my bloodline without an altar, let it begin with mine.","As for me and my house, we will serve the Lord. I decree it over my family today.","Father, let me command my children and my household after me, as Abraham did.","Lord, teach me to pray out loud with my spouse, holding hands, calling names.","Every awkwardness that has kept my spouse and me from praying together, be removed.","Every child in my house, let them hear their name in prayer this week.","Lord, let my words be in my heart and let me teach them diligently to my children.","Every distraction that competes with my altar time, be removed in the name of Jesus.","Father, let me withdraw often to pray, as Jesus withdrew into the wilderness.","Lord, let my house be known in heaven as a praying house.","Every devout household like Cornelius that God visits, let mine be counted among them.","Father, let the altar I build today outlive me and become my children's inheritance.","I decree that a permanent altar is established in my life and my home, in Jesus' name."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Where Is the God of Elijah","subtitle":"","about":["Tonight we contend. 2 Kings 2. Elijah has been taken up. Elisha is standing at the Jordan holding the mantle that fell, and everything now depends on one question. He strikes the water and says: \"Where is the LORD God of Elijah?\" (2 Kings 2:14).","That is not a doubting question. It is a demanding question. He is not asking whether God exists. He is asking whether the God who parted this river an hour ago for another man will do it for him.","And the water parted.","That question needs to be asked in this generation. We have inherited a great deal from the fathers. Buildings. Doctrine. Structures. Recordings. Testimonies. But you cannot inherit fire. You can only inherit the mantle and then contend for the fire yourself.","Look at what it cost Elisha. He asked for a double portion and Elijah told him, \"Thou hast asked a hard thing\" (2 Kings 2:10), and made it conditional on seeing him taken. Elisha had to keep his eyes fixed while three separate companies of prophets tried to talk him into stopping at Bethel, at Jericho, and at Jordan. Three invitations to settle for less. He refused all three. Some of you have accepted a Bethel when God offered you a Jordan.","And remember Carmel. Elijah's prayer was under sixty seconds. \"Hear me, O LORD, hear me, that this people may know that thou art the LORD God\" (1 Kings 18:37). No screaming. No hours of frenzy like the prophets of Baal. The fire did not respond to volume. It responded to covenant.","Tonight we contend for encounter and power. Not for a show. For the real thing.","Come hungry. Come dissatisfied. Come with the question in your mouth."],"scriptures":["2 Kings 2:1 to 15","1 Kings 18:30 to 39","Exodus 33:13 to 23","Luke 24:49","Acts 1:8","Acts 4:29 to 31","Matthew 5:6","Psalm 42:1 to 2","Psalm 63:1 to 2","Jeremiah 20:9","Habakkuk 3:2","Isaiah 64:1 to 2"],"note":"Stand. Ask loudly.","points":["Where is the Lord God of Elijah? Answer me tonight, in the name of Jesus.","Father, I have inherited the mantle. Tonight I contend for the fire.","Every Jordan standing before me, be divided by the God of my fathers.","Lord, I ask a hard thing. Give me a double portion of Your Spirit.","Every invitation to stop at Bethel when You have offered me Jordan, I refuse it tonight.","Every settling for less that I have called contentment, be exposed and be broken.","Lord, do not let me build a ministry on structure while the fire is missing.","Oh that Thou wouldest rend the heavens and come down over my life. Isaiah 64:1.","Lord, revive Thy work in the midst of the years. In wrath remember mercy.","Every dryness in me that I have learned to function around, be flooded tonight.","As the hart panteth after the water brooks, so panteth my soul after Thee, O God.","My soul thirsteth for Thee in a dry and thirsty land where no water is. Satisfy me tonight.","Lord, put Your word in me as a fire shut up in my bones that I cannot contain.","Every fear that has made me pray quietly, break tonight. Grant unto me boldness.","Lord, shake the place where I am praying, as You shook the room in Acts 4:31.","Father, answer me by fire tonight. Let this people know that You are God.","Blessed are they which hunger and thirst after righteousness, for they shall be filled.","Lord, increase my hunger. Do not let me leave this fast satisfied with less than You.","Every generation in my family that had a mantle but no fire, let it change with me.","Father, let my children see a God who still parts rivers, not just stories about one.","I decree that the God of Elijah is my God, and He answers by fire, in the name of Jesus."]}],"questions":["Isaac built an altar, called on the Lord, pitched a tent, and then dug. Which of those four have you skipped, and what has it cost you?","Elisha refused to stop at Bethel and Jericho. Where have you settled for a lesser thing that was genuinely good, and what is the Jordan you walked away from?"],"questionNote":""},{"n":16,"date":"Tuesday, October 20","title":"When Your Enemy Comes to Cut Covenant","subtitle":"","anchor":{"text":"And Isaac said unto them, Wherefore come ye to me, seeing ye hate me, and have sent me away from you? And they said, We saw certainly that the LORD was with thee.","ref":"Genesis 26:27 to 28"},"teaching":["This is one of the great vindication scenes in Scripture and it happens without a single word of self defence.","Trace the history. In verse 16, Abimelech told Isaac: \"Go from us; for thou art much mightier than we.\" He was evicted. Publicly. Told to leave a place he had been prospering in. Then his wells were taken. Then he was driven from Esek. Then driven from Sitnah.","Isaac never once retaliated. He never organised a delegation, never went to court, never mounted a campaign to clear his name. He just kept digging.","And then verse 26: Abimelech comes to him. The king, with his adviser and the captain of his army, travels to find the man he threw out.","And Isaac, to his credit, asks the honest question. \"Wherefore come ye to me, seeing ye hate me?\" He does not pretend the history did not happen. He names it plainly.","Their answer is the sentence that should live in you for the rest of this fast: \"We saw certainly that the LORD was with thee.\" Not, we heard you complained. Not, we read your statement. We saw.","This is the principle of today: there is a vindication that only comes from output. Isaac's defence was his fruitfulness. He did not argue with Abimelech. He out produced him. And eventually the evidence became so undeniable that the man who evicted him made a journey to make peace with him. Some of you have been trying to talk your way back into rooms you were thrown out of. Stop talking. Dig.","Then comes the second half of the day, and it is the harvest of the entire fast. Look at how the chapter ends. \"And it came to pass the same day, that Isaac's servants came, and told him concerning the well which they had digged, and said unto him, We have found water\" (Genesis 26:32).","The same day he made peace with his enemy, the report of water came in.","So today we also deal with recovery. David at Ziklag lost everything and asked God one question: \"Shall I pursue after this troop? shall I overtake them?\" And the answer: \"Pursue: for thou shalt surely overtake them, and without fail recover all\" (1 Samuel 30:8).","Recover all. Tonight we go after everything the enemy has taken."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"Abimelech at My Tent","subtitle":"","about":["Tonight we pray for the turn. There is a moment in a person's story when the pressure reverses. When those who pushed you out come looking for you. When the door that was slammed is knocked on from the other side. Proverbs 16:7 states the principle: \"When a man's ways please the LORD, he maketh even his enemies to be at peace with him.\" Tonight we ask for that turn, and we ask for the grace to handle it well, because how you receive a returning enemy reveals more about you than how you survived them."],"scriptures":["Genesis 26:26 to 31","Proverbs 16:7","Psalm 23:5","Revelation 3:9","Genesis 50:15 to 21","Isaiah 60:14","Psalm 105:14 to 15","Esther 6:6 to 11"],"note":"","points":["Father, when my ways please You, You make even my enemies to be at peace with me.","Every Abimelech who sent me away, let them come looking for me in Your timing.","Every door slammed in my face, let it be knocked on from the other side in Jesus' name.","Every room I was thrown out of, let me be invited back with honour or given better.","Lord, prepare a table before me in the presence of my enemies. Let them watch.","Every person who despised me, let them come and worship before my feet. Revelation 3:9.","Lord, give me the heart of Joseph when the turn comes. Let me not repay evil.","Ye thought evil against me but God meant it unto good. I release my brothers tonight.","Every Haman being forced to honour the Mordecai he planned to kill, let it be so for me.","Father, touch not mine anointed. Reprove kings for my sake. Psalm 105:14 to 15.","Every reputation of mine that was damaged unjustly, be restored publicly.","Lord, do not let vindication make me proud. Keep me humble when the turn comes.","Every covenant of peace You want me to make, give me wisdom to make it well.","Every peace treaty that is actually a trap, give me discernment to refuse it.","Father, let my marriage be vindicated before the people who predicted its failure.","Every prophecy of failure spoken over my family, let the outcome silence it.","Lord, let my life become the argument. Take the burden of self defence off me.","Every energy I have spent explaining myself, redirect it into digging.","Father, let those who mocked my fast be present when the water comes up.","Lord, prepare me for the visit I am not expecting from a person I did not expect.","I decree that the pressure is reversing over my life tonight, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"We Saw Certainly That the Lord Was With Thee","subtitle":"","about":["There is a kind of evidence that does not require a witness.","Abimelech did not say we were told. He said we saw. The presence of God on Isaac's life had become visible to people who did not worship his God, did not attend his services, and did not like him.","That is the standard we pray for this morning.","Look at the same phenomenon elsewhere. Potiphar, an Egyptian idolater, \"saw that the LORD was with him\" (Genesis 39:3). The Sanhedrin, examining Peter and John, \"took knowledge of them, that they had been with Jesus\" (Acts 4:13), and these were unschooled men. Something was on them that could not be explained by qualification.","Now the honest question this morning: would an unbeliever watching your life for six months conclude that God is with you?","Not your Sunday. Your Tuesday. Your driving. Your work ethic. Your marriage in the car park after the argument. Your reaction when you are overlooked.","We are not praying for a performance today. We are praying for a presence so consistent that people who are not looking for God notice Him on you anyway."],"scriptures":["Genesis 26:28","Genesis 39:2 to 5","Acts 4:13","Matthew 5:14 to 16","Daniel 6:3","Daniel 5:11 to 12","1 Peter 2:12","2 Corinthians 3:2 to 3","Nehemiah 6:16","Zechariah 8:23"],"note":"","points":["Father, let it be said of me, we saw certainly that the Lord was with him.","Let Your presence on my life be visible to people who do not share my faith.","Lord, let my employer see it, as Potiphar saw it on Joseph.","Let an excellent spirit be found in me, as it was found in Daniel.","Every place where my private life contradicts my public confession, correct me today.","Lord, let my Tuesday match my Sunday. Let there be no double life in me.","Let men take knowledge of me that I have been with Jesus.","Let my light so shine before men that they see my good works and glorify my Father.","Lord, let my work be so excellent that it opens doors my words could not open.","Every reputation I have that is inconsistent with Christ, dismantle it and rebuild it.","Father, let my marriage be a witness. Let people see God in how we treat each other.","Let my children be a testimony of the grace of God on my household.","Lord, I am an epistle known and read of all men. Let what is written be true.","Every enemy watching my life for a fall, let them find nothing to report.","Let my adversaries perceive that this work was wrought of God. Nehemiah 6:16.","Lord, let people take hold of my sleeve and say, we will go with you, for God is with you.","Father, deliver me from performing spirituality. Give me the real thing.","Every hypocrisy hidden in me, expose it now while there is still time to repent.","Lord, let my conversation be honest among those who do not believe.","Father, let the fruit of this fast be visible to my household before it is visible to a crowd.","I decree that the presence of God on my life will be undeniable this season."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"They Must Pay Back","subtitle":"","about":["Restitution is a legal principle in Scripture, not a wish.","Exodus 22:7 says that a thief, when found, \"shall pay double.\" And in verse 1, the multiplier for certain thefts is fourfold and fivefold. Proverbs 6:31 goes further: \"But if he be found, he shall restore sevenfold; he shall give all the substance of his house.\" The law never permitted a thief to simply return what was taken. Theft carried a penalty attached to the return.","Now bring that into the spirit realm. The enemy is \"a thief\" who comes \"to steal, and to kill, and to destroy\" (John 10:10). Jesus named him by his profession. And under the law of restitution, when a thief is exposed, he does not merely give it back. He pays a penalty.","That is your legal position today. You are not begging for the return of what was yours. You are enforcing a judgement against an exposed thief.","Look at the pattern in Scripture. Job received double (Job 42:10). Israel left Egypt and \"they spoiled the Egyptians\" (Exodus 12:36), taking four hundred years of unpaid wages out with them. Joel 2:25 promises the restoration of the years, not just the harvest, and the years are the harder thing to give back.","And take note of Job 42:10 carefully: \"And the LORD turned the captivity of Job, when he prayed for his friends.\" The double came on the other side of him praying for the people who wounded him. Some restitution is waiting behind a forgiveness you have not offered."],"scriptures":["Exodus 22:1 to 9","Proverbs 6:30 to 31","John 10:10","Joel 2:25 to 26","Job 42:10 to 12","Exodus 12:35 to 36","Isaiah 61:7","Zechariah 9:12","Isaiah 40:2","Luke 19:8","Ezekiel 34:11 to 16"],"note":"","points":["Father, I bring the thief to court today. Every enemy who has stolen from me, be exposed.","The thief, being found, shall restore sevenfold. I demand restitution today. Proverbs 6:31.","Every year the locust, the cankerworm, and the caterpiller ate, be restored to me.","Every wasted year in my life, be redeemed and be repaid in Jesus' name.","Every stolen opportunity in my career and my calling, be returned with interest.","Every stolen relationship that the enemy destroyed, let God restore or replace it.","Every stolen year of my marriage, be restored to us in the name of Jesus.","Every stolen joy, every stolen peace, every stolen sleep, be returned to me now.","Turn ye to the strong hold, ye prisoners of hope. I declare I will render double.","For my shame I shall have double, and for confusion I shall rejoice in my portion.","Every unpaid wage in my life, as Israel spoiled the Egyptians, let it be paid.","Lord, turn my captivity as You turned Job's, and give me twice as much as I had.","Father, where restitution waits behind forgiveness, help me pray for those who wounded me.","I pray now for those who hurt me, and I ask You to turn my captivity today.","Every inheritance stolen from my family line, I recover it in the name of Jesus.","Every good name stolen from my family, be restored in the name of Jesus.","Lord, seek that which was lost and bring again that which was driven away. Ezekiel 34:16.","Every gift, virtue, and anointing stolen from me in the night, be returned today.","Every seed I sowed that produced nothing, let the harvest be released with interest.","Father, let my restitution be so visible that my children inherit the difference.","I decree double for my trouble and sevenfold from every thief, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Recover All","subtitle":"","about":["Tonight we pursue. 1 Samuel 30. David returns to Ziklag and finds it burned. Wives, sons, daughters, everything gone. And the men who followed him, in their grief, spoke of stoning him.","Read verse 6 carefully, because it contains the hinge of the whole chapter: \"And David was greatly distressed... but David encouraged himself in the LORD his God.\"","There was no prophet available. No congregation. No worship team. Every human source of comfort was actively discussing his execution. He had to become his own encourager, and some of you are in exactly that place tonight.","Then he did the thing that separates recovery from mere grief. He enquired. \"And David enquired at the LORD, saying, Shall I pursue after this troop? shall I overtake them?\" (1 Samuel 30:8). Two questions. Shall I pursue? Shall I overtake? He did not assume. He asked. Because pursuit without instruction is just running.","And God's answer: \"Pursue: for thou shalt surely overtake them, and without fail recover all.\"","Three guarantees in one sentence. Surely overtake. Without fail. Recover all.","Now note the details of the pursuit, because they matter. Two hundred of his six hundred men were too exhausted to cross the brook (1 Samuel 30:10). He went on with four hundred. Some of you will finish this fast tired, and tired is not disqualified, it is just tired. And he found an abandoned Egyptian servant in a field, half dead, and fed him. That discarded man became the intelligence that led him to the enemy camp (1 Samuel 30:11 to 15). The thing everybody else discarded was the key to the recovery.","Verse 19: \"And there was nothing lacking to them, neither small nor great, neither sons nor daughters, neither spoil, nor any thing that they had taken to them: David recovered all.\" And then verse 20: he took extra. He came back with more than he lost.","Tonight, we recover all."],"scriptures":["1 Samuel 30:1 to 20","Joel 2:25 to 27","Isaiah 49:24 to 26","Obadiah 17","Jeremiah 30:16 to 17","Nahum 2:2","Psalm 126:1 to 6","Isaiah 61:4 to 7","Ezekiel 37:11 to 14","Luke 15:22 to 24","Zechariah 10:6"],"note":"Stand. Tonight you are pursuing.","points":["Father, I enquire of You tonight. Shall I pursue? And I receive Your answer: pursue.","I shall surely overtake, and without fail I shall recover all, in the name of Jesus.","Every Ziklag in my life that has been burned, I decree full restoration tonight.","Every troop that has raided my family, I pursue you and I overtake you now.","Lord, when there is nobody left to encourage me, teach me to encourage myself in You.","Every discarded thing in my life that holds the key to my recovery, let me find it.","Every exhausted person in my company, let strength come. The tired are not disqualified.","Shall the prey be taken from the mighty? Yes. I contend with him that contendeth with me.","Every captive of mine held illegally, be delivered tonight in the name of Jesus.","Upon mount Zion shall be deliverance, and the house of Jacob shall possess their possessions.","Every possession of my family in the hand of a stranger, return to us now.","All that prey upon me will I give for a prey, saith the Lord. Jeremiah 30:16.","I will restore health unto thee and heal thee of thy wounds. I receive it tonight.","The Lord hath turned away the excellency of Jacob. Let my excellency be restored. Nahum 2:2.","Every dream buried in my life, come out of your grave tonight. Ezekiel 37:12.","Bring forth the best robe, the ring, and the shoes. Restore my sonship completely.","Every child of mine taken captive by the world, I recover you tonight in Jesus' name.","Every marriage in my family that was raided, be restored in the name of Jesus.","They that sow in tears shall reap in joy. Every tear I have sown, produce a harvest.","Lord, let me recover all and let me come back with extra, as David did.","There shall be nothing lacking, neither small nor great. I recover all, in the name of Jesus."]}],"questions":["Where have you been trying to talk your way back into a room instead of out producing the argument? What would digging look like in that situation?","Make an actual list. What has been stolen from you: years, opportunities, relationships, health, virtue. Write them down, then pray over the list tonight and every remaining day of this fast."],"questionNote":""},{"n":17,"date":"Wednesday, October 21","title":"He Intreated the Lord for His Wife","subtitle":"The Womb, The Seed, And The Next Generation","anchor":{"text":"And Isaac intreated the LORD for his wife, because she was barren: and the LORD was intreated of him, and Rebekah his wife conceived.","ref":"Genesis 25:21"},"teaching":["Before Isaac ever dug a well, he prayed for a womb. Genesis 25:21 sits before Genesis 26, and the order is not accidental. The man who would later redig his father's wells first had to learn to intreat God for water of a different kind. Look at the detail Scripture gives us. Isaac married Rebekah at forty (Genesis 25:20). Their sons were born when he was sixty (Genesis 25:26). Twenty years. Twenty years of a promise that God had already made to Abraham concerning this exact seed, and twenty years of nothing.","The promise was certain. The waiting was still twenty years long. If you are in a waiting season and you have concluded that the delay proves the promise was never real, Isaac's twenty years should settle that question for you today.","And notice the word. Intreated. The Hebrew carries the sense of pleading, of pressing, of persistent entreaty. It is not a casual prayer. Isaac did not mention it once at dinner. He pressed. And then the verse says \"the LORD was intreated of him\", which means the pressing reached its target.","Also notice who did the praying. Isaac intreated the Lord for his wife. The husband carried the burden of the wife's barrenness as his own. He did not stand outside her pain giving advice. He went to God about it as if it were happening to him, because it was.","Husbands, that is your assignment today.","Today we deal with barrenness in every form, and we go wide with it, because the God who opens wombs is the same God who opens every closed thing.","Physical barrenness. Wombs that have been waiting. Miscarriage. Loss. Failed treatments. Silence.","Barrenness of season. Businesses that never take, ministries that never multiply, years of labour with no visible fruit. And tonight, the war for the seed itself, because there has always been an assignment against children. Pharaoh gave the order. Herod gave the order. And in this generation, the assault on children is not hidden, it is systemic, and it requires parents who know how to fight.","A word of tenderness before we begin. Some of you carry a grief today that has no words. A due date that passed. A name you chose and never used. This day may be the hardest day of this fast for you. You are not being punished, and your faith is not the reason. Come and pray anyway, and let God hold what you are carrying."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"He Intreated the Lord","subtitle":"","about":["Tonight we learn to press. Hannah is our teacher at this hour. \"And she was in bitterness of soul, and prayed unto the LORD, and wept sore\" (1 Samuel 1:10). She prayed so intensely that Eli the priest assumed she was drunk. And her answer to him is one of the most dignified sentences in Scripture: \"I am a woman of a sorrowful spirit... I have poured out my soul before the LORD\" (1 Samuel 1:15). She poured out. She did not present a request. She emptied herself.","And 1 Samuel 1:18 records something that happened before any pregnancy: \"and her countenance was no more sad.\" She received something at the altar before she received anything in her body.","Tonight, pour out."],"scriptures":["Genesis 25:21","1 Samuel 1:9 to 20","Luke 18:1 to 8","Genesis 30:22","Psalm 62:8","Romans 4:17 to 21","Hebrews 11:11","Isaiah 62:6 to 7"],"note":"","points":["Father, tonight I do not present a request. I pour out my soul before You.","Lord, as Isaac intreated You for his wife, I intreat You tonight for what is closed in my life.","Every prayer I have prayed casually about this matter, I press tonight in Jesus' name.","Lord, be intreated of me. Let my crying reach You and let it move You.","Every twenty year waiting in my life, let it end in this season.","Father, I refuse to conclude that delay means denial. The promise stands.","Every discouragement built by years of unanswered prayer, be broken tonight.","Lord, remember me as You remembered Rachel and opened her womb. Genesis 30:22.","Every closed thing in my life, be opened by the God who opens wombs.","Father, let my countenance change tonight even before my situation does.","Every widow who wearies the judge, let my persistence be rewarded. Luke 18:5.","Lord, avenge me speedily. Do not let my case be delayed further.","Every mockery I have endured over my waiting, be silenced by my testimony.","Father, husbands in this fast, let them carry their wives' burden as their own.","Lord, I give You no rest until You establish the thing I am asking for. Isaiah 62:7.","Every accusation that my faith is the reason for my delay, I reject it in Jesus' name.","Father, strengthen every couple praying together tonight over a closed womb.","Every promise from You that I have stopped mentioning, I pick it up again tonight.","Lord, You called Abraham a father of many nations before he had one child. Do it for me.","Every dead situation, let it receive the God who quickeneth the dead.","I decree that heaven is intreated tonight over my life, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Every Barrenness Must Break","subtitle":"","about":["God has a track record with closed wombs, and it is remarkable how many of the significant people in Scripture came from one.","Sarah waited until ninety. Rebekah waited twenty years. Rachel wept and prayed. Hannah was provoked year after year. Manoah's wife was barren and bore Samson. Elisabeth was \"well stricken in years\" and bore John the Baptist. The Shunammite woman had no child and no expectation.","Notice the pattern. The children God had to fight to bring were usually the ones who changed history. Isaac, Jacob, Joseph, Samson, Samuel, John the Baptist. Every one of them came out of a closed womb.","That is not a coincidence. That is a principle. The enemy fights hardest against the arrival he most fears.","If your womb, your business, or your ministry has been under sustained assault, consider seriously that the resistance is proportional to what is trying to come out.","And this morning we go wide. Exodus 23:26 is a covenant promise: \"There shall nothing cast their young, nor be barren, in thy land.\" Nothing. Not the womb, not the flock, not the field. God's covenant covers every kind of production."],"scriptures":["Exodus 23:25 to 26","Deuteronomy 7:13 to 14","Genesis 21:1 to 2","Genesis 30:22 to 24","Judges 13:2 to 3","1 Samuel 1:19 to 20","Luke 1:5 to 25","2 Kings 4:14 to 17","Psalm 113:9","Isaiah 54:1","Galatians 4:27","Joel 2:22"],"note":"","points":["Father, there shall nothing be barren in my land. I stand on Exodus 23:26 today.","Every barrenness of the womb in my life and my family, break now in the name of Jesus.","Every barrenness of my hands, my business, and my labour, break now in Jesus' name.","Every barrenness in my ministry that produces no fruit, be broken today.","Every barrenness of joy, of vision, and of expectation, be reversed in Jesus' name.","Lord, You make the barren woman to keep house and be a joyful mother of children.","Sing, O barren, thou that didst not bear. I sing this morning before I see. Isaiah 54:1.","More are the children of the desolate than the children of the married wife.","Every mockery from a Peninnah in my life, be silenced by my testimony this season.","Every year of provocation I have endured, let it end with an Elkanah's God answering me.","Every resistance against what is trying to come out of me, be broken. I know why you fight.","Father, whatever the enemy has fought hardest, let it be born and let it be great.","Every reproach of barrenness in my family line, be taken away in the name of Jesus.","Every failed attempt, every failed cycle, every failed treatment, let this one be different.","Lord, You visited Sarah as You had said, and did as You had spoken. Visit me.","Every medical report standing against my body, be overruled by the word of God.","Father, bless the fruit of my body, my land, and my store. Deuteronomy 7:13.","Every closed door in my creativity and my ideas, be opened today.","Lord, restore the years and let the fig tree and the vine yield their strength. Joel 2:22.","Every couple in this fast believing for a child, let this be their year in Jesus' name.","I decree the end of barrenness in every area of my life, in the name of Jesus."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Conceiving, Carrying, and Safe Delivery","subtitle":"","about":["There are three distinct battles, and many people only pray for the first.","Conception is the beginning. But conception is not the finish line, and a great deal of grief comes from assuming it is. Carrying is where many things are lost. Isaiah 37:3 describes it exactly: \"the children are come to the birth, and there is not strength to bring forth.\" That verse is not only about babies. It describes businesses that reach launch and collapse, ministries that get to the edge and stall, dreams that make it eight months and never arrive. Something conceived is not automatically something delivered.","Delivery is the third battle, and Revelation 12:4 shows us why: the dragon stood before the woman \"to devour her child as soon as it was born.\" He waited for the delivery room. The most dangerous moment for the promise was the moment of its arrival. Today we pray through all three.","And we pray for the mothers. For the ones currently carrying. For safe pregnancies, healthy deliveries, and protected children. Isaiah 66:9 is God's own question, and it is a beautiful one: \"Shall I bring to the birth, and not cause to bring forth? saith the LORD.\"","He does not start what He will not finish."],"scriptures":["Isaiah 37:3","Isaiah 66:7 to 9","Revelation 12:1 to 5","Exodus 1:19","Psalm 139:13 to 16","Jeremiah 1:5","Galatians 4:19","Ecclesiastes 11:5","Psalm 22:9 to 10","Deuteronomy 28:4","1 Timothy 2:15","Isaiah 49:15"],"note":"","points":["Father, everything conceived in my life, I pray it through to safe delivery.","Every promise that has come to the birth without strength to bring forth, receive strength now.","Shall I bring to the birth and not cause to bring forth? Lord, You finish what You start.","Every miscarriage in my womb, my business, and my ministry, be reversed in Jesus' name.","Every dragon waiting at my delivery room to devour, be defeated in the name of Jesus.","Every attack on what I am carrying in the final stretch, be cancelled now.","Lord, cover every pregnant woman in this fast. Let them carry to full term in safety.","Every complication assigned to a pregnancy in this congregation, be cancelled in Jesus' name.","Every delivery in my family, let it be safe for mother and for child.","Every child in the womb right now, I speak life, health, and destiny over you.","Lord, You covered me in my mother's womb. Cover every child being formed today.","Before I formed thee in the belly I knew thee. Lord, let purpose be established from the womb.","Every project of mine that stalled at ninety percent, let it be delivered now.","Every idea I conceived and never carried, revive it and let me carry it this time.","Father, give me the strength to carry what You have entrusted to me.","Every fear of loss that keeps me from conceiving again, be healed today.","Lord, comfort every woman here who has lost a child. Hold what she is carrying.","Every grief with no words attached, let the Holy Spirit minister to it today.","Every child God has already given me, let none be lost. Not one.","Blessed shall be the fruit of my body. I receive that blessing today.","I decree conception, carrying, and safe delivery over everything God has given me."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Herod Shall Not Touch This Generation","subtitle":"","about":["Tonight parents go to war. Understand the pattern in Scripture, because it is consistent and it is chilling. Whenever God is about to raise a deliverer, an order goes out against the children.","Exodus 1. Israel is multiplying. Pharaoh's response is not a tax, not a wall, not a war. \"Every son that is born ye shall cast into the river\" (Exodus 1:22). He went for the babies. And Moses was in that generation.","Matthew 2. A King is born in Bethlehem. Herod's response: \"slew all the children that were in Bethlehem... from two years old and under\" (Matthew 2:16). He went for the children. And Jesus was in that generation.","Revelation 12. A woman is in travail. And the dragon stands ready \"to devour her child as soon as it was born\" (Revelation 12:4). The enemy has always had a strategy for children, because a generation destroyed early never has to be fought later.","Now look at your own generation and be honest about what your children are being formed by. What is on the phone. What is in the music. What is in the classroom. What is in the group chat you have never seen. The rates of anxiety and self harm in this generation of young people are not merely social. There is a spiritual assault on this generation, and it is not accidental. But hear Isaiah 49:25: \"I will contend with him that contendeth with thee, and I will save thy children.\" God takes it personally.","Tonight we do three things. We cover our children by name. We break every assignment against them. And we pray them into their destiny, not merely their safety, because survival is not the goal. Purpose is.","Parents, grandparents, guardians, spiritual parents: stand tonight. If you have a photograph of your children, hold it. Call their names out loud."],"scriptures":["Exodus 1:8 to 22","Matthew 2:13 to 18","Revelation 12:1 to 6","Isaiah 49:24 to 26","Isaiah 54:13","Jeremiah 31:15 to 17","Psalm 127:3 to 5","Deuteronomy 6:6 to 9","Joel 2:28","Acts 2:39","Malachi 4:6","2 Timothy 1:5","Proverbs 22:6","Psalm 112:2","Isaiah 8:18"],"note":"Stand. Call your children by name where the points allow.","points":["Father, tonight I stand as a parent and I contend for my children in the name of Jesus.","I call my children by name before You now, and I cover each of them with the blood of Jesus.","Every Pharaoh decree against this generation of children, be cancelled in Jesus' name.","Every Herod assignment to destroy children before they mature, be destroyed tonight.","Every dragon waiting to devour what my family is bringing forth, be defeated now.","I will contend with him that contendeth with thee, and I will save thy children. Isaiah 49:25.","Every spirit of anxiety, depression, and self destruction assaulting this generation, be broken.","Every gate of hell opened over my children through a screen, be shut in Jesus' name.","Every ungodly voice speaking into my children that I cannot hear, be silenced now.","Every wrong friendship assigned to derail my child, be broken in the name of Jesus.","Every sexual perversion targeting my children, be cancelled by the blood of Jesus.","Every identity confusion assigned to this generation, be exposed and be broken.","Every addiction reaching for my children, your hand is cut off in Jesus' name.","All thy children shall be taught of the Lord, and great shall be the peace of my children.","Every prodigal in my family, come home. I call you back tonight by name.","Refrain thy voice from weeping. Thy children shall come again to their own border.","Lord, pour out Your Spirit upon my sons and daughters. Let them prophesy. Joel 2:28.","The promise is unto me and to my children. I claim Acts 2:39 over my household.","Turn the heart of the fathers to the children and the children to the fathers in my family.","My seed shall be mighty upon the earth. The generation of the upright shall be blessed.","Behold, I and the children whom the Lord hath given me are for signs and for wonders. It is settled."]}],"questions":["Isaac intreated for twenty years. What is the one thing you stopped mentioning to God because the waiting got too long? Bring it back tonight.","Write out the full names of every child under your spiritual covering, and one specific thing you are asking God for in each of their lives."],"questionNote":""},{"n":18,"date":"Thursday, October 22","title":"The Hundredfold in a Famine","subtitle":"Wealth, Provision, And The Breaking Of Poverty","anchor":{"text":"Then Isaac sowed in that land, and received in the same year an hundredfold: and the LORD blessed him. And the man waxed great, and went forward, and grew until he became very great.","ref":"Genesis 26:12 to 13"},"teaching":["Read Genesis 26:12 and then go back and read verse 1, and let the two sit together.","Verse 1: \"And there was a famine in the land.\"","Verse 12: \"Then Isaac sowed in that land, and received in the same year an hundredfold.\"","Same land. Same year. Same famine.","Everybody else in Gerar was experiencing a famine, and one man in the middle of it produced a hundred times what he planted.","Which means the famine was real and it was not the determining factor.","That is the entire teaching of this day. Your economy is not the economy.","Notice three things about how it happened.","He stayed where God told him to stay. God said do not go to Egypt, \"dwell in the land which I shall tell thee of\" (Genesis 26:2). Isaac's prosperity began with an act of obedience that made no economic sense. Egypt had grain. Gerar had famine. He stayed in the famine because God said stay. Some of you are poor in the right place and would be poorer in the wrong one. He sowed. In a famine, when every instinct says store it, eat it, protect it, he put seed in the ground. Sowing in a famine is the highest expression of faith in agriculture, because you are burying food you could have eaten today on the strength of a word about tomorrow.","And the Lord blessed him. The text is careful to name the source. Not his strategy. Not the market. The Lord. Then verse 13 gives us the trajectory: \"waxed great, and went forward, and grew until he became very great.\" Three stages. It was not one event. It was a progression.","Today we deal with the covenant of wealth, the leaks that drain provision, and tonight, the altars of poverty that have governed some bloodlines for generations.","And let us say something plainly, because this teaching is abused in both directions. God is not against you having money, and money is not the evidence of His approval. Job was rich and then he was not and he was righteous throughout. Paul knew how to abound and how to be abased. We are praying for provision that serves an assignment, not for a lifestyle that replaces one."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"Sowing in Famine Ground","subtitle":"","about":["Tonight we deal with the seed in our hand.","There is a moment in 1 Kings 17 that has troubled generous people for centuries. Elijah arrives at Zarephath and asks a widow with a handful of meal and a little oil, who is gathering sticks to cook a final meal for herself and her son before they die, to make him a cake first (1 Kings 17:13).","It sounds outrageous until you understand what he was doing. He was not taking her last meal. He was showing her where her seed was. She thought she was holding a meal. She was actually holding a seed, and the difference between the two is entirely a matter of what you do with it.","\"And she went and did according to the saying of Elijah: and she, and he, and her house, did eat many days\" (1 Kings 17:15). Tonight we ask God to show us the seed we have been holding as a meal."],"scriptures":["Genesis 26:12","1 Kings 17:8 to 16","2 Corinthians 9:6 to 11","Ecclesiastes 11:4 to 6","Galatians 6:7 to 9","Luke 6:38","Psalm 126:5 to 6","Malachi 3:10 to 11","Proverbs 11:24 to 25"],"note":"","points":["Father, show me the seed in my hand that I have been treating as a meal.","Every fear that keeps me from sowing in a hard season, be broken tonight.","Lord, let me sow in famine ground and reap a hundredfold in the same year.","Every barrel of meal and cruse of oil in my house, let it not fail. 1 Kings 17:14.","He that observeth the wind shall not sow. Lord, take the hesitation out of me.","Every seed I have sown that has produced nothing, let it be located and let it grow.","Father, You give seed to the sower and bread to the eater. Multiply my seed sown.","Every stinginess in me that is disguised as wisdom, expose it and correct it.","Lord, teach me to give in a way that reflects trust and not calculation.","Give, and it shall be given unto you, pressed down, shaken together, running over.","Every tithe and offering I have withheld, forgive me and restore my standing.","Open the windows of heaven over my life and pour out a blessing I cannot contain.","Rebuke the devourer for my sake. Let him not destroy the fruits of my ground.","Every good ground assigned to my seed, let my sowing find it in Jesus' name.","They that sow in tears shall reap in joy. Every tear seed of mine, produce a harvest.","Lord, do not let me become weary in well doing. In due season I shall reap.","Father, let my giving be a testimony to my children, not a secret.","Every generational poverty in my line that says never give, break at my generation.","Lord, make me able to give without needing to be seen giving.","There is that scattereth and yet increaseth. Let me be that person.","I decree a hundredfold return on every seed sown in obedience, in Jesus' name."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"The Covenant of Wealth","subtitle":"","about":["\"But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant which he sware unto thy fathers\" (Deuteronomy 8:18).","Read that verse carefully. It contains three things. Power to get wealth. Not wealth. Power to get it. God's provision is often an ability rather than a deposit. Ideas, skill, capacity, favour, insight, endurance. Many people are praying for money while ignoring the ability God already gave them. That He may establish His covenant. Here is the purpose clause, and it is the part most prosperity teaching removes. Wealth in this verse is not an end. It is the mechanism by which a covenant gets established in the earth. Money in the hand of a covenant person is infrastructure.","Remember the Lord thy God. And the warning that precedes it in verse 17: \"And thou say in thine heart, My power and the might of mine hand hath gotten me this wealth.\" Prosperity has a specific temptation attached to it, which is amnesia. This morning we ask for the power to get wealth, and we ask for the character to hold it."],"scriptures":["Deuteronomy 8:11 to 18","Genesis 26:12 to 14","Proverbs 10:22","Psalm 35:27","3 John 2","Joshua 1:8","Proverbs 13:22","Ecclesiastes 5:19","2 Corinthians 8:9","Philippians 4:19","Psalm 112:1 to 3","Isaiah 45:3"],"note":"","points":["Father, it is You that giveth me power to get wealth. Release that power over my life.","Every ability You have already given me that I have been ignoring, let me see it and use it.","Lord, give me ideas, skill, and insight that produce income in Jesus' name.","Let Your covenant be established through my hands. Make my money infrastructure.","Every amnesia that comes with increase, protect me from it before it arrives.","The blessing of the Lord maketh rich and He addeth no sorrow with it. I receive that blessing.","Let the Lord be magnified, who hath pleasure in the prosperity of His servant.","Every wrong teaching about money that has kept me poor, be corrected today.","Every wrong teaching about money that has made me greedy, be corrected today.","Lord, prosper me even as my soul prospereth. Do not let my wealth outrun my character.","Every hidden riches of secret places assigned to me, be released in Jesus' name.","Father, give me treasures of darkness that I may know that You have called me by name.","A good man leaveth an inheritance to his children's children. Let me be that man.","Every generational poverty ceiling in my family, I break through it today.","Lord, give me power to enjoy what You give me and not only to accumulate it.","Wealth and riches shall be in his house and his righteousness endureth for ever.","Every debt in my life, be cancelled and be cleared in the name of Jesus.","Father, make me a lender and not a borrower, the head and not the tail.","My God shall supply all my need according to His riches in glory by Christ Jesus.","Lord, let my prosperity finance the gospel and not merely my comfort.","I decree that I have power to get wealth this season, in the name of Jesus."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"Bags With Holes","subtitle":"","about":["Haggai 1:6 describes a condition many believers live in without ever naming it. \"Ye have sown much, and bring in little; ye eat, but ye have not enough; ye drink, but ye are not filled with drink; ye clothe you, but there is none warm; and he that earneth wages, earneth wages to put it into a bag with holes.\"","A bag with holes.","That is not a problem of income. Money is coming in. It is a problem of retention. And it means that for some people, the answer is not a raise. A raise into a bag with holes simply loses more money faster.","Look for the holes today.","Devourer activity. Malachi 3:11 promises God will rebuke the devourer, which implies there is a devourer and it has a legal relationship to the tithe. Unexpected expenses in clusters. The car, the tooth, the appliance, and the bill, all in the same fortnight, every single time you get ahead.","Undisciplined spending, which is not spiritual at all and needs to be said. Some of the leaking is simply a lack of a budget, and no amount of warfare prayer replaces writing down what you spend. Proverbs 27:23 says \"Be thou diligent to know the state of thy flocks.\" Know your numbers.","Debt that compounds faster than income rises.","Financial dishonesty, including with your spouse. Money hidden from a marriage is a hole in the bag of that marriage. And giving that was promised and never delivered.","Ecclesiastes 5:5 is direct: \"Better is it that thou shouldest not vow, than that thou shouldest vow and not pay.\"","Today we seal the bag."],"scriptures":["Haggai 1:5 to 11","Malachi 3:8 to 12","Proverbs 27:23 to 27","Luke 14:28 to 30","Proverbs 21:20","Proverbs 22:7","Ecclesiastes 5:4 to 5","Romans 13:8","2 Kings 4:1 to 7","Proverbs 13:11","1 Timothy 6:6 to 10"],"note":"","points":["Father, show me every hole in my bag today. Expose where my provision is leaking.","Every devourer eating my increase, be rebuked for my sake. Malachi 3:11.","Every cluster of unexpected expenses that arrives whenever I get ahead, be broken.","Lord, give me the discipline to know my numbers and to write them down.","Every undisciplined spending habit in me, be broken by the Spirit of self control.","Father, forgive me where I blamed the enemy for what was actually indiscipline.","Every debt that compounds faster than my income, be broken in the name of Jesus.","Owe no man any thing but to love one another. Lord, bring me out of bondage to debt.","The borrower is servant to the lender. Break every servitude of debt over my life.","Every financial dishonesty in my marriage, be exposed and be repented of today.","Lord, give my spouse and me one honest set of books and one honest conversation.","Every vow I made to God that I never paid, I settle it in Jesus' name.","Every pledge to a person that I never honoured, help me make it right.","Lord, give me wisdom to count the cost before I build. Luke 14:28.","There is treasure to be desired in the dwelling of the wise. Teach me to keep and not just to earn.","Every wealth gotten by vanity that is diminishing, correct my methods today.","Lord, show me what I have in my house, as You showed the widow her pot of oil.","Every creditor pressing my family, let the oil flow until every debt is paid.","Father, deliver me from the love of money while giving me the use of it.","Godliness with contentment is great gain. Give me both, Lord.","I decree every hole in my bag is sealed today, in the name of Jesus."]},{"time":"6:00 PM","watch":"The Evening Watch","title":"Breaking the Altars of Poverty","subtitle":"","about":["Tonight we deal with poverty as a spiritual structure and not merely a financial condition. Let us be careful and true. Not all poverty is demonic. Some is systemic and unjust, and Scripture has more to say about oppressing the poor than almost any other social sin. Some is circumstantial. Some is the result of decisions. Pretending every financial struggle is witchcraft is lazy and it wounds people. But some poverty is generational, patterned, and enforced, and everybody who has looked honestly at certain family lines knows it. Where every generation reaches the same ceiling. Where money arrives and evaporates without explanation. Where a person prospers everywhere except in their father's town. Where the family has land, education, and effort, and somehow nothing accumulates.","That is not economics. That is an altar.","Look at Judges 6 again. Israel's poverty was so severe they were hiding food in caves. And what was the source? Verse 4: the Midianites \"destroyed the increase of the earth.\" They did not attack the people. They attacked the increase. And God's first instruction to the deliverer was to break the altar of Baal in his father's compound (Judges 6:25), because the altar was the legal permission for the raiding.","Tonight we break altars.","We deal with: altars of poverty in the bloodline. Covenants that traded prosperity for survival. Curses that follow the family name. Financial witchcraft, where increase is diverted, buried, or consumed. Spirits of lack, of waste, and of shame around money. And the vow of poverty that some believers made in a moment of religious zeal and have been living under ever since. Come standing. Break something tonight."],"scriptures":["Judges 6:1 to 6, 25 to 27","Malachi 3:8 to 12","Deuteronomy 28:15 to 24, 38 to 44","Haggai 1:6 to 9","2 Corinthians 8:9","Galatians 3:13 to 14","Proverbs 10:22","Joel 2:25 to 26","Isaiah 61:6 to 7","Obadiah 17","Psalm 23:1","Zechariah 1:17","Deuteronomy 28:1 to 13"],"note":"Stand.","points":["In the name of Jesus, I break every altar of poverty in my father's house and my mother's house.","Every Midianite destroying the increase of my ground, be driven out tonight.","Every altar giving legal permission for my harvest to be raided, be demolished now.","Every generational ceiling that no one in my family has passed, I break through you tonight.","Every covenant of poverty made by my ancestors for survival, I cancel it by the blood of Jesus.","Every curse attached to my family name concerning money, be broken in Jesus' name.","Every financial witchcraft diverting my increase, be exposed and be destroyed by fire.","Every buried prosperity belonging to my bloodline, be exhumed and be released now.","Every spirit of lack that has followed my family for generations, come out and stay out.","Every spirit of waste that destroys what I acquire, be bound in the name of Jesus.","Every shame around money that keeps me hiding and shrinking, be broken tonight.","Every religious vow of poverty I made in zeal, I renounce it. Poverty is not holiness.","Christ was made poor that I through His poverty might be rich. I receive the exchange.","Every curse of the law over my finances, I am redeemed from it. Galatians 3:13.","Every hard labour that produces nothing, break now. My sowing shall produce.","Every man who plants a vineyard and does not eat of it, that is not my portion.","Upon mount Zion shall be deliverance, and the house of Jacob shall possess their possessions.","Restore unto me the years that the locust hath eaten, and let me eat in plenty and be satisfied.","Every place where the enemy has been eating my increase, I evict you permanently.","My cities through prosperity shall yet be spread abroad. Zechariah 1:17.","I decree that the altar of poverty over my bloodline is broken tonight, and it ends with me."]}],"questions":["Isaac sowed in a famine. What is the one thing God has been asking you to give or invest that you have been holding because the season looks hard?","Where exactly is the hole in your bag? Be specific and be honest, and separate what is spiritual from what is simply undisciplined."],"questionNote":"Married couples: tonight is our Couples Dinner. Come dressed. Come ready to laugh and to learn."},{"n":19,"date":"Friday, October 23","title":"Drink From Your Own Well","subtitle":"The Well Two Share","anchor":{"text":"Drink waters out of thine own cistern, and running waters out of thine own well... Let thy fountain be blessed: and rejoice with the wife of thy youth.","ref":"Proverbs 5:15, 18"},"teaching":["This is the day the whole fast was built around.","Nineteen days ago we said that marriage is destiny, and today we prove it from the text. Because when you trace the wells of Scripture, you keep finding covenant standing beside them. Rebekah was found at a well. Abraham's servant travelled to a strange country, stopped at a well, and prayed a specific prayer. \"And it came to pass, before he had done speaking, that, behold, Rebekah came out... with her pitcher upon her shoulder\"","(Genesis 24:15). Before he had finished praying. God had the answer moving before the prayer was completed.","Rachel was received at a well. Jacob rolled a stone away that normally required a crowd (Genesis 29:10). A man moved something for a woman that he had no business being able to move alone.","Zipporah came to Moses at a well. He drove away the shepherds who were blocking the daughters of Reuel from watering their flock, and \"he was content to dwell with the man: and he gave Moses Zipporah his daughter\" (Exodus 2:21). He defended a well and received a wife.","And Isaac's marriage was a well. Genesis 26:8 records that Abimelech looked out of a window and \"saw, and, behold, Isaac was sporting with Rebekah his wife.\" That is the verse that exposed the lie he had been telling. His affection revealed his covenant. He had told everyone she was his sister to protect himself, and it was his tenderness toward her that gave him away. Then Proverbs 5 completes the picture and gives us today's title. \"Drink waters out of thine own cistern.\" Solomon's warning against adultery is framed entirely in the language of wells. Your marriage is a well. It has water in it. And the enemy's strategy is not usually to poison it. It is to convince you there is nothing in it, so that you go looking for water somewhere else.","Today we deal with everything.","Foundations of marriage. Covenant and its enemies. Intimacy, communication, healing. Delay for those still waiting. And tonight, as the marathon opens, we break altars against marriage: marriage destroying covenants, spirit spouses, altars of divorce, and the spiritual structures that have been fighting unions in some bloodlines for generations.","Whether you are married, single, engaged, separated, or widowed: today is for you. The well belongs to everyone who will dig."],"sessions":[{"time":"12:00 AM","watch":"The Midnight Watch","title":"Rebekah at the Well","subtitle":"","about":["Tonight we pray about divine connection and divine timing.","Genesis 24 is the most detailed account of finding a spouse in the entire Bible, and it is worth noticing what actually produced the result.","A father who took it seriously. Abraham did not leave it to chance. He gave specific instruction about where his son's wife would come from and where she would not.","A servant who prayed specifically. \"Let it come to pass, that the damsel to whom I shall say, Let down thy pitcher, I pray thee, that I may drink; and she shall say, Drink, and I will give thy camels drink also: let the same be she\" (Genesis 24:14). He asked for a sign of character, not appearance. Watering ten camels is a great deal of work for a stranger. He was screening for generosity and diligence.","And a woman who was already doing the right thing before she was seen. Rebekah was at the well doing ordinary work with excellence when the answer to somebody's prayer found her.","Singles, take note of both halves of that. Pray specifically. And be found doing something."],"scriptures":["Genesis 24:1 to 27","Genesis 24:58 to 67","Proverbs 18:22","Proverbs 19:14","Amos 3:3","Ruth 2:1 to 12","Psalm 37:4 to 5","Ecclesiastes 3:11","1 Corinthians 7:8 to 9","Isaiah 34:16"],"note":"","points":["Father, order every connection in my life. Let the right people find me and the wrong ones pass me.","Every relationship in my life that You did not authorise, expose it and end it in Jesus' name.","Lord, as You answered before the servant finished speaking, answer me speedily.","Every delay in my divine connection caused by an altar, be broken tonight.","Father, screen for character in the person coming to me, and build character in me.","Lord, let me be found doing something worthy when my answer arrives.","Every counterfeit sent to occupy the place of my true covenant, be exposed and be removed.","Every soul tie with a person who is not my covenant, I sever it tonight by the sword of the Spirit.","Lord, give me the courage of Rebekah to say I will go when the time comes.","Every fear of commitment in me, be healed and be broken in Jesus' name.","Father, none shall want her mate. Let none of Your daughters lack. Isaiah 34:16.","Whoso findeth a wife findeth a good thing and obtaineth favour of the Lord.","A prudent wife is from the Lord. Lord, do the giving Yourself. Proverbs 19:14.","Every wasted year in a relationship that went nowhere, be redeemed in Jesus' name.","Lord, heal every wound from a broken engagement or a broken relationship.","Every generational delay in marriage in my family line, be broken tonight.","Father, let my parents' prayers and my spiritual fathers' prayers avail for me.","Lord, prepare me for the person I am praying for. Do not send them to an unready house.","Every Boaz and every Ruth in this fast, let them find each other in Your timing.","Father, make everything beautiful in its time. I trust Your calendar over my anxiety.","I decree divine connection and divine timing over my life, in the name of Jesus."]},{"time":"5:00 AM","watch":"The Morning Watch","title":"Rolling the Stone for Rachel","subtitle":"","about":["This morning we speak to men, and then to both.","Genesis 29:10. \"And it came to pass, when Jacob saw Rachel the daughter of Laban his mother's brother, and the sheep of Laban his mother's brother, that Jacob went near, and rolled the stone from the well's mouth, and watered the flock of Laban his mother's brother.\"","Look at the custom in verse 8. \"We cannot, until all the flocks be gathered together, and till they roll the stone from the well's mouth.\" It was a group job. Everybody waited. Everybody contributed. And Jacob, a man Scripture describes as \"a plain man, dwelling in tents\", walked up and moved it alone. Something rose in him at the sight of her that had not risen for anything else.","Men, hear this. The stone over your household is yours to move. Not your wife's. Not your mother's. Not the church's. There are men who will fight a stranger over a parking space and will not confront the thing sitting on the mouth of their own family's well. Ephesians 5:25 does not say lead your wife. It says \"love your wives, even as Christ also loved the church, and gave himself for it.\" The standard is a cross, not a throne. And Peter is explicit that the way a man treats his wife has direct spiritual consequence: dwell with her according to knowledge, give her honour, \"that your prayers be not hindered\" (1 Peter 3:7). A man can pray for twenty one days and be blocked by how he speaks to his wife on day fourteen.","Women, Genesis 29 also shows Rachel doing her work at the well before Jacob ever arrived. Covering does not mean passivity. Proverbs 31 is a portrait of a woman with land, income, strength, and a voice."],"scriptures":["Genesis 29:1 to 12","Ephesians 5:22 to 33","1 Peter 3:1 to 7","Colossians 3:18 to 19","Proverbs 31:10 to 31","1 Corinthians 11:3","1 Timothy 5:8","Genesis 2:18 to 24","Malachi 2:14 to 16","Joshua 24:15"],"note":"","points":["Father, give me the strength to move the stone over my own household.","Every stone on the well of my family that I have been ignoring, I confront it today.","Lord, make the men of this house men who cover, provide, and pray.","Every passivity in me as a husband and a father, be broken in the name of Jesus.","Father, teach me to love as Christ loved the church and gave Himself for it.","Every harshness and bitterness in me toward my spouse, be removed today.","Lord, if my prayers have been hindered by how I treat my wife, correct me now.","Every man in my family line who abandoned his post, that pattern ends with me.","Father, let me provide for my own house and not be worse than an infidel.","Lord, make me a covering and not a ceiling over my household.","Every woman in this fast carrying a load that was never hers, let it be lifted.","Father, make the women of this house strong, wise, and full of Your Spirit.","Every wife who has had to be both mother and father, let God send relief.","Lord, teach us submission and headship as You defined them, not as culture defined them.","Every control disguised as leadership in my home, expose it and correct it.","Every manipulation disguised as submission in my home, expose it and correct it.","Father, let my spouse and I be help meet for each other in the truest sense.","Every stone that requires a crowd, give me grace to move it in faith.","Lord, let my children see a marriage worth wanting.","As for me and my house, we will serve the Lord. I say it again today.","I decree that the stone over my household moves today, in the name of Jesus."]},{"time":"12:00 PM","watch":"The Noon Watch","title":"One Flesh, One Well","subtitle":"","about":["\"Drink waters out of thine own cistern, and running waters out of thine own well.\" Solomon is warning about adultery, and his argument is not primarily moral. It is agricultural. He is saying: you already have a well. There is water in it. Go and draw from it. Which raises the question that this hour exists to answer: how does a marriage stop drawing from its own well?","Usually not through a dramatic betrayal. Usually through slow drift.","Neglect. Nobody drew from the well for a long time, and the well did not disappear. It just got covered.","Unhealed offence. Ephesians 4:26 says do not let the sun go down on your wrath, and the reason is given in verse 27: \"Neither give place to the devil.\" Overnight anger becomes a residence. Comparison, which is the fastest way to make a full well look empty. Nobody drifts toward a person they think is worse. Emotional outsourcing, where the deepest conversations of your life are happening with someone who is not your spouse. That is not innocent. That is drawing water from another well. And exhaustion, which is not sin but is a real thief. Children, work, ministry, and money can consume a marriage entirely while both people are doing nothing wrong.","Today we redig the marriage well. Communication. Intimacy. Friendship. Forgiveness. Laughter. The things that were there at the beginning and got buried under earth one shovel at a time. If you are married, pray this session with your spouse if at all possible. Hold hands. Say the points out loud over each other."],"scriptures":["Proverbs 5:15 to 21","Genesis 2:18 to 25","Ecclesiastes 4:9 to 12","Song of Solomon 4:12 to 16","1 Corinthians 7:1 to 5","Ephesians 4:26 to 32","Malachi 2:14 to 15","Matthew 19:4 to 6","Amos 3:3","1 Corinthians 13:4 to 8","Hebrews 13:4","Song of Solomon 2:15"],"note":"","points":["Father, I redig the well of my marriage today. Let the water come up again.","Every layer of earth covering the friendship we once had, be cleared away today.","Lord, restore the laughter in my marriage. Bring back what neglect buried.","Every unhealed offence in our home, be brought to the surface and be resolved.","Every place we gave to the devil by letting the sun go
